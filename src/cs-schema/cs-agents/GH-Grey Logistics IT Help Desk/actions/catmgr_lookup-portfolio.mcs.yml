mcs.metadata:
  componentName: Look up portfolio
  description: Looks up the portfolio manager and portfolio value of a Grey Logistics client in the Financial Portfolio Dashboard, a web app without an API. Use it when a user asks who manages a client's portfolio or what it is worth.
kind: TaskDialog
inputs:
  - kind: AutomaticTaskInput
    propertyName: clientName
    name: ClientName
    description: The client name exactly as it appears in the Client Name column, for example Fourth Coffee or Northwind Traders.

modelDisplayName: Look up portfolio
modelDescription: "Looks up the portfolio manager and portfolio value of a Grey Logistics client in the Financial Portfolio Dashboard, a web app without an API. Use it when a user asks who manages a client's portfolio or what it is worth."
action:
  kind: InvokeComputerUsingAgentTaskAction
  connectionReference: catmgr_GHGreyLogisticsITHelpDesk.cr.shared_computeroperator
  connectionProperties:
    mode: Maker
  operationId: ComputerOperatorInvokeMcpCua
  instructions: |-
    1. Go to https://computerusedemos.blob.core.windows.net/web/Portfolio/index.html.
    2. Find the row whose Client Name matches the ClientName input and record the Manager name and the Portfolio Value exactly as shown.
    3. Return those two values as plain text in the form: Manager: <name>, Value: <value>.
  inputType:
    properties:
      clientName:
        displayName: ClientName
        description: The client name exactly as it appears in the Client Name column, for example Fourth Coffee or Northwind Traders.
        isRequired: true
        type: String

  model:
    modelNameHint: sonnet4-5
  initializeContext:
    enforceHttps: true
  allowlist:
    websites:
      - computerusedemos.blob.core.windows.net
    desktopApps:
      - Microsoft Edge
