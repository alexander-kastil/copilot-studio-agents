<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How the Northwind Sales Assistant answers in Preview</title>
  <desc id="d">Two seller messages in Preview reach the Northwind Sales Assistant, whose orchestration runtime reasons against its Instructions and its Knowledge source on every turn. The in-scope question about Tier 2 lead time and the Cold Brew case price is answered from northwind-products with a citation: 5 business days and 48.00 USD. The request for a signed contract price for 500 cases meets the You do not list in the Instructions, so the agent declines the binding quote and points back to what it can do. A dot traces each path in turn.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="60" y="112" font-size="28" fill="#57606a">Seller asks in Preview</text>
  <text x="1860" y="112" font-size="28" fill="#57606a" text-anchor="end">Agent replies in Preview</text>

  <rect x="60" y="140" width="520" height="270" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="90" y="190" font-size="28" font-weight="700" fill="#24292f">In-scope question</text>
  <g font-size="28" fill="#24292f">
    <text x="90" y="244">What is the standard lead</text>
    <text x="90" y="286">time for a Tier 2 account,</text>
    <text x="90" y="328">and what does a case of</text>
    <text x="90" y="370">Cold Brew Concentrate cost?</text>
  </g>

  <rect x="60" y="640" width="520" height="240" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="90" y="690" font-size="28" font-weight="700" fill="#24292f">Out-of-scope request</text>
  <g font-size="28" fill="#24292f">
    <text x="90" y="744">Can you give me a signed</text>
    <text x="90" y="786">contract price for</text>
    <text x="90" y="828">500 cases?</text>
  </g>

  <rect x="650" y="80" width="620" height="870" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="135" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Northwind Sales Assistant</text>

  <rect x="690" y="170" width="540" height="250" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <rect x="706" y="238" width="508" height="46" rx="10" fill="#fff6e5" stroke="#e0a534" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.3"/>
  </rect>
  <rect x="706" y="294" width="508" height="88" rx="10" fill="#fff6e5" stroke="#e0a534" stroke-width="2" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.65;0.8"/>
  </rect>
  <text x="720" y="220" font-size="30" font-weight="700" fill="#24292f">Instructions</text>
  <g font-size="28" fill="#24292f">
    <text x="720" y="271">You do: cite the source</text>
    <text x="720" y="327">You do not: binding price</text>
    <text x="720" y="367">quotes or contract terms</text>
  </g>

  <line x1="960" y1="468" x2="960" y2="422" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="690" y="470" width="540" height="140" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="530" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Orchestration runtime</text>
  <text x="960" y="574" font-size="28" fill="#57606a" text-anchor="middle">reasons on every turn</text>

  <line x1="960" y1="612" x2="960" y2="658" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="690" y="660" width="540" height="250" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <rect x="690" y="660" width="540" height="250" rx="14" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.15;0.3"/>
  </rect>
  <text x="720" y="710" font-size="30" font-weight="700" fill="#24292f">Knowledge</text>
  <text x="720" y="758" font-size="28" font-family="Consolas, monospace" fill="#24292f">northwind-products</text>
  <text x="720" y="810" font-size="28" fill="#57606a">Tier 2: 5 business days</text>
  <text x="720" y="856" font-size="28" fill="#57606a">Cold Brew case: 48.00 USD</text>

  <path d="M580,275 H620 V520 H686" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M580,760 H620 V560 H686" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1230,520 H1300 V275 H1336" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1230,560 H1300 V760 H1336" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="1340" y="140" width="520" height="270" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1370" y="190" font-size="28" font-weight="700" fill="#24292f">Cited answer</text>
  <text x="1370" y="244" font-size="28" fill="#24292f">Lead time: 5 business days</text>
  <text x="1370" y="286" font-size="28" fill="#24292f">Case price: 48.00 USD</text>
  <rect x="1370" y="316" width="460" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1370" y="316" width="460" height="62" rx="31" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.425;0.4875"/>
  </rect>
  <text x="1398" y="357" font-size="28" fill="#57606a">Source: <tspan font-family="Consolas, monospace" fill="#24292f">northwind-products</tspan></text>

  <rect x="1340" y="640" width="520" height="240" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1340" y="640" width="520" height="240" rx="16" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.925;0.9875"/>
  </rect>
  <text x="1370" y="690" font-size="28" font-weight="700" fill="#24292f">Declines the quote</text>
  <text x="1370" y="744" font-size="28" fill="#24292f">No binding quote; points</text>
  <text x="1370" y="786" font-size="28" fill="#24292f">back to what it can do</text>

  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M580,275 H620 V520 H688" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.025;0.15;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.025;0.1625"/>
  </circle>
  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M1232,520 H1300 V275 H1338" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.425;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.3;0.4375"/>
  </circle>
  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M580,760 H620 V560 H688" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.525;0.65;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.525;0.6625"/>
  </circle>
  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M1232,560 H1300 V760 H1338" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.8;0.925;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.8;0.9375"/>
  </circle>
</svg>
