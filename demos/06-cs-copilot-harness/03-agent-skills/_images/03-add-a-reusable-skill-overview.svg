<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Six steps take the follow-up-email-drafter skill from the decision to a shared file</title>
  <desc id="d">In the center, the SKILL.md of follow-up-email-drafter: YAML front matter with name: follow-up-email-drafter and the tightened description, Draft a follow-up email ONLY after a completed customer call, meeting, or demo, followed by the Markdown heading Follow-up email drafter. Around it, six steps on the Northwind Sales Assistant: 1, Decide: recurring, self-contained and needed only sometimes, so it is a skill. 2, Create from blank: Name, Description and the template Instructions. 3, Upload a skill: the SKILL.md saves at once and is Read-only. 4, Test in Preview: a follow-up request shows Used skill, a lead-time question stays quiet. 5, Replace: a tighter description, no second skill. 6, Download: follow-up-email-drafter.md, renamed to SKILL.md. Then share the file: upload it into another agent or check it into source control, in the same format as Claude Code and GitHub Copilot. A dot walks the loop from step 1 to the shared file.</desc>
