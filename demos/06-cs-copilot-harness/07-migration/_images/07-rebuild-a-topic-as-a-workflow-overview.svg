<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Check Symptoms topic of the Standard Health Advisor becomes the Check Symptoms workflow tool of Health Advisor (Upgraded)</title>
  <desc id="d">On the left, the Standard Health Advisor runs its Check Symptoms topic: three questions in fixed order for Age, Gender and Symptoms, the agent flow SummarizePatientSymtoms, a Power Fx condition that looks for cleared for light work, and a message with the outcome. The upgrade creates Health Advisor (Upgraded) on the GitHub Copilot harness. On the right, the same journey runs as one Check Symptoms workflow tool: the trigger takes the inputs Age, Gender and Symptoms, a classify node sorts them into the branches Cleared for light work, See a doctor and Other, and each branch ends in Respond to the agent returning Outcome. At the bottom, the mapping: the three questions become three inputs, the agent flow and the Power Fx condition become one classify node, and the message becomes Respond to the agent. Dots walk the topic from top to bottom, cross the upgrade arrow and run through the workflow.</desc>
