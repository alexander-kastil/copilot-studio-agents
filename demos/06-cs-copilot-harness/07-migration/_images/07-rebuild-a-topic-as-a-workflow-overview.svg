  <text class="b" x="90" y="914">3 questions</text>
  <text class="bb" x="90" y="964">become 3 inputs</text>
  <rect x="680" y="850" width="560" height="160" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
