  <rect x="100" y="232" width="620" height="146" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="124" y="276">3 questions</text>
  <text class="mono" x="124" y="318">Age, Gender, Symptoms</text>
  <text class="s" x="124" y="358">asked in fixed order</text>
  <line x1="410" y1="378" x2="410" y2="420" stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)"/>

  <rect x="100" y="420" width="620" height="110" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="124" y="464">Agent flow</text>
