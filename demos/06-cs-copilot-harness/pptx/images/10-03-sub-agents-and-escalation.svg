  <rect x="30" y="930" width="1860" height="110" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="996" font-size="30" fill="#24292f" text-anchor="middle"><tspan font-weight="700">Deploy:</tspan> demo website, web chat, Teams Phone, contact centers</text>
</svg>
