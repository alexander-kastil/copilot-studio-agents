<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Three routes from a Standard agent to a Microsoft Copilot harness agent</title>
  <desc id="d">A Standard agent on the left stays unchanged. Three routes fan out from it: upgrade on the home page with the request upgrade my HR Buddy agent, which ends in a report of what was migrated, what requires attention and what was skipped; rebuild by hand from the capability map; and migrate from the terminal with /mcs-assistant:migrate, which writes a MIGRATION-PLAN file. All three end in a new Microsoft Copilot harness agent beside the original, and the same test set runs on both agents.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="400" width="380" height="250" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="250" y="490" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Standard agent</text>
  <rect x="95" y="540" width="310" height="64" rx="32" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="122" y="568" width="26" height="22" rx="4" fill="#57606a"/>
  <path d="M127,568 V560 a8,8 0 0 1 16,0 V568" fill="none" stroke="#57606a" stroke-width="4"/>
  <text x="166" y="583" font-size="28" fill="#24292f">stays unchanged</text>

  <path d="M440,525 H530 V175 H602" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M440,525 H602" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M440,525 H530 V815 H602" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="610" y="90" width="640" height="170" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="930" y="160" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Upgrade on the home page</text>
  <text x="930" y="215" font-size="30" font-style="italic" fill="#57606a" text-anchor="middle">"upgrade my HR Buddy agent"</text>
  <rect x="590" y="282" width="680" height="62" rx="31" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="930" y="323" font-size="28" fill="#24292f" text-anchor="middle">Report: migrated, requires attention, skipped</text>

  <rect x="610" y="440" width="640" height="170" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="930" y="510" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Rebuild by hand</text>
  <text x="930" y="565" font-size="30" fill="#57606a" text-anchor="middle">from the capability map</text>

  <rect x="610" y="730" width="640" height="170" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="930" y="800" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Migrate from the terminal</text>
  <text x="930" y="855" font-size="30" font-family="Consolas, Menlo, monospace" fill="#57606a" text-anchor="middle">/mcs-assistant:migrate</text>
  <rect x="740" y="922" width="380" height="62" rx="31" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="930" y="963" font-size="28" fill="#24292f" text-anchor="middle">MIGRATION-PLAN file</text>

  <path d="M1250,175 H1340 V525 H1422" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M1250,525 H1422" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M1250,815 H1340 V525 H1422" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="1430" y="380" width="430" height="290" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1645" y="460" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Microsoft Copilot</text>
  <text x="1645" y="504" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">harness agent</text>
  <text x="1645" y="574" font-size="28" fill="#57606a" text-anchor="middle">new agent beside</text>
  <text x="1645" y="612" font-size="28" fill="#57606a" text-anchor="middle">the original</text>
  <rect x="1430" y="700" width="430" height="62" rx="31" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1645" y="741" font-size="28" fill="#24292f" text-anchor="middle">Same test set on both agents</text>
</svg>
