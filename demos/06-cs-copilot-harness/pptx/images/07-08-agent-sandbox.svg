<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The agent sandbox runs code and builds files</title>
  <desc id="d">A chat message, Chart revenue by region, with the file sales.xlsx attached, goes into the agent sandbox. There Python code runs with the packages pandas, matplotlib, openpyxl, python-docx, python-pptx and reportlab, guided by the built-in skills for docx, xlsx, pptx, pdf and csv. The result is a created file card with revenue-by-region.xlsx and a Download button. A follow-up, make the chart taller, makes the agent read the file back. Each file can be up to 10 MB and is kept 28 days after the last activity.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <path d="M60,250 H430 Q450,250 450,270 V450 Q450,470 430,470 H140 L90,510 L100,470 H60 Q40,470 40,450 V270 Q40,250 60,250 Z" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="245" y="315" font-size="30" fill="#24292f" text-anchor="middle">Chart revenue by region</text>
  <rect x="70" y="360" width="250" height="70" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <path d="M92,375 H112 L122,385 V415 H92 Z" fill="#e9f7ef" stroke="#57606a" stroke-width="2"/>
  <text x="138" y="406" font-size="28" fill="#24292f">sales.xlsx</text>

  <line x1="450" y1="360" x2="538" y2="360" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="540" y="160" width="760" height="580" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="3" stroke-dasharray="16 10"/>
  <text x="575" y="215" font-size="32" font-weight="700" fill="#24292f">Agent sandbox</text>
  <rect x="580" y="245" width="680" height="96" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="920" y="305" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Python code</text>
  <g font-size="28" fill="#24292f" text-anchor="middle">
    <rect x="580" y="375" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="690" y="415">pandas</text>
    <rect x="810" y="375" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="920" y="415">matplotlib</text>
    <rect x="1040" y="375" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1150" y="415">openpyxl</text>
    <rect x="580" y="455" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="690" y="495">python-docx</text>
    <rect x="810" y="455" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="920" y="495">python-pptx</text>
    <rect x="1040" y="455" width="220" height="60" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1150" y="495">reportlab</text>
    <rect x="580" y="575" width="680" height="70" rx="35" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="920" y="620">built-in skills: docx, xlsx, pptx, pdf, csv</text>
  </g>

  <line x1="1300" y1="420" x2="1398" y2="420" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="1400" y="200" width="480" height="440" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1640" y="255" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Created file card</text>
  <path d="M1595,290 H1665 L1695,320 V410 H1595 Z" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <path d="M1665,290 V320 H1695" fill="none" stroke="#57606a" stroke-width="3"/>
  <g stroke="#1a7f37" stroke-width="4">
    <line x1="1612" y1="345" x2="1678" y2="345"/>
    <line x1="1612" y1="368" x2="1678" y2="368"/>
    <line x1="1612" y1="391" x2="1660" y2="391"/>
  </g>
  <text x="1640" y="470" font-size="29" fill="#24292f" text-anchor="middle">revenue-by-region.xlsx</text>
  <rect x="1530" y="510" width="220" height="64" rx="14" fill="#1a7f37"/>
  <text x="1640" y="552" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Download</text>

  <path d="M1640,640 C1640,900 245,900 245,522" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <text x="940" y="880" font-size="28" fill="#57606a" text-anchor="middle">make the chart taller: the agent reads the file back</text>

  <rect x="570" y="960" width="780" height="64" rx="32" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="960" y="1002" font-size="28" fill="#24292f" text-anchor="middle">10 MB per file, kept 28 days after the last activity</text>
</svg>
