<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The eight topics of module 6 in five groups</title>
  <desc id="d">Topics 1 and 2 cover the two kinds of agent: Standard vs. Microsoft Copilot Harness Agents, then the unified Build surface and the new orchestrator. Topics 3 to 5 sit on the Build tab: Agent Skills, then Tools, MCP and the new Workflows designer, then grounding with Work IQ, Foundry IQ and Fabric IQ. Topic 6, Test and Evaluate Copilot Studio Agents, comes before an agent ships. Topic 7, Migrate Standard Agents to Microsoft Copilot Harness Agents, covers existing agents. Topic 8, Building Apps in Copilot Studio, sits beside agents. Arrows lead from one group to the next.</desc>
