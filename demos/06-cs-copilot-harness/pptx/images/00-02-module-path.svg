<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The ten topics of module 6 in six groups</title>
  <desc id="d">Topics 1 and 2 cover the two kinds of agent: Standard vs. Microsoft Copilot Harness Agents, then the unified Build surface and the new orchestrator. Topics 3 to 6 build and extend the agent: Agent Skills, then Tools, MCP and the new Workflows designer, then Hooks: Steps That Run Every Time, then grounding with Work IQ, Foundry IQ and Fabric IQ. Topic 7, Test and Evaluate Copilot Studio Agents, comes before an agent ships. Topic 8, Migrate Standard Agents to Microsoft Copilot Harness Agents, covers existing agents. Topic 9, Building Apps in Copilot Studio, sits beside agents. Topic 10, Customer Conversation Agents: Topic Skills, Sub-Agents, and Escalation, is for customers. Arrows lead from one group to the next.</desc>
