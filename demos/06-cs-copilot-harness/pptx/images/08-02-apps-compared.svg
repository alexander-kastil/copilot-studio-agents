<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">An app in Copilot Studio compared with other ways to build a business app</title>
  <desc id="d">Four columns. App in Copilot Studio (preview): describe the need in plain language, refine it in the conversation and preview as you build; you get a generated data model, logic and interface, the app, data and connections in one place, data access with the user's own permissions, and publish and share on Microsoft-hosted infrastructure. App skill in Copilot Cowork (Frontier): describe the app in a Cowork conversation with no coding; you get a lightweight, interactive app to refine, open, publish and share. Power Apps canvas app: start from a blank canvas, place controls and write Power Fx; you get a screen designed control by control. Power Apps model-driven app: start from the data model in Dataverse; you get forms and views built on that data, with the layout from the components you add.</desc>
