<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Hooks at six points of a run</title>
  <desc id="d">A run reads left to right: session starts, user message, agent plans, tool call, then the tool succeeds or fails, ending in the answer. Start (pre-loop) returns additionalContext. User prompt submitted returns modifiedPrompt. Pre tool use returns deny or modifiedParameters and is the only hook that blocks. Post tool use returns modifiedResult. After tool failure returns additionalContext. Error returns retry, skip or abort. Every hook receives event, timestamp and metadata: user, channel and agent.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="30" y="330" width="1860" height="430" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>

  <g stroke="#e0a534" stroke-width="4">
    <line x1="170" y1="270" x2="170" y2="500"/>
    <line x1="520" y1="270" x2="520" y2="500"/>
    <line x1="1310" y1="300" x2="1310" y2="532"/>
    <line x1="1700" y1="250" x2="1700" y2="392"/>
    <line x1="1700" y1="688" x2="1700" y2="800"/>
  </g>
  <circle cx="1310" cy="540" r="9" fill="#e0a534"/>
  <circle cx="1700" cy="400" r="9" fill="#e0a534"/>
  <circle cx="1700" cy="680" r="9" fill="#e0a534"/>

  <g font-size="28" fill="#24292f" text-anchor="middle">
    <rect x="40" y="500" width="260" height="80" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="170" y="550">Session starts</text>
    <rect x="390" y="500" width="260" height="80" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="520" y="550">User message</text>
    <rect x="740" y="500" width="260" height="80" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="870" y="550">Agent plans</text>
    <rect x="1080" y="500" width="200" height="80" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1180" y="550">Tool call</text>
    <rect x="1400" y="360" width="240" height="80" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1520" y="410">Tool succeeds</text>
    <rect x="1400" y="640" width="240" height="80" rx="14" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="1520" y="690">Tool fails</text>
    <rect x="1730" y="500" width="150" height="80" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1805" y="550">Answer</text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="4">
    <line x1="300" y1="540" x2="388" y2="540" marker-end="url(#ah)"/>
    <line x1="650" y1="540" x2="738" y2="540" marker-end="url(#ah)"/>
    <line x1="1000" y1="540" x2="1078" y2="540" marker-end="url(#ah)"/>
    <path d="M1280,540 H1350"/>
    <path d="M1350,540 V400 H1398" marker-end="url(#ah)"/>
    <path d="M1350,540 V680 H1398" marker-end="url(#ah)"/>
    <path d="M1640,400 H1805 V498" marker-end="url(#ah)"/>
    <path d="M1640,680 H1805 V582" marker-end="url(#ah)"/>
  </g>

  <g fill="#24292f">
    <rect x="30" y="130" width="290" height="140" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="175" y="185" font-size="29" font-weight="700" text-anchor="middle">Start (pre-loop)</text>
    <text x="175" y="235" font-size="28" fill="#57606a" text-anchor="middle">additionalContext</text>

    <rect x="335" y="130" width="370" height="140" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="520" y="185" font-size="29" font-weight="700" text-anchor="middle">User prompt submitted</text>
    <text x="520" y="235" font-size="28" fill="#57606a" text-anchor="middle">modifiedPrompt</text>

    <rect x="1065" y="60" width="410" height="240" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1270" y="113" font-size="29" font-weight="700" text-anchor="middle">Pre tool use</text>
    <text x="1270" y="161" font-size="28" fill="#57606a" text-anchor="middle">deny, modifiedParameters</text>
    <rect x="1105" y="194" width="330" height="50" rx="25" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <text x="1270" y="229" font-size="28" fill="#a40e26" text-anchor="middle">only hook that blocks</text>

    <rect x="1530" y="110" width="350" height="140" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1705" y="165" font-size="29" font-weight="700" text-anchor="middle">Post tool use</text>
    <text x="1705" y="215" font-size="28" fill="#57606a" text-anchor="middle">modifiedResult</text>

    <rect x="1500" y="800" width="380" height="140" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1690" y="855" font-size="29" font-weight="700" text-anchor="middle">After tool failure</text>
    <text x="1690" y="905" font-size="28" fill="#57606a" text-anchor="middle">additionalContext</text>

    <rect x="700" y="800" width="340" height="140" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="870" y="855" font-size="29" font-weight="700" text-anchor="middle">Error</text>
    <text x="870" y="905" font-size="28" fill="#57606a" text-anchor="middle">retry, skip, abort</text>
  </g>

  <rect x="30" y="975" width="1860" height="80" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="1026" font-size="30" fill="#24292f" text-anchor="middle">Every hook receives event, timestamp and metadata (user, channel, agent)</text>
</svg>
