<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A scoped description activates the skill on a follow-up request and stays quiet on a lead-time question</title>
  <desc id="d">Two Preview prompts reach the follow-up-email-drafter description, whose phrases include follow up, recap next steps, thank a customer, confirm an order and a note after a demo. Draft a follow-up email after my call with Around the Horn about their green tea reorder matches, so the skill activates and returns subject, greeting, recap, next step and sign-off. What is the standard lead time for a Tier 3 account does not match, so the skill stays quiet and the agent answers normally from its instructions and knowledge.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="80" y="130" width="540" height="330" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="350" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Follow-up request</text>
  <text x="350" y="270" text-anchor="middle" font-size="28" fill="#24292f">“Draft a follow-up email after</text>
  <text x="350" y="312" text-anchor="middle" font-size="28" fill="#24292f">my call with Around the Horn</text>
  <text x="350" y="354" text-anchor="middle" font-size="28" fill="#24292f">about their green tea reorder.”</text>

  <rect x="80" y="620" width="540" height="330" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="350" y="722" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Lead-time question</text>
  <text x="350" y="782" text-anchor="middle" font-size="28" fill="#24292f">“What is the standard lead</text>
  <text x="350" y="824" text-anchor="middle" font-size="28" fill="#24292f">time for a Tier 3 account?”</text>

  <rect x="760" y="200" width="480" height="660" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="262" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Skill description</text>
  <text x="1000" y="312" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#24292f">follow-up-email-drafter</text>
  <text x="1000" y="360" text-anchor="middle" font-size="28" fill="#57606a">matched by the runtime</text>
  <rect x="800" y="400" width="400" height="66" rx="33" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="443" text-anchor="middle" font-size="28" fill="#24292f">follow up</text>
  <rect x="800" y="485" width="400" height="66" rx="33" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="528" text-anchor="middle" font-size="28" fill="#24292f">recap next steps</text>
  <rect x="800" y="570" width="400" height="66" rx="33" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="613" text-anchor="middle" font-size="28" fill="#24292f">thank a customer</text>
  <rect x="800" y="655" width="400" height="66" rx="33" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="698" text-anchor="middle" font-size="28" fill="#24292f">confirm an order</text>
  <rect x="800" y="740" width="400" height="66" rx="33" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
  <text x="1000" y="783" text-anchor="middle" font-size="28" fill="#24292f">a note after a demo</text>

  <rect x="1380" y="130" width="460" height="330" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1610" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Skill activates</text>
  <text x="1610" y="270" text-anchor="middle" font-size="28" fill="#24292f">Subject, greeting,</text>
  <text x="1610" y="312" text-anchor="middle" font-size="28" fill="#24292f">recap, next step,</text>
  <text x="1610" y="354" text-anchor="middle" font-size="28" fill="#24292f">sign-off</text>

  <rect x="1380" y="620" width="460" height="330" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1610" y="700" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Skill stays quiet</text>
  <text x="1610" y="760" text-anchor="middle" font-size="28" fill="#24292f">a normal answer from</text>
  <text x="1610" y="802" text-anchor="middle" font-size="28" fill="#24292f">instructions and</text>
  <text x="1610" y="844" text-anchor="middle" font-size="28" fill="#24292f">knowledge</text>

  <line x1="620" y1="295" x2="756" y2="380" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1240" y1="380" x2="1376" y2="295" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1300" y="290" text-anchor="middle" font-size="28" fill="#57606a">match</text>
  <line x1="620" y1="785" x2="756" y2="700" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1240" y1="700" x2="1376" y2="785" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1310" y="840" text-anchor="middle" font-size="28" fill="#57606a">no match</text>

  <rect x="800" y="400" width="400" height="66" rx="33" fill="none" stroke="#1a7f37" stroke-width="6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.135;0.3;0.31;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1380" y="130" width="460" height="330" rx="18" fill="none" stroke="#1a7f37" stroke-width="6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3;0.31;0.475;0.485;1" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1380" y="620" width="460" height="330" rx="18" fill="none" stroke="#1a7f37" stroke-width="6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.81;0.975;0.985;1" dur="8s" repeatCount="indefinite"/>
  </rect>

  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="1">
    <animateMotion path="M620,295 L756,380" keyPoints="0;1;1" keyTimes="0;0.125;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.125;0.13;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="0">
    <animateMotion path="M1240,380 L1376,295" keyPoints="0;0;1;1" keyTimes="0;0.175;0.3;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.174;0.175;0.3;0.305;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="0">
    <animateMotion path="M620,785 L756,700" keyPoints="0;0;1;1" keyTimes="0;0.5;0.625;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.499;0.5;0.625;0.63;1" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="0">
    <animateMotion path="M1240,700 L1376,785" keyPoints="0;0;1;1" keyTimes="0;0.675;0.8;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.674;0.675;0.8;0.805;1" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
