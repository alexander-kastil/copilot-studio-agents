<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Seven built-in document skills that the harness provides</title>
  <desc id="d">The harness provides the built-in skills; a maker doesn't upload or write them. There are seven, one for each document format. CSV: look up values, filter rows, calculate summaries. Word: extract text, structure, tables and images to answer questions. HTML: read page content, analyze tables and structured information. Markdown: find information in headings, lists and tables, summarize table data. PDF: extract text and tables to answer questions. PowerPoint: analyze slides, tables, charts and speaker notes. Excel: look up and summarize data across worksheets and workbooks, create charts.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <rect x="40" y="40" width="1840" height="1000" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="108" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Provided by the harness</text>
  <text x="960" y="152" text-anchor="middle" font-size="28" fill="#57606a">not uploaded or authored by a maker</text>

  <g>
    <rect x="80" y="200" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="285" y="268" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">CSV</text>
    <text x="285" y="314" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.csv</text>
    <text x="285" y="400" text-anchor="middle" font-size="28" fill="#24292f">look up values,</text>
    <text x="285" y="440" text-anchor="middle" font-size="28" fill="#24292f">filter rows,</text>
    <text x="285" y="480" text-anchor="middle" font-size="28" fill="#24292f">calculate summaries</text>
  </g>
  <g>
    <rect x="530" y="200" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="735" y="268" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Word</text>
    <text x="735" y="314" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.docx</text>
    <text x="735" y="400" text-anchor="middle" font-size="28" fill="#24292f">extract text, structure,</text>
    <text x="735" y="440" text-anchor="middle" font-size="28" fill="#24292f">tables and images</text>
    <text x="735" y="480" text-anchor="middle" font-size="28" fill="#24292f">to answer questions</text>
  </g>
  <g>
    <rect x="980" y="200" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1185" y="268" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">HTML</text>
    <text x="1185" y="314" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.html  .htm</text>
    <text x="1185" y="400" text-anchor="middle" font-size="28" fill="#24292f">read page content,</text>
    <text x="1185" y="440" text-anchor="middle" font-size="28" fill="#24292f">analyze tables and</text>
    <text x="1185" y="480" text-anchor="middle" font-size="28" fill="#24292f">structured information</text>
  </g>
  <g>
    <rect x="1430" y="200" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1635" y="268" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Markdown</text>
    <text x="1635" y="314" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.md</text>
    <text x="1635" y="400" text-anchor="middle" font-size="28" fill="#24292f">find information in</text>
    <text x="1635" y="440" text-anchor="middle" font-size="28" fill="#24292f">headings, lists, tables,</text>
    <text x="1635" y="480" text-anchor="middle" font-size="28" fill="#24292f">summarize table data</text>
  </g>

  <g>
    <rect x="305" y="620" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="510" y="688" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">PDF</text>
    <text x="510" y="734" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.pdf</text>
    <text x="510" y="820" text-anchor="middle" font-size="28" fill="#24292f">extract text and</text>
    <text x="510" y="860" text-anchor="middle" font-size="28" fill="#24292f">tables to answer</text>
    <text x="510" y="900" text-anchor="middle" font-size="28" fill="#24292f">questions</text>
  </g>
  <g>
    <rect x="755" y="620" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="688" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">PowerPoint</text>
    <text x="960" y="734" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.pptx</text>
    <text x="960" y="820" text-anchor="middle" font-size="28" fill="#24292f">analyze slides, tables,</text>
    <text x="960" y="860" text-anchor="middle" font-size="28" fill="#24292f">charts and</text>
    <text x="960" y="900" text-anchor="middle" font-size="28" fill="#24292f">speaker notes</text>
  </g>
  <g>
    <rect x="1205" y="620" width="410" height="380" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="688" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Excel</text>
    <text x="1410" y="734" text-anchor="middle" font-size="28" font-family="Consolas, monospace" fill="#57606a">.xlsx</text>
    <text x="1410" y="810" text-anchor="middle" font-size="28" fill="#24292f">look up and summarize</text>
    <text x="1410" y="850" text-anchor="middle" font-size="28" fill="#24292f">data across worksheets</text>
    <text x="1410" y="890" text-anchor="middle" font-size="28" fill="#24292f">and workbooks,</text>
    <text x="1410" y="930" text-anchor="middle" font-size="28" fill="#24292f">create charts</text>
  </g>
</svg>
