<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">When Copilot Credit billing starts</title>
  <desc id="d">For apps in Copilot Studio, billing starts as soon as you start building: building, previewing, and testing consume Copilot Credits. In the standard harness, billing starts after publishing.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      .h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:36px;font-weight:600;fill:#24292f}
      .c{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;fill:#24292f}
      .s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;fill:#24292f}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;fill:#57606a}
      .box{stroke:#8c959f;stroke-width:2}
      .col{fill:#f6f8fa;stroke:#8c959f;stroke-width:2}
      .sep{stroke:#8c959f;stroke-width:2;stroke-dasharray:6 10;opacity:0.6}
      .band{fill:#fff6e5;stroke:#e0a534;stroke-width:3}
    </style>
  </defs>

  <rect class="col" x="460" y="130" width="230" height="90" rx="16"/>
  <text class="c" x="575" y="186" text-anchor="middle">Build</text>
  <rect class="col" x="710" y="130" width="230" height="90" rx="16"/>
  <text class="c" x="825" y="186" text-anchor="middle">Preview</text>
  <rect class="col" x="960" y="130" width="230" height="90" rx="16"/>
  <text class="c" x="1075" y="186" text-anchor="middle">Test</text>
  <rect class="col" x="1210" y="130" width="210" height="90" rx="16"/>
  <text class="c" x="1315" y="186" text-anchor="middle">Publish</text>
  <rect class="col" x="1440" y="130" width="410" height="90" rx="16"/>
  <text class="c" x="1645" y="186" text-anchor="middle">After publishing</text>

  <line class="sep" x1="700" y1="240" x2="700" y2="920"/>
  <line class="sep" x1="950" y1="240" x2="950" y2="920"/>
  <line class="sep" x1="1200" y1="240" x2="1200" y2="920"/>
  <line class="sep" x1="1430" y1="240" x2="1430" y2="920"/>

  <rect class="box" x="60" y="280" width="360" height="280" rx="22" fill="#f3edff"/>
  <text class="h" x="100" y="408">Apps</text>
  <text class="b" x="100" y="456">in Copilot Studio</text>
  <path class="band" d="M460,360 H1790 L1850,420 L1790,480 H460 Z"/>
  <text class="s" x="495" y="410">Billing starts as soon as you start building</text>
  <text class="b" x="495" y="452">Building, previewing, and testing consume Copilot Credits</text>

  <rect class="box" x="60" y="640" width="360" height="280" rx="22" fill="#f6f8fa"/>
  <text class="h" x="100" y="768">Standard</text>
  <text class="h" x="100" y="814">harness</text>
  <line x1="460" y1="780" x2="1430" y2="780" stroke="#8c959f" stroke-width="3" stroke-dasharray="10 10"/>
  <path class="band" d="M1440,720 H1790 L1850,780 L1790,840 H1440 Z"/>
  <text class="s" x="1470" y="772">Billing starts</text>
  <text class="s" x="1470" y="812">after publishing</text>
</svg>
