<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">The four outcomes of a test case and who owns them</title>
<desc id="d">One test case has four possible outcomes. Invalid means the case could not be graded because an input the grader needs is missing, and Error means the run itself failed, for example authentication or a connection under the selected user profile: these are about the run or the case, your problem rather than the agent's, and are cleared first. Pass and Fail are verdicts about the agent's answer, never a substitute for reading what the agent actually said, and are interpreted second; a case that flips is the signal.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
.r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

<rect x="660" y="60" width="600" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="960" y="110" font-size="32" text-anchor="middle">One test case</text>
<text class="s" x="960" y="152" font-size="28" text-anchor="middle">four possible outcomes</text>
<path d="M860,180 V228 H510 V272" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1060,180 V228 H1410 V272" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="90" y="280" width="840" height="730" rx="22" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="130" y="340" font-size="32">About the run or the case</text>
<rect x="130" y="375" width="200" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="230" y="417" font-size="30" text-anchor="middle">Invalid</text>
<text class="r" x="130" y="487" font-size="28">The case could not be graded: an input</text>
<text class="r" x="130" y="525" font-size="28">the grader needs is missing</text>
<rect x="130" y="570" width="200" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="230" y="612" font-size="30" text-anchor="middle">Error</text>
<text class="r" x="130" y="682" font-size="28">The run itself failed, for example</text>
<text class="r" x="130" y="720" font-size="28">authentication or a connection under</text>
<text class="r" x="130" y="758" font-size="28">the selected user profile</text>
<rect x="120" y="810" width="780" height="170" rx="16" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
<circle cx="190" cy="895" r="38" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="190" y="907" font-size="34" text-anchor="middle">1</text>
<text class="h" x="252" y="882" font-size="30">Clear these first</text>
<text class="s" x="252" y="924" font-size="28">your problem, not the agent's</text>

<rect x="990" y="280" width="840" height="730" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1030" y="340" font-size="32">About the agent's answer</text>
<rect x="1030" y="375" width="200" height="62" rx="31" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1130" y="417" font-size="30" text-anchor="middle">Pass</text>
<rect x="1260" y="375" width="200" height="62" rx="31" fill="#fdecec" stroke="#c24141" stroke-width="2"/>
<text class="h" x="1360" y="417" font-size="30" text-anchor="middle">Fail</text>
<text class="r" x="1030" y="487" font-size="28">Verdicts about the answer the agent gave</text>
<text class="r" x="1030" y="682" font-size="28">Never a substitute for reading</text>
<text class="r" x="1030" y="720" font-size="28">what the agent actually said</text>
<rect x="1020" y="810" width="780" height="170" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<circle cx="1090" cy="895" r="38" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1090" y="907" font-size="34" text-anchor="middle">2</text>
<text class="h" x="1152" y="882" font-size="30">Then interpret Pass and Fail</text>
<text class="s" x="1152" y="924" font-size="28">a case that flips is the signal</text>
</svg>
