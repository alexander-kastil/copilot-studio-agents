<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Evaluate reads the verdict, Monitor reads the path</title>
<desc id="d">One test case reaches an answer by two paths: through the knowledge source you added, or from general model knowledge. Both answers pass, so Evaluate, which tells you whether the answer met the bar, shows the same verdict. Monitor, which shows what the agent did to produce the answer, shows the different paths, which is why a sample of passing cases is confirmed there. A highlight traces each path in turn.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
.r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

<rect x="520" y="70" width="590" height="940" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="560" y="132" font-size="34">Monitor</text>
<text class="s" x="560" y="174" font-size="28">what the agent did</text>
<text class="s" x="560" y="212" font-size="28">to produce the answer</text>

<rect x="1170" y="70" width="680" height="940" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1210" y="132" font-size="34">Evaluate</text>
<text class="s" x="1210" y="174" font-size="28">whether the answer met the bar</text>

<rect x="70" y="480" width="350" height="170" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="245" y="557" font-size="32" text-anchor="middle">Test case</text>
<text class="s" x="245" y="599" font-size="28" text-anchor="middle">one question</text>

<path d="M420,530 H470 V345 H574" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<path d="M420,600 H470 V765 H574" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="580" y="270" width="470" height="150" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="815" y="337" font-size="30" text-anchor="middle">Knowledge source</text>
<text class="s" x="815" y="378" font-size="28" text-anchor="middle">you added</text>
<rect x="580" y="690" width="470" height="150" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="815" y="757" font-size="30" text-anchor="middle">General model</text>
<text class="s" x="815" y="798" font-size="28" text-anchor="middle">knowledge</text>

<text class="h" x="815" y="575" font-size="30" text-anchor="middle">Different paths</text>

<path d="M1050,345 H1214" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1050,765 H1214" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="1220" y="285" width="240" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1340" y="355" font-size="30" text-anchor="middle">Answer</text>
<rect x="1220" y="705" width="240" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1340" y="775" font-size="30" text-anchor="middle">Answer</text>

<path d="M1460,345 H1554" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1460,765 H1554" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="1560" y="300" width="240" height="90" rx="45" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1680" y="357" font-size="32" text-anchor="middle">Pass</text>
<rect x="1560" y="720" width="240" height="90" rx="45" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1680" y="777" font-size="32" text-anchor="middle">Pass</text>

<text class="h" x="1510" y="575" font-size="30" text-anchor="middle">Same verdict</text>

<text class="h" x="815" y="925" font-size="28" text-anchor="middle">Confirm a sample of</text>
<text class="h" x="815" y="963" font-size="28" text-anchor="middle">passing cases here</text>

<g fill="none" stroke="#e0a534" stroke-width="7">
<rect x="63" y="473" width="364" height="184" rx="24" opacity="1"><animate attributeName="opacity" values="1;0;1;0" keyTimes="0;0.125;0.5;0.625" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="573" y="263" width="484" height="164" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.125;0.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1213" y="278" width="254" height="134" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.375" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1553" y="293" width="254" height="104" rx="52" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.375;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="573" y="683" width="484" height="164" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.625;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1213" y="698" width="254" height="134" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1553" y="713" width="254" height="104" rx="52" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/></rect>
</g>
</svg>
