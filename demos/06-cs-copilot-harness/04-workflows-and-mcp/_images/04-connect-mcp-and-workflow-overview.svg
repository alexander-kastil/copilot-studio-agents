<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Live Dataverse records rise through the Northwind Sales Assistant into a Preview answer and a workflow run</title>
  <desc id="d">At the bottom, the Microsoft Dataverse MCP Server holds account, order and support case records, read live; over the Streamable transport, server changes need no republish. In the middle, the published Northwind Sales Assistant calls it when the Server description matches the question. Top left, Preview: the question Which open support cases do we have for accounts in the North region? shows a Used tool line that expands to Output and Latency, and the answer lists open support cases for North region accounts. Top right, the workflow Northwind Follow-up Draft: the trigger takes AccountName, Alpine Ski House, the Agent node calls the assistant and takes about 17 seconds, and Respond to the agent returns FollowUp; Version history marks the published version LIVE. Dots carry the records up into the Preview answer, then through the workflow run.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
