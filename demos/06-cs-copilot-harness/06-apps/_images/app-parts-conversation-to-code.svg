<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">What an app is made of</title>
  <desc id="d">A message in the conversation makes Copilot Studio update the data model, the logic, and the user interface together. The live preview shows the result for testing, the read-only code view shows the generated files, and every change goes back through the conversation.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:600;fill:#24292f}
      .l{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;fill:#24292f}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;fill:#57606a}
      .e{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:600;fill:#24292f}
      .c{font-family:Consolas,'Courier New',monospace;font-size:30px;font-weight:700;fill:#57606a}
      .box{stroke:#8c959f;stroke-width:2}
      .arrow{stroke:#57606a;stroke-width:3;fill:none}
      .hi{fill:none;stroke:#e0a534;stroke-width:6}
    </style>
  </defs>

  <rect class="box" x="90" y="250" width="430" height="430" rx="22" fill="#eaf2ff"/>
  <path d="M136,292 h76 a14,14 0 0 1 14,14 v34 a14,14 0 0 1 -14,14 h-46 l-22,18 v-18 h-8 a14,14 0 0 1 -14,-14 v-34 a14,14 0 0 1 14,-14 z" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <text class="h" x="130" y="420">Conversation</text>
  <text class="b" x="130" y="472">Describe the app in</text>
  <text class="b" x="130" y="510">plain language</text>
  <text class="b" x="130" y="582">Every change</text>
  <text class="b" x="130" y="620">happens here</text>

  <rect class="box" x="680" y="150" width="560" height="650" rx="22" fill="#f3edff"/>
  <text class="l" x="720" y="215">Copilot Studio generates</text>
  <rect class="box" x="730" y="260" width="460" height="120" rx="16" fill="#ffffff"/>
  <text class="h" x="960" y="332" text-anchor="middle">Data model</text>
  <rect class="box" x="730" y="410" width="460" height="120" rx="16" fill="#ffffff"/>
  <text class="h" x="960" y="482" text-anchor="middle">Logic</text>
  <rect class="box" x="730" y="560" width="460" height="120" rx="16" fill="#ffffff"/>
  <text class="h" x="960" y="632" text-anchor="middle">User interface</text>
  <text class="b" x="960" y="750" text-anchor="middle" font-style="italic">Updated together</text>

  <rect class="box" x="1400" y="150" width="430" height="300" rx="22" fill="#e9f7ef"/>
  <path d="M1752,186 l34,20 l-34,20 z" fill="#57606a"/>
  <text class="h" x="1440" y="230">Live preview</text>
  <text class="b" x="1440" y="285">Test features,</text>
  <text class="b" x="1440" y="325">behavior, and</text>
  <text class="b" x="1440" y="365">connected data</text>

  <rect class="box" x="1400" y="500" width="430" height="300" rx="22" fill="#f6f8fa"/>
  <text class="c" x="1730" y="582">&lt;/&gt;</text>
  <text class="h" x="1440" y="580">Code view</text>
  <text class="e" x="1440" y="636">Read-only</text>
  <text class="b" x="1440" y="680">Read and check</text>
  <text class="b" x="1440" y="720">the generated files</text>

  <line class="arrow" x1="520" y1="465" x2="676" y2="465" marker-end="url(#ah)"/>
  <line class="arrow" x1="1240" y1="300" x2="1396" y2="300" marker-end="url(#ah)"/>
  <line class="arrow" x1="1240" y1="650" x2="1396" y2="650" marker-end="url(#ah)"/>
  <path id="back" class="arrow" d="M1615,800 V880 H305 V684" stroke-dasharray="14 10" marker-end="url(#ah)"/>
  <text class="e" x="960" y="935" text-anchor="middle" fill="#57606a">Changes go through the conversation</text>

  <rect class="hi" x="726" y="256" width="468" height="128" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.4167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="726" y="406" width="468" height="128" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.4167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="726" y="556" width="468" height="128" rx="18" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.1667;0.4167" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="1394" y="144" width="442" height="312" rx="26" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.55;0.75" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="1394" y="494" width="442" height="312" rx="26" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.55;0.75" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
  </rect>

  <circle cx="534" cy="465" r="13" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0333;0.1667" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="534;534;660;660" keyTimes="0;0.0333;0.1667;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1254" cy="300" r="13" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.55" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1254;1254;1380;1380" keyTimes="0;0.4167;0.55;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1254" cy="650" r="13" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4167;0.55" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cx" values="1254;1254;1380;1380" keyTimes="0;0.4167;0.55;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="13" fill="#0969da" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.9833" calcMode="discrete" dur="6s" repeatCount="indefinite"/>
    <animateMotion path="M1615,800 V880 H305 V700" keyPoints="0;0;1;1" keyTimes="0;0.75;0.9833;1" calcMode="linear" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
