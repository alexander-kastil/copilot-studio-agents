<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A fast model answers at once, a reasoning model works the question through step by step</title>
  <desc id="d">A question where several rules meet, for example planning next month's stock against changing demand, can take two paths. The fast model answers at once: quick, but it may take a confident shortcut. The reasoning model reads the rules, checks each option, weighs them against each other and then answers: slower, more careful.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="330" width="460" height="420" rx="20" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="100" y="410" font-size="32" font-weight="700" fill="#24292f">A question where</text>
  <text x="100" y="452" font-size="32" font-weight="700" fill="#24292f">several rules meet</text>
  <text x="100" y="560" font-size="28" fill="#57606a">for example: plan next</text>
  <text x="100" y="600" font-size="28" fill="#57606a">month's stock against</text>
  <text x="100" y="640" font-size="28" fill="#57606a">changing demand</text>

  <rect x="600" y="60" width="1260" height="290" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="640" y="130" font-size="32" font-weight="700" fill="#24292f">Fast model</text>
  <text x="640" y="300" font-size="28" fill="#57606a">quick, but may take a confident shortcut</text>
  <rect x="1380" y="105" width="440" height="200" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1600" y="216" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">Answers at once</text>

  <rect x="600" y="400" width="1260" height="620" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="640" y="470" font-size="32" font-weight="700" fill="#24292f">Reasoning model</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="640" y="505" width="520" height="90" rx="14"/>
    <rect x="640" y="630" width="520" height="90" rx="14"/>
    <rect x="640" y="755" width="520" height="90" rx="14"/>
    <rect x="640" y="880" width="520" height="90" rx="14"/>
  </g>
  <g font-size="28" fill="#24292f">
    <text x="675" y="560">reads the rules</text>
    <text x="675" y="685">checks each option</text>
    <text x="675" y="810">weighs them against each other</text>
    <text x="675" y="935">answers</text>
  </g>
  <rect x="1380" y="640" width="440" height="240" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="1600" cy="720" r="34" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <path d="M1583,721 l12,12 l23,-26" fill="none" stroke="#1a7f37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1600" y="820" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">slower, more careful</text>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="522" y1="420" x2="596" y2="270"/>
    <line x1="522" y1="660" x2="596" y2="760"/>
    <line x1="640" y1="205" x2="1376" y2="205"/>
    <line x1="900" y1="597" x2="900" y2="626"/>
    <line x1="900" y1="722" x2="900" y2="751"/>
    <line x1="900" y1="847" x2="900" y2="876"/>
    <line x1="1162" y1="925" x2="1376" y2="830"/>
  </g>
</svg>
