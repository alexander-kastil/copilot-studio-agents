<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Deep reasoning only for a step that weighs evidence; five situations that stay on a cheaper choice</title>
  <desc id="d">Does the step weigh evidence? Yes leads to a deep reasoning node with the reason keyword. No leads to five situations and their better choice: FAQ answers and lookups use the default model with knowledge; a fixed rule, the same every time, belongs in an agent flow or a Power Fx condition; high volume or latency-sensitive conversations, such as a phone line, use the default model with reason on no step; vague instructions with weak answers need the instructions rewritten first; data residency outside the US and EU regions waits for regional availability. A reasoning step costs the feature's own rate plus 10 Copilot Credits per 1,000 tokens.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="40" width="760" height="110" rx="55" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="440" y="106" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Does the step weigh evidence?</text>

  <rect x="1060" y="40" width="800" height="110" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1100" y="67" width="140" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="105" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">reason</text>
  <text x="1270" y="106" font-size="32" font-weight="700" fill="#24292f">deep reasoning node</text>

  <text x="940" y="80" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">Yes</text>
  <text x="140" y="196" font-size="30" font-weight="700" fill="#24292f">No</text>

  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="160" y="230" width="780" height="120" rx="16"/>
    <rect x="160" y="370" width="780" height="120" rx="16"/>
    <rect x="160" y="510" width="780" height="120" rx="16"/>
    <rect x="160" y="650" width="780" height="120" rx="16"/>
    <rect x="160" y="790" width="780" height="120" rx="16"/>
  </g>
  <g fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
    <rect x="1060" y="230" width="800" height="120" rx="16"/>
    <rect x="1060" y="370" width="800" height="120" rx="16"/>
    <rect x="1060" y="510" width="800" height="120" rx="16"/>
    <rect x="1060" y="650" width="800" height="120" rx="16"/>
    <rect x="1060" y="790" width="800" height="120" rx="16"/>
  </g>

  <text x="195" y="300" font-size="28" fill="#24292f">FAQ answers and lookups</text>
  <text x="195" y="421" font-size="28" fill="#24292f">A fixed rule,</text>
  <text x="195" y="459" font-size="28" fill="#24292f">the same every time</text>
  <text x="195" y="561" font-size="28" fill="#24292f">High volume or latency-sensitive,</text>
  <text x="195" y="599" font-size="28" fill="#24292f">such as a phone line</text>
  <text x="195" y="701" font-size="28" fill="#24292f">Vague instructions,</text>
  <text x="195" y="739" font-size="28" fill="#24292f">weak answers</text>
  <text x="195" y="841" font-size="28" fill="#24292f">Data residency outside</text>
  <text x="195" y="879" font-size="28" fill="#24292f">the US and EU regions</text>

  <text x="1095" y="300" font-size="28" fill="#24292f">default model with knowledge</text>
  <text x="1095" y="440" font-size="28" fill="#24292f">agent flow or Power Fx condition</text>
  <text x="1095" y="580" font-size="28" fill="#24292f">default model, <tspan font-family="Consolas, monospace" font-weight="700">reason</tspan> on no step</text>
  <text x="1095" y="720" font-size="28" fill="#24292f">rewrite the instructions first</text>
  <text x="1095" y="860" font-size="28" fill="#24292f">wait for regional availability</text>

  <g stroke="#57606a" stroke-width="3" fill="none">
    <line x1="100" y1="150" x2="100" y2="850"/>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="822" y1="95" x2="1056" y2="95"/>
    <line x1="100" y1="290" x2="156" y2="290"/>
    <line x1="100" y1="430" x2="156" y2="430"/>
    <line x1="100" y1="570" x2="156" y2="570"/>
    <line x1="100" y1="710" x2="156" y2="710"/>
    <line x1="100" y1="850" x2="156" y2="850"/>
    <line x1="942" y1="290" x2="1056" y2="290"/>
    <line x1="942" y1="430" x2="1056" y2="430"/>
    <line x1="942" y1="570" x2="1056" y2="570"/>
    <line x1="942" y1="710" x2="1056" y2="710"/>
    <line x1="942" y1="850" x2="1056" y2="850"/>
  </g>

  <rect x="60" y="950" width="1800" height="90" rx="16" fill="#fff4e0" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="1006" text-anchor="middle" font-size="30" fill="#24292f">A reasoning step = <tspan font-weight="700">the feature's own rate + 10 Copilot Credits per 1,000 tokens</tspan></text>
</svg>
