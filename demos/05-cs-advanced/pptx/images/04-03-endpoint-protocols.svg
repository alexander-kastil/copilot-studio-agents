<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">One agent endpoint over immutable versions, speaking five protocols</title>
  <desc id="d">Three immutable versions v1, v2 and v3 sit under the agent. Always use latest points to v3 by default; production pins v2. The agent endpoint keeps a stable identity and address and serves five protocols: Responses for apps, the Foundry portal and SDKs; Activity Protocol for Teams, Microsoft Copilot and Copilot Studio; Invocations for custom apps with their own payloads; A2A for other agents; MCP in preview for MCP clients. Inbound calls use Microsoft Entra ID or Azure Bot Service; API keys are not supported.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
    <marker id="ahn" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B365D"/>
    </marker>
    <marker id="aha" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#b7791f"/>
    </marker>
    <g id="lock">
      <rect x="-14" y="-4" width="28" height="22" rx="4" fill="#57606a"/>
      <path d="M-9,-4 v-7 a9,9 0 0 1 18,0 v7" fill="none" stroke="#57606a" stroke-width="4"/>
    </g>
  </defs>

  <rect x="60" y="290" width="220" height="110" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="356" font-size="34" font-weight="700" fill="#24292f">v3</text>
  <use href="#lock" x="236" y="342"/>
  <rect x="60" y="430" width="220" height="110" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="496" font-size="34" font-weight="700" fill="#24292f">v2</text>
  <use href="#lock" x="236" y="482"/>
  <rect x="60" y="570" width="220" height="110" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="636" font-size="34" font-weight="700" fill="#24292f">v1</text>
  <use href="#lock" x="236" y="622"/>
  <text x="170" y="736" text-anchor="middle" font-size="28" fill="#57606a">immutable version</text>

  <rect x="340" y="290" width="290" height="110" rx="16" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
  <text x="485" y="337" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">Always use latest</text>
  <text x="485" y="375" text-anchor="middle" font-size="28" fill="#57606a">default</text>
  <line x1="340" y1="345" x2="284" y2="345" stroke="#b7791f" stroke-width="4" marker-end="url(#aha)"/>

  <rect x="340" y="430" width="290" height="110" rx="16" fill="#1B365D" stroke="#1B365D" stroke-width="2"/>
  <text x="485" y="477" text-anchor="middle" font-size="28" font-weight="700" fill="#ffffff">pinned</text>
  <text x="485" y="515" text-anchor="middle" font-size="28" fill="#ffffff">production</text>
  <line x1="340" y1="485" x2="284" y2="485" stroke="#1B365D" stroke-width="4" marker-end="url(#ahn)"/>

  <line x1="700" y1="420" x2="630" y2="345" stroke="#8c959f" stroke-width="3"/>
  <line x1="700" y1="485" x2="630" y2="485" stroke="#8c959f" stroke-width="3"/>

  <rect x="700" y="365" width="360" height="240" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="880" y="455" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Agent endpoint</text>
  <text x="880" y="505" text-anchor="middle" font-size="28" fill="#57606a">stable identity</text>
  <text x="880" y="543" text-anchor="middle" font-size="28" fill="#57606a">and address</text>

  <path d="M1060,405 C1100,405 1100,209 1136,209" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1060,445 C1100,445 1100,347 1136,347" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1060" y1="485" x2="1136" y2="485" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1060,525 C1100,525 1100,623 1136,623" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1060,565 C1100,565 1100,761 1136,761" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="1140" y="150" width="720" height="118" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="199" font-size="30" font-weight="700" fill="#24292f">Responses</text>
  <text x="1170" y="241" font-size="28" fill="#57606a">apps, the Foundry portal and SDKs</text>

  <rect x="1140" y="288" width="720" height="118" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="337" font-size="30" font-weight="700" fill="#24292f">Activity Protocol</text>
  <text x="1170" y="379" font-size="28" fill="#57606a">Teams, Microsoft Copilot, Copilot Studio</text>

  <rect x="1140" y="426" width="720" height="118" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="475" font-size="30" font-weight="700" fill="#24292f">Invocations</text>
  <text x="1170" y="517" font-size="28" fill="#57606a">custom apps with their own payloads</text>

  <rect x="1140" y="564" width="720" height="118" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="613" font-size="30" font-weight="700" fill="#24292f">A2A</text>
  <text x="1170" y="655" font-size="28" fill="#57606a">other agents</text>

  <rect x="1140" y="702" width="720" height="118" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1170" y="751" font-size="30" font-weight="700" fill="#24292f">MCP (preview)</text>
  <text x="1170" y="793" font-size="28" fill="#57606a">MCP clients</text>

  <rect x="60" y="890" width="1800" height="120" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="962" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Inbound: Microsoft Entra ID or Azure Bot Service. No API keys.</text>
</svg>
