  <rect x="1520" y="570" width="120" height="60" rx="30" fill="#1B365D"/>
  <circle cx="1610" cy="600" r="23" fill="#ffffff"/>

  <rect x="60" y="870" width="1800" height="140" rx="22" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
  <text x="960" y="952" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Only in environments in the United States or the EU, not the United Kingdom</text>
