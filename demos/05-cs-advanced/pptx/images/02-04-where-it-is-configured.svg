<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Where deep reasoning is configured on a Standard agent's page</title>
  <desc id="d">A schematic of the agent page with the tabs Overview, Knowledge, Tools, Agents, Topics and Activity and a Settings button. 1, in Settings: Generative AI, Orchestration set to Yes, needed first. 2, in Settings: Deep reasoning (preview) switched on. 3, on Overview: the Instructions hold the line 4. Use reason to choose the best option. 4, on Activity: the activity map shows a Deep reasoning node. Only in environments in the United States or the EU, not the United Kingdom.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="40" width="1800" height="230" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <path d="M62,140 H1858" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="104" font-size="34" font-weight="700" fill="#24292f">Your agent</text>
  <rect x="1500" y="64" width="260" height="56" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1630" y="102" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">Settings</text>
  <text x="100" y="215" font-size="28" fill="#24292f">Overview</text>
  <text x="270" y="215" font-size="28" fill="#57606a">Knowledge</text>
  <text x="450" y="215" font-size="28" fill="#57606a">Tools</text>
  <text x="570" y="215" font-size="28" fill="#57606a">Agents</text>
  <text x="700" y="215" font-size="28" fill="#57606a">Topics</text>
  <text x="830" y="215" font-size="28" fill="#24292f">Activity</text>
  <path d="M100,232 H222" stroke="#1B365D" stroke-width="4"/>
  <path d="M830,232 H936" stroke="#1B365D" stroke-width="4"/>

  <path d="M161,236 V312" fill="none" stroke="#1B365D" stroke-width="3"/>
  <path d="M883,236 V312" fill="none" stroke="#1B365D" stroke-width="3"/>
  <path d="M1560,120 V190 H1240 V312" fill="none" stroke="#1B365D" stroke-width="3"/>
  <path d="M1700,120 V312" fill="none" stroke="#1B365D" stroke-width="3"/>
  <path d="M161,368 V390 M883,368 V390 M1240,368 V390 M1700,368 V390" stroke="#1B365D" stroke-width="3"/>

  <circle cx="161" cy="340" r="28" fill="#1B365D"/>
  <text x="161" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">3</text>
  <circle cx="883" cy="340" r="28" fill="#1B365D"/>
  <text x="883" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">4</text>
  <circle cx="1240" cy="340" r="28" fill="#1B365D"/>
  <text x="1240" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">1</text>
  <circle cx="1700" cy="340" r="28" fill="#1B365D"/>
  <text x="1700" y="350" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">2</text>

  <rect x="60" y="390" width="500" height="420" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="456" font-size="32" font-weight="700" fill="#24292f">Instructions</text>
  <rect x="90" y="500" width="440" height="200" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="575" font-size="30" fill="#24292f">4. Use</text>
  <rect x="216" y="539" width="130" height="50" rx="10" fill="#f3edff" stroke="#1B365D" stroke-width="2"/>
  <text x="281" y="574" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#1B365D">reason</text>
  <text x="120" y="645" font-size="30" fill="#24292f">to choose the best option</text>

  <rect x="600" y="390" width="400" height="420" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="640" y="456" font-size="32" font-weight="700" fill="#24292f">Activity map</text>
  <rect x="650" y="560" width="300" height="90" rx="45" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="800" y="616" text-anchor="middle" font-size="30" font-weight="700" fill="#1B365D">Deep reasoning</text>

  <rect x="1040" y="390" width="400" height="420" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1080" y="456" font-size="30" font-weight="700" fill="#24292f">Generative AI &gt;</text>
  <text x="1080" y="498" font-size="30" font-weight="700" fill="#24292f">Orchestration: Yes</text>
  <text x="1080" y="560" font-size="28" fill="#57606a">needed first</text>

  <rect x="1480" y="390" width="380" height="420" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
