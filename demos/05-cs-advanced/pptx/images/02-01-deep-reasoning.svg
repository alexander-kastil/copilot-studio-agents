<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The reason keyword sends only step 4 of the Sourcing Advisor instructions to Azure OpenAI o3</title>
  <desc id="d">Five instruction steps run in order. Steps 1 to 3 read sourcing policy SP-14, the supplier scorecard and the incident log on the fast default model. Step 4 carries the reason keyword and runs on Azure OpenAI o3, the deep reasoning model, which is slower and billed per use. Step 5 presents the recommendation back on the fast default model.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="60" width="920" height="960" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="120" font-size="34" font-weight="700" fill="#24292f">Fast default model</text>
  <text x="100" y="162" font-size="28" fill="#57606a">steps without the keyword</text>

  <rect x="1040" y="60" width="820" height="960" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1080" y="120" font-size="34" font-weight="700" fill="#24292f">Azure OpenAI o3</text>
  <text x="1080" y="162" font-size="28" fill="#57606a">deep reasoning (preview)</text>

  <circle cx="1100" cy="280" r="9" fill="#57606a"/>
  <text x="1126" y="290" font-size="28" fill="#24292f">Forced by the keyword <tspan font-family="Consolas, monospace" font-weight="700">reason</tspan></text>
  <circle cx="1100" cy="350" r="9" fill="#57606a"/>
  <text x="1126" y="360" font-size="28" fill="#24292f">Runs for that step only</text>
  <circle cx="1100" cy="420" r="9" fill="#57606a"/>
  <text x="1126" y="430" font-size="28" fill="#24292f">Noticeably slower responses</text>
  <circle cx="1100" cy="490" r="9" fill="#57606a"/>
  <text x="1126" y="500" font-size="28" fill="#24292f">Billed Copilot Credits per use</text>

  <rect x="100" y="200" width="840" height="120" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="156" cy="260" r="26" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="156" y="270" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">1</text>
  <text x="206" y="250" font-size="30" font-weight="600" fill="#24292f">Read sourcing policy SP-14</text>
  <text x="206" y="292" font-size="28" fill="#57606a">volume, start date, rules R1 to R8</text>

  <rect x="100" y="365" width="840" height="120" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="156" cy="425" r="26" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="156" y="435" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">2</text>
  <text x="206" y="415" font-size="30" font-weight="600" fill="#24292f">Read the supplier scorecard</text>
  <text x="206" y="457" font-size="28" fill="#57606a">list every supplier with its scores</text>

  <rect x="100" y="530" width="840" height="120" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="156" cy="590" r="26" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="156" y="600" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">3</text>
  <text x="206" y="580" font-size="30" font-weight="600" fill="#24292f">Read the supplier incident log</text>
  <text x="206" y="622" font-size="28" fill="#57606a">note every open incident and its severity</text>

  <rect x="1080" y="610" width="740" height="290" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="1136" cy="668" r="26" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1136" y="678" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">4</text>
  <text x="1186" y="678" font-size="32" font-weight="600" fill="#24292f"><tspan font-family="Consolas, monospace" font-weight="700">reason</tspan> through the award</text>
  <text x="1136" y="740" font-size="28" fill="#57606a">screen each supplier against R1 to R4</text>
  <text x="1136" y="782" font-size="28" fill="#57606a">apply the cap R5 and continuity R6</text>
  <text x="1136" y="824" font-size="28" fill="#57606a">rank with R7, determine the split</text>
  <text x="1136" y="866" font-size="28" fill="#57606a">escalate under R8 if volume is short</text>

  <rect x="100" y="860" width="840" height="120" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="156" cy="920" r="26" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="156" y="930" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">5</text>
  <text x="206" y="910" font-size="30" font-weight="600" fill="#24292f">Present the recommendation</text>
  <text x="206" y="952" font-size="28" fill="#57606a">primary, secondary, table of exclusions</text>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="520" y1="322" x2="520" y2="362"/>
    <line x1="520" y1="487" x2="520" y2="527"/>
    <line x1="942" y1="600" x2="1076" y2="700"/>
    <line x1="1078" y1="820" x2="944" y2="910"/>
  </g>

  <g fill="none" stroke="#e0a534" stroke-width="6">
    <rect x="92" y="192" width="856" height="136" rx="20" opacity="1">
      <animate attributeName="opacity" calcMode="discrete" values="1;0" keyTimes="0;0.1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="357" width="856" height="136" rx="20" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.1;0.2" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="522" width="856" height="136" rx="20" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.3" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1072" y="602" width="756" height="306" rx="20" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1;0.35;1;0.35;1;0.35;1;0.35;1;0" keyTimes="0;0.3;0.35;0.4;0.45;0.5;0.55;0.6;0.65;0.7;0.8" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="92" y="852" width="856" height="136" rx="20" opacity="0">
      <animate attributeName="opacity" calcMode="discrete" values="0;1" keyTimes="0;0.8" dur="10s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
