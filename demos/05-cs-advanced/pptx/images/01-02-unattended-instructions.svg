<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Three kinds of instructions feed one unattended run, and only maker-provided credentials let it finish</title>
  <desc id="d">Agent instructions apply to every run: tone, boundaries, data never to invent and how to report a failure. Payload instructions apply to this one trigger: what to look for in the event and which tool to call. Tool and topic descriptions help the orchestrator pick a tool and fill its inputs. All three feed an unattended run with nobody to answer a question, so the instructions name the tool, map each payload field to an input and say what to do when data is missing. A tool on maker-provided credentials lets the run go on; a tool on end user credentials asks for a sign-in and the run stops.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="60" width="580" height="290" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="122" font-size="34" font-weight="700" fill="#24292f">Agent instructions</text>
  <text x="100" y="166" font-size="28" font-weight="600" fill="#57606a">every run</text>
  <text x="100" y="224" font-size="28" fill="#24292f">tone, boundaries,</text>
  <text x="100" y="262" font-size="28" fill="#24292f">data never to invent,</text>
  <text x="100" y="300" font-size="28" fill="#24292f">how to report a failure</text>

  <rect x="60" y="395" width="580" height="290" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="457" font-size="34" font-weight="700" fill="#24292f">Payload instructions</text>
  <text x="100" y="501" font-size="28" font-weight="600" fill="#57606a">this one trigger</text>
  <text x="100" y="559" font-size="28" fill="#24292f">what to look for in the event,</text>
  <text x="100" y="597" font-size="28" fill="#24292f">which tool to call</text>

  <rect x="60" y="730" width="580" height="290" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="792" font-size="34" font-weight="700" fill="#24292f">Tool and topic descriptions</text>
  <text x="100" y="860" font-size="28" fill="#24292f">help the orchestrator pick</text>
  <text x="100" y="898" font-size="28" fill="#24292f">a tool and fill its inputs</text>

  <rect x="720" y="200" width="520" height="680" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="980" y="270" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Unattended run</text>
  <text x="980" y="316" text-anchor="middle" font-size="28" fill="#57606a">nobody to answer a question</text>

  <rect x="760" y="370" width="440" height="110" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <path d="M790,425 l14,14 l26,-30" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="435" font-size="28" fill="#24292f">name the tool</text>

  <rect x="760" y="510" width="440" height="140" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <path d="M790,580 l14,14 l26,-30" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="572" font-size="28" fill="#24292f">map each payload</text>
  <text x="850" y="610" font-size="28" fill="#24292f">field to an input</text>

  <rect x="760" y="680" width="440" height="160" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <path d="M790,760 l14,14 l26,-30" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="850" y="752" font-size="28" fill="#24292f">say what to do when</text>
  <text x="850" y="790" font-size="28" fill="#24292f">data is missing</text>

  <rect x="1320" y="200" width="540" height="300" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <circle cx="1590" cy="275" r="38" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <path d="M1570,276 l13,13 l28,-30" fill="none" stroke="#1a7f37" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1590" y="375" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Maker-provided credentials</text>
  <text x="1590" y="430" text-anchor="middle" font-size="28" fill="#57606a">the run goes on</text>

  <rect x="1320" y="580" width="540" height="300" rx="20" fill="#fdecea" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="680" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">End user credentials</text>
  <text x="1590" y="752" text-anchor="middle" font-size="28" fill="#57606a">asks for a sign-in:</text>
  <text x="1590" y="790" text-anchor="middle" font-size="28" fill="#57606a">the run stops</text>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="642" y1="205" x2="716" y2="330"/>
    <line x1="642" y1="540" x2="716" y2="540"/>
    <line x1="642" y1="875" x2="716" y2="760"/>
    <line x1="1242" y1="350" x2="1316" y2="350"/>
    <line x1="1242" y1="730" x2="1316" y2="730"/>
  </g>
</svg>
