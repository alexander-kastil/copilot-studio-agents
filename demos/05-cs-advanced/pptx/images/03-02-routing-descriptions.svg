<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A vague description is picked at random, a precise one gives the planner one clear route</title>
  <desc id="d">Left: a weak tool card, Answer Question, described as This tool can answer questions. The planner scatters three dashed arrows to three question marks: picked at random. Right: a strong tool card, Current Weather, described as Provides the current temperature and conditions for any location. Forecasts for future days are out of scope. One solid arrow from the planner: one clear route. Three chips name what makes it work: what it does, for whom, what it does not do. Bottom: two overlapping circles, two similar descriptions: overlap, the planner picks one, nobody asks the user.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
    <marker id="ahb" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B365D"/>
    </marker>
    <g id="planner">
      <circle cx="0" cy="0" r="58" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
      <circle cx="0" cy="-22" r="10" fill="#1B365D"/>
      <circle cx="-22" cy="16" r="10" fill="#1B365D"/>
      <circle cx="22" cy="16" r="10" fill="#1B365D"/>
      <path d="M0,-22 L-22,16 M0,-22 L22,16 M-22,16 L22,16" stroke="#1B365D" stroke-width="3" fill="none"/>
    </g>
  </defs>

  <rect x="40" y="40" width="900" height="730" rx="22" fill="#fdecea" stroke="#8c959f" stroke-width="2"/>
  <rect x="80" y="80" width="820" height="170" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="115" y="142" font-size="32" font-weight="700" fill="#24292f">Answer Question</text>
  <text x="115" y="200" font-size="28" fill="#57606a">This tool can answer questions.</text>

  <use href="#planner" x="220" y="520"/>
  <text x="220" y="620" text-anchor="middle" font-size="28" fill="#57606a">planner</text>
  <text x="220" y="700" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">picked at random</text>

  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="640" y="300" width="100" height="100" rx="12"/>
    <rect x="640" y="470" width="100" height="100" rx="12"/>
    <rect x="640" y="640" width="100" height="100" rx="12"/>
  </g>
  <text x="690" y="365" text-anchor="middle" font-size="40" font-weight="700" fill="#57606a">?</text>
  <text x="690" y="535" text-anchor="middle" font-size="40" font-weight="700" fill="#57606a">?</text>
  <text x="690" y="705" text-anchor="middle" font-size="40" font-weight="700" fill="#57606a">?</text>

  <g stroke="#57606a" stroke-width="3" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)">
    <line x1="274" y1="496" x2="636" y2="355"/>
    <line x1="280" y1="520" x2="636" y2="520"/>
    <line x1="274" y1="544" x2="636" y2="685"/>
  </g>

  <rect x="980" y="40" width="900" height="730" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <rect x="1020" y="80" width="820" height="280" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1055" y="142" font-size="32" font-weight="700" fill="#24292f">Current Weather</text>
  <text x="1055" y="198" font-size="28" fill="#57606a">Provides the current temperature and conditions</text>
  <text x="1055" y="238" font-size="28" fill="#57606a">for any location. Forecasts for future days</text>
  <text x="1055" y="278" font-size="28" fill="#57606a">are out of scope.</text>

  <g fill="#ffffff" stroke="#1B365D" stroke-width="2">
    <rect x="1180" y="390" width="190" height="56" rx="28"/>
    <rect x="1385" y="390" width="140" height="56" rx="28"/>
    <rect x="1540" y="390" width="290" height="56" rx="28"/>
  </g>
  <text x="1275" y="427" text-anchor="middle" font-size="28" fill="#24292f">what it does</text>
  <text x="1455" y="427" text-anchor="middle" font-size="28" fill="#24292f">for whom</text>
  <text x="1685" y="427" text-anchor="middle" font-size="28" fill="#24292f">what it does not do</text>

  <use href="#planner" x="1090" y="620"/>
  <text x="1090" y="720" text-anchor="middle" font-size="28" fill="#57606a">planner</text>
  <text x="1180" y="632" font-size="28" font-weight="700" fill="#24292f">one clear route</text>
  <line x1="1090" y1="560" x2="1090" y2="366" stroke="#1B365D" stroke-width="5" marker-end="url(#ahb)"/>

  <rect x="40" y="810" width="1840" height="230" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <circle cx="230" cy="925" r="85" fill="#eaf2ff" fill-opacity="0.8" stroke="#8c959f" stroke-width="2"/>
  <circle cx="340" cy="925" r="85" fill="#f3edff" fill-opacity="0.8" stroke="#8c959f" stroke-width="2"/>
  <text x="490" y="905" font-size="32" font-weight="700" fill="#24292f">two similar descriptions</text>
  <text x="490" y="960" font-size="30" fill="#24292f">overlap: the planner picks one, nobody asks the user</text>
</svg>
