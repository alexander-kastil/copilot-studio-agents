<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Two levers choose the model: deep reasoning for one step, the primary model for every turn</title>
  <desc id="d">Lever 1, Settings, Deep reasoning (preview), with the reason keyword, runs one step on the reasoning model, which Learn names as Azure OpenAI o3. Lever 2, Overview, Model, sets the agent's primary model for every turn. Below, a scale of three model tags: General for everyday chat, light grounding and simple actions; Auto for mixed workloads, routed per turn; Deep for multistep reasoning, policy and contract analysis and complex troubleshooting. Latency and cost grow from lowest at General to highest at Deep, with Auto variable.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="50" width="880" height="420" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="112" font-size="30" font-weight="600" fill="#57606a">Lever 1</text>
  <text x="100" y="164" font-size="32" font-weight="700" fill="#24292f">Settings &gt; Deep reasoning (preview)</text>
  <rect x="100" y="200" width="150" height="56" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="238" text-anchor="middle" font-size="30" font-weight="700" font-family="Consolas, monospace" fill="#24292f">reason</text>
  <text x="100" y="340" font-size="30" fill="#24292f">one step on the reasoning model</text>
  <text x="100" y="384" font-size="28" fill="#57606a">(Learn: Azure OpenAI o3)</text>

  <rect x="980" y="50" width="880" height="420" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1020" y="112" font-size="30" font-weight="600" fill="#57606a">Lever 2</text>
  <text x="1020" y="164" font-size="32" font-weight="700" fill="#24292f">Overview &gt; Model</text>
  <text x="1020" y="340" font-size="30" fill="#24292f">the agent's primary model</text>
  <text x="1020" y="384" font-size="30" fill="#24292f">for every turn</text>

  <rect x="60" y="530" width="560" height="270" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="340" y="590" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">General</text>
  <text x="340" y="652" text-anchor="middle" font-size="28" fill="#57606a">everyday chat,</text>
  <text x="340" y="692" text-anchor="middle" font-size="28" fill="#57606a">light grounding,</text>
  <text x="340" y="732" text-anchor="middle" font-size="28" fill="#57606a">simple actions</text>

  <rect x="680" y="530" width="560" height="270" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="590" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Auto</text>
  <text x="960" y="652" text-anchor="middle" font-size="28" fill="#57606a">mixed workloads,</text>
  <text x="960" y="692" text-anchor="middle" font-size="28" fill="#57606a">routed per turn</text>

  <rect x="1300" y="530" width="560" height="270" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1580" y="590" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Deep</text>
  <text x="1580" y="652" text-anchor="middle" font-size="28" fill="#57606a">multistep reasoning,</text>
  <text x="1580" y="692" text-anchor="middle" font-size="28" fill="#57606a">policy and contract analysis,</text>
  <text x="1580" y="732" text-anchor="middle" font-size="28" fill="#57606a">complex troubleshooting</text>

  <text x="60" y="910" font-size="30" font-weight="700" fill="#24292f">latency</text>
  <text x="340" y="880" text-anchor="middle" font-size="28" fill="#57606a">lowest</text>
  <text x="960" y="880" text-anchor="middle" font-size="28" fill="#57606a">variable</text>
  <text x="1580" y="880" text-anchor="middle" font-size="28" fill="#57606a">highest</text>
  <text x="60" y="1030" font-size="30" font-weight="700" fill="#24292f">cost</text>
  <text x="340" y="1000" text-anchor="middle" font-size="28" fill="#57606a">lowest</text>
  <text x="960" y="1000" text-anchor="middle" font-size="28" fill="#57606a">variable</text>
  <text x="1580" y="1000" text-anchor="middle" font-size="28" fill="#57606a">highest</text>

  <g stroke="#57606a" stroke-width="4" fill="none" marker-end="url(#ah)">
    <line x1="200" y1="900" x2="1856" y2="900"/>
    <line x1="200" y1="1020" x2="1856" y2="1020"/>
  </g>
</svg>
