<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The activity map shows a deep reasoning node only where the reasoning model ran</title>
  <desc id="d">An activity map of five steps. Steps 1, 2, 4 and 5 run on the default model. Step 3 carries the reason keyword and shows a Deep reasoning node; expanded, the node shows the reasoning steps, the data the model used and the result. A simple lookup shows a three-step plan with no reasoning node. The same question, run without and with reason, gives two answers to compare: did the answer change?</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="60" y="60" width="500" height="140" rx="16"/>
    <rect x="60" y="240" width="500" height="140" rx="16"/>
    <rect x="60" y="700" width="500" height="140" rx="16"/>
    <rect x="60" y="880" width="500" height="140" rx="16"/>
  </g>
  <rect x="60" y="420" width="500" height="240" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>

  <g font-size="30" font-weight="700" fill="#24292f">
    <text x="95" y="118">Step 1</text>
    <text x="95" y="298">Step 2</text>
    <text x="95" y="482">Step 3</text>
    <text x="95" y="758">Step 4</text>
    <text x="95" y="938">Step 5</text>
  </g>
  <g font-size="28" fill="#57606a">
    <text x="95" y="162">default model</text>
    <text x="95" y="342">default model</text>
    <text x="95" y="802">default model</text>
    <text x="95" y="982">default model</text>
  </g>
  <rect x="220" y="448" width="140" height="50" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="290" y="483" text-anchor="middle" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">reason</text>
  <rect x="90" y="540" width="440" height="84" rx="42" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="310" y="592" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">Deep reasoning</text>

  <rect x="640" y="400" width="500" height="320" rx="18" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="670" y="425" width="440" height="80" rx="12"/>
    <rect x="670" y="520" width="440" height="80" rx="12"/>
    <rect x="670" y="615" width="440" height="80" rx="12"/>
  </g>
  <g font-size="28" fill="#24292f">
    <text x="700" y="475">reasoning steps</text>
    <text x="700" y="570">data the model used</text>
    <text x="700" y="665">result</text>
  </g>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="310" y1="202" x2="310" y2="236"/>
    <line x1="310" y1="382" x2="310" y2="416"/>
    <line x1="310" y1="662" x2="310" y2="696"/>
    <line x1="310" y1="842" x2="310" y2="876"/>
    <line x1="532" y1="582" x2="636" y2="582"/>
  </g>

  <rect x="1220" y="60" width="640" height="380" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="124" font-size="32" font-weight="700" fill="#24292f">A simple lookup</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="1260" y="170" width="160" height="80" rx="12"/>
    <rect x="1460" y="170" width="160" height="80" rx="12"/>
    <rect x="1660" y="170" width="160" height="80" rx="12"/>
  </g>
  <g font-size="28" fill="#24292f" text-anchor="middle">
    <text x="1340" y="220">Step 1</text>
    <text x="1540" y="220">Step 2</text>
    <text x="1740" y="220">Step 3</text>
  </g>
  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="1422" y1="210" x2="1456" y2="210"/>
    <line x1="1622" y1="210" x2="1656" y2="210"/>
  </g>
  <circle cx="1290" cy="350" r="26" fill="#ffffff" stroke="#1a7f37" stroke-width="3"/>
  <path d="M1277,351 l9,9 l17,-19" fill="none" stroke="#1a7f37" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1332" y="360" font-size="30" font-weight="700" fill="#24292f">no reasoning node</text>

  <rect x="1220" y="480" width="640" height="540" rx="20" fill="#fff4e0" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="544" font-size="32" font-weight="700" fill="#24292f">Same question,</text>
  <text x="1260" y="588" font-size="32" font-weight="700" fill="#24292f">with and without <tspan font-family="Consolas, monospace">reason</tspan></text>

  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="1260" y="630" width="270" height="230" rx="14"/>
    <rect x="1550" y="630" width="270" height="230" rx="14"/>
  </g>
  <text x="1395" y="680" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">without</text>
  <text x="1685" y="680" text-anchor="middle" font-size="28" font-weight="700" fill="#24292f">with</text>
  <g fill="#d0d7de">
    <rect x="1290" y="710" width="210" height="14" rx="7"/>
    <rect x="1290" y="745" width="180" height="14" rx="7"/>
    <rect x="1290" y="780" width="200" height="14" rx="7"/>
    <rect x="1290" y="815" width="130" height="14" rx="7"/>
    <rect x="1580" y="710" width="210" height="14" rx="7"/>
    <rect x="1580" y="745" width="190" height="14" rx="7"/>
    <rect x="1580" y="780" width="170" height="14" rx="7"/>
    <rect x="1580" y="815" width="140" height="14" rx="7"/>
  </g>
  <text x="1540" y="940" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">did the answer change?</text>
</svg>
