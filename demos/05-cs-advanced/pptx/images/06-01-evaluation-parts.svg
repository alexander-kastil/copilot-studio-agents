<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The parts of an evaluation: test set, test cases, test methods, user profile, run and results</title>
  <desc id="d">A test set holds test cases, each a question with an optional expected response, and up to five test methods, the graders. A user profile supplies the account and its connections. Both feed a run, which leads to recent results with one score per method. A test set runs either as single response, each question in a fresh chat, or as conversation in preview, where the exchange is graded as a whole.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ahn" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="24" markerHeight="24" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B365D"/>
    </marker>
  </defs>

  <rect x="50" y="110" width="700" height="860" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="90" y="174" font-size="34" font-weight="700" fill="#24292f">Test set</text>

  <rect x="80" y="210" width="640" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="254" font-size="28" font-weight="700" fill="#24292f">Test case</text>
  <rect x="110" y="276" width="170" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="195" y="312" text-anchor="middle" font-size="28" fill="#57606a">question</text>
  <rect x="300" y="276" width="400" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="312" text-anchor="middle" font-size="28" fill="#57606a">expected response (optional)</text>

  <rect x="80" y="370" width="640" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="414" font-size="28" font-weight="700" fill="#24292f">Test case</text>
  <rect x="110" y="436" width="170" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="195" y="472" text-anchor="middle" font-size="28" fill="#57606a">question</text>
  <rect x="300" y="436" width="400" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="472" text-anchor="middle" font-size="28" fill="#57606a">expected response (optional)</text>

  <rect x="80" y="530" width="640" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="574" font-size="28" font-weight="700" fill="#24292f">Test case</text>
  <rect x="110" y="596" width="170" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="195" y="632" text-anchor="middle" font-size="28" fill="#57606a">question</text>
  <rect x="300" y="596" width="400" height="52" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="500" y="632" text-anchor="middle" font-size="28" fill="#57606a">expected response (optional)</text>

  <rect x="80" y="700" width="640" height="240" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="752" font-size="28" font-weight="700" fill="#24292f">Test methods: up to five graders</text>
  <rect x="110" y="800" width="100" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="232" y="800" width="100" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="354" y="800" width="100" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="476" y="800" width="100" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="598" y="800" width="100" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="8 6"/>

  <rect x="800" y="60" width="1070" height="230" rx="30" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="816" y="76" width="519" height="198" rx="22" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <circle cx="856" cy="133" r="14" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <circle cx="856" cy="133" r="7" fill="#1B365D"/>
  <text x="884" y="143" font-size="30" font-weight="700" fill="#24292f">Single response:</text>
  <text x="844" y="196" font-size="28" fill="#24292f">each question in</text>
  <text x="844" y="236" font-size="28" fill="#24292f">a fresh chat</text>
  <circle cx="1386" cy="133" r="14" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <text x="1414" y="143" font-size="30" font-weight="700" fill="#24292f">Conversation (preview):</text>
  <text x="1374" y="196" font-size="28" fill="#57606a">the exchange graded</text>
  <text x="1374" y="236" font-size="28" fill="#57606a">as a whole</text>

  <rect x="800" y="620" width="320" height="270" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="840" y="680" font-size="32" font-weight="700" fill="#24292f">User profile</text>
  <path d="M842,740 l12,14 l24,-30" fill="none" stroke="#2da44e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="896" y="752" font-size="28" fill="#24292f">account</text>
  <path d="M842,814 l12,14 l24,-30" fill="none" stroke="#2da44e" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="896" y="826" font-size="28" fill="#24292f">connections</text>

  <rect x="1160" y="430" width="180" height="120" rx="20" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="1250" y="502" text-anchor="middle" font-size="34" font-weight="700" fill="#1B365D">Run</text>

  <line x1="750" y1="490" x2="1154" y2="490" stroke="#1B365D" stroke-width="5" marker-end="url(#ahn)"/>
  <path d="M1120,755 H1250 V556" fill="none" stroke="#1B365D" stroke-width="5" marker-end="url(#ahn)"/>
  <line x1="1340" y1="490" x2="1404" y2="490" stroke="#1B365D" stroke-width="5" marker-end="url(#ahn)"/>

  <rect x="1410" y="350" width="460" height="400" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1450" y="414" font-size="32" font-weight="700" fill="#24292f">Recent results</text>
  <rect x="1450" y="470" width="270" height="30" rx="15" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="1450" y="470" width="248" height="30" rx="15" fill="#1B365D"/>
  <text x="1840" y="496" text-anchor="end" font-size="28" fill="#24292f">92%</text>
  <rect x="1450" y="560" width="270" height="30" rx="15" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="1450" y="560" width="211" height="30" rx="15" fill="#1B365D"/>
  <text x="1840" y="586" text-anchor="end" font-size="28" fill="#24292f">78%</text>
  <rect x="1450" y="650" width="270" height="30" rx="15" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="1450" y="650" width="230" height="30" rx="15" fill="#1B365D"/>
  <text x="1840" y="676" text-anchor="end" font-size="28" fill="#24292f">85%</text>
</svg>
