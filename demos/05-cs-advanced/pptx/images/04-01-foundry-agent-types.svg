<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Three Foundry agent types, from configuration only to your own code</title>
  <desc id="d">A prompt agent is configuration: you supply model, instructions and tools, authored in the portal, SDK or REST API, with no runtime code, reached through the managed endpoint. A voice-based prompt agent is the same plus audio settings and a greeting, over a real-time WebSocket through Voice Live. A hosted agent is your code in a container image or a .zip file, written with Agent Framework, LangGraph, the OpenAI Agents SDK and others, running in a per-session sandbox with its own Microsoft Entra identity. For all three, Foundry runs the endpoint, scaling and observability.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="26" markerHeight="26" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="60" y="50" width="560" height="580" rx="22" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="100" y="122" font-size="34" font-weight="700" fill="#24292f">Prompt agent</text>
  <circle cx="110" cy="200" r="8" fill="#57606a"/>
  <text x="134" y="210" font-size="28" fill="#24292f">you supply model,</text>
  <text x="134" y="250" font-size="28" fill="#24292f">instructions and tools</text>
  <circle cx="110" cy="315" r="8" fill="#57606a"/>
  <text x="134" y="325" font-size="28" fill="#24292f">authored in the portal,</text>
  <text x="134" y="365" font-size="28" fill="#24292f">SDK or REST API</text>
  <circle cx="110" cy="430" r="8" fill="#57606a"/>
  <text x="134" y="440" font-size="28" fill="#24292f">no runtime code</text>
  <circle cx="110" cy="505" r="8" fill="#57606a"/>
  <text x="134" y="515" font-size="28" fill="#24292f">reached through the</text>
  <text x="134" y="555" font-size="28" fill="#24292f">managed endpoint</text>

  <rect x="680" y="50" width="560" height="580" rx="22" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="720" y="122" font-size="34" font-weight="700" fill="#24292f">Voice-based prompt agent</text>
  <circle cx="730" cy="200" r="8" fill="#57606a"/>
  <text x="754" y="210" font-size="28" fill="#24292f">the same as a</text>
  <text x="754" y="250" font-size="28" fill="#24292f">prompt agent</text>
  <circle cx="730" cy="315" r="8" fill="#57606a"/>
  <text x="754" y="325" font-size="28" fill="#24292f">plus audio settings</text>
  <text x="754" y="365" font-size="28" fill="#24292f">and a greeting</text>
  <circle cx="730" cy="430" r="8" fill="#57606a"/>
  <text x="754" y="440" font-size="28" fill="#24292f">real-time WebSocket</text>
  <text x="754" y="480" font-size="28" fill="#24292f">through Voice Live</text>

  <rect x="1300" y="50" width="560" height="580" rx="22" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1340" y="122" font-size="34" font-weight="700" fill="#24292f">Hosted agent</text>
  <circle cx="1350" cy="200" r="8" fill="#57606a"/>
  <text x="1374" y="210" font-size="28" fill="#24292f">your code in a container</text>
  <text x="1374" y="250" font-size="28" fill="#24292f">image or a .zip file</text>
  <circle cx="1350" cy="315" r="8" fill="#57606a"/>
  <text x="1374" y="325" font-size="28" fill="#24292f">Agent Framework, LangGraph,</text>
  <text x="1374" y="365" font-size="28" fill="#24292f">OpenAI Agents SDK and others</text>
  <circle cx="1350" cy="430" r="8" fill="#57606a"/>
  <text x="1374" y="440" font-size="28" fill="#24292f">runs in a per-session</text>
  <text x="1374" y="480" font-size="28" fill="#24292f">sandbox</text>
  <circle cx="1350" cy="545" r="8" fill="#57606a"/>
  <text x="1374" y="555" font-size="28" fill="#24292f">own Microsoft Entra identity</text>

  <line x1="80" y1="690" x2="1836" y2="690" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <text x="60" y="748" font-size="30" font-weight="700" fill="#57606a">configuration only</text>
  <text x="1860" y="748" text-anchor="end" font-size="30" font-weight="700" fill="#57606a">your own code</text>

  <rect x="60" y="820" width="1800" height="160" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="912" text-anchor="middle" font-size="34" font-weight="700" fill="#24292f">Foundry runs the endpoint, scaling and observability</text>
</svg>
