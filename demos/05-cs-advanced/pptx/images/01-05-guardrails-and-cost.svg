<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">An event passes five guardrails before it reaches an autonomous agent, and every payload is billed</title>
  <desc id="d">An event passes through five gates on its way to the autonomous agent, which runs on the author's credentials: narrow trigger parameters (one list, one folder), validate the input (authentic and expected), least privilege (only the tools this job needs), human approval (high-stakes steps) and audit (Activity page, Last step column). The cost panel: every payload is one message, a Recurrence trigger every 10 minutes sends 144 messages a day, shown as a 12 by 12 grid, and each agent action costs 5 Copilot Credits.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="40" y="480" width="160" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="551" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Event</text>

  <rect x="250" y="50" width="490" height="980" rx="22" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>

  <g fill="#ffffff" stroke="#1B365D" stroke-width="3">
    <rect x="270" y="70" width="450" height="160" rx="14"/>
    <rect x="270" y="260" width="450" height="160" rx="14"/>
    <rect x="270" y="450" width="450" height="160" rx="14"/>
    <rect x="270" y="640" width="450" height="160" rx="14"/>
    <rect x="270" y="830" width="450" height="180" rx="14"/>
  </g>
  <text x="300" y="136" font-size="30" font-weight="700" fill="#24292f">Narrow trigger parameters</text>
  <text x="300" y="182" font-size="28" fill="#57606a">one list, one folder</text>
  <text x="300" y="326" font-size="30" font-weight="700" fill="#24292f">Validate the input</text>
  <text x="300" y="372" font-size="28" fill="#57606a">authentic and expected</text>
  <text x="300" y="516" font-size="30" font-weight="700" fill="#24292f">Least privilege</text>
  <text x="300" y="562" font-size="28" fill="#57606a">only the tools this job needs</text>
  <text x="300" y="706" font-size="30" font-weight="700" fill="#24292f">Human approval</text>
  <text x="300" y="752" font-size="28" fill="#57606a">high-stakes steps</text>
  <text x="300" y="892" font-size="30" font-weight="700" fill="#24292f">Audit</text>
  <text x="300" y="938" font-size="28" fill="#57606a">Activity page,</text>
  <text x="300" y="976" font-size="28" fill="#57606a"><tspan font-family="Consolas, monospace">Last step</tspan> column</text>

  <rect x="790" y="300" width="230" height="110" rx="14" fill="#fff4e0" stroke="#8c959f" stroke-width="2"/>
  <text x="905" y="347" text-anchor="middle" font-size="28" fill="#24292f">author's</text>
  <text x="905" y="385" text-anchor="middle" font-size="28" fill="#24292f">credentials</text>

  <rect x="790" y="440" width="230" height="200" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="905" y="527" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Autonomous</text>
  <text x="905" y="569" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">agent</text>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="202" y1="540" x2="246" y2="540"/>
    <line x1="742" y1="540" x2="786" y2="540"/>
  </g>

  <rect x="1080" y="50" width="800" height="980" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1480" y="130" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Every payload = 1 message</text>

  <defs>
    <g id="r" fill="#eaf2ff" stroke="#1B365D" stroke-width="2">
      <rect x="1276" y="0" width="26" height="26" rx="4"/>
      <rect x="1310" y="0" width="26" height="26" rx="4"/>
      <rect x="1344" y="0" width="26" height="26" rx="4"/>
      <rect x="1378" y="0" width="26" height="26" rx="4"/>
      <rect x="1412" y="0" width="26" height="26" rx="4"/>
      <rect x="1446" y="0" width="26" height="26" rx="4"/>
      <rect x="1480" y="0" width="26" height="26" rx="4"/>
      <rect x="1514" y="0" width="26" height="26" rx="4"/>
      <rect x="1548" y="0" width="26" height="26" rx="4"/>
      <rect x="1582" y="0" width="26" height="26" rx="4"/>
      <rect x="1616" y="0" width="26" height="26" rx="4"/>
      <rect x="1650" y="0" width="26" height="26" rx="4"/>
    </g>
  </defs>
  <use href="#r" y="190"/>
  <use href="#r" y="224"/>
  <use href="#r" y="258"/>
  <use href="#r" y="292"/>
  <use href="#r" y="326"/>
  <use href="#r" y="360"/>
  <use href="#r" y="394"/>
  <use href="#r" y="428"/>
  <use href="#r" y="462"/>
  <use href="#r" y="496"/>
  <use href="#r" y="530"/>
  <use href="#r" y="564"/>

  <text x="1480" y="660" text-anchor="middle" font-size="30" font-weight="600" fill="#24292f">Recurrence every 10 minutes:</text>
  <text x="1480" y="702" text-anchor="middle" font-size="30" font-weight="600" fill="#24292f">144 messages a day</text>

  <line x1="1140" y1="780" x2="1820" y2="780" stroke="#8c959f" stroke-width="2"/>

  <text x="1480" y="870" text-anchor="middle" font-size="30" fill="#24292f">Each agent action:</text>
  <rect x="1310" y="900" width="340" height="70" rx="35" fill="#ffffff" stroke="#1B365D" stroke-width="3"/>
  <text x="1480" y="946" text-anchor="middle" font-size="30" font-weight="700" fill="#24292f">5 Copilot Credits</text>
</svg>
