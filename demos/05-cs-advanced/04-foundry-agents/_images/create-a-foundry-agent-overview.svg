<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Build, test, pin and call grey-logistics-device-specialist in Microsoft Foundry</title>
  <desc id="d">Inside the Foundry project: 1, the prompt agent grey-logistics-device-specialist is built from the gpt-5-mini model and instructions that cover standard laptops, warranty, battery, lost or stolen devices and device questions only. 2, the Playground tests it: a bulging Surface Laptop 7 battery gets stop using it, unplug it, IT desk today; the follow-up still under warranty after 30 months gets covered by the 3-year warranty, 2 business days to replace; a Teams password question gets outside my scope. 3, Version 2 adds loaner laptops for up to 10 business days and is pinned to receive 100 percent of the traffic; the agent endpoint, Responses protocol, is live from creation and serves the pinned version. 4, outside the portal, az rest sends the question which laptop does a new engineer receive, and when is it replaced, signed with a Microsoft Entra token for the Foundry User role and no API key, and the output text names the Dell Precision 5690, replaced every 4 years. A dot follows the steps from build to call.</desc>
