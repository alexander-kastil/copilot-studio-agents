<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">The seven Travel planner routing cases and the agent the Details panel names for each</title>
<desc id="d">Each of the seven cases of the test set Travel planner routing is answered by the agent the Details panel names. Vienna to Budapest booking and evening sights in Budapest go to CS-Travel Agent, a connected agent. Mild cold, should I travel goes to CS-Health Advisor, a connected agent. Official daily allowance in Austria and claim a refund for my train ticket go to CS-Travel Expense Refund, a connected agent, which answers the refund claim with its Expense Claim Adaptive Card. Free gym in Budapest goes to Work life balance Buddy, a child agent. Canteen menu today goes to no agent: the planner answers itself, and with Web Search on the answer comes from public web pages. The Tool use test method's Select tools picker lists the planner's 13 topics and no connected or child agents, so routes are read in the Details panel and not graded by Tool use.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
