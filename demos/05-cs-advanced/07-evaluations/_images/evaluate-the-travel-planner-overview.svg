<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">A routing test set on CS-Business Travel Planner finds two failing cases with two different owners</title>
  <desc id="d">The test set Travel planner routing is imported from travel-planner-test-set.csv: 7 cases on CS-Business Travel Planner. It is graded by two test methods, Answer quality and Meaning match with pass score 50, and run under your own profile, then run again with nothing changed between the runs. Reading every case, its route in Details, verdict and activity, shows two failing cases with two owners. Agent problem: What is on the canteen menu today? was answered with a full menu from public web pages, Answer quality Pass and Meaning match Fail 0, and run 2 flipped with no change. The fix: Web Search switched to Disabled; in runs 3 and 4 Meaning match gives Pass 100 and holds at 86%. Test-case problem: Claim a refund for my train ticket returns only Expense Claim and both methods fail, because the specialist answered with its Adaptive Card. The case stays in the set: its job is to prove the route, and a text grader cannot judge a form. The animation walks the trunk, then the agent-problem branch, then the test-case branch.</desc>
