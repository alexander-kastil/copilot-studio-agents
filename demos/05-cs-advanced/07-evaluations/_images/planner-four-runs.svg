<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Four runs of the Travel planner routing test set on CS-Business Travel Planner</title>
<desc id="d">The test set Travel planner routing (7 single-response cases) ran four times on CS-Business Travel Planner. With Web Search on, run 1 at 22:54 scored Answer quality 86% and Meaning match 71%, and run 2 at 23:02, with nothing changed, scored 71% and 86%. After one change, Web Search switched to Disabled, run 3 at 23:09 scored 71% and 86% and run 4 at 23:13 scored 57% and 86%. On the canteen case, run 1 answered with a full menu taken from public school web pages (Answer quality Pass, Meaning match Fail 0); run 2 said it couldn't find a reliable canteen menu because the search only surfaced unrelated public menus (Answer quality Fail, Not answered; Meaning match Pass 100); runs 3 and 4 said it couldn't find a published company canteen menu in the available organizational resources, with no web pages referenced (Answer quality Fail, Not answered; Meaning match Pass 100). The refund-claim case fails both methods in all four runs, because the response is only Expense Claim, the title of the specialist's Adaptive Card (Answer quality Fail, Meaning match Fail 25). Answer quality swings from run to run, while after the one change Meaning match holds at 86% and its last failure is the card case.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
