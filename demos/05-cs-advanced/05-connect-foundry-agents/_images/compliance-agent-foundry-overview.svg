<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Compliance Agent collects, confirms, and only then calls CS-Social Profiler in Microsoft Foundry</title>
  <desc id="d">CS-Compliance Agent runs on Claude Sonnet 4.6 and follows five instruction steps. 1, Initiate Interaction: it explains the purpose of the check and asks for the full name first. 2, Collect Data: one per turn, Jana Novak, jana.novak@example.com and Fabrikam Consulting, with the email format validated. 3, Confirm Details: it repeats all three in a table, and the user answers Yes, that's correct. 4, Prepare Data for Handoff: structured for the social research agent. 5, Run the Background Check: only after the user confirmed the details it calls CS-Social Profiler, the social-profiler agent in Microsoft Foundry on gpt-5.4-mini with Web search, which answers in five sections: Person, Company, Email domain check, Public sources, Notes for the compliance check. In a second run the email jana.novak(at)example fails at step 2: the agent says the format looks invalid, asks for a corrected address, and no CS-Social Profiler node appears. The animation steps through the confirmed run, then the run that stops.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      svg { font-size: 26px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .hl { font-size: 34px; font-weight: 700; }
      .t { font-size: 30px; font-weight: 600; }
      .tc { font-size: 30px; font-weight: 600; text-anchor: middle; }
      .s { font-size: 28px; fill: #57606a; }
      .sc { font-size: 28px; fill: #57606a; text-anchor: middle; }
      .b { font-size: 28px; }
      .bc { font-size: 28px; text-anchor: middle; }
      .bb { font-size: 28px; font-weight: 600; }
      .bbc { font-size: 28px; font-weight: 600; text-anchor: middle; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .codec { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .mono { font-family: Consolas, 'Courier New', monospace; font-size: 26px; }
      .monoc { font-family: Consolas, 'Courier New', monospace; font-size: 26px; text-anchor: middle; }
      .num { font-size: 28px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .tag { font-size: 26px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
