  <circle cx="150" cy="235" r="26" fill="#24292f"/>
  <text class="num" x="150" y="245">1</text>
  <text class="t" x="200" y="210">Initiate Interaction</text>
  <text class="s" x="200" y="252">explains the purpose of the check,</text>
  <text class="s" x="200" y="288">asks for the full name first</text>
  <rect x="100" y="332" width="980" height="150" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
