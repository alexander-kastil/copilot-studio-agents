  <text class="t" x="1190" y="112">Microsoft Foundry</text>
  <rect x="60" y="140" width="680" height="190" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="tc" x="400" y="200">Grey Logistics IT Help Desk</text>
  <text class="sc" x="400" y="244">Agents page:</text>
  <text class="bbc" x="400" y="284">Grey Logistics Device Specialist</text>
  <rect x="1180" y="140" width="680" height="190" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="codec" x="1520" y="196">grey-logistics-device-specialist</text>
  <text class="monoc" x="1520" y="244">activity, responses, a2a</text>
  <text class="monoc" x="1520" y="286">Entra, BotServiceRbac</text>
  <line x1="740" y1="235" x2="1180" y2="235" stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text class="bbc" x="960" y="218">Activity Protocol</text>
  <text class="sc" x="960" y="278">project endpoint, Agent Id</text>
  <rect x="1180" y="390" width="680" height="170" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="mono" x="1210" y="440">az rest --method patch</text>
  <text class="s" x="1210" y="484">activity.json adds the Activity Protocol,</text>
  <text class="s" x="1210" y="522">keeps responses and Entra</text>
