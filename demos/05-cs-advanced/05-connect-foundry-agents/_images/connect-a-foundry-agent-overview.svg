  <rect x="60" y="390" width="680" height="200" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="90" y="436">The battery on my work laptop is bulging.</text>
  <text class="s" x="90" y="476">Grey Logistics Device Specialist node:</text>
  <text class="b" x="90" y="514">stop using and unplug it, hand it in today,</text>
  <text class="b" x="90" y="552">the 3-year laptop warranty has run out</text>
  <rect x="60" y="620" width="680" height="160" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="90" y="666">How do I share my calendar with</text>
  <text class="bb" x="90" y="704">a colleague in Outlook?</text>
  <text class="s" x="90" y="746">no specialist node, the help desk answers</text>
  <rect x="60" y="810" width="680" height="190" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="90" y="856">Which phone can I get as a</text>
  <text class="bb" x="90" y="894">Grey Logistics employee?</text>
  <text class="s" x="90" y="936">before: no phone models on record</text>
  <text class="b" x="90" y="974">after: iPhone 16 and Samsung Galaxy S25</text>
  <rect x="1180" y="810" width="680" height="190" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
  <text class="b" x="1210" y="856">Phones: iPhone 16 or Samsung Galaxy S25,</text>
  <text class="b" x="1210" y="894">replaced every 3 years</text>
  <text class="s" x="1210" y="936">saved, then the new version</text>
  <text class="s" x="1210" y="974">pinned in the Publish dropdown</text>
  <line x1="1180" y1="905" x2="740" y2="905" stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text class="bbc" x="960" y="888">new version</text>
  <text class="sc" x="960" y="946">nothing changed</text>
  <text class="sc" x="960" y="984">in Copilot Studio</text>
