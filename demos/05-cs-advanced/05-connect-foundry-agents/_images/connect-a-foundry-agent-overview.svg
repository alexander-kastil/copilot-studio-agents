<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Grey Logistics IT Help Desk in Copilot Studio reaches the Foundry device specialist over the Activity Protocol</title>
  <desc id="d">Left, Copilot Studio: the Grey Logistics IT Help Desk lists Grey Logistics Device Specialist on its Agents page. Right, Microsoft Foundry: the agent grey-logistics-device-specialist, whose endpoint az rest --method patch opened with activity.json, adding the Activity Protocol while keeping responses and Entra, so it now lists activity, responses and a2a and the schemes Entra and BotServiceRbac. The connection carries the project endpoint and the Agent Id across the Activity Protocol. The question about a bulging work laptop battery reaches the Grey Logistics Device Specialist node: stop using and unplug it, hand it in today, the 3-year laptop warranty has run out. The question how do I share my calendar with a colleague in Outlook runs with no specialist node, and the help desk answers on its own. In Foundry the device team adds the rule Phones: iPhone 16 or Samsung Galaxy S25, replaced every 3 years, and pins the new version; the question which phone can I get as a Grey Logistics employee changes from no phone models on record to the iPhone 16 and the Samsung Galaxy S25, with nothing changed in Copilot Studio. Dots follow the device question across the bridge and the rule change back to the help desk.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
