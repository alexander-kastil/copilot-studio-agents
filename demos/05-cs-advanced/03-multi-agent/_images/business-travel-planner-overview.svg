<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Business Travel Planner routes each test message to the one specialist that owns it</title>
  <desc id="d">Five test messages enter CS-Business Travel Planner, a Standard agent on GPT-5 Chat that routes on descriptions. Booking (Vienna to Budapest, May 12) goes to the connected agent CS-Travel Agent, which handles booking and sightseeing and suggests the Castle District and a Danube cruise. Health (a mild cold, travel tomorrow?) goes to CS-Health Advisor, the health check before the trip, which advises that traveling is reasonable while the symptoms stay mild. Allowance (the daily allowance in Austria) goes to CS-Travel Expense Refund, for claims and allowances, which answers 30 euros per 24 hours and 2.50 euros per commenced hour. Gym (a free gym in Budapest) goes to Work life balance Buddy, the child agent inside the planner that reads the gym document, which names the No Pain - No Gain gym in Budapest with up to three free one-day passes. Canteen (the canteen menu today) reaches no agent: Web Search runs, and the planner says it has no access to today's canteen menu. The three connected agents are published in the same environment. A dot carries each message in turn to the agent that answers it.</desc>
