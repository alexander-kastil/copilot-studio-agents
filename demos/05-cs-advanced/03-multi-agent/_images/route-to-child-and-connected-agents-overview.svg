<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Grey Logistics IT Help Desk sends one request to two specialists and gives one reply</title>
  <desc id="d">The user sends: I'm locked out of my account, and once I'm back in I also need Project for my new role. The Grey Logistics IT Help Desk, the parent and the only voice the user hears, routes the account lockout to Account Access, a child agent inside it, which returns findings: the 30-minute unlock and the self-service portal. It then sends only the task, without conversation history, to Grey Logistics Software Licensing, a connected agent another team publishes, which returns findings: approval takes one business day. The help desk combines both into one reply to the user. Below, two more tests: the canteen menu question calls no agent node and gets one sentence and a ticket offer, and with Account Access switched off the reply loses the 30-minute and portal details. A dot follows the messages in order.</desc>
