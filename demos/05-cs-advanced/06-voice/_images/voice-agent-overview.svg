<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Keys 1, 2 and 0 drive the IT phone menu of the Grey Logistics IT Hotline, and a hang-up sends a post-call email</title>
  <desc id="d">Grey Logistics IT Hotline is a basic voice agent that adds the system topics Silence detection, Speech unrecognized and Unknown dial pad press. A caller says I need help, which starts the IT phone menu topic. It plays Welcome to the Grey Logistics IT hotline, then asks about account, device or a person, and reads the options as Press 1 or say Account, Press 2 or say Device, Press 0 or say Person. On a phone keypad the keys 1, 2 and 0 are marked; the test panel simulates them with /DTMFkey 1. Account answers: unlock or reset at aka.ms/sspr, at least 14 characters. Device answers: bulging battery, stop using it and bring it to the IT desk today. Person transfers the conversation to +15555550123. Below, the Post-call actions topic: when a caller hangs up on a real Telephony call, the End of conversation activity fires, the condition Conversation.EndReason is CUSTOMER_HANGUP holds, and Send an email (V2) mails the help desk mailbox. The animation presses 1, 2 and 0 in turn, then runs the hang-up chain.</desc>
