<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Deep reasoning on the ranking step puts the overdue ticket first in the Grey Logistics IT Help Desk backlog</title>
  <desc id="d">Left, the backlog at "It is Tuesday 10:00": nine tickets, T-101 printer on floor 3 jams, T-102 new hire needs a laptop, T-103 board member cannot open Outlook, T-104 sales rep cannot sign in to the CRM, T-105 suspicious email that one person clicked, T-106 Visio license request, T-107 shared drive slow for 12 people, T-108 developer laptop won't boot, T-109 a monitor flickers. Middle, the Grey Logistics IT Help Desk with step 4 using reason (Exercise 2): Deep reasoning (preview) weighs priority, the board rule, the deadline and the clock. Above it, Exercise 4: "How do I connect my phone to the guest Wi-Fi?" runs with no deep reasoning node. Below it, Exercise 1: the default model often lists T-105 first, misses that T-109 is overdue, or leaves T-103 at P3. Right, Exercise 3, the order by the instructions: 1, T-109, P3, overdue by one hour; 2, T-105, P1, security incident suspected; 3, T-104, P2, no workaround; 4, T-108, P2, laptop won't boot; 5, T-103, P3 to P2 under the board rule; 6, T-107, P3, the marketing team can still use it; 7, T-101, P3, the floor 2 printer works; then the two P4 requests T-102 and T-106. A dot carries the backlog through step 4 to the ordered list, where the three traps T-109, T-103 and T-107 light up in turn.</desc>
