<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Returns Agent answers each return request in the shared mailbox by email, with nobody in the chat</title>
  <desc id="d">The picture is a clockwise loop. Exercise 5: your second mailbox sends "Return request for order 10482" from Maria Huber about wireless headphones bought 20 days ago. The email lands in the shared mailbox for returns, in its Inbox, which your account has full access to. Exercise 4: the trigger CS-When a new email arrives in a shared mailbox, a flow that checks once a minute, sends it to the agent with Use content from Body. Exercise 1: CS-Returns Agent handles returns only and replies as an email with &lt;p&gt; and &lt;br&gt; tags; Exercise 2: it searches returns-policy.docx from SharePoint, its only knowledge source. Exercise 3: it sends the answer with CS-Work IQ Mail, the Mail (Preview) Mail MCP server, on maker-provided credentials. The reply "Re: Return request for order 10482" explains that the 14-day return window has passed and arrives back in your second mailbox. Exercise 6: an "Invoice address change" email gets the answer that the agent only handles returns, and no reply email went out. A dot travels the whole loop from the request to the reply.</desc>
