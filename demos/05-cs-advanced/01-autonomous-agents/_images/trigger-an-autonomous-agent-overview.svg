  <text class="tag" x="143" y="865">Ex 4</text>
  <text class="m" x="104" y="916">Request for a second</text>
  <text class="m" x="104" y="954">monitor</text>
  <text class="xs" x="584" y="890">I would like a second monitor for</text>
