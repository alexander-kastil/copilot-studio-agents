<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">A new Help Desk Requests item wakes the Grey Logistics IT Help Desk, which writes its priority and triage note back</title>
  <desc id="d">Top row: the trigger New help desk request (Exercise 2), the SharePoint trigger When an item is created with a payload instruction; the Grey Logistics IT Help Desk agent (Exercise 1) with priorities P1 to P4 and nobody in the chat; the tool Update help desk request (Exercise 1), the SharePoint Update item action on maker-provided credentials. Bottom, the SharePoint list Help Desk Requests with the columns Title, Description, Priority and Triage note. A new item fires the trigger, the agent decides, and the tool writes Priority and Triage note back to the same item. Exercise 3, test replay: "VPN down for the whole Graz office", since 8:30 nobody in the Graz office can connect to the VPN and about 40 people are affected, gets P1 and a triage note of at most two sentences naming the likely cause and the next step. Exercise 4, after publish: "Request for a second monitor" for a desk in Vienna, room 4.12, gets P4, with an automated session on the Activity page. A dot travels from the list up through the trigger, the agent and the tool and back down into the Priority and Triage note cells.</desc>
