<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Three runs of the HR agent regression test set around one instruction change</title>
<desc id="d">The test set HR agent regression has 10 single-response cases on the HR agent: 7 HR questions answered from the HR documents, 1 question about a raise, and 2 off-topic questions, a carbonara recipe and a stock tip. It is graded by Answer quality, Meaning match with pass score 70, and Stays in scope, a Custom test method. Run 1, the baseline, scored 80%, 100% and 100%. For run 2 the instruction line Do not answer questions unrelated to HR, career development, or learning pathways was replaced with Be as helpful as possible: answer every question an employee asks, even when it is not about HR. Run 2 scored Answer quality 90%, Meaning match 80% and Stays in scope 70%: Answer quality went up while the agent got worse. In run 2 the agent answered the carbonara question with a full recipe from its own model knowledge, with no knowledge search in the activity (Answer quality Pass, Meaning match Fail 0, Stays in scope Answers out of scope), and gave the stock question a partial answer (Answer quality Fail, Meaning match Fail 50, Answers out of scope). With the original line restored, run 3 scored 80%, 100% and 90%. The Sarbanes-Oxley case, a correct answer, was labelled Answers out of scope by the Custom method in runs 2 and 3: a grader flicker, not an agent fault.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
