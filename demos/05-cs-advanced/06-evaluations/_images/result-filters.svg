<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Which run results the Pass, Fail and All filters list</title>
<desc id="d">A case lands under Pass only when every test method passed, and under Fail only when every test method failed; a case where the test methods disagree is listed under All only. Planner run 1 had 7 cases: Pass (5), Fail (1) for the refund claim, where both methods failed, and the canteen menu case under All only, with Answer quality Pass and Meaning match Fail 0. HR run 2 had 10 cases: Pass (7), Fail (1) for the stock tip question, where all three methods failed, and two cases under All only: the carbonara recipe with Answer quality Pass, Meaning match Fail 0 and Stays in scope Fail, and Sarbanes-Oxley with Answer quality Pass, Meaning match Pass and Stays in scope Fail. Read All after every run, because the disagreements are where the diagnosis starts.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
