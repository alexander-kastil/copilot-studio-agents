<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">What goes into a test set as a CSV file and what comes out of it</title>
<desc id="d">Into a test set: the template link on the Data source panel downloads EvaluationTemplate.csv, whose comment lines state the limits, a maximum of 100 questions and a maximum of 500 characters per question including spaces, followed by the two columns question and expectedResponse. The conversation data type has its own EvalConversationTemplate.csv with the columns conversationNumber, question and response, where response is optional and not compared, and a limit of 8 question-and-answer pairs per conversation and 50 conversations. Test methods are not in the file: after import the test set has Answer quality by default, and you add the other test methods yourself. Out of a test set: Export test set in the test set menu downloads a file named after the set, for example HR agent regression.csv, which starts with the comment lines # Test set name: HR agent regression and # Test methods: GeneralQuality, CompareMeaning, Stays in scope, followed by the same two columns. GeneralQuality and CompareMeaning are Learn's old names for Answer quality and Meaning match, and the Custom method Stays in scope travels as its name only. The test methods travel only as a comment line, so add them again after you import the file elsewhere.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
