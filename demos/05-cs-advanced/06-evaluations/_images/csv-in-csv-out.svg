<rect x="680" y="774" width="290" height="40" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="m" x="825" y="802" font-size="26" text-anchor="middle">expectedResponse</text>
<text class="s" x="992" y="803" font-size="26">the same two columns</text>
