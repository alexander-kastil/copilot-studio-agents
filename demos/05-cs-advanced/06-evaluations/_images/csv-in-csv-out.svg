<text class="r" x="1472" y="826" font-size="26">a Custom method, name only</text>
<rect x="60" y="904" width="1798" height="140" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="90" y="948" font-size="30">The test methods travel only as a comment line: add them again after you import the file elsewhere</text>
