<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The meeting prep skill demo: one brief, eight sections, each from a source or your judgement</title>
  <desc id="d">In the middle, the one-page brief Meeting Brief - Markus Lind - 30 October 2026.docx in house format, with its eight sections in order: Meeting purpose, mixed; Attendees and context, data; Where we left off, data; Open items to resolve, data; My objectives, judgement; Risks and sensitivities, judgement; Talking points, mixed; Next steps, judgement. Step 1 maps the template to its sources on the left: the invite and directory feed Attendees and context, the call notes and the v1.0 proposal feed Where we left off and Open items, your judgement feeds My objectives, Risks and sensitivities and Next steps as a first draft you adjust, and emails with Markus Lind come back as none found. On the right, Step 2 authors the meeting-prep skill, SKILL.md with meeting-brief-template.docx beside it in your OneDrive skills folder, and the template sets the sections. Step 3 runs it by name for the Fjallbryggan follow-up with Markus Lind. Step 4 tunes it for discovery, and Prep me for my next Fjallbryggan call shows meeting-prep under Plugins without naming it. Dots carry each source into its sections, then a highlight fills the brief section by section.</desc>
