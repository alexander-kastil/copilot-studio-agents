<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The product pitch skill demo: from a market brief to a checked partner deck</title>
  <desc id="d">Steps 1 and 2 find the pitch in aw26-market-brief.docx and map each of the seven cards to its evidence. Step 3 authors the product-pitch skill: SKILL.md with pitch-deck-structure.pptx beside it, listed as /product-pitch. Step 4 runs it by name with the brief attached, Run my Product Pitch skill for the AW26 trail-running capsule, and checks every claim in a claim table that marks it supported, overstated or unsupported; you approve before anything is saved. Step 5 tunes the skill with a sharper description and tighter evidence rules through an Edit file? card at Medium risk. A new prompt that never names the skill, I need a partner deck for the AW26 trail-running capsule, shows Reviewed custom skill Product pitch, passes the claim table, and saves Aurora Trail Capsule AW26.pptx: seven cards where market claims name their source and commercial cards stay placeholders. A dot runs the first named run, the tuning loop back into the skill, then the unnamed run through the claim table to the saved deck.</desc>
