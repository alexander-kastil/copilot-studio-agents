    <text x="1210" y="736" font-size="28" fill="#57606a">house brief template</text>

    <rect x="100" y="900" width="1720" height="80" rx="40" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="950" font-size="30" fill="#24292f" text-anchor="middle">Up to <tspan font-weight="700">20 companion files</tspan> and <tspan font-weight="700">10 MB</tspan> per skill, each named in the instructions</text>
  </g>
</svg>
