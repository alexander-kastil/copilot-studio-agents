<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Skill chips light up in the Workspace panel as Cowork runs its plan</title>
  <desc id="d">Cowork decomposes a request into a plan. Step 1, the Excel skill, builds the spreadsheet and its Excel chip lights up under Plugins in the Workspace panel; step 2, the Email skill, sends it and the Email chip lights up. Each step is ticked under Steps when it is done. The panel also lists Output, References, Schedule and Permissions.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="140" y="250" width="820" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="180" y="314" font-size="32" font-weight="700" fill="#24292f">Your request</text>
    <text x="180" y="362" font-size="28" fill="#57606a">Cowork decomposes it into a plan</text>
    <line x1="550" y1="400" x2="550" y2="563" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <rect x="140" y="565" width="820" height="110" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="140" y="565" width="820" height="110" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.15;0.42;0.45;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="620" r="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200" y="631" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">1</text>
    <text x="256" y="610" font-size="32" font-weight="700" fill="#24292f">Excel skill</text>
    <text x="256" y="652" font-size="28" fill="#57606a">builds the spreadsheet</text>

    <rect x="140" y="695" width="820" height="110" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="140" y="695" width="820" height="110" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.525;0.795;0.825;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="750" r="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200" y="761" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">2</text>
    <text x="256" y="740" font-size="32" font-weight="700" fill="#24292f">Email skill</text>
    <text x="256" y="782" font-size="28" fill="#57606a">sends it</text>

    <rect x="1160" y="90" width="640" height="920" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190" y="140" font-size="30" font-weight="700" fill="#57606a">Workspace</text>

    <rect x="1190" y="165" width="580" height="160" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="209" font-size="28" font-weight="700" fill="#24292f">Steps</text>
    <circle cx="1238" cy="248" r="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M1230,248 L1236,255 L1247,241" fill="none" stroke="#2da44e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.45;0.46;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <text x="1268" y="257" font-size="26" fill="#24292f">Build the spreadsheet</text>
    <circle cx="1238" cy="294" r="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M1230,294 L1236,301 L1247,287" fill="none" stroke="#2da44e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.825;0.835;1" dur="8s" repeatCount="indefinite"/>
    </path>
    <text x="1268" y="303" font-size="26" fill="#24292f">Send it</text>

    <rect x="1190" y="340" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="386" font-size="28" fill="#24292f">Output</text>
    <rect x="1190" y="425" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="471" font-size="28" fill="#24292f">References</text>

    <rect x="1190" y="510" width="580" height="320" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="555" font-size="28" font-weight="700" fill="#24292f">Plugins</text>
    <rect x="1220" y="585" width="260" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1220" y="585" width="260" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2375;0.25;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="1350" y="631" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Excel</text>
    <rect x="1220" y="715" width="260" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1220" y="715" width="260" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6125;0.625;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="1350" y="761" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Email</text>

    <rect x="1190" y="845" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="891" font-size="28" fill="#24292f">Schedule</text>
    <rect x="1190" y="925" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="971" font-size="28" fill="#24292f">Permissions</text>

    <line x1="960" y1="620" x2="1217" y2="620" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>
    <line x1="960" y1="750" x2="1217" y2="750" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>

    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M960,620 L1210,620" keyPoints="0;0;1;1" keyTimes="0;0.15;0.2375;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.149;0.15;0.2375;0.24;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M960,750 L1210,750" keyPoints="0;0;1;1" keyTimes="0;0.525;0.6125;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.524;0.525;0.6125;0.615;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
