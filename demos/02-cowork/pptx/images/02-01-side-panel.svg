<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Skills chips light up as Cowork runs its plan</title>
  <desc id="d">Cowork decomposes a request into a plan. Step 1, the Excel skill, builds the spreadsheet and its Excel chip lights up in the Skills section of the side panel; step 2, the Email skill, sends it and the Email chip lights up. The side panel also lists Progress, Input folder, Output folder, Schedule and Permissions.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="140" y="220" width="820" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="180" y="284" font-size="32" font-weight="700" fill="#24292f">Your request</text>
    <text x="180" y="332" font-size="28" fill="#57606a">Cowork decomposes it into a plan</text>
    <line x1="550" y1="370" x2="550" y2="533" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <rect x="140" y="535" width="820" height="110" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="140" y="535" width="820" height="110" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.125;0.15;0.42;0.45;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="590" r="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200" y="601" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">1</text>
    <text x="256" y="580" font-size="32" font-weight="700" fill="#24292f">Excel skill</text>
    <text x="256" y="622" font-size="28" fill="#57606a">builds the spreadsheet</text>

    <rect x="140" y="665" width="820" height="110" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="140" y="665" width="820" height="110" rx="18" fill="none" stroke="#e0a534" stroke-width="5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.525;0.795;0.825;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="200" cy="720" r="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="200" y="731" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">2</text>
    <text x="256" y="710" font-size="32" font-weight="700" fill="#24292f">Email skill</text>
    <text x="256" y="752" font-size="28" fill="#57606a">sends it</text>

    <rect x="1160" y="110" width="640" height="870" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1190" y="158" font-size="30" font-weight="700" fill="#57606a">Side panel</text>

    <rect x="1190" y="180" width="580" height="120" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="224" font-size="28" font-weight="700" fill="#24292f">Progress</text>
    <rect x="1220" y="248" width="520" height="26" rx="13" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1220" y="248" width="0" height="26" rx="13" fill="#e0a534">
      <animate attributeName="width" values="0;0;260;260;520;520" keyTimes="0;0.125;0.45;0.5;0.825;1" dur="8s" repeatCount="indefinite"/>
    </rect>

    <rect x="1190" y="315" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="361" font-size="28" fill="#24292f">Input folder</text>
    <rect x="1190" y="400" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="446" font-size="28" fill="#24292f">Output folder</text>

    <rect x="1190" y="485" width="580" height="300" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="530" font-size="28" font-weight="700" fill="#24292f">Skills</text>
    <rect x="1220" y="555" width="260" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1220" y="555" width="260" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2375;0.25;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="1350" y="601" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Excel</text>
    <rect x="1220" y="685" width="260" height="70" rx="35" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1220" y="685" width="260" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6125;0.625;1" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="1350" y="731" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Email</text>

    <rect x="1190" y="800" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="846" font-size="28" fill="#24292f">Schedule</text>
    <rect x="1190" y="885" width="580" height="70" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1220" y="931" font-size="28" fill="#24292f">Permissions</text>

    <line x1="960" y1="590" x2="1217" y2="590" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>
    <line x1="960" y1="720" x2="1217" y2="720" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>

    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M960,590 L1210,590" keyPoints="0;0;1;1" keyTimes="0;0.15;0.2375;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.149;0.15;0.2375;0.24;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M960,720 L1210,720" keyPoints="0;0;1;1" keyTimes="0;0.525;0.6125;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.524;0.525;0.6125;0.615;1" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
