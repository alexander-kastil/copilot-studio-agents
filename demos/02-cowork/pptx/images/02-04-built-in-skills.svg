<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The built-in skills of Cowork in five groups</title>
  <desc id="d">Fifteen built-in skills in five groups. Documents: Word, Excel, PowerPoint in your brand template, and PDF. Communication: Email and Communications for stakeholder updates. Calendar and meetings: Scheduling, Calendar Management, Meetings and Daily Briefing. Research: Enterprise Search across your organization and Deep Research. Cards, apps and images: Adaptive Cards, App in Frontier, and image generation with ChatGPT Images 2.0. Cowork picks them from your task, and each one it uses shows under Plugins in the Workspace panel.</desc>
