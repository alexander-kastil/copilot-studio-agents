<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The approval card and how far each choice reaches</title>
  <desc id="d">Cowork pauses before anything that leaves a mark and shows an approval card with a risk level indicator and Show parameters. Four choices follow. Approve once (Send, Post, or Create) approves that one action. More options (Only to, Always allow, or Approve &amp; don't ask again) approves it, then skips similar prompts for the rest of the session; review or revoke them under Permissions. Approve All (n), when several approvals are pending, releases every pending approval. Cancel skips the action and Cowork carries on.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="70" y="290" width="460" height="440" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="110" y="360" font-size="38" font-weight="700" fill="#24292f">Approval card</text>
    <text x="110" y="420" font-size="30" fill="#24292f">Cowork pauses before</text>
    <text x="110" y="460" font-size="30" fill="#24292f">anything that</text>
    <text x="110" y="500" font-size="30" fill="#24292f">leaves a mark</text>
    <rect x="105" y="545" width="390" height="65" rx="32" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
    <text x="300" y="588" font-size="28" fill="#24292f" text-anchor="middle">Risk level indicator</text>
    <rect x="105" y="635" width="390" height="65" rx="32" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="300" y="678" font-size="28" fill="#24292f" text-anchor="middle">Show parameters</text>

    <g stroke="#57606a" stroke-width="3" fill="none">
      <line x1="532" y1="510" x2="580" y2="510"/>
      <line x1="580" y1="190" x2="580" y2="830"/>
    </g>
    <g stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
      <line x1="579" y1="190" x2="634" y2="190"/>
      <line x1="579" y1="415" x2="634" y2="415"/>
      <line x1="579" y1="640" x2="634" y2="640"/>
      <line x1="579" y1="830" x2="634" y2="830"/>
      <line x1="1122" y1="190" x2="1184" y2="190"/>
      <line x1="1122" y1="415" x2="1184" y2="415"/>
      <line x1="1122" y1="640" x2="1184" y2="640"/>
      <line x1="1122" y1="830" x2="1184" y2="830"/>
    </g>

    <rect x="640" y="110" width="480" height="160" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="675" y="180" font-size="36" font-weight="700" fill="#24292f">Approve once</text>
    <text x="675" y="228" font-size="28" fill="#57606a">Send, Post, or Create</text>

    <rect x="640" y="300" width="480" height="230" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="675" y="372" font-size="36" font-weight="700" fill="#24292f">More options</text>
    <text x="675" y="425" font-size="28" fill="#57606a">Only to, Always allow,</text>
    <text x="675" y="465" font-size="28" fill="#57606a">Approve &amp; don't ask again</text>

    <rect x="640" y="560" width="480" height="160" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="675" y="630" font-size="36" font-weight="700" fill="#24292f">Approve All (n)</text>
    <text x="675" y="678" font-size="28" fill="#57606a">Several approvals pending</text>

    <rect x="640" y="750" width="480" height="160" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="675" y="842" font-size="36" font-weight="700" fill="#24292f">Cancel</text>

    <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <rect x="1190" y="110" width="670" height="160" rx="20"/>
      <rect x="1190" y="300" width="670" height="230" rx="20"/>
      <rect x="1190" y="560" width="670" height="160" rx="20"/>
      <rect x="1190" y="750" width="670" height="160" rx="20"/>
    </g>
    <g font-size="30" fill="#24292f">
      <text x="1225" y="200">Approves that one action</text>
      <text x="1225" y="365">Approves it, then skips</text>
      <text x="1225" y="405">similar prompts for</text>
      <text x="1225" y="445">the rest of the session</text>
      <text x="1225" y="650">Releases every pending approval</text>
      <text x="1225" y="820">Skips the action;</text>
      <text x="1225" y="860">Cowork carries on</text>
    </g>
    <text x="1225" y="500" font-size="28" fill="#57606a">Review or revoke under Permissions</text>
  </g>
</svg>
