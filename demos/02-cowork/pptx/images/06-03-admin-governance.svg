<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Access comes from a spending policy, visibility from the discovery setting</title>
  <desc id="d">Access, who can use Cowork: a spending policy under Copilot, Cost Management, Configuration grants access when its scope includes the user and it selects Cowork under Select agents and services; a limit of one credit is enough, and removing a user from the scope blocks them. Visibility, who sees Cowork: the discovery setting AI experiences enabled by usage-based billing controls visibility only, not access; when billing is not enabled, users request access and admins approve.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="300" font-size="40" font-weight="700" fill="#24292f">Access</text>
    <text x="70" y="345" font-size="28" fill="#57606a">Who can use</text>
    <text x="70" y="380" font-size="28" fill="#57606a">Cowork</text>

    <rect x="430" y="110" width="910" height="410" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="470" y="175" font-size="36" font-weight="700" fill="#24292f">Spending policy</text>
    <text x="470" y="222" font-size="28" fill="#57606a">Copilot &gt; Cost Management &gt; Configuration</text>
    <g fill="none" stroke="#57606a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M472,280 l9,10 l17,-20"/>
      <path d="M472,335 l9,10 l17,-20"/>
      <path d="M472,430 l9,10 l17,-20"/>
    </g>
    <g font-size="30" fill="#24292f">
      <text x="515" y="292">Its scope includes the user</text>
      <text x="515" y="347">It selects Cowork under</text>
      <text x="515" y="387">Select agents and services</text>
      <text x="515" y="442">A limit of one credit is enough</text>
    </g>
    <text x="470" y="495" font-size="28" fill="#57606a">To block a user, remove them from the scope</text>

    <line x1="1342" y1="315" x2="1434" y2="315" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <rect x="1440" y="215" width="410" height="200" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1645" y="305" font-size="40" font-weight="700" fill="#24292f" text-anchor="middle">Can use</text>
    <text x="1645" y="355" font-size="40" font-weight="700" fill="#24292f" text-anchor="middle">Cowork</text>

    <text x="70" y="737" font-size="40" font-weight="700" fill="#24292f">Visibility</text>
    <text x="70" y="782" font-size="28" fill="#57606a">Who sees</text>
    <text x="70" y="817" font-size="28" fill="#57606a">Cowork</text>

    <rect x="430" y="600" width="910" height="300" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="470" y="672" font-size="36" font-weight="700" fill="#24292f">Discovery setting</text>
    <text x="470" y="752" font-size="28" fill="#24292f">AI experiences enabled by usage-based billing</text>
    <text x="470" y="832" font-size="30" fill="#24292f">Controls visibility only, not access</text>

    <line x1="1342" y1="750" x2="1414" y2="750" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <rect x="1420" y="600" width="430" height="300" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="1635" y="672" font-size="36" font-weight="700" fill="#24292f">Sees Cowork</text>
      <text x="1635" y="752" font-size="28" fill="#57606a">Billing not enabled:</text>
      <text x="1635" y="792" font-size="28" fill="#57606a">users request access,</text>
      <text x="1635" y="832" font-size="28" fill="#57606a">admins approve</text>
    </g>
  </g>
</svg>
