<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Every skill source ends in the same Skills section</title>
  <desc id="d">Six sources of skills: built-in skills, custom skills from Customize or a SKILL.md file, an uploaded or shared skill file, plugin skills from Discover, admin-deployed plugins, and your own plugin package. All of them feed one step: Cowork reads each description and loads the skill when the work calls for it, so you do not name it. The loaded skills appear as chips in one Skills section.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="100" y="120" width="700" height="118" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="170" font-size="30" font-weight="700" fill="#24292f">Built-in skills</text>
    <text x="132" y="212" font-size="28" fill="#57606a">ship with Cowork</text>

    <rect x="100" y="260" width="700" height="118" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="310" font-size="30" font-weight="700" fill="#24292f">Custom skills</text>
    <text x="132" y="352" font-size="28" fill="#57606a">Customize &gt; Skills, or a SKILL.md file</text>

    <rect x="100" y="400" width="700" height="118" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="450" font-size="30" font-weight="700" fill="#24292f">Uploaded skill file</text>
    <text x="132" y="492" font-size="28" fill="#57606a">or one a colleague shares with you</text>

    <rect x="100" y="540" width="700" height="118" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="590" font-size="30" font-weight="700" fill="#24292f">Plugin skills</text>
    <text x="132" y="632" font-size="28" fill="#57606a">from Discover</text>

    <rect x="100" y="680" width="700" height="118" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="730" font-size="30" font-weight="700" fill="#24292f">Admin-deployed plugins</text>
    <text x="132" y="772" font-size="28" fill="#57606a">rolled out by your IT organization</text>

    <rect x="100" y="820" width="700" height="118" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="870" font-size="30" font-weight="700" fill="#24292f">Your own plugin package</text>
    <text x="132" y="912" font-size="28" fill="#57606a">Customize &gt; Plugins</text>

    <line x1="800" y1="179" x2="977" y2="380" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="800" y1="319" x2="977" y2="440" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="800" y1="459" x2="977" y2="500" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="800" y1="599" x2="977" y2="560" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="800" y1="739" x2="977" y2="620" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="800" y1="879" x2="977" y2="680" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <rect x="980" y="340" width="420" height="380" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="1190" y="414" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Cowork reads</text>
    <text x="1190" y="456" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">each description</text>
    <text x="1190" y="528" font-size="28" fill="#57606a" text-anchor="middle">and loads the skill</text>
    <text x="1190" y="568" font-size="28" fill="#57606a" text-anchor="middle">when the work</text>
    <text x="1190" y="608" font-size="28" fill="#57606a" text-anchor="middle">calls for it</text>
    <text x="1190" y="670" font-size="28" font-style="italic" fill="#57606a" text-anchor="middle">you do not name it</text>

    <line x1="1400" y1="530" x2="1517" y2="530" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <rect x="1520" y="330" width="300" height="400" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1550" y="382" font-size="30" font-weight="700" fill="#24292f">Skills</text>
    <rect x="1550" y="410" width="240" height="56" rx="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1670" y="448" font-size="28" fill="#24292f" text-anchor="middle">built-in</text>
    <rect x="1550" y="482" width="240" height="56" rx="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1670" y="520" font-size="28" fill="#24292f" text-anchor="middle">custom</text>
    <rect x="1550" y="554" width="240" height="56" rx="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1670" y="592" font-size="28" fill="#24292f" text-anchor="middle">uploaded</text>
    <rect x="1550" y="626" width="240" height="56" rx="28" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1670" y="664" font-size="28" fill="#24292f" text-anchor="middle">plugin</text>
  </g>
</svg>
