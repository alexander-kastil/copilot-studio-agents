<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Core capabilities of Cowork</title>
  <desc id="d">Five areas. Communication: emails, replies, forwards; Teams channel and chat posts; stakeholder updates. Documents and files: Word, Excel, PowerPoint, PDF; edit files in place; output in OneDrive. Calendar and meetings: schedule in plain language; resolve conflicts; Daily Briefing. Research: search people and files; Deep Research with sources; browser tasks in Edge. Automation: prompts on a schedule; start on an email or Teams message; Automations page. Under all five: skills, Cowork loads the right ones and lists them under Plugins in the Workspace panel.</desc>
