<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Three ways in, one skills folder, discovered by the next new task</title>
  <desc id="d">The guided flow under Customize, Skills, Add, Create new, asking in chat, and writing a SKILL.md yourself all end in one folder, Documents/Cowork/skills, with one subfolder per skill such as weekly-report and meeting-prep, up to 50 custom skills. A task that is already open started before the save and does not list the new skill. The next new task discovers the skills at its start and lists weekly-report and meeting-prep.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="100" y="150" width="560" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="204" font-size="30" font-weight="700" fill="#24292f">Guided flow</text>
    <text x="132" y="248" font-size="28" fill="#57606a">Customize &gt; Skills &gt;</text>
    <text x="132" y="288" font-size="28" fill="#57606a">Add &gt; Create new</text>

    <rect x="100" y="395" width="560" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="449" font-size="30" font-weight="700" fill="#24292f">Ask in chat</text>
    <text x="132" y="493" font-size="28" fill="#57606a">describe the task</text>
    <text x="132" y="533" font-size="28" fill="#57606a">you repeat</text>

    <rect x="100" y="640" width="560" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="132" y="694" font-size="30" font-weight="700" fill="#24292f">Write it yourself</text>
    <text x="132" y="738" font-size="28" fill="#57606a">a SKILL.md in its own</text>
    <text x="132" y="778" font-size="28" fill="#57606a">OneDrive subfolder</text>

    <line x1="660" y1="235" x2="777" y2="400" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="660" y1="480" x2="777" y2="490" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="660" y1="725" x2="777" y2="580" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <rect x="780" y="250" width="480" height="480" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <rect x="780" y="250" width="480" height="480" rx="18" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.19;0.21;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <g font-family="Consolas, Menlo, monospace" font-size="28">
      <text x="815" y="312" font-weight="700" fill="#24292f">Documents/Cowork/skills/</text>
      <text x="845" y="380" fill="#24292f">weekly-report/</text>
      <text x="885" y="424" fill="#57606a">SKILL.md</text>
      <text x="845" y="484" fill="#24292f">meeting-prep/</text>
      <text x="885" y="528" fill="#57606a">SKILL.md</text>
    </g>
    <text x="815" y="620" font-size="28" fill="#57606a">one folder per skill</text>
    <text x="815" y="664" font-size="28" fill="#57606a">up to 50 custom skills</text>

    <rect x="1380" y="120" width="440" height="210" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1410" y="180" font-size="30" font-weight="700" fill="#24292f">Task already open</text>
    <text x="1410" y="226" font-size="28" fill="#57606a">started before the save</text>
    <text x="1410" y="290" font-size="28" font-style="italic" fill="#57606a">new skill not listed</text>

    <line x1="1600" y1="330" x2="1600" y2="467" stroke="#8c959f" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>
    <text x="1624" y="410" font-size="28" font-style="italic" fill="#57606a">later</text>

    <rect x="1380" y="470" width="440" height="410" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <rect x="1380" y="470" width="440" height="410" rx="16" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.44;0.46;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1410" y="530" font-size="30" font-weight="700" fill="#24292f">Next new task</text>
    <text x="1410" y="576" font-size="28" fill="#57606a">discovery at its start</text>
    <text x="1410" y="660" font-size="28" font-weight="700" fill="#24292f">Skills</text>
    <rect x="1410" y="690" width="290" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1410" y="690" width="290" height="62" rx="31" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1555" y="731" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">weekly-report</text>
    <rect x="1410" y="772" width="290" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1410" y="772" width="290" height="62" rx="31" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.56;0.58;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1555" y="813" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">meeting-prep</text>

    <line x1="1260" y1="660" x2="1377" y2="660" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M660,235 L770,390" keyPoints="0;0;1;1" keyTimes="0;0.05;0.19;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.049;0.05;0.19;0.191;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M660,480 L770,489" keyPoints="0;0;1;1" keyTimes="0;0.05;0.19;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.049;0.05;0.19;0.191;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M660,725 L770,589" keyPoints="0;0;1;1" keyTimes="0;0.05;0.19;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.049;0.05;0.19;0.191;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M1260,660 L1370,660" keyPoints="0;0;1;1" keyTimes="0;0.34;0.44;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.339;0.34;0.44;0.441;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
