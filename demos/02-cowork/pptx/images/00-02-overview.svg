  <g stroke="#8c959f" stroke-width="2">
    <rect x="80" y="475" width="380" height="310" rx="20" fill="#eaf2ff"/>
    <rect x="540" y="280" width="380" height="310" rx="20" fill="#e9f7ef"/>
    <rect x="540" y="670" width="380" height="310" rx="20" fill="#e9f7ef"/>
    <rect x="1000" y="280" width="380" height="310" rx="20" fill="#f3edff"/>
    <rect x="1000" y="670" width="380" height="310" rx="20" fill="#f3edff"/>
    <rect x="1460" y="475" width="380" height="310" rx="20" fill="#fff6e5"/>
  </g>
  <g fill="#24292f">
    <circle cx="136" cy="533" r="30"/>
