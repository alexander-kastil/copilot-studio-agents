<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Module 2 topic path: six Cowork topics in four phases</title>
  <desc id="d">Six numbered topic cards in four phases from left to right. Get started, core capabilities: topic 1, Getting Started with Cowork. Use and author skills: topic 2, Understanding Skills, then topic 3, Creating Custom Skills. Make it recurring and extensible: topic 4, Scheduled Prompts and Event-Driven Tasks, then topic 5, Extending Cowork with Plugins. Keep it under human control: topic 6, Human-in-the-Loop: Staying in Control. Arrows lead from each topic to the next.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .ph { font-size: 30px; font-weight: 600; text-anchor: middle; }
      .t { font-size: 30px; font-weight: 600; }
      .s { font-size: 28px; fill: #57606a; }
      .num { font-size: 30px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .code { font-family: Consolas, 'Courier New', monospace; fill: #57606a; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#8c959f" stroke-width="2">
    <rect x="80" y="130" width="380" height="110" rx="20" fill="#eaf2ff"/>
    <rect x="540" y="130" width="380" height="110" rx="20" fill="#e9f7ef"/>
    <rect x="1000" y="130" width="380" height="110" rx="20" fill="#f3edff"/>
    <rect x="1460" y="130" width="380" height="110" rx="20" fill="#fff6e5"/>
  </g>
