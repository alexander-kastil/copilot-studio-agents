  <text class="ph" x="270" y="215">core capabilities</text>
  <text class="ph" x="730" y="177">Use and author</text>
  <text class="ph" x="730" y="215">skills</text>
  <text class="ph" x="1190" y="177">Make it recurring</text>
  <text class="ph" x="1190" y="215">and extensible</text>
  <text class="ph" x="1650" y="177">Keep it under</text>
  <text class="ph" x="1650" y="215">human control</text>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="460" y1="520" x2="540" y2="520"/>
    <line x1="730" y1="590" x2="730" y2="670"/>
    <path d="M920,825 H960 V435 H1000"/>
    <line x1="1190" y1="590" x2="1190" y2="670"/>
    <line x1="1380" y1="740" x2="1460" y2="740"/>
