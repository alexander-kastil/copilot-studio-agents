<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Anatomy of the weekly-report SKILL.md</title>
  <desc id="d">The file weekly-report/SKILL.md has a YAML header and plain-language instructions. The name, weekly-report, matches the folder name exactly and uses lowercase letters, numbers and hyphens, up to 64 characters. The description is what Cowork reads to decide when the skill applies, so it is specific and trigger-oriented. The instructions are the step-by-step recipe Cowork follows, and a SKILL.md can be up to 1 MB.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="100" y="110" width="980" height="800" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M100,180 L100,128 Q100,110 118,110 L1062,110 Q1080,110 1080,128 L1080,180 Z" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <rect x="126" y="124" width="214" height="44" rx="8" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <rect x="120" y="195" width="940" height="270" rx="12" fill="#eaf2ff"/>
    <rect x="120" y="480" width="940" height="410" rx="12" fill="#e9f7ef"/>
    <rect x="220" y="262" width="214" height="40" rx="8" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace" font-size="28" fill="#24292f">
      <text x="130" y="156"><tspan font-weight="700">weekly-report/</tspan><tspan fill="#57606a">SKILL.md</tspan></text>
      <text x="130" y="240" fill="#57606a">---</text>
      <text x="130" y="290">name: weekly-report</text>
      <text x="130" y="340">description: Generates a weekly status</text>
      <text x="161" y="390">report from my recent emails and calendar.</text>
      <text x="130" y="440" fill="#57606a">---</text>
      <text x="130" y="530">Gather my sent emails and calendar events</text>
      <text x="130" y="580">from the past week.</text>
      <text x="130" y="630">Summarize activity by project and key outcomes.</text>
      <text x="130" y="680">Create a Word document with sections:</text>
      <text x="130" y="730">Highlights, In Progress, Blockers, Next Week.</text>
      <text x="130" y="780">Send the document to my manager every</text>
      <text x="130" y="830">Friday at 4 PM.</text>
    </g>

    <rect x="1180" y="110" width="640" height="230" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1212" y="162" font-size="30" font-weight="700" fill="#24292f">name</text>
    <text x="1212" y="206" font-size="28" fill="#57606a">matches the folder exactly</text>
    <text x="1212" y="250" font-size="28" fill="#57606a">lowercase, numbers, hyphens</text>
    <text x="1212" y="294" font-size="28" fill="#57606a">up to 64 characters</text>

    <rect x="1180" y="370" width="640" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1212" y="422" font-size="30" font-weight="700" fill="#24292f">description</text>
    <text x="1212" y="466" font-size="28" fill="#57606a">what Cowork reads to decide</text>
    <text x="1212" y="510" font-size="28" fill="#57606a">when the skill applies</text>
    <text x="1212" y="554" font-size="28" fill="#57606a">specific, trigger-oriented</text>

    <rect x="1180" y="640" width="640" height="230" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1212" y="692" font-size="30" font-weight="700" fill="#24292f">instructions</text>
    <text x="1212" y="736" font-size="28" fill="#57606a">the step-by-step recipe</text>
    <text x="1212" y="780" font-size="28" fill="#57606a">Cowork follows</text>
    <text x="1212" y="824" font-size="28" fill="#57606a">SKILL.md up to 1 MB</text>

    <line x1="1180" y1="225" x2="1084" y2="280" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="1180" y1="485" x2="1084" y2="365" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="1180" y1="755" x2="1084" y2="680" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  </g>
</svg>
