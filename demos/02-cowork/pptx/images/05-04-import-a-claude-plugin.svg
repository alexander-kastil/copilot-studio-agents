<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Import a Claude plugin</title>
  <desc id="d">The command wiqd plugin import turns a Claude plugin into a Microsoft 365 plugin. plugin.json becomes manifest.json, skills are copied as they are, and .mcp.json becomes connectors. The commands, agents and hooks folders are not converted.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="40" markerHeight="40" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#24292f"/></marker>
  </defs>
  <rect x="60" y="170" width="660" height="830" rx="18" fill="#fff6e5" stroke="#8c959f" stroke-width="2"/>
  <text x="90" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#24292f" font-weight="700">Claude plugin</text>
  <rect x="90" y="275" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">.claude-plugin/plugin.json</text>
  <rect x="90" y="395" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">skills/</text>
  <rect x="90" y="515" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="574" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">.mcp.json</text>
  <rect x="90" y="635" width="600" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="694" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#8c959f" font-weight="600">commands/</text>
  <rect x="90" y="755" width="600" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="814" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#8c959f" font-weight="600">agents/</text>
  <rect x="90" y="875" width="600" height="96" rx="12" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="934" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#8c959f" font-weight="600">hooks/</text>
  <rect x="440" y="657" width="230" height="52" rx="26" fill="#fbe9e7" stroke="#c4554d" stroke-width="2"/>
  <text x="555" y="692" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a8322b" font-weight="700" text-anchor="middle">Not converted</text>
  <rect x="440" y="777" width="230" height="52" rx="26" fill="#fbe9e7" stroke="#c4554d" stroke-width="2"/>
  <text x="555" y="812" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a8322b" font-weight="700" text-anchor="middle">Not converted</text>
  <rect x="440" y="897" width="230" height="52" rx="26" fill="#fbe9e7" stroke="#c4554d" stroke-width="2"/>
  <text x="555" y="932" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#a8322b" font-weight="700" text-anchor="middle">Not converted</text>
  <rect x="1200" y="170" width="660" height="830" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1230" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#24292f" font-weight="700">Microsoft 365 plugin</text>
  <rect x="1230" y="275" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">manifest.json</text>
  <rect x="1230" y="395" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">skills/</text>
  <rect x="1230" y="515" width="600" height="96" rx="12" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="574" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">Connectors</text>
  <rect x="1230" y="635" width="600" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1260" y="694" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="600">Icons</text>
  <rect x="750" y="96" width="420" height="68" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="141" font-family="Consolas, Menlo, monospace" font-size="32" fill="#24292f" font-weight="700" text-anchor="middle">wiqd plugin import</text>
  <path d="M722,225 L1196,225" fill="none" stroke="#24292f" stroke-width="10" marker-end="url(#ahb)"/>
  <path d="M690,323 L1228,323" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M690,443 L1228,443" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="960" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" fill="#57606a" text-anchor="middle">copied as they are</text>
  <path d="M690,563 L1228,563" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
</svg>
