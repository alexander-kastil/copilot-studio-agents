  <text x="140" y="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f" font-weight="600">Interactive widget</text>
  <text x="140" y="826" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a">UI from an MCP app</text>
  <rect x="680" y="140" width="440" height="820" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
