  <text x="740" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">Legal research</text>
  <text x="740" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">Clinical or HR</text>
  <text x="740" y="518" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">domain knowledge</text>
