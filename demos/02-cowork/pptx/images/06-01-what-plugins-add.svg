  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <line x1="1230" y1="70" x2="1230" y2="1010" stroke="#8c959f" stroke-width="3" stroke-dasharray="14 10"/>
  <text x="1200" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a" font-weight="600" text-anchor="end">Microsoft 365</text>
  <text x="1260" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#57606a" font-weight="600">Beyond Microsoft 365</text>
