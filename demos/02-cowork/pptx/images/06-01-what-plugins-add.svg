  <rect x="115" y="391" width="390" height="86" rx="12" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="140" y="444" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f" font-weight="600">Custom skills</text>
