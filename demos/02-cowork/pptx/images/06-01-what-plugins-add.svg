<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Plugins reach beyond Microsoft 365</title>
  <desc id="d">Cowork inside Microsoft 365 holds built-in, custom and plugin skills in its side panel. A plugin adds expertise skills and MCP connectors; the connectors reach CRM data, ticketing systems and third-party APIs beyond Microsoft 365 after a one-time Connect sign-in per user, and an MCP app returns an interactive widget into the conversation.</desc>
