<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1350" width="800" height="1350" role="img" aria-labelledby="t d">
  <title id="t">What Cowork remembers</title>
  <desc id="d">One Cowork conversation holds First step, Next step and Your next message; context carries from one to the next, and approvals last for the session. The next conversation starts empty. Applies every time: custom instructions on Customize and a custom skill.</desc>
  <defs>
    <style>
      svg { font-size: 32px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 38px; font-weight: 600; text-anchor: middle; }
      .c { font-size: 34px; text-anchor: middle; }
      .c2 { font-size: 32px; text-anchor: middle; }
      .n { font-size: 30px; fill: #57606a; }
      .d { font-size: 32px; fill: #57606a; text-anchor: middle; }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="1350" fill="#ffffff"/>

  <rect x="40" y="40" width="720" height="830" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="400" y="108">One Cowork conversation</text>

  <g stroke="#57606a" stroke-width="3">
    <line x1="190" y1="250" x2="190" y2="330"/>
    <line x1="190" y1="430" x2="190" y2="510"/>
  </g>
  <text class="n" x="212" y="301">context carries</text>
  <text class="n" x="212" y="481">context carries</text>

  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="110" y="150" width="580" height="100" rx="16"/>
    <rect x="110" y="330" width="580" height="100" rx="16"/>
    <rect x="110" y="510" width="580" height="100" rx="16"/>
  </g>
  <text class="c" x="400" y="212">First step</text>
  <text class="c" x="400" y="392">Next step</text>
  <text class="c" x="400" y="572">Your next message</text>

  <rect x="110" y="670" width="580" height="150" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="c" x="400" y="736">Approvals last</text>
  <text class="c" x="400" y="782">for the session</text>

  <line x1="40" y1="925" x2="760" y2="925" stroke="#8c959f" stroke-width="3" stroke-dasharray="14 10"/>
  <text class="d" x="400" y="982">Next conversation starts empty</text>

  <rect x="40" y="1030" width="720" height="280" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="400" y="1092">Applies every time</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="80" y="1120" width="640" height="76" rx="16"/>
    <rect x="80" y="1214" width="640" height="76" rx="16"/>
  </g>
  <text class="c2" x="400" y="1170">Custom instructions on Customize</text>
  <text class="c2" x="400" y="1264">A custom skill</text>
</svg>
