<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Where each Cowork admin control lives</title>
  <desc id="d">Four groups of admin controls. Copilot, Cost management: a spending policy that selects Cowork grants access with limits and alerts, model profiles hold a Cowork-only profile of at least two models, and Consumption splits Copilot Credits by policy, user and service. Cowork settings under Copilot, Settings, View All: Allow browser access is off by default, can be limited to security groups, and the audit log records each browser task. Agents, Tools: deploy plugins to everyone or to groups, allow or block them, and org-wide sharing waits for admin approval. Usage report and Microsoft Purview: active users, total tasks, scheduled versus user-initiated tasks and CSV export, refreshed once a day, plus auditing, sensitivity labels, DLP and eDiscovery.</desc>
  <style>
    svg { font-size: 27px; }
  </style>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="70" y="60" width="860" height="440" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="70" y="60" width="14" height="440" rx="7" fill="#4a7fd4"/>
    <text x="120" y="122" font-size="34" font-weight="700" fill="#24292f">Copilot &gt; Cost management</text>
    <line x1="120" y1="150" x2="890" y2="150" stroke="#8c959f" stroke-width="2"/>
    <circle cx="134" cy="200" r="7" fill="#57606a"/>
    <text x="160" y="209" fill="#24292f"><tspan font-weight="700">Configuration:</tspan> a spending policy that</text>
    <text x="160" y="249" fill="#24292f">selects Cowork grants access, with limits</text>
    <text x="160" y="289" fill="#24292f">and alerts</text>
    <circle cx="134" cy="340" r="7" fill="#57606a"/>
    <text x="160" y="349" fill="#24292f"><tspan font-weight="700">Model profiles:</tspan> a Cowork-only profile</text>
    <text x="160" y="389" fill="#24292f">with at least two models</text>
    <circle cx="134" cy="440" r="7" fill="#57606a"/>
    <text x="160" y="449" fill="#24292f"><tspan font-weight="700">Consumption:</tspan> credits by policy, user, service</text>

    <rect x="990" y="60" width="860" height="440" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <rect x="990" y="60" width="14" height="440" rx="7" fill="#8a63d2"/>
    <text x="1040" y="122" font-size="34" font-weight="700" fill="#24292f">Cowork settings</text>
    <line x1="1040" y1="150" x2="1810" y2="150" stroke="#8c959f" stroke-width="2"/>
    <text x="1040" y="200" font-size="26" fill="#57606a">Copilot &gt; Settings &gt; View All</text>
    <circle cx="1054" cy="260" r="7" fill="#57606a"/>
    <text x="1080" y="269" fill="#24292f"><tspan font-weight="700">Allow browser access</tspan> (Cowork Browsing)</text>
    <circle cx="1054" cy="320" r="7" fill="#57606a"/>
    <text x="1080" y="329" fill="#24292f">Off by default</text>
    <circle cx="1054" cy="380" r="7" fill="#57606a"/>
    <text x="1080" y="389" fill="#24292f">Limit it to security groups</text>
    <circle cx="1054" cy="440" r="7" fill="#57606a"/>
    <text x="1080" y="449" fill="#24292f">The audit log records each browser task</text>

    <rect x="70" y="580" width="860" height="440" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <rect x="70" y="580" width="14" height="440" rx="7" fill="#2da44e"/>
    <text x="120" y="642" font-size="34" font-weight="700" fill="#24292f">Agents &gt; Tools</text>
    <line x1="120" y1="670" x2="890" y2="670" stroke="#8c959f" stroke-width="2"/>
    <text x="120" y="720" font-size="26" fill="#57606a">Plugins</text>
    <circle cx="134" cy="780" r="7" fill="#57606a"/>
    <text x="160" y="789" fill="#24292f">Deploy to everyone or to groups</text>
    <circle cx="134" cy="840" r="7" fill="#57606a"/>
    <text x="160" y="849" fill="#24292f">Allow or block each plugin</text>
    <circle cx="134" cy="900" r="7" fill="#57606a"/>
    <text x="160" y="909" fill="#24292f">Org-wide sharing waits for admin approval</text>

    <rect x="990" y="580" width="860" height="440" rx="20" fill="#fff6e5" stroke="#8c959f" stroke-width="2"/>
    <rect x="990" y="580" width="14" height="440" rx="7" fill="#e0a534"/>
    <text x="1040" y="642" font-size="34" font-weight="700" fill="#24292f">Reports and Microsoft Purview</text>
    <line x1="1040" y1="670" x2="1810" y2="670" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1054" cy="720" r="7" fill="#57606a"/>
    <text x="1080" y="729" fill="#24292f"><tspan font-weight="700">Cowork usage report:</tspan> active users,</text>
    <text x="1080" y="769" fill="#24292f">total tasks, scheduled versus user-initiated,</text>
    <text x="1080" y="809" fill="#24292f">CSV export</text>
    <circle cx="1054" cy="860" r="7" fill="#57606a"/>
    <text x="1080" y="869" fill="#24292f">Refreshes once a day</text>
    <circle cx="1054" cy="920" r="7" fill="#57606a"/>
    <text x="1080" y="929" fill="#24292f"><tspan font-weight="700">Purview:</tspan> auditing, sensitivity labels,</text>
    <text x="1080" y="969" fill="#24292f">DLP, eDiscovery</text>
  </g>
</svg>
