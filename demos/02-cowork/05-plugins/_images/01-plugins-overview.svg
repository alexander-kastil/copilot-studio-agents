<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The plugins demo: the dietitian plugin's skills join the built-in Word in one Plugins list</title>
  <desc id="d">Step 1 installs the dietitian plugin: manifest.json, the icon PNGs and the skills/ folder, zipped, then Customize, Add, Upload. Customize lists it under Added: dietitian, Created by The AI Career Lab, Enable dietitian switched on, with the skills clinical-nutrition and dietary-communication. In one task, + &gt; Upload images and files adds client-intake.docx under References in the Workspace panel. Step 2 drafts the assessment and dietitian (clinical-nutrition) appears under Plugins, Step 3 turns it into a handout and dietitian (dietary-communication) appears, and Step 4 compiles the packet with the built-in Word, so plugin and built-in skills share one list. The packet, Client Nutrition Packet - NUT-2041.docx, lands under Output with the line DRAFT ONLY. Not medical nutrition therapy. A registered dietitian must review and approve before any client use. Dots carry the install into Customize, the file into References, each prompt to its Plugins entry, and the compile and the disclaimer into Output.</desc>
