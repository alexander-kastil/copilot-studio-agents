<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The weekly status report demo: one run by hand, then every Friday at 3:00 PM</title>
  <desc id="d">Steps 1 and 2 map the template to its sources and write the weekly-status-report skill, a SKILL.md in OneDrive. Along a timeline, Step 3 runs it once by hand, built from the Q3 material with the draft addressed to you, and Cowork confirms Nothing has been sent. Step 4 answers a Create recurring task? card set to Weekly, Friday, 3:00 PM with a Schedule button, and Automations lists it under Active as Every week on Friday at 3:00 PM. Each following Friday at 3:00 PM the run produces a one-page Word report and a Hi Elena email saved to drafts; each run saves the email to Drafts and never sends it. After the demo, ... &gt; Pause moves the task under Paused. A ring moves along the timeline and stops at each run.</desc>
