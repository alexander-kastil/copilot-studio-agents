<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">What the weekly status report demo builds</title>
  <desc id="d">Step 1 maps the house format in weekly-status-template.docx (section order and headings, bracketed placeholders) to its sources from the past seven days: sent emails, meetings, and the latest regional figures. Step 2 captures the recipe as the custom skill weekly-status-report, a SKILL.md in your OneDrive skills folder. Step 3 runs it once by hand before you trust it; Step 4 runs it every Friday at 3 PM. Each run produces a one-page Word report titled with the week ending date and a draft email to Elena Varga with the report attached, held for your approval.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="70" y="170" width="520" height="240" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="105" y="232" font-size="34" font-weight="700" fill="#24292f">House format</text>
    <text x="105" y="282" font-size="28" font-family="Consolas, monospace" fill="#24292f">weekly-status-template.docx</text>
    <text x="105" y="335" font-size="28" fill="#57606a">Section order and headings</text>
    <text x="105" y="375" font-size="28" fill="#57606a">Bracketed placeholders</text>

    <g stroke="#57606a" stroke-width="3" stroke-dasharray="10 8">
      <line x1="330" y1="412" x2="330" y2="463"/>
      <line x1="330" y1="527" x2="330" y2="578"/>
    </g>
    <rect x="140" y="465" width="380" height="60" rx="30" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="330" y="505" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Step 1: source map</text>

    <rect x="70" y="580" width="520" height="260" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="105" y="640" font-size="30" font-weight="700" fill="#24292f">Sources, past seven days</text>
    <text x="105" y="700" font-size="30" fill="#24292f">Sent emails</text>
    <text x="105" y="745" font-size="30" fill="#24292f">Meetings</text>
    <text x="105" y="790" font-size="30" fill="#24292f">Latest regional figures</text>

    <rect x="730" y="110" width="500" height="160" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <rect x="760" y="130" width="130" height="44" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="825" y="162" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Step 4</text>
    <text x="760" y="235" font-size="34" font-weight="700" fill="#24292f">Every Friday, 3 PM</text>

    <rect x="730" y="350" width="500" height="330" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <rect x="760" y="372" width="130" height="44" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="825" y="404" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Step 2</text>
    <text x="760" y="472" font-size="34" font-weight="700" fill="#24292f">Custom skill</text>
    <text x="760" y="522" font-size="30" font-family="Consolas, monospace" fill="#24292f">weekly-status-report</text>
    <text x="760" y="585" font-size="28" fill="#57606a">SKILL.md in your</text>
    <text x="760" y="625" font-size="28" fill="#57606a">OneDrive skills folder</text>

    <rect x="730" y="780" width="500" height="180" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <rect x="760" y="800" width="130" height="44" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="825" y="832" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Step 3</text>
    <text x="760" y="893" font-size="32" font-weight="700" fill="#24292f">Run once by hand</text>
    <text x="760" y="935" font-size="28" fill="#57606a">before you trust it</text>

    <rect x="1370" y="170" width="480" height="210" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="1610" y="235" font-size="34" font-weight="700" fill="#24292f">One-page</text>
      <text x="1610" y="278" font-size="34" font-weight="700" fill="#24292f">Word report</text>
      <text x="1610" y="327" font-size="28" fill="#57606a">Titled with the</text>
      <text x="1610" y="362" font-size="28" fill="#57606a">week ending date</text>
    </g>

    <rect x="1370" y="440" width="480" height="180" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="1610" y="500" font-size="34" font-weight="700" fill="#24292f">Draft email to</text>
      <text x="1610" y="543" font-size="34" font-weight="700" fill="#24292f">Elena Varga</text>
      <text x="1610" y="592" font-size="28" fill="#57606a">Report attached</text>
    </g>

    <rect x="1370" y="700" width="480" height="160" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <g font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">
      <text x="1610" y="768">Held for</text>
      <text x="1610" y="811">your approval</text>
    </g>

    <g stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
      <line x1="592" y1="290" x2="724" y2="448"/>
      <line x1="592" y1="710" x2="724" y2="600"/>
      <line x1="980" y1="272" x2="980" y2="344"/>
      <line x1="980" y1="778" x2="980" y2="686"/>
      <line x1="1232" y1="450" x2="1364" y2="292"/>
      <line x1="1232" y1="580" x2="1364" y2="532"/>
      <line x1="1610" y1="622" x2="1610" y2="694"/>
    </g>
  </g>
</svg>
