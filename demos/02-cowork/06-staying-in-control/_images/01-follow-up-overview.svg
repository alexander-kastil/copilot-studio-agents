      .code { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .open { font-family: Consolas, 'Courier New', monospace; font-size: 26px; font-weight: 700; fill: #57606a; text-anchor: middle; }
      .add { font-size: 26px; font-weight: 600; fill: #24292f; text-anchor: middle; }
      .num { font-size: 28px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
