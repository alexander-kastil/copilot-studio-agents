  <rect x="1340" y="590" width="500" height="170" rx="18" fill="none" stroke="#e0a534" stroke-width="8" opacity="0">
    <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.71;0.73;0.77;0.80;0.83;0.86;0.88;1" values="0;0;1;0.3;1;0.3;1;0;0"/>
