  <text class="sc" x="1590" y="922">standing in for</text>
  <text class="sc" x="1590" y="958">Elena Varga</text>

  <g fill="none" stroke="#24292f" stroke-width="5">
    <rect x="720" y="290" width="460" height="170" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.13;0.15;0.29;0.31;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="720" y="490" width="460" height="170" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.31;0.33;0.41;0.43;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="720" y="690" width="460" height="170" rx="16" opacity="0">
