<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">From three demo files to a gated send: the Q3 review flow</title>
  <desc id="d">Three files feed one Cowork task: q2-review.pptx gives the structure, slide count and tone to match; q3-sales-by-region.xlsx gives every figure, targets and headcount; q3-regional-notes.docx gives the story and the leadership ask. In one working folder the task runs 1, a numbered plan that waits for go-ahead, 2, the plan steered and the deck built, 3, speaker notes saved in place. It produces the deck Aurora Northern Europe - Q3 Review with speaker notes, which goes into an email draft with the deck attached to your own address, then an approval step with a risk level and a Send button, then your inbox, standing in for Elena Varga. Dots travel from the files into the task, and the finished deck travels down the chain and waits at the approval step.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .t { font-size: 30px; font-weight: 600; }
      .tc { font-size: 30px; font-weight: 600; text-anchor: middle; }
      .s { font-size: 28px; fill: #57606a; }
      .sc { font-size: 28px; fill: #57606a; text-anchor: middle; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .num { font-size: 28px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
