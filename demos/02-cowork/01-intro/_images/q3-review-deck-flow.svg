      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.12;0.13;1" values="1;1;0;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1220,235 H1590 V900" calcMode="linear" keyTimes="0;0.53;0.58;0.64;0.68;0.72;0.86;0.92;1" keyPoints="0;0;0.3575;0.3575;0.5700;0.7826;0.7826;1;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.53;0.54;1" values="0;0;1;1"/>
    </circle>
  </g>

