      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.12;0.13;1" values="1;1;0;0"/>
    </circle>
    <circle r="14">
      <animateMotion dur="10s" repeatCount="indefinite" path="M560,540 H680" calcMode="linear" keyTimes="0;0.12;1" keyPoints="0;1;1"/>
