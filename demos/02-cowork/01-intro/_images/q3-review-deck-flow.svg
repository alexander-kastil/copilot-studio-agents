    </rect>
    <rect x="1340" y="150" width="500" height="170" rx="18" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.58;0.60;0.65;0.67;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="1340" y="820" width="500" height="160" rx="18" opacity="0">
