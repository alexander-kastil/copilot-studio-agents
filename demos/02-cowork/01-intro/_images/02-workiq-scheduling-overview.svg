<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Work IQ scheduling demo: one free hour in your live week, defended and booked</title>
  <desc id="d">Your calendar from Monday to Friday, 09:00 to 17:00, read through Work IQ with nothing attached. Step 1 maps your week: grey meetings and white free time. Step 2 defends one slot: the lunch hour, the block right after your longest meeting and late Friday are ruled out, your only long focus stretch is left intact, and one free hour becomes the Agentic AI meeting. Step 3 books it: a Create calendar event? card at Medium risk with a Save button holds the write, then Agentic AI appears as a Teams meeting with the agenda in its body. Step 4 briefs you: Agentic AI Prep.docx lands in Output, and an Update event? card at Medium risk with an Update button holds the change that adds the line Prep document: Agentic AI Prep to the meeting. A highlight sweeps the days, marks the ruled-out blocks and the chosen hour, then a dot carries the slot to the approval cards.</desc>
