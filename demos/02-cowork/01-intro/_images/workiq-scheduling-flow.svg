<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Work IQ scheduling flow: reads pass freely, writes wait for approval</title>
  <desc id="d">Your data, calendar, mail, meetings, files and people, flows through Work IQ, which grounds Cowork in your working life, into a Cowork task with nothing attached. Steps 1, map your week, and 2, defend one slot, only read, and the calendar stays unchanged. Step 3, book it, writes an event and passes an approval step before the Agentic AI meeting with its agenda in the body appears. Step 4, brief yourself, attaches the prep note and passes a second approval step before Agentic AI Prep.docx sits on the meeting. A dot carries your data into the task, and each write waits at its approval step.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; text-anchor: middle; }
      .k { font-size: 28px; font-weight: 600; }
      .kc { font-size: 28px; font-weight: 600; text-anchor: middle; }
      .nc { font-size: 28px; text-anchor: middle; }
      .s { font-size: 28px; fill: #57606a; }
      .sc { font-size: 28px; fill: #57606a; text-anchor: middle; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; text-anchor: middle; }
      .num { font-size: 28px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="340" y1="470" x2="420" y2="470"/>
    <line x1="720" y1="470" x2="800" y2="470"/>
    <line x1="1240" y1="650" x2="1310" y2="650"/>
    <line x1="1490" y1="650" x2="1560" y2="650"/>
    <line x1="1240" y1="830" x2="1310" y2="830"/>
    <line x1="1490" y1="830" x2="1560" y2="830"/>
  </g>

  <g fill="#24292f">
    <circle r="14">
      <animateMotion dur="10s" repeatCount="indefinite" path="M210,470 H1020" calcMode="linear" keyTimes="0;0.25;1" keyPoints="0;1;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.26;1" values="1;1;0;0"/>
    </circle>
    <circle r="14">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1020,650 H1700" calcMode="linear" keyTimes="0;0.54;0.60;0.68;0.74;1" keyPoints="0;0;0.5588;0.5588;1;1"/>
    </circle>
    <circle r="14">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1020,830 H1700" calcMode="linear" keyTimes="0;0.80;0.84;0.92;0.96;1" keyPoints="0;0;0.5588;0.5588;1;1"/>
    </circle>
  </g>

  <rect x="80" y="195" width="260" height="550" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="kc" x="210" y="255">Your data</text>
  <g stroke="#8c959f" stroke-width="2" fill="#ffffff">
    <rect x="110" y="290" width="200" height="70" rx="14"/>
    <rect x="110" y="376" width="200" height="70" rx="14"/>
    <rect x="110" y="462" width="200" height="70" rx="14"/>
    <rect x="110" y="548" width="200" height="70" rx="14"/>
    <rect x="110" y="634" width="200" height="70" rx="14"/>
  </g>
  <text class="nc" x="210" y="335">Calendar</text>
  <text class="nc" x="210" y="421">Mail</text>
  <text class="nc" x="210" y="507">Meetings</text>
  <text class="nc" x="210" y="593">Files</text>
  <text class="nc" x="210" y="679">People</text>

  <rect x="420" y="340" width="300" height="260" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="570" y="412">Work IQ</text>
  <text class="sc" x="570" y="462">grounds Cowork</text>
  <text class="sc" x="570" y="498">in your</text>
  <text class="sc" x="570" y="534">working life</text>

  <rect x="800" y="150" width="440" height="770" rx="24" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="1020" y="210">Cowork task</text>
  <text class="sc" x="1020" y="252">nothing attached</text>
  <g stroke="#8c959f" stroke-width="2" fill="#ffffff">
    <rect x="830" y="280" width="380" height="120" rx="16"/>
    <rect x="830" y="420" width="380" height="120" rx="16"/>
    <rect x="830" y="590" width="380" height="120" rx="16"/>
    <rect x="830" y="770" width="380" height="120" rx="16"/>
  </g>
  <g fill="#24292f">
    <circle cx="870" cy="340" r="24"/>
    <circle cx="870" cy="480" r="24"/>
    <circle cx="870" cy="650" r="24"/>
    <circle cx="870" cy="830" r="24"/>
  </g>
  <text class="num" x="870" y="349">1</text>
  <text class="num" x="870" y="489">2</text>
  <text class="num" x="870" y="659">3</text>
  <text class="num" x="870" y="839">4</text>
  <text class="k" x="910" y="332">Map your week</text>
  <text class="s" x="910" y="374">reads only</text>
  <text class="k" x="910" y="472">Defend one slot</text>
  <text class="s" x="910" y="514">calendar unchanged</text>
  <text class="k" x="910" y="642">Book it</text>
  <text class="s" x="910" y="684">writes an event</text>
  <text class="k" x="910" y="822">Brief yourself</text>
  <text class="s" x="910" y="864">prep note attached</text>

  <g stroke="#e0a534" stroke-width="3" fill="#fff6e5">
    <rect x="1310" y="600" width="180" height="100" rx="16"/>
    <rect x="1310" y="780" width="180" height="100" rx="16"/>
  </g>
  <text class="kc" x="1400" y="644">Approval</text>
  <text class="sc" x="1400" y="680">step</text>
  <text class="kc" x="1400" y="824">Approval</text>
  <text class="sc" x="1400" y="860">step</text>

  <g stroke="#8c959f" stroke-width="2" fill="#eaf2ff">
    <rect x="1560" y="575" width="280" height="150" rx="18"/>
    <rect x="1560" y="755" width="280" height="150" rx="18"/>
  </g>
  <text class="kc" x="1700" y="623">Agentic AI</text>
  <text class="sc" x="1700" y="663">meeting, agenda</text>
  <text class="sc" x="1700" y="699">in the body</text>
  <text class="code" x="1700" y="803">Agentic AI</text>
  <text class="code" x="1700" y="841">Prep.docx</text>
  <text class="sc" x="1700" y="881">on the meeting</text>

  <g fill="none" stroke="#24292f" stroke-width="5">
    <rect x="830" y="280" width="380" height="120" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.25;0.27;0.37;0.39;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="830" y="420" width="380" height="120" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.39;0.41;0.51;0.53;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="830" y="590" width="380" height="120" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.53;0.55;0.59;0.61;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="830" y="770" width="380" height="120" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.78;0.80;0.83;0.85;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="1560" y="575" width="280" height="150" rx="18" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.74;0.76;0.82;0.84;1" values="0;0;1;1;0;0"/>
    </rect>
    <rect x="1560" y="755" width="280" height="150" rx="18" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.96;0.97;0.99;1" values="0;0;1;1;0"/>
    </rect>
  </g>
  <g fill="none" stroke="#e0a534" stroke-width="8">
    <rect x="1310" y="600" width="180" height="100" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.60;0.61;0.64;0.66;0.68;0.69;1" values="0;0;1;0.3;1;1;0;0"/>
    </rect>
    <rect x="1310" y="780" width="180" height="100" rx="16" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" keyTimes="0;0.84;0.85;0.88;0.90;0.92;0.93;1" values="0;0;1;0.3;1;1;0;0"/>
