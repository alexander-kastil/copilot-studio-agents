<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Q3 review demo: what you decide and what Cowork does</title>
  <desc id="d">Two lanes across the four steps, with q3-sales-by-region.xlsx, q3-regional-notes.docx and q2-review.pptx under References. In Step 1 you brief the outcome and ask for the plan before any file, and Cowork answers with a numbered plan, paused on your go-ahead. In Step 2 you steer the plan, the returns theme first and the ask last, and Cowork builds the deck with the Q2 deck's six slides. In Step 3 you ask for speaker notes saved in place, and Cowork saves them over the same file. In Step 4 you ask for the email to your own address, Cowork holds the Send draft? card at Medium risk with Cancel and Send, you select Send on the card, once per irreversible action, and Cowork records Approved 1 action with the email in your inbox. From Step 2 on, one deck sits under Output: Aurora Northern Europe - Q3 Review.pptx, saved in place, then attached. A dot moves back and forth between the lanes and pauses on the plan and on the approval card.</desc>
