<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The dietitian demo, step by step</title>
  <desc id="d">Step 1 installs the dietitian plugin. In the Cowork side panel, clinical-nutrition turns client-intake.docx into a nutrition assessment, dietary-communication turns the assessment into a client education handout, and the built-in Word skill compiles both into the Client Nutrition Packet NUT-2041 with the DRAFT ONLY line first. A registered dietitian reviews and approves the packet before it reaches a client.</desc>
