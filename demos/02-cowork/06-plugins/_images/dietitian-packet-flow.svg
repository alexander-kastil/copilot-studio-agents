  <text x="430" y="244" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#24292f">clinical-nutrition</text>
  <text x="430" y="292" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a">dietitian plugin</text>
