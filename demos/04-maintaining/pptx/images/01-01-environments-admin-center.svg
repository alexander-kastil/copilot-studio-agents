<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Admin Center, tenant, environments and solutions</title>
  <desc id="d">The Power Platform Admin Center is the control plane where admins create environments, assign security and apply policies for the tenant. The tenant holds environments of four types: default, developer, sandbox and production. Inside an environment, where every agent lives, Dataverse stores the solutions, environment variables and in-product pipelines. The default solution is where agents land automatically and is fine for a quick build; a custom solution set as the preferred solution, with a custom publisher and prefix, captures new components as you build.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .h { font-size: 36px; font-weight: 600; }
    .b { font-size: 30px; font-weight: 600; }
    .t { font-size: 28px; }
    .s { font-size: 28px; fill: #57606a; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="80" y="200" width="440" height="570" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="112" y="268">Power Platform</text>
  <text class="h" x="112" y="312">Admin Center</text>
  <text class="s" x="112" y="356">The control plane</text>
  <rect x="112" y="400" width="376" height="90" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="300" y="455" text-anchor="middle">Create environments</text>
  <rect x="112" y="520" width="376" height="90" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="300" y="575" text-anchor="middle">Assign security</text>
  <rect x="112" y="640" width="376" height="90" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="300" y="695" text-anchor="middle">Apply policies</text>

  <line x1="522" y1="485" x2="616" y2="485" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="620" y="80" width="1220" height="920" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="660" y="142">Tenant</text>
  <text class="s" x="1798" y="142" text-anchor="end">Environment types</text>
  <rect x="660" y="170" width="262" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="791" y="231" text-anchor="middle">Default</text>
  <rect x="952" y="170" width="262" height="100" rx="12" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1083" y="231" text-anchor="middle">Developer</text>
  <rect x="1244" y="170" width="262" height="100" rx="12" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1375" y="231" text-anchor="middle">Sandbox</text>
  <rect x="1536" y="170" width="262" height="100" rx="12" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1667" y="231" text-anchor="middle">Production</text>

  <rect x="660" y="310" width="1140" height="650" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="700" y="372">Inside an environment</text>
  <text class="s" x="1760" y="372" text-anchor="end">where every agent lives</text>

  <rect x="700" y="400" width="1060" height="525" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="740" y="455">Dataverse</text>

  <rect x="740" y="480" width="440" height="250" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="772" y="530">Default solution</text>
  <text class="s" x="772" y="576">Agents land here</text>
  <text class="s" x="772" y="614">automatically</text>
  <text class="s" x="772" y="662">Fine for a quick build</text>

  <rect x="1220" y="480" width="500" height="250" rx="12" fill="#e9f7ef" stroke="#8c959f" stroke-width="3"/>
  <text class="b" x="1252" y="530">Custom solution</text>
  <text class="t" x="1252" y="574">Set as preferred solution</text>
  <text class="t" x="1252" y="614">Custom publisher and prefix</text>
  <text class="t" x="1252" y="654">Captures new components</text>
  <text class="t" x="1252" y="692">as you build</text>

  <rect x="740" y="770" width="440" height="115" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="960" y="838" text-anchor="middle">Environment variables</text>
  <rect x="1220" y="770" width="500" height="115" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="1470" y="838" text-anchor="middle">In-product pipelines</text>
</svg>
