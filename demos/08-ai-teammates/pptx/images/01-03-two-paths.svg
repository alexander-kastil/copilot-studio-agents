<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">How the two paths to a teammate relate</title>
<desc id="d">A business process that needs an owner raises the question who builds the teammate. When a user describes name, role and goal, the path leads to Autopilot (private preview). When a maker configures instructions, tools and triggers, it leads to a Copilot Studio agent with an agent account. Both paths lead to own identity, memory, Teams and Outlook presence, governed in Agent 365 and Entra.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#57606a"/></marker></defs>
<rect x="710" y="40" width="500" height="120" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="92" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">A business process</text>
<text x="960" y="132" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">that needs an owner</text>
<path d="M760,300 L960,205 L1160,300 L960,395 Z" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="960" y="292" font-size="28" font-weight="600" fill="#24292f" text-anchor="middle">Who builds</text>
<text x="960" y="330" font-size="28" font-weight="600" fill="#24292f" text-anchor="middle">the teammate?</text>
<rect x="170" y="460" width="500" height="140" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="420" y="520" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Autopilot</text>
<text x="420" y="560" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">(private preview)</text>
<rect x="1250" y="460" width="500" height="140" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="1500" y="520" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Copilot Studio agent</text>
<text x="1500" y="560" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">with an agent account</text>
<rect x="720" y="650" width="480" height="150" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="712" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Own identity, memory,</text>
<text x="960" y="752" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Teams and Outlook presence</text>
<rect x="760" y="860" width="400" height="120" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="912" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Governed in</text>
<text x="960" y="952" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Agent 365 and Entra</text>
<text x="740" y="232" font-size="28" fill="#57606a" text-anchor="end">A user describes</text>
<text x="740" y="268" font-size="28" fill="#57606a" text-anchor="end">name, role, goal</text>
<text x="1180" y="232" font-size="28" fill="#57606a">A maker configures</text>
<text x="1180" y="268" font-size="28" fill="#57606a">instructions, tools, triggers</text>
