<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">The Cadence review cycle</title>
<desc id="d">The recurrence trigger fires. Cadence reads the tracker and status evidence, finds blockers and missing updates, generates a new review document and sends the link to reviewers. Reviewers reply or comment, and people decide priorities.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#57606a"/></marker></defs>
<rect x="70" y="150" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="240.0" y="257" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Recurrence</text>
<text x="240.0" y="299" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">trigger fires</text>
<rect x="550" y="150" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="720.0" y="257" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Read tracker and</text>
<text x="720.0" y="299" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">status evidence</text>
<rect x="1030" y="150" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1200.0" y="257" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Find blockers and</text>
<text x="1200.0" y="299" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">missing updates</text>
<rect x="1510" y="150" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1680.0" y="257" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Generate a new</text>
<text x="1680.0" y="299" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">review document</text>
<rect x="1510" y="700" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1680.0" y="807" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Send link to</text>
<text x="1680.0" y="849" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">reviewers</text>
<rect x="1030" y="700" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="1200.0" y="807" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">Reviewers reply</text>
<text x="1200.0" y="849" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">or comment</text>
<rect x="550" y="700" width="340" height="230" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="720.0" y="807" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">People decide</text>
<text x="720.0" y="849" font-size="30" font-weight="600" fill="#24292f" text-anchor="middle">priorities</text>
