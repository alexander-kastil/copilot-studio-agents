<rect x="860" y="350" width="320" height="80" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5667;0.5889;0.6333;0.6556;1.0000" dur="9s" repeatCount="indefinite"/></rect>
