<rect x="1400" y="400" width="450" height="260" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2111;0.2333;0.3000;0.3222;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<rect x="110" y="480" width="480" height="210" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3556;0.3778;0.4667;0.4889;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M590,585 L610,585 L610,585 L1392,585" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.4222;0.5556;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4182;0.4222;0.5556;0.5616;1" dur="9s" repeatCount="indefinite"/></circle>
<rect x="1400" y="400" width="450" height="260" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5444;0.5667;0.6333;0.6556;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<rect x="110" y="730" width="480" height="210" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6889;0.7111;0.8000;0.8222;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M590,835 L610,835 L610,585 L1392,585" dur="9s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7556;0.8889;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7516;0.7556;0.8889;0.8949;1" dur="9s" repeatCount="indefinite"/></circle>
<rect x="1400" y="400" width="450" height="260" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.8778;0.9000;0.9667;0.9889;1.0000" dur="9s" repeatCount="indefinite"/></rect>
</svg>
