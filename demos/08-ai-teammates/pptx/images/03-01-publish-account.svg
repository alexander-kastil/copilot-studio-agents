<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M780,540 L862,540" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3750;0.4250;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3710;0.3750;0.4250;0.4310;1" dur="8s" repeatCount="indefinite"/></circle>
<rect x="870" y="400" width="350" height="280" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4125;0.4375;0.5750;0.6000;1.0000" dur="8s" repeatCount="indefinite"/></rect>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M1220,480 L1332,380" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5750;0.6375;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5710;0.5750;0.6375;0.6435;1" dur="8s" repeatCount="indefinite"/></circle>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M1220,600 L1332,760" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5750;0.6375;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5710;0.5750;0.6375;0.6435;1" dur="8s" repeatCount="indefinite"/></circle>
<rect x="1340" y="110" width="510" height="490" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6500;0.8750;0.9000;1.0000" dur="8s" repeatCount="indefinite"/></rect>
<rect x="1340" y="660" width="510" height="270" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.6250;0.6500;0.8750;0.9000;1.0000" dur="8s" repeatCount="indefinite"/></rect>
