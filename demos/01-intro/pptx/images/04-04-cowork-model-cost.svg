<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What the model costs in Cowork</title>
  <desc id="d">Auto, the default, picks a model from the steps for each request and weighs accuracy, speed and cost. Three steps of model weight rise toward more Copilot Credits per task: Everyday with Claude Sonnet 5.5, GPT 5.6 Terra and GPT 5.5 (Frontier); Hard work with GPT 6.1 Sol and Grok 4.7; Highest with Claude Opus 5.5, GPT 6 Astra and Claude Fable 5.1 (Frontier). Above, five reasoning effort levels, Light, Medium, High, Extra High and Max, where higher effort uses more credits.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="60" y="60" width="840" height="360" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="90" y="118" font-size="34" font-weight="700" fill="#24292f">Reasoning effort</text>
  <text x="90" y="160" font-size="28" fill="#57606a">higher effort uses more credits</text>
  <g fill="#f3edff" stroke="#8c959f" stroke-width="2">
    <rect x="90" y="300" width="140" height="40" rx="6"/>
    <rect x="250" y="270" width="140" height="70" rx="6" fill="#d8c8fb"/>
    <rect x="410" y="240" width="140" height="100" rx="6"/>
    <rect x="570" y="210" width="140" height="130" rx="6"/>
    <rect x="730" y="180" width="140" height="160" rx="6"/>
  </g>
  <g font-size="28" fill="#24292f" text-anchor="middle">
    <text x="160" y="385">Light</text>
    <text x="320" y="385" font-weight="700">Medium</text>
    <text x="480" y="385">High</text>
    <text x="640" y="385">Extra High</text>
    <text x="800" y="385">Max</text>
  </g>
  <rect x="60" y="480" width="410" height="420" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <rect x="500" y="480" width="410" height="420" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <rect x="940" y="360" width="410" height="540" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1380" y="240" width="410" height="660" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <g text-anchor="middle" fill="#24292f">
    <text x="265" y="542" font-size="38" font-weight="700">Auto</text>
    <text x="265" y="592" font-size="28" fill="#57606a">the default</text>
    <text x="265" y="652" font-size="28">picks a model from</text>
    <text x="265" y="692" font-size="28">the steps for each</text>
    <text x="265" y="732" font-size="28">request and weighs</text>
    <text x="265" y="772" font-size="28">accuracy, speed</text>
    <text x="265" y="812" font-size="28">and cost</text>
    <text x="705" y="542" font-size="38" font-weight="700">Everyday</text>
    <text x="705" y="592" font-size="28" fill="#57606a">common tasks</text>
    <text x="705" y="652" font-size="28">Claude Sonnet 5.5</text>
    <text x="705" y="692" font-size="28">GPT 5.6 Terra</text>
    <text x="705" y="732" font-size="28">GPT 5.5 (Frontier)</text>
    <text x="1145" y="422" font-size="38" font-weight="700">Hard work</text>
    <text x="1145" y="472" font-size="28" fill="#57606a">long, multistep tasks</text>
    <text x="1145" y="532" font-size="28">GPT 6.1 Sol</text>
    <text x="1145" y="572" font-size="28">Grok 4.7</text>
    <text x="1585" y="302" font-size="38" font-weight="700">Highest</text>
    <text x="1585" y="352" font-size="28" fill="#57606a">complex, high-stakes work</text>
    <text x="1585" y="412" font-size="28">Claude Opus 5.5</text>
    <text x="1585" y="452" font-size="28">GPT 6 Astra</text>
    <text x="1585" y="492" font-size="28">Claude Fable 5.1 (Frontier)</text>
  </g>
  <line x1="500" y1="950" x2="1786" y2="950" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
  <text x="1143" y="1010" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">more Copilot Credits per task</text>
</svg>
