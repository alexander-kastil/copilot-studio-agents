<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Per-user licenses and the three places Copilot Credits come from</title>
  <desc id="d">Left, the per-user licenses: a Microsoft 365 Copilot license for every learner in modules 1, 2 and 8, paid per user; Copilot Studio access for every maker in modules 3 to 8, free; and a GitHub account as the class prerequisite, free. Right, Copilot Credits at about one cent each, charged where the work runs. The agent environment runs Standard and GitHub Copilot agents, agent flows, workflows and computer use, paid by a billing plan with the Copilot Studio meter set up in the Power Platform admin center. The maker's personal developer environment runs the building and previewing of apps in module 6, paid by the same billing plan with this environment added, also in the Power Platform admin center. The Microsoft 365 tenant runs Cowork, the Work IQ API and Copilot Managed Runtime for apps, paid by a spending policy that selects each service, set up in the Microsoft 365 admin center. An arrow leads from the credits down to the Azure subscription and resource group, which pays every pay-as-you-go route and needs Owner or Contributor rights.</desc>
