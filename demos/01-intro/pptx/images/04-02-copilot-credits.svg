<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Three billing routes into Copilot Credits and one Azure subscription</title>
  <desc id="d">Copilot Chat and SharePoint agents for users without a Copilot license bill through a billing policy, set in the Microsoft 365 admin center under Copilot, Billing and usage. Copilot Studio agents bill through a billing plan, set in the Power Platform admin center under Licensing, Pay-as-you-go plans. Cowork and usage-based services bill through a spending policy, set in the Microsoft 365 admin center under Copilot, Cost Management. All three routes draw Copilot Credits: prepaid packs and P3 first, then pay-as-you-go. Pay-as-you-go bills an Azure subscription and resource group on which the admin holds Owner or Contributor rights. A moving dot follows each route in turn, through the credits and into the Azure subscription.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="45" width="560" height="433" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="350" y="102" font-size="34" font-weight="700" fill="#24292f">Copilot Chat &amp;</text>
    <text x="350" y="144" font-size="34" font-weight="700" fill="#24292f">SharePoint agents</text>
    <text x="350" y="189" font-size="28" fill="#57606a">Users without a Copilot license</text>
    <rect x="100" y="226" width="500" height="125" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="350" y="278" font-size="30" font-weight="700" fill="#24292f">Microsoft 365 admin center</text>
    <text x="350" y="324" font-size="28" fill="#57606a">Copilot: Billing &amp; usage</text>
    <rect x="130" y="378" width="440" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="350" y="424" font-size="30" font-weight="700" fill="#24292f">Billing policy</text>

    <rect x="680" y="45" width="560" height="433" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="123" font-size="34" font-weight="700" fill="#24292f">Copilot Studio agents</text>
    <rect x="710" y="226" width="500" height="125" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="278" font-size="30" font-weight="700" fill="#24292f">Power Platform admin center</text>
    <text x="960" y="324" font-size="28" fill="#57606a">Licensing: Pay-as-you-go plans</text>
    <rect x="740" y="378" width="440" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="424" font-size="30" font-weight="700" fill="#24292f">Billing plan</text>

    <rect x="1290" y="45" width="560" height="433" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1570" y="102" font-size="34" font-weight="700" fill="#24292f">Cowork &amp;</text>
    <text x="1570" y="144" font-size="34" font-weight="700" fill="#24292f">usage-based services</text>
    <rect x="1320" y="226" width="500" height="125" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1570" y="278" font-size="30" font-weight="700" fill="#24292f">Microsoft 365 admin center</text>
    <text x="1570" y="324" font-size="28" fill="#57606a">Copilot: Cost Management</text>
    <rect x="1350" y="378" width="440" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1570" y="424" font-size="30" font-weight="700" fill="#24292f">Spending policy</text>

    <line x1="350" y1="480" x2="350" y2="572" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="960" y1="480" x2="960" y2="572" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1570" y1="480" x2="1570" y2="572" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="70" y="580" width="1780" height="170" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="905" y="703" font-size="40" font-weight="700" fill="#24292f" text-anchor="end">Copilot Credits</text>
    <text x="1015" y="685" font-size="30" fill="#57606a" text-anchor="start">Prepaid packs and P3 first,</text>
    <text x="1015" y="725" font-size="30" fill="#57606a" text-anchor="start">then pay-as-you-go</text>

    <line x1="960" y1="752" x2="960" y2="832" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="460" y="840" width="1000" height="180" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="922" font-size="38" font-weight="700" fill="#24292f">Azure subscription and resource group</text>
    <text x="960" y="975" font-size="30" fill="#57606a">Owner or Contributor rights</text>

    <circle cx="350" cy="500" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;0;0" keyTimes="0;0.28;0.2801;1" path="M0,0 L0,110 L610,110 L610,358"/>
    </circle>
    <circle cx="960" cy="500" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;0;0" keyTimes="0;0.3333;0.4667;0.4668;1" path="M0,0 L0,358"/>
    </circle>
    <circle cx="1570" cy="500" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;0;0" keyTimes="0;0.6667;0.9467;0.9468;1" path="M0,0 L0,110 L-610,110 L-610,358"/>
    </circle>
  </g>
</svg>
