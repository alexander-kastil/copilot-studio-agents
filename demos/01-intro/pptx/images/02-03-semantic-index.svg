<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The semantic index matches by meaning</title>
  <desc id="d">A search for time off policy and a document titled annual leave use different words. Both are stored as embeddings, numeric representations of meaning, and land close together in the semantic index, so the search matches the document.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="200" width="480" height="170" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="255" font-size="28" fill="#57606a">Search</text>
  <text x="120" y="318" font-size="36" font-weight="700" fill="#24292f">time off policy</text>

  <line x1="320" y1="378" x2="320" y2="468" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="320" y="507" font-size="28" fill="#57606a" text-anchor="middle">Different words</text>
  <line x1="320" y1="530" x2="320" y2="612" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 6"/>

  <rect x="80" y="620" width="480" height="170" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="675" font-size="28" fill="#57606a">Document title</text>
  <text x="120" y="738" font-size="36" font-weight="700" fill="#24292f">annual leave</text>

  <line x1="562" y1="285" x2="646" y2="285" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="562" y1="705" x2="646" y2="705" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <g fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
    <rect x="660" y="280" width="26" height="50" rx="4"/>
    <rect x="698" y="250" width="26" height="80" rx="4"/>
    <rect x="736" y="300" width="26" height="30" rx="4"/>
    <rect x="774" y="235" width="26" height="95" rx="4"/>
    <rect x="812" y="270" width="26" height="60" rx="4"/>
    <rect x="850" y="290" width="26" height="40" rx="4"/>
    <rect x="888" y="245" width="26" height="85" rx="4"/>
    <rect x="926" y="275" width="26" height="55" rx="4"/>
  </g>
  <g fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
    <rect x="660" y="695" width="26" height="55" rx="4"/>
    <rect x="698" y="675" width="26" height="75" rx="4"/>
    <rect x="736" y="715" width="26" height="35" rx="4"/>
    <rect x="774" y="660" width="26" height="90" rx="4"/>
    <rect x="812" y="685" width="26" height="65" rx="4"/>
    <rect x="850" y="715" width="26" height="35" rx="4"/>
    <rect x="888" y="670" width="26" height="80" rx="4"/>
    <rect x="926" y="690" width="26" height="60" rx="4"/>
  </g>

  <text x="806" y="480" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Embeddings</text>
  <text x="806" y="522" font-size="28" fill="#57606a" text-anchor="middle">numeric representations</text>
  <text x="806" y="558" font-size="28" fill="#57606a" text-anchor="middle">of meaning</text>

  <rect x="1100" y="120" width="740" height="840" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1140" y="180" font-size="32" font-weight="700" fill="#24292f">Semantic index</text>
  <text x="1140" y="222" font-size="28" fill="#57606a">Your content stored by meaning</text>

  <g fill="#d0d7de">
    <circle cx="1230" cy="290" r="11"/>
    <circle cx="1690" cy="300" r="11"/>
    <circle cx="1785" cy="390" r="11"/>
    <circle cx="1170" cy="530" r="11"/>
    <circle cx="1240" cy="830" r="11"/>
    <circle cx="1420" cy="885" r="11"/>
    <circle cx="1650" cy="860" r="11"/>
    <circle cx="1780" cy="815" r="11"/>
    <circle cx="1290" cy="760" r="11"/>
  </g>

  <ellipse cx="1570" cy="550" rx="232" ry="122" fill="#ffffff" stroke="#8c959f" stroke-width="3" stroke-dasharray="10 8"/>
  <path d="M962,285 C1150,285 1250,500 1406,500" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M962,705 C1150,705 1300,600 1466,600" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <circle cx="1430" cy="500" r="18" fill="#eaf2ff" stroke="#24292f" stroke-width="3"/>
  <circle cx="1490" cy="600" r="18" fill="#e9f7ef" stroke="#24292f" stroke-width="3"/>
  <text x="1462" y="491" font-size="30" font-weight="700" fill="#24292f">time off policy</text>
  <text x="1522" y="611" font-size="30" font-weight="700" fill="#24292f">annual leave</text>

  <rect x="1340" y="700" width="460" height="70" rx="35" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1570" y="746" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Close in meaning: a match</text>
</svg>
