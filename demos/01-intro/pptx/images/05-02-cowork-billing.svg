<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The order Cowork draws down Copilot Credits</title>
  <desc id="d">Cowork usage is metered in Copilot Credits. Step one: prepaid capacity packs and Copilot Credit Pre-Purchase Plan (P3) credits are drawn down first. Step two: pay-as-you-go charges, with an Azure subscription as the billing method, apply only after packs and P3 credits are exhausted. The two steps light up in this order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="140" width="380" height="760" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="270" y="505" font-size="40" font-weight="700" fill="#24292f">Cowork usage</text>
    <text x="270" y="555" font-size="30" fill="#57606a">in Copilot Credits</text>

    <line x1="462" y1="520" x2="556" y2="520" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="570" y="140" width="625" height="760" rx="18" fill="#e9f7ef" stroke="#57606a" stroke-width="6">
      <animate attributeName="stroke-width" values="6;2" keyTimes="0;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="stroke" values="#57606a;#8c959f" keyTimes="0;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="634" cy="250" r="32" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
    <text x="634" y="263" font-size="36" font-weight="700" fill="#24292f">1</text>
    <circle cx="634" cy="250" r="32" fill="none" stroke="#57606a" stroke-width="3" opacity="0.8">
      <animate attributeName="r" values="32;54;54;32" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0;0" keyTimes="0;0.45;0.5;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="696" y="263" font-size="36" font-weight="700" fill="#24292f" text-anchor="start">Drawn down first</text>
    <rect x="610" y="330" width="545" height="160" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="882" y="422" font-size="32" font-weight="700" fill="#24292f">Prepaid capacity packs</text>
    <text x="882" y="542" font-size="30" fill="#57606a">and</text>
    <rect x="610" y="575" width="545" height="240" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="882" y="652" font-size="32" font-weight="700" fill="#24292f">Copilot Credit</text>
    <text x="882" y="697" font-size="32" font-weight="700" fill="#24292f">Pre-Purchase Plan</text>
    <text x="882" y="742" font-size="32" font-weight="700" fill="#24292f">(P3) credits</text>

    <rect x="1215" y="140" width="625" height="760" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
      <animate attributeName="stroke-width" values="2;6" keyTimes="0;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1279" cy="250" r="32" fill="#ffffff" stroke="#e0a534" stroke-width="3"/>
    <text x="1279" y="263" font-size="36" font-weight="700" fill="#24292f">2</text>
    <circle cx="1279" cy="250" r="32" fill="none" stroke="#e0a534" stroke-width="3" opacity="0">
      <animate attributeName="r" values="32;32;54;54" keyTimes="0;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.4999;0.5;0.95;1" dur="8s" repeatCount="indefinite"/>
    </circle>
    <text x="1341" y="263" font-size="34" font-weight="700" fill="#24292f" text-anchor="start">Pay-as-you-go charges</text>
    <text x="1527" y="395" font-size="30" fill="#57606a">Apply only after</text>
    <text x="1527" y="439" font-size="30" fill="#57606a">packs and P3 credits</text>
    <text x="1527" y="483" font-size="30" fill="#57606a">are exhausted</text>
    <rect x="1255" y="575" width="545" height="240" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1527" y="682" font-size="34" font-weight="700" fill="#24292f">Azure subscription</text>
    <text x="1527" y="730" font-size="30" fill="#57606a">as the billing method</text>
  </g>
</svg>
