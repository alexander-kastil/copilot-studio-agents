<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What a harness is: the operating layer that equips and directs the model</title>
  <desc id="d">The model sits inside the harness and only reasons and writes. Around it the harness equips and directs it: context (instructions, history, retrieved knowledge), tools (connectors, REST APIs, MCP servers), skills (a SKILL.md loaded when a request matches), memory (what it learned across turns and runs), a sandbox for code and files (Word, Excel, PowerPoint, PDF), and the orchestration loop (plan, act, check, retry, delegate, stop). Guardrails apply on every step. A request comes in and an answer or action goes out.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <rect x="300" y="40" width="1320" height="1000" rx="32" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="112" text-anchor="middle" font-size="46" font-weight="700" fill="#24292f">Harness</text>
  <text x="960" y="160" text-anchor="middle" font-size="32" fill="#57606a">equips and directs the model</text>
  <g stroke="#8c959f" stroke-width="2">
    <line x1="740" y1="290" x2="800" y2="460"/>
    <line x1="740" y1="540" x2="800" y2="540"/>
    <line x1="740" y1="790" x2="800" y2="620"/>
    <line x1="1180" y1="290" x2="1120" y2="460"/>
    <line x1="1180" y1="540" x2="1120" y2="540"/>
    <line x1="1180" y1="790" x2="1120" y2="620"/>
  </g>
  <rect x="800" y="440" width="320" height="200" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="528" text-anchor="middle" font-size="42" font-weight="700" fill="#24292f">Model</text>
  <text x="960" y="580" text-anchor="middle" font-size="30" fill="#57606a">reasons and writes</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="340" y="215" width="400" height="150" rx="16"/>
    <rect x="340" y="465" width="400" height="150" rx="16"/>
    <rect x="340" y="715" width="400" height="150" rx="16"/>
    <rect x="1180" y="215" width="400" height="150" rx="16"/>
    <rect x="1180" y="465" width="400" height="150" rx="16"/>
    <rect x="1180" y="715" width="400" height="150" rx="16"/>
  </g>
  <g text-anchor="middle" fill="#24292f">
    <text x="540" y="267" font-size="34" font-weight="700">Context</text>
    <text x="540" y="309" font-size="28" fill="#57606a">instructions, history,</text>
    <text x="540" y="343" font-size="28" fill="#57606a">retrieved knowledge</text>
    <text x="540" y="517" font-size="34" font-weight="700">Skills</text>
    <text x="540" y="559" font-size="28" fill="#57606a">SKILL.md loaded when</text>
    <text x="540" y="593" font-size="28" fill="#57606a">a request matches</text>
    <text x="540" y="767" font-size="34" font-weight="700">Memory</text>
    <text x="540" y="809" font-size="28" fill="#57606a">what it learned across</text>
    <text x="540" y="843" font-size="28" fill="#57606a">turns and runs</text>
    <text x="1380" y="267" font-size="34" font-weight="700">Tools</text>
    <text x="1380" y="309" font-size="28" fill="#57606a">connectors, REST APIs,</text>
    <text x="1380" y="343" font-size="28" fill="#57606a">MCP servers</text>
    <text x="1380" y="517" font-size="34" font-weight="700">Sandbox and files</text>
    <text x="1380" y="559" font-size="28" fill="#57606a">runs code, writes Word,</text>
    <text x="1380" y="593" font-size="28" fill="#57606a">Excel, PowerPoint, PDF</text>
    <text x="1380" y="767" font-size="34" font-weight="700">Orchestration loop</text>
    <text x="1380" y="809" font-size="28" fill="#57606a">plan, act, check,</text>
    <text x="1380" y="843" font-size="28" fill="#57606a">retry, delegate, stop</text>
  </g>
  <rect x="340" y="905" width="1240" height="95" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="960" y="963" text-anchor="middle" font-size="30" fill="#24292f"><tspan font-weight="700">Guardrails</tspan> on every step: sign-in, permissions, approvals</text>
  <rect x="20" y="480" width="230" height="120" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="135" y="551" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Request</text>
  <line x1="250" y1="540" x2="296" y2="540" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
  <rect x="1670" y="465" width="230" height="150" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1785" y="532" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">Answer</text>
  <text x="1785" y="572" text-anchor="middle" font-size="32" font-weight="700" fill="#24292f">or action</text>
  <line x1="1620" y1="540" x2="1666" y2="540" stroke="#57606a" stroke-width="3" marker-end="url(#a)"/>
</svg>
