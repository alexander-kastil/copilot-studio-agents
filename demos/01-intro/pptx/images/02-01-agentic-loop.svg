<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A chatbot answers one turn; an agent loops toward a goal</title>
  <desc id="d">A chatbot takes a question and gives one answer, one turn at a time, then forgets. An agent takes a goal and loops through plan, act, observe and adjust until the outcome is reached. When it acts it calls tools, and a person approves before a consequential action runs. The steps of the loop light up in order.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="80" width="560" height="920" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="150" font-size="40" font-weight="700" fill="#24292f">Chatbot</text>
  <rect x="150" y="330" width="420" height="110" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="360" y="397" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">A question</text>
  <line x1="360" y1="442" x2="360" y2="526" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <rect x="150" y="530" width="420" height="110" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="360" y="597" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">One answer</text>
  <text x="360" y="730" font-size="30" fill="#57606a" text-anchor="middle">One turn at a time,</text>
  <text x="360" y="772" font-size="30" fill="#57606a" text-anchor="middle">then it forgets</text>

  <rect x="720" y="80" width="1120" height="920" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="760" y="150" font-size="40" font-weight="700" fill="#24292f">Agent</text>

  <rect x="1010" y="110" width="540" height="96" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1280" y="169" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Goal: an outcome you describe</text>
  <line x1="1280" y1="208" x2="1280" y2="252" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="1170" y="256" width="220" height="88" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="311" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Plan</text>
  <rect x="1410" y="496" width="220" height="88" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1520" y="551" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Act</text>
  <rect x="1170" y="736" width="220" height="88" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="791" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Observe</text>
  <rect x="930" y="496" width="220" height="88" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1040" y="551" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Adjust</text>

  <path d="M1407,336.5 A240,240 0 0,1 1494,431" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M1494,649 A240,240 0 0,1 1407,743.5" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M1153,743.5 A240,240 0 0,1 1066,649" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <path d="M1066,431 A240,240 0 0,1 1153,336.5" fill="none" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <text x="1280" y="505" font-size="28" fill="#57606a" text-anchor="middle">Repeat until</text>
  <text x="1280" y="543" font-size="28" fill="#57606a" text-anchor="middle">the outcome</text>
  <text x="1280" y="581" font-size="28" fill="#57606a" text-anchor="middle">is reached</text>

  <rect x="1560" y="380" width="250" height="76" rx="38" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1685" y="428" font-size="28" fill="#24292f" text-anchor="middle">Calls tools</text>
  <line x1="1600" y1="458" x2="1600" y2="494" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 6"/>

  <line x1="1590" y1="586" x2="1590" y2="698" stroke="#8c959f" stroke-width="3" stroke-dasharray="8 6"/>
  <rect x="1450" y="700" width="360" height="120" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1630" y="751" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Person approves</text>
  <text x="1630" y="791" font-size="28" fill="#24292f" text-anchor="middle">before it runs</text>

  <line x1="1280" y1="826" x2="1280" y2="876" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <rect x="1100" y="880" width="360" height="90" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="936" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Outcome reached</text>

  <rect x="1170" y="256" width="220" height="88" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1410" y="496" width="220" height="88" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1560" y="380" width="250" height="76" rx="38" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1450" y="700" width="360" height="120" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1170" y="736" width="220" height="88" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="930" y="496" width="220" height="88" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
</svg>
