<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The four harnesses in Copilot Studio side by side</title>
  <desc id="d">Four cards compare the harnesses of Copilot Studio. GitHub Copilot reasons toward a goal: it plans, recovers and works with files, has skills and memory, publishes internally or externally, bills Copilot Credits and is taught in module 6. Standard follows the paths you define with topics, trigger phrases and branches and classic or generative orchestration; it publishes internally or externally, uses standard licensing and is taught in modules 3 to 5. Copilot chat extends Copilot Chat for employees with your organization's knowledge and each user's own permissions; it publishes to internal teams, bills by consumption or through a Microsoft 365 Copilot license and works like Agent Builder agents. Customer Conversation, marked as preview, serves customers by chat and phone with sub-agents that hand over to a person, plus skills and memory; it publishes to website chat or a phone number, bills Copilot Credits and is not built in this class. A banner below says the harness is chosen once, at creation: a Standard agent never becomes a GitHub Copilot agent, or back.</desc>
