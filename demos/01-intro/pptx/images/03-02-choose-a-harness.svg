<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Four questions that choose the harness</title>
  <desc id="d">Four questions run from top to bottom, and the first Yes names the harness. Question 1 asks whether the agent extends Copilot Chat for employees; Yes leads to Copilot chat. Question 2 asks whether customers reach it by website chat or phone, with a person to hand over to; Yes leads to Customer Conversation. Question 3 asks whether every conversation must follow paths a maker defines; Yes leads to Standard. Question 4 asks whether the work plans across tools and files, needs memory and recovers from failed steps; Yes leads to GitHub Copilot, and No leads to Standard. A side note says to check next where users reach the agent and which billing fits. A bar along the bottom says that mixed needs are decided by the dominant job: agents and workflows combine, and each agent runs on one harness.</desc>
  <style>svg { font-size: 28px; }</style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="64" width="840" height="112" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="112" cy="120" r="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="112" y="130" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">1</text>
  <text x="164" y="130" font-size="30" fill="#24292f">Extend Copilot Chat for employees?</text>

  <rect x="60" y="240" width="840" height="112" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="112" cy="296" r="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="112" y="306" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">2</text>
  <text x="164" y="286" font-size="30" fill="#24292f">Customers by website chat or phone,</text>
  <text x="164" y="326" font-size="30" fill="#24292f">with a person to hand over to?</text>

  <rect x="60" y="416" width="840" height="112" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="112" cy="472" r="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="112" y="482" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">3</text>
  <text x="164" y="462" font-size="30" fill="#24292f">Must every conversation follow</text>
  <text x="164" y="502" font-size="30" fill="#24292f">paths a maker defines?</text>

  <rect x="60" y="592" width="840" height="112" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="112" cy="648" r="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="112" y="658" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">4</text>
  <text x="164" y="638" font-size="30" fill="#24292f">Plans across tools and files, needs memory,</text>
  <text x="164" y="678" font-size="30" fill="#24292f">recovers from failed steps?</text>

  <g stroke="#57606a" stroke-width="4" marker-end="url(#ah)">
    <line x1="180" y1="180" x2="180" y2="234"/>
    <line x1="180" y1="356" x2="180" y2="410"/>
    <line x1="180" y1="532" x2="180" y2="586"/>
    <line x1="180" y1="708" x2="180" y2="762"/>
    <line x1="904" y1="120" x2="1072" y2="120"/>
    <line x1="904" y1="296" x2="1072" y2="296"/>
    <line x1="904" y1="472" x2="1072" y2="472"/>
    <line x1="904" y1="648" x2="1072" y2="648"/>
  </g>
  <g font-size="28" font-weight="700" fill="#57606a">
    <text x="200" y="218">No</text>
    <text x="200" y="394">No</text>
    <text x="200" y="570">No</text>
    <text x="200" y="746">No</text>
  </g>
  <g font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="988" y="104">Yes</text>
    <text x="988" y="280">Yes</text>
    <text x="988" y="456">Yes</text>
    <text x="988" y="632">Yes</text>
  </g>

  <rect x="1080" y="64" width="400" height="112" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="131" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Copilot chat</text>
  <rect x="1080" y="240" width="400" height="112" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2" stroke-dasharray="14 10"/>
  <text x="1280" y="307" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Customer Conversation</text>
  <rect x="1080" y="416" width="400" height="112" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="483" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Standard</text>
  <rect x="1080" y="592" width="400" height="112" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1280" y="659" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">GitHub Copilot</text>

  <rect x="60" y="768" width="240" height="72" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="180" y="814" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Standard</text>

  <rect x="1540" y="240" width="340" height="288" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1710" y="328" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Then check:</text>
  <text x="1710" y="372" font-size="30" fill="#24292f" text-anchor="middle">where do users</text>
  <text x="1710" y="416" font-size="30" fill="#24292f" text-anchor="middle">reach it, and</text>
  <text x="1710" y="460" font-size="30" fill="#24292f" text-anchor="middle">which billing fits?</text>

  <rect x="60" y="900" width="1820" height="100" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="970" y="960" font-size="30" fill="#24292f" text-anchor="middle"><tspan font-weight="700">Mixed needs:</tspan> decide by the dominant job. Agents and workflows combine; each agent runs on one harness.</text>
</svg>
