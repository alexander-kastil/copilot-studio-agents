<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Assistant, copilot and agent as nested categories</title>
  <desc id="d">Assistant is the general category. A copilot is an assistant embedded in an app you already use, where the human asks and Copilot responds turn by turn. An agent is a copilot given a specific job, its own knowledge, instructions and tools, where the human sets a goal and the agent plans and acts across steps. Moving inward means a narrower job and more autonomy.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="80" width="1400" height="920" rx="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="124" y="150" font-size="40" font-weight="700" fill="#24292f">Assistant</text>
  <text x="124" y="200" font-size="28" fill="#57606a">Any AI that helps a person complete work in natural language</text>

  <rect x="140" y="250" width="1280" height="690" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="184" y="318" font-size="40" font-weight="700" fill="#24292f">Copilot</text>
  <text x="184" y="366" font-size="28" fill="#57606a">Embedded in an app you already use, grounded in your work content</text>
  <text x="184" y="410" font-size="28" fill="#24292f">The human asks; Copilot responds turn by turn</text>
  <text x="184" y="454" font-size="28" fill="#57606a">Microsoft 365 Copilot: the broad assistant across your apps</text>

  <rect x="200" y="490" width="1160" height="400" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="244" y="558" font-size="40" font-weight="700" fill="#24292f">Agent</text>
  <text x="244" y="606" font-size="28" fill="#57606a">A copilot given a specific job, its own knowledge,</text>
  <text x="244" y="646" font-size="28" fill="#57606a">instructions, and tools it can call</text>
  <text x="244" y="694" font-size="28" fill="#24292f">The human sets a goal; the agent plans and acts across steps</text>
  <rect x="244" y="740" width="460" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="474" y="790" font-size="28" fill="#24292f" text-anchor="middle">Handling sales objections</text>
  <rect x="734" y="740" width="520" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="994" y="790" font-size="28" fill="#24292f" text-anchor="middle">Answering HR policy questions</text>

  <line x1="1550" y1="160" x2="1550" y2="900" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <text x="1585" y="510" font-size="30" font-weight="700" fill="#24292f">Narrower job,</text>
  <text x="1585" y="550" font-size="30" font-weight="700" fill="#24292f">more autonomy</text>
</svg>
