<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Three admin surfaces, one Azure billing account</title>
  <desc id="d">Copilot message metering is enabled in the Microsoft 365 Admin Center under Copilot, Billing and usage, with a billing policy. Copilot Studio message capacity is enabled in the Power Platform Admin Center under Licensing, Copilot Studio, with a billing plan. Cowork, metered in Copilot Credits, is enabled in the Microsoft 365 Admin Center under Copilot, Cost Management, with a spending policy. All three bill to one Azure subscription and resource group with Owner or Contributor rights, the shared billing plumbing. Moving dots show usage from each service reaching the same Azure billing account in turn.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="100" width="560" height="500" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="350" y="172" font-size="40" font-weight="700" fill="#24292f">Copilot</text>
    <text x="350" y="220" font-size="30" fill="#57606a">Message metering</text>
    <rect x="100" y="255" width="500" height="190" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="350" y="315" font-size="32" font-weight="700" fill="#24292f">Microsoft 365</text>
    <text x="350" y="357" font-size="32" font-weight="700" fill="#24292f">Admin Center</text>
    <text x="350" y="410" font-size="28" fill="#57606a">Copilot: Billing &amp; usage</text>
    <rect x="130" y="480" width="440" height="80" rx="40" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="350" y="532" font-size="32" font-weight="700" fill="#24292f">Billing policy</text>

    <rect x="680" y="100" width="560" height="500" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="172" font-size="40" font-weight="700" fill="#24292f">Copilot Studio</text>
    <text x="960" y="220" font-size="30" fill="#57606a">Message capacity</text>
    <rect x="710" y="255" width="500" height="190" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="315" font-size="32" font-weight="700" fill="#24292f">Power Platform</text>
    <text x="960" y="357" font-size="32" font-weight="700" fill="#24292f">Admin Center</text>
    <text x="960" y="410" font-size="28" fill="#57606a">Licensing: Copilot Studio</text>
    <rect x="740" y="480" width="440" height="80" rx="40" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="532" font-size="32" font-weight="700" fill="#24292f">Billing plan</text>

    <rect x="1290" y="100" width="560" height="500" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1570" y="172" font-size="40" font-weight="700" fill="#24292f">Cowork</text>
    <text x="1570" y="220" font-size="30" fill="#57606a">Copilot Credits</text>
    <rect x="1320" y="255" width="500" height="190" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1570" y="315" font-size="32" font-weight="700" fill="#24292f">Microsoft 365</text>
    <text x="1570" y="357" font-size="32" font-weight="700" fill="#24292f">Admin Center</text>
    <text x="1570" y="410" font-size="28" fill="#57606a">Copilot: Cost Management</text>
    <rect x="1350" y="480" width="440" height="80" rx="40" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="1570" y="532" font-size="32" font-weight="700" fill="#24292f">Spending policy</text>

    <line x1="350" y1="602" x2="350" y2="764" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="960" y1="602" x2="960" y2="764" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="1570" y1="602" x2="1570" y2="764" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="70" y="780" width="1780" height="200" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="865" font-size="40" font-weight="700" fill="#24292f">Azure subscription and resource group</text>
    <text x="960" y="925" font-size="30" fill="#57606a">Owner or Contributor rights, the shared billing plumbing for all three</text>

    <circle cx="350" cy="628" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animate attributeName="cy" values="628;750;628;628" keyTimes="0;0.3;0.3001;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="628" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animate attributeName="cy" values="628;628;750;628;628" keyTimes="0;0.3333;0.6333;0.6334;1" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1570" cy="628" r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3">
      <animate attributeName="cy" values="628;628;750;628;628" keyTimes="0;0.6667;0.9667;0.9668;1" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
