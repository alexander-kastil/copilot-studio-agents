<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">How an agent uses its three parts when it runs</title>
  <desc id="d">A user question reaches the agent, which reads its instructions (how it behaves). It retrieves grounding from knowledge (what it knows) when it needs facts, and calls tools (what it can do) when it needs live data or has to act. The result is a grounded answer or an action. A marker walks through the parts in that order.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="470" width="320" height="140" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="240" y="551" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">User question</text>
  <line x1="402" y1="540" x2="694" y2="540" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="700" y="90" width="520" height="170" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="162" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Knowledge</text>
  <text x="960" y="208" font-size="28" fill="#57606a" text-anchor="middle">What it knows</text>

  <line x1="900" y1="266" x2="900" y2="394" stroke="#57606a" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="940" y="320" font-size="28" fill="#24292f">Retrieves grounding</text>
  <text x="940" y="356" font-size="28" fill="#24292f">when it needs facts</text>

  <rect x="700" y="400" width="520" height="280" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="740" y="458" font-size="34" font-weight="700" fill="#24292f">Agent</text>
  <rect x="740" y="486" width="440" height="160" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="552" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Instructions</text>
  <text x="960" y="598" font-size="28" fill="#57606a" text-anchor="middle">How it behaves</text>

  <line x1="900" y1="686" x2="900" y2="814" stroke="#57606a" stroke-width="4" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="940" y="740" font-size="28" fill="#24292f">Calls tools when it needs</text>
  <text x="940" y="776" font-size="28" fill="#24292f">live data or has to act</text>

  <rect x="700" y="820" width="520" height="170" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="892" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Tools</text>
  <text x="960" y="938" font-size="28" fill="#57606a" text-anchor="middle">What it can do</text>

  <line x1="1222" y1="540" x2="1514" y2="540" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <rect x="1520" y="440" width="320" height="200" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1680" y="528" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Grounded answer</text>
  <text x="1680" y="570" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">or action</text>

  <rect x="740" y="486" width="440" height="160" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.15;0.3" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="90" width="520" height="170" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="820" width="520" height="170" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.7" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <rect x="1520" y="440" width="320" height="200" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
    <animate attributeName="opacity" values="0;1" keyTimes="0;0.85" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>

  <g fill="#e0a534" stroke="#ffffff" stroke-width="3">
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.15" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.15;1" path="M402,540 L694,540"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3;0.5;1" path="M900,394 L900,266 L900,394"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.7" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.7;1" path="M900,686 L900,814 L900,686"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.85" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.7;0.85;1" path="M1222,540 L1514,540"/>
    </circle>
  </g>
</svg>
