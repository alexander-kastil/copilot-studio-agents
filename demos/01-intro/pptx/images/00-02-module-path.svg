  <title id="t">The four topics of module 1 in three groups</title>
  <desc id="d">Topics 1 and 2 establish the concepts: Agents and Copilots for Microsoft 365, then How Agents Work. Topic 3, Where to Build and What It Costs, maps the build paths and their billing. Topic 4, Copilot Chat and Productivity Agents, tours the productivity surface. Arrows lead from one group to the next.</desc>
