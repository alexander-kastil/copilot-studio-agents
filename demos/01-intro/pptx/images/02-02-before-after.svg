<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A quarterly account review today and with agentic AI</title>
  <desc id="d">Today a person gathers files, reads emails, checks the CRM and assembles a summary by hand, and the result takes hours. With agentic AI the person sets the goal, an agent does the same four steps by calling tools and knowledge, and the person reviews and approves the result, which takes minutes plus a review.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="70" width="1760" height="400" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="135" font-size="36" font-weight="700" fill="#24292f">Process today</text>
  <text x="120" y="180" font-size="28" fill="#57606a">Human role: does the work</text>
  <text x="1800" y="135" font-size="30" fill="#24292f" text-anchor="end">Time to result: hours</text>

  <rect x="120" y="250" width="230" height="140" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="235" y="331" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">A person</text>
  <rect x="410" y="250" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="525" y="331" font-size="30" fill="#24292f" text-anchor="middle">Gather files</text>
  <rect x="700" y="250" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="815" y="331" font-size="30" fill="#24292f" text-anchor="middle">Read emails</text>
  <rect x="990" y="250" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1105" y="312" font-size="30" fill="#24292f" text-anchor="middle">Check</text>
  <text x="1105" y="352" font-size="30" fill="#24292f" text-anchor="middle">the CRM</text>
  <rect x="1280" y="250" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1395" y="312" font-size="30" fill="#24292f" text-anchor="middle">Assemble</text>
  <text x="1395" y="352" font-size="30" fill="#24292f" text-anchor="middle">a summary</text>
  <line x1="352" y1="320" x2="406" y2="320" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="642" y1="320" x2="696" y2="320" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="932" y1="320" x2="986" y2="320" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1222" y1="320" x2="1276" y2="320" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="80" y="510" width="1760" height="500" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="120" y="575" font-size="36" font-weight="700" fill="#24292f">Process with agentic AI</text>
  <text x="120" y="620" font-size="28" fill="#57606a">Human role: sets the goal and approves</text>
  <text x="1800" y="575" font-size="30" fill="#24292f" text-anchor="end">Time to result: minutes, plus a review</text>

  <rect x="120" y="780" width="230" height="140" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="235" y="842" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Person sets</text>
  <text x="235" y="882" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">the goal</text>
  <line x1="352" y1="850" x2="392" y2="850" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="396" y="660" width="1128" height="320" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="430" y="718" font-size="30" font-weight="700" fill="#24292f">Agent calls tools and knowledge</text>
  <rect x="410" y="780" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="525" y="861" font-size="30" fill="#24292f" text-anchor="middle">Gather files</text>
  <rect x="700" y="780" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="815" y="861" font-size="30" fill="#24292f" text-anchor="middle">Read emails</text>
  <rect x="990" y="780" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1105" y="842" font-size="30" fill="#24292f" text-anchor="middle">Check</text>
  <text x="1105" y="882" font-size="30" fill="#24292f" text-anchor="middle">the CRM</text>
  <rect x="1280" y="780" width="230" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1395" y="842" font-size="30" fill="#24292f" text-anchor="middle">Assemble</text>
  <text x="1395" y="882" font-size="30" fill="#24292f" text-anchor="middle">a summary</text>
  <line x1="642" y1="850" x2="696" y2="850" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="932" y1="850" x2="986" y2="850" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <line x1="1222" y1="850" x2="1276" y2="850" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <line x1="1526" y1="850" x2="1566" y2="850" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1570" y="780" width="230" height="140" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1685" y="822" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Person</text>
  <text x="1685" y="860" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">reviews and</text>
  <text x="1685" y="898" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">approves</text>
</svg>
