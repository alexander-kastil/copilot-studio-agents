<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What Work IQ is</title>
  <desc id="d">Your work data, mail, meetings, Teams chats, files, people and business data, flows into Work IQ, the intelligence layer of Microsoft 365. Work IQ offers context, tools through the Work IQ MCP server, chat and workspaces, and runs as the signed-in user, permission-trimmed and logged. It grounds Copilot Chat and the Office apps, Copilot Cowork and Copilot Studio agents.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="260" y="130" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Your work data</text>
  <rect x="80" y="170" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="233" font-size="32" fill="#24292f" text-anchor="middle">Mail</text>
  <rect x="80" y="300" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="363" font-size="32" fill="#24292f" text-anchor="middle">Meetings</text>
  <rect x="80" y="430" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="493" font-size="32" fill="#24292f" text-anchor="middle">Teams chats</text>
  <rect x="80" y="560" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="623" font-size="32" fill="#24292f" text-anchor="middle">Files</text>
  <rect x="80" y="690" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="753" font-size="32" fill="#24292f" text-anchor="middle">People</text>
  <rect x="80" y="820" width="360" height="104" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="260" y="883" font-size="32" fill="#24292f" text-anchor="middle">Business data</text>

  <line x1="450" y1="547" x2="594" y2="547" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="600" y="100" width="720" height="880" rx="26" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="182" font-size="48" font-weight="700" fill="#24292f" text-anchor="middle">Work IQ</text>
  <text x="960" y="230" font-size="28" fill="#57606a" text-anchor="middle">Intelligence layer of Microsoft 365</text>

  <rect x="640" y="270" width="310" height="230" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="795" y="370" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Context</text>
  <text x="795" y="416" font-size="26" fill="#57606a" text-anchor="middle">Grounded input</text>
  <rect x="970" y="270" width="310" height="230" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1125" y="370" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Tools</text>
  <text x="1125" y="416" font-size="26" fill="#57606a" text-anchor="middle">Work IQ MCP server</text>
  <rect x="640" y="520" width="310" height="230" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="795" y="620" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Chat</text>
  <text x="795" y="666" font-size="26" fill="#57606a" text-anchor="middle">Delegate a question</text>
  <rect x="970" y="520" width="310" height="230" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1125" y="620" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Workspaces</text>
  <text x="1125" y="666" font-size="26" fill="#57606a" text-anchor="middle">Space for long tasks</text>

  <rect x="640" y="790" width="640" height="150" rx="18" fill="#fff8e6" stroke="#e0a534" stroke-width="3"/>
  <text x="960" y="856" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Runs as the signed-in user</text>
  <text x="960" y="900" font-size="26" fill="#57606a" text-anchor="middle">Permission-trimmed and logged</text>

  <line x1="1326" y1="547" x2="1470" y2="547" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <text x="1660" y="130" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Grounds</text>
  <rect x="1480" y="200" width="360" height="190" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1660" y="285" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Copilot Chat</text>
  <text x="1660" y="327" font-size="28" fill="#57606a" text-anchor="middle">and the Office apps</text>
  <rect x="1480" y="452" width="360" height="190" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1660" y="537" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Copilot Cowork</text>
  <text x="1660" y="579" font-size="28" fill="#57606a" text-anchor="middle">Tasks in your name</text>
  <rect x="1480" y="704" width="360" height="190" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1660" y="789" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Copilot Studio</text>
  <text x="1660" y="831" font-size="28" fill="#57606a" text-anchor="middle">Agents you build</text>
