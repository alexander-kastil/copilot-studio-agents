<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The six topics of module 1 in four groups</title>
  <desc id="d">Topics 1 and 2 establish the concepts: Agents and Copilots for Microsoft 365, then How Agents Work. Topics 3 and 4 are the decisions to make before you build: Agent Harnesses, Choose the Runtime, then Where to Build and What It Costs. Topic 5, Copilot Chat and Productivity Agents, tours the productivity surface. Topic 6, Prepare the Tenant: Licenses and Credits, is optional and readies the class tenant. Arrows lead from one group to the next.</desc>
