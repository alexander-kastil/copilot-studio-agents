<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Four build paths on one build-effort scale</title>
  <desc id="d">The four build paths are ordered by build effort. Agent Builder and SharePoint agents need no code and answer grounded questions over sites and files; they come in module 1. Cowork skills and plugins need no code and take on recurring knowledge work; they come in module 2. Copilot Studio is low code with three harnesses (GitHub Copilot, standard and Copilot chat) and is most of this course. Pro-code with the Agents Toolkit, the Agents SDK and Microsoft Foundry is out of scope here. The scale runs from no code, fastest to ship, to code, most control. Below it one bar serves every path: Copilot connectors for external content, MCP servers for tools, and plugins as one installable package.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="110" y="70" width="380" height="455" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="300" y="140" font-size="34" font-weight="700" fill="#24292f">Agent Builder &amp;</text>
    <text x="300" y="184" font-size="34" font-weight="700" fill="#24292f">SharePoint agents</text>
    <text x="300" y="250" font-size="30" font-weight="600" fill="#24292f">No code</text>
    <text x="300" y="300" font-size="28" fill="#57606a">Grounded Q&amp;A over</text>
    <text x="300" y="340" font-size="28" fill="#57606a">sites and files</text>
    <rect x="200" y="430" width="200" height="66" rx="33" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="300" y="473" font-size="28" fill="#24292f">Module 1</text>

    <rect x="550" y="70" width="380" height="455" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="740" y="140" font-size="34" font-weight="700" fill="#24292f">Cowork skills</text>
    <text x="740" y="184" font-size="34" font-weight="700" fill="#24292f">&amp; plugins</text>
    <text x="740" y="250" font-size="30" font-weight="600" fill="#24292f">No code</text>
    <text x="740" y="300" font-size="28" fill="#57606a">Recurring</text>
    <text x="740" y="340" font-size="28" fill="#57606a">knowledge work</text>
    <rect x="640" y="430" width="200" height="66" rx="33" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="740" y="473" font-size="28" fill="#24292f">Module 2</text>

    <rect x="990" y="70" width="380" height="455" rx="18" fill="#eaf2ff" stroke="#57606a" stroke-width="5"/>
    <text x="1180" y="162" font-size="34" font-weight="700" fill="#24292f">Copilot Studio</text>
    <text x="1180" y="250" font-size="30" font-weight="600" fill="#24292f">Low code</text>
    <text x="1180" y="300" font-size="28" fill="#57606a">Three harnesses:</text>
    <text x="1180" y="340" font-size="28" fill="#57606a">GitHub Copilot,</text>
    <text x="1180" y="380" font-size="28" fill="#57606a">standard, Copilot chat</text>
    <rect x="1020" y="430" width="320" height="66" rx="33" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
    <text x="1180" y="473" font-size="28" font-weight="700" fill="#24292f">Most of this course</text>

    <rect x="1430" y="70" width="380" height="455" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1620" y="162" font-size="34" font-weight="700" fill="#24292f">Pro-code</text>
    <text x="1620" y="250" font-size="28" fill="#57606a">Agents Toolkit,</text>
    <text x="1620" y="290" font-size="28" fill="#57606a">Agents SDK,</text>
    <text x="1620" y="330" font-size="28" fill="#57606a">Microsoft Foundry</text>
    <rect x="1475" y="430" width="290" height="66" rx="33" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1620" y="473" font-size="28" fill="#57606a">Out of scope here</text>

    <line x1="300" y1="527" x2="300" y2="626" stroke="#8c959f" stroke-width="2"/>
    <line x1="740" y1="527" x2="740" y2="626" stroke="#8c959f" stroke-width="2"/>
    <line x1="1180" y1="528" x2="1180" y2="626" stroke="#8c959f" stroke-width="2"/>
    <line x1="1620" y1="527" x2="1620" y2="626" stroke="#8c959f" stroke-width="2"/>

    <line x1="100" y1="640" x2="1810" y2="640" stroke="#57606a" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="300" cy="640" r="14" fill="#e9f7ef" stroke="#57606a" stroke-width="3"/>
    <circle cx="740" cy="640" r="14" fill="#e9f7ef" stroke="#57606a" stroke-width="3"/>
    <circle cx="1180" cy="640" r="14" fill="#eaf2ff" stroke="#57606a" stroke-width="3"/>
    <circle cx="1620" cy="640" r="14" fill="#f6f8fa" stroke="#57606a" stroke-width="3"/>

    <text x="100" y="705" font-size="30" font-weight="700" fill="#24292f" text-anchor="start">No code: fastest to ship</text>
    <text x="960" y="705" font-size="30" fill="#57606a">Build effort</text>
    <text x="1820" y="705" font-size="30" font-weight="700" fill="#24292f" text-anchor="end">Code: most control</text>

    <rect x="100" y="760" width="1720" height="240" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="822" font-size="32" font-weight="700" fill="#24292f">Serves every path</text>
    <rect x="208" y="864" width="570" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="493" y="914" font-size="28" fill="#24292f">Copilot connectors: external content</text>
    <rect x="818" y="864" width="340" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="988" y="914" font-size="28" fill="#24292f">MCP servers: tools</text>
    <rect x="1198" y="864" width="515" height="80" rx="40" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1455.5" y="914" font-size="28" fill="#24292f">Plugins: one installable package</text>
  </g>
</svg>
