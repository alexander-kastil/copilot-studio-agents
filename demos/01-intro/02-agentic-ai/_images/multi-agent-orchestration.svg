  <line x1="960" y1="642" x2="960" y2="854" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>
  <rect x="760" y="860" width="400" height="140" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="922" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Combined</text>
  <text x="960" y="964" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">answer</text>

