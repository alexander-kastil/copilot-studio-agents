<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A master agent orchestrating three specialist agents</title>
  <desc id="d">The user goal goes to the master agent, the orchestrator. The master routes work to the hotel booking agent, the flight search agent and the restaurant agent, each returns its result to the master, and the master produces the combined answer. Markers travel out to the specialists, back to the master, and on to the combined answer.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="80" y="470" width="320" height="140" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="240" y="551" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">User goal</text>
  <line x1="402" y1="540" x2="754" y2="540" stroke="#57606a" stroke-width="4" marker-end="url(#ah)"/>

  <rect x="760" y="440" width="400" height="200" rx="24" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="530" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Master agent</text>
  <text x="960" y="576" font-size="28" fill="#57606a" text-anchor="middle">(orchestrator)</text>

  <rect x="1440" y="160" width="400" height="160" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1640" y="228" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Hotel booking</text>
  <text x="1640" y="270" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">agent</text>
  <rect x="1440" y="460" width="400" height="160" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1640" y="528" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Flight search</text>
  <text x="1640" y="570" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">agent</text>
  <rect x="1440" y="760" width="400" height="160" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="1640" y="828" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Restaurant</text>
  <text x="1640" y="870" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">agent</text>

  <g stroke="#57606a" stroke-width="4" fill="none" marker-end="url(#ah)">
    <path d="M1162,470 L1434,222"/>
    <path d="M1438,262 L1166,500"/>
    <path d="M1162,522 L1434,522"/>
    <path d="M1438,558 L1166,558"/>
    <path d="M1162,580 L1434,818"/>
