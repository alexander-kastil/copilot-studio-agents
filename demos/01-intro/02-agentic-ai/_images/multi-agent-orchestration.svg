      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.6875;1" path="M1438,262 L1166,500"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6875" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.6875;1" path="M1438,558 L1166,558"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6875" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.5;0.6875;1" path="M1438,858 L1166,610"/>
    </circle>
    <circle r="13" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
      <animateMotion dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.75;0.875;1" path="M960,642 L960,854"/>
