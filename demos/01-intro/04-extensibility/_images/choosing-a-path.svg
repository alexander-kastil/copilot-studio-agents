<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Choosing an extensibility path</title>
  <desc id="d">A new scenario runs through three questions in order. Just grounded Q and A over your sites and files? Yes leads to a declarative agent (Agent Builder or SharePoint). No leads to the next question: needs tools, topics, or a published channel? Yes leads to Copilot Studio (low-code). No leads to: content lives in an external system? Yes leads to a Graph connector. No leads to pro-code, which is out of scope.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="400" y="50" width="340" height="70" rx="35" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="570" y="96" font-size="32" font-weight="700" fill="#24292f">New scenario</text>
    <line x1="570" y1="122" x2="570" y2="171" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="240" y="175" width="660" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="570" y="245" font-size="32" font-weight="700" fill="#24292f">Just grounded Q&amp;A over</text>
    <text x="570" y="287" font-size="32" font-weight="700" fill="#24292f">your sites and files?</text>
    <line x1="902" y1="255" x2="1154" y2="255" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1028" y="238" font-size="30" font-weight="700" fill="#57606a">Yes</text>
    <rect x="1160" y="175" width="600" height="160" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1460" y="245" font-size="34" font-weight="700" fill="#24292f">Declarative agent</text>
    <text x="1460" y="290" font-size="30" fill="#57606a">(Agent Builder / SharePoint)</text>

    <line x1="570" y1="337" x2="570" y2="391" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="592" y="375" font-size="30" font-weight="700" fill="#57606a" text-anchor="start">No</text>

    <rect x="240" y="395" width="660" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="570" y="465" font-size="32" font-weight="700" fill="#24292f">Needs tools, topics, or a</text>
    <text x="570" y="507" font-size="32" font-weight="700" fill="#24292f">published channel?</text>
    <line x1="902" y1="475" x2="1154" y2="475" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1028" y="458" font-size="30" font-weight="700" fill="#57606a">Yes</text>
    <rect x="1160" y="395" width="600" height="160" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1460" y="465" font-size="34" font-weight="700" fill="#24292f">Copilot Studio</text>
    <text x="1460" y="510" font-size="30" fill="#57606a">(low-code)</text>

    <line x1="570" y1="557" x2="570" y2="611" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="592" y="595" font-size="30" font-weight="700" fill="#57606a" text-anchor="start">No</text>

    <rect x="240" y="615" width="660" height="160" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="570" y="685" font-size="32" font-weight="700" fill="#24292f">Content lives in an</text>
    <text x="570" y="727" font-size="32" font-weight="700" fill="#24292f">external system?</text>
    <line x1="902" y1="695" x2="1154" y2="695" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1028" y="678" font-size="30" font-weight="700" fill="#57606a">Yes</text>
    <rect x="1160" y="615" width="600" height="160" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1460" y="707" font-size="34" font-weight="700" fill="#24292f">Graph connector</text>

    <line x1="570" y1="777" x2="570" y2="831" stroke="#57606a" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="592" y="815" font-size="30" font-weight="700" fill="#57606a" text-anchor="start">No</text>

    <rect x="360" y="835" width="420" height="130" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="570" y="890" font-size="34" font-weight="700" fill="#24292f">Pro-code</text>
    <text x="570" y="934" font-size="30" fill="#57606a">(out of scope)</text>
  </g>
</svg>
