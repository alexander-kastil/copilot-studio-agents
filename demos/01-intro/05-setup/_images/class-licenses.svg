<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2008" width="1920" height="2008" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Licenses for this class, by module</title>
  <desc id="d">A matrix of the licenses this class needs: one row per license, one column for each of the eight modules, and a cost column. A filled dot means the license is needed in the module; a ring means it is needed only for an optional topic or step. Module 8, AI Teammates, is optional. Per user: Microsoft 365 with Microsoft 365 Copilot is needed in modules 1, 2 and 8 and is paid per user, monthly or annual. Copilot Studio access, through a Copilot license, the free user license or a trial, is needed in modules 3 to 8 and is free or included. A GitHub account is a class prerequisite for all eight modules and is free. Claude Code or GitHub Copilot CLI is needed in module 7 and comes with a Claude or GitHub Copilot plan. Copilot Credits, about $0.01 each: a billing plan on the agent environment, set in the Power Platform admin center, is needed in modules 4, 5, 6 and 8, and in module 7 only for an optional topic or step; it is pay-as-you-go. A billing plan on each maker's personal environment, for apps, is needed in module 6 and is pay-as-you-go. A Microsoft 365 spending policy for Cowork, the Work IQ API and app runtime is needed in modules 2, 5 and 6, up to a monthly limit. Azure: an Azure subscription and resource group with Owner or Contributor rights is needed in modules 2, 4, 5, 6 and 8, and in module 7 only for an optional topic or step; it costs Azure usage, and the F1 tier is free. A Microsoft Foundry project is needed in module 5, and in module 6 only for an optional topic or step, and costs Azure usage. Azure Communication Services is needed only for an optional topic or step in modules 5 and 7 and costs Azure usage. Optional topics and module: a Microsoft Fabric semantic model is needed only for an optional topic or step in module 6 and requires workspace access. Dynamics 365 Contact Center is needed only for an optional topic or step in module 5 and requires a Contact Center license. Agent 365, a maker license and Frontier for AI Teammates are needed in module 8, with a 30-day trial, then about $15 to $18. Autopilot preview, with Intune and a GitHub Copilot seat, is needed in module 8 and is by invitation only.</desc>
