<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Choose the harness: the presenter walks four exercises in Copilot Studio without creating an agent</title>
  <desc id="d">The presenter walks four exercises in order. Ex 1 finds where each harness starts on Home: under Optimize your business processes, which uses Copilot Credits, the Agent, Workflow and App (preview) cards each carry the GitHub Copilot badge; under Other ways to build, Customer Assist Agent carries the Customer conversation badge, and Agent and Agent flows carry the Standard badge. Ex 2 reads the harness of an existing agent in the Powered by column of the Agents list: a CS- agent shows Standard, included with your Microsoft 365 Copilot license, and a GH- agent shows GitHub Copilot, where Copilot Credits are used as you create and edit it. Ex 3 compares one job on two harnesses: CS-Grey Logistics IT Help Desk runs the topic VPN won't connect on GPT Chat Latest, and GH-Grey Logistics IT Help Desk uses the skill vpn-wont-connect on Claude Sonnet 4.6. Ex 4 decides the harness for four requests: VPN drops every morning goes to Standard, Missing inventory items to GitHub Copilot, First-class rail policy to Copilot chat, and Where is my shipment to Customer Conversation. The result: no agent created, no Copilot Credits used. A dot carries the flow from one exercise to the next while each exercise lights up in turn.</desc>
