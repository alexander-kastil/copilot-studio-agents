<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">An app, a workflow, and an agent in one sales follow-up</title>
  <desc id="d">A sales rep uses the tracker app on a screen and asks the pricing agent in a conversation. When a request is marked Completed, the confirmation workflow sends a confirmation email. The app provides the interface, the workflow runs repeatable steps, and the agent handles questions, exceptions, and adaptation.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:36px;font-weight:600;fill:#24292f}
      .h2{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;fill:#24292f}
      .tag{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;font-weight:600;fill:#57606a;letter-spacing:1px}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;fill:#57606a}
      .box{stroke:#8c959f;stroke-width:2}
      .arrow{stroke:#57606a;stroke-width:3;fill:none}
    </style>
  </defs>

  <rect x="40" y="60" width="1840" height="960" rx="28" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="tag" x="90" y="125">One business process: sales follow-up</text>

  <rect class="box" x="80" y="470" width="320" height="150" rx="20" fill="#eaf2ff"/>
  <circle cx="145" cy="527" r="19" fill="#57606a"/>
  <path d="M113,582 A32,32 0 0 1 177,582 Z" fill="#57606a"/>
  <text class="h" x="200" y="558">Sales rep</text>

  <rect class="box" x="560" y="170" width="500" height="260" rx="22" fill="#f3edff"/>
  <text class="tag" x="600" y="225">APP</text>
  <text class="h" x="600" y="285">Tracker app</text>
  <text class="b" x="600" y="342">Provides the interface</text>

  <rect class="box" x="560" y="650" width="500" height="280" rx="22" fill="#eaf2ff"/>
  <text class="tag" x="600" y="705">AGENT</text>
  <text class="h" x="600" y="765">Pricing agent</text>
  <text class="b" x="600" y="822">Handles questions,</text>
  <text class="b" x="600" y="862">exceptions, and adaptation</text>

  <rect class="box" x="1320" y="170" width="500" height="260" rx="22" fill="#e9f7ef"/>
  <text class="tag" x="1360" y="225">WORKFLOW</text>
  <text class="h2" x="1360" y="285">Confirmation workflow</text>
  <text class="b" x="1360" y="342">Runs repeatable steps</text>

  <rect class="box" x="1350" y="650" width="440" height="170" rx="22" fill="#fff6e5" stroke="#e0a534"/>
  <rect x="1540" y="678" width="60" height="42" rx="4" fill="#ffffff" stroke="#57606a" stroke-width="3"/>
  <path d="M1540,680 L1570,703 L1600,680" fill="none" stroke="#57606a" stroke-width="3"/>
  <text class="h2" x="1570" y="775" text-anchor="middle">Confirmation email</text>

  <path class="arrow" d="M240,470 V300 H556" marker-end="url(#ah)"/>
  <text class="b" x="398" y="280" text-anchor="middle">A screen</text>
  <path class="arrow" d="M240,620 V790 H556" marker-end="url(#ah)"/>
  <text class="b" x="398" y="835" text-anchor="middle">A conversation</text>

  <line class="arrow" x1="1060" y1="300" x2="1316" y2="300" marker-end="url(#ah)"/>
  <text class="b" x="1190" y="248" text-anchor="middle">Request marked</text>
  <text class="b" x="1190" y="284" text-anchor="middle">Completed</text>

  <line class="arrow" x1="1570" y1="430" x2="1570" y2="646" marker-end="url(#ah)"/>
  <text class="b" x="1595" y="550">Sends</text>
</svg>
