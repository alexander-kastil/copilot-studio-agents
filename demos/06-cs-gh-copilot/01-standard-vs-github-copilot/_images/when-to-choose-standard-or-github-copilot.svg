<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">When to choose a Standard or a GitHub Copilot agent</title>
  <desc id="d">Two columns of choice drivers. Choose a Standard agent for deterministic control, an exact auditable path, authored topics and branching logic, orchestration that is classic or generative, the broader mature feature set, or a feature GitHub Copilot agents lack. Choose a GitHub Copilot agent for a greenfield agent, reasoning over Microsoft 365 data, the simpler instructions-first model, access to Skills, and the enhanced orchestrator. In this module Standard agents are the primary production track and GitHub Copilot agents run as guided demos and labs.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="100" y="100" width="830" height="880" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="150" y="180" font-size="36" font-weight="700" fill="#24292f">Choose a Standard agent for</text>
  <g font-size="28" fill="#24292f">
    <rect x="140" y="220" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="262" r="9" fill="#57606a"/>
    <text x="208" y="272">Deterministic control</text>
    <rect x="140" y="324" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="366" r="9" fill="#57606a"/>
    <text x="208" y="376">An exact, auditable path</text>
    <rect x="140" y="428" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="470" r="9" fill="#57606a"/>
    <text x="208" y="480">Authored topics and branching logic</text>
    <rect x="140" y="532" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="574" r="9" fill="#57606a"/>
    <text x="208" y="584">Orchestration: classic or generative</text>
    <rect x="140" y="636" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="678" r="9" fill="#57606a"/>
    <text x="208" y="688">The broader, mature feature set</text>
    <rect x="140" y="740" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="178" cy="782" r="9" fill="#57606a"/>
    <text x="208" y="792">A feature GitHub Copilot agents lack</text>
  </g>
  <line x1="140" y1="870" x2="890" y2="870" stroke="#8c959f" stroke-width="2"/>
  <text x="150" y="928" font-size="28" fill="#57606a">Primary production track in this module</text>

  <rect x="990" y="100" width="830" height="880" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1040" y="180" font-size="36" font-weight="700" fill="#24292f">Choose a GitHub Copilot agent for</text>
  <g font-size="28" fill="#24292f">
    <rect x="1030" y="220" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1068" cy="262" r="9" fill="#57606a"/>
    <text x="1098" y="272">A greenfield agent</text>
    <rect x="1030" y="324" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1068" cy="366" r="9" fill="#57606a"/>
    <text x="1098" y="376">Reasoning over Microsoft 365 data</text>
    <rect x="1030" y="428" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1068" cy="470" r="9" fill="#57606a"/>
    <text x="1098" y="480">The simpler instructions-first model</text>
    <rect x="1030" y="532" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1068" cy="574" r="9" fill="#57606a"/>
    <text x="1098" y="584">Access to Skills</text>
    <rect x="1030" y="636" width="750" height="84" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1068" cy="678" r="9" fill="#57606a"/>
    <text x="1098" y="688">The enhanced orchestrator</text>
  </g>
  <line x1="1030" y1="870" x2="1780" y2="870" stroke="#8c959f" stroke-width="2"/>
  <text x="1040" y="928" font-size="28" fill="#57606a">Guided demos and labs in this module</text>
</svg>
