<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The four tabs of a GitHub Copilot agent in working order</title>
  <desc id="d">Four tabs from left to right in the order a maker works. Build: build it, author the agent with everything in one components panel; in Standard agents this was scattered areas. Preview: try it, talk to the agent and watch it apply what you configured; in Standard agents the Test pane. Evaluate: measure it, score the agent against a repeatable test set; GitHub Copilot agents add test-set scoring. Monitor: watch it, review real runs and activity after the fact; in Standard agents Analytics.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g transform="translate(0,45)">

  <g stroke-width="2">
    <rect x="70" y="110" width="400" height="550" rx="20" fill="#eaf2ff" stroke="#8c959f"/>
    <rect x="530" y="110" width="400" height="550" rx="20" fill="#e9f7ef" stroke="#8c959f"/>
    <rect x="990" y="110" width="400" height="550" rx="20" fill="#f3edff" stroke="#8c959f"/>
    <rect x="1450" y="110" width="400" height="550" rx="20" fill="#fff6e5" stroke="#e0a534"/>
  </g>

  <g fill="#ffffff" stroke-width="2">
    <circle cx="270" cy="190" r="38" stroke="#8c959f"/>
    <circle cx="730" cy="190" r="38" stroke="#8c959f"/>
    <circle cx="1190" cy="190" r="38" stroke="#8c959f"/>
    <circle cx="1650" cy="190" r="38" stroke="#e0a534"/>
  </g>
  <g font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="270" y="203">1</text>
    <text x="730" y="203">2</text>
    <text x="1190" y="203">3</text>
    <text x="1650" y="203">4</text>
  </g>

  <g font-size="58" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="270" y="300">Build</text>
    <text x="730" y="300">Preview</text>
    <text x="1190" y="300">Evaluate</text>
    <text x="1650" y="300">Monitor</text>
  </g>
  <g font-size="36" fill="#57606a" text-anchor="middle">
    <text x="270" y="365">build it</text>
    <text x="730" y="365">try it</text>
    <text x="1190" y="365">measure it</text>
    <text x="1650" y="365">watch it</text>
  </g>

  <g stroke="#8c959f" stroke-width="2">
    <line x1="110" y1="410" x2="430" y2="410"/>
    <line x1="570" y1="410" x2="890" y2="410"/>
    <line x1="1030" y1="410" x2="1350" y2="410"/>
    <line x1="1490" y1="410" x2="1810" y2="410" stroke="#e0a534"/>
  </g>

  <g font-size="30" fill="#24292f" text-anchor="middle">
    <text x="270" y="475">Author the agent:</text>
    <text x="270" y="520">everything in one</text>
    <text x="270" y="565">components panel</text>
    <text x="730" y="475">Talk to the agent</text>
    <text x="730" y="520">and watch it apply</text>
    <text x="730" y="565">what you configured</text>
    <text x="1190" y="475">Score the agent</text>
    <text x="1190" y="520">against a repeatable</text>
    <text x="1190" y="565">test set</text>
    <text x="1650" y="475">Review real runs</text>
    <text x="1650" y="520">and activity after</text>
    <text x="1650" y="565">the fact</text>
  </g>

  <g stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
    <line x1="478" y1="385" x2="522" y2="385"/>
    <line x1="938" y1="385" x2="982" y2="385"/>
    <line x1="1398" y1="385" x2="1442" y2="385"/>
  </g>

  <g stroke="#8c959f" stroke-width="2" stroke-dasharray="6 6">
    <line x1="270" y1="660" x2="270" y2="710"/>
    <line x1="730" y1="660" x2="730" y2="710"/>
    <line x1="1190" y1="660" x2="1190" y2="710"/>
    <line x1="1650" y1="660" x2="1650" y2="710"/>
  </g>
  <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <rect x="70" y="710" width="400" height="180" rx="16"/>
    <rect x="530" y="710" width="400" height="180" rx="16"/>
    <rect x="990" y="710" width="400" height="180" rx="16"/>
    <rect x="1450" y="710" width="400" height="180" rx="16"/>
  </g>
  <g font-size="28" fill="#57606a" text-anchor="middle">
    <text x="270" y="780">In Standard agents</text>
    <text x="730" y="780">In Standard agents</text>
    <text x="1190" y="780">GitHub Copilot adds</text>
    <text x="1650" y="780">In Standard agents</text>
  </g>
  <g font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="270" y="835">scattered areas</text>
    <text x="730" y="835">Test pane</text>
    <text x="1190" y="835">test-set scoring</text>
    <text x="1650" y="835">Analytics</text>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="6">
    <rect x="60" y="100" width="420" height="570" rx="26" opacity="0">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="520" y="100" width="420" height="570" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.25;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="980" y="100" width="420" height="570" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="1440" y="100" width="420" height="570" rx="26" opacity="0">
      <animate attributeName="opacity" values="0;1" keyTimes="0;0.75" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  </g>
</svg>
