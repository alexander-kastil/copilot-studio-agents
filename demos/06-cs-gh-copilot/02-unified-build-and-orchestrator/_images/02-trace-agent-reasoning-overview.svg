<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Reading the Northwind Sales Assistant's plan in Preview, in History and after a reason instruction</title>
  <desc id="d">Left, the knowledge of the Northwind Sales Assistant: Search all websites, northwind-accounts with orders and support cases, and the product reference with lead times, both Ready. Center, the Preview tab with Debug mode on: the question For Around the Horn, what did they order last quarter, do they have any open support cases, and what is their standard lead time? opens a step list, Reasoned through your request, with Used tool: Searched knowledge for orders and support cases from northwind-accounts, Used tool: Searched knowledge for the lead time from the product reference, and Used skill: analyzing-markdown. The answer names Organic Green Tea with 1 case backordered, no open support cases and the Tier 2 lead time, citing both sources by number. Right, History shows the same turn after the fact: the Activity panel lists the Searched knowledge steps, the citations and the credits. An added instruction line, reason step by step: account tier, then orders and cases, then summarize, produces a new plan, Ran 2 events in parallel, with one Searched knowledge per part of the question. The animation runs the plan step by step, then the review in History and the reasoned rerun.</desc>
