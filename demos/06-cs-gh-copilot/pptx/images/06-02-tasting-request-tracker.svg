<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Three messages and the Tasting Request Tracker they built</title>
  <desc id="d">Three numbered messages on the left, and the live preview of the Tasting Request Tracker on the right with the same numbers on the parts each message shaped. 1 Describe: customer name, product, requested date and status, a list, a summary by status and sample data built the tracker. 2 Refine 1: a priority field with the choices High, Medium and Low, High priority first, grouped the list into High priority with 3 requests, Medium priority with 4 and Low priority with 4. 3 Refine 2: the statuses New, Scheduled, Completed and Cancelled, with New and Scheduled counted as open, changed the summary to 8 open requests (New 3, Scheduled 5) and 3 closed (Completed 2, Cancelled 1).</desc>
