  <text x="140" y="472" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">2</text>
  <text x="192" y="473" font-size="36" font-weight="700" fill="#24292f">Refine 1</text>
  <text x="110" y="536" font-size="28" fill="#57606a">A priority field with the choices</text>
  <text x="110" y="578" font-size="28" fill="#57606a">High, Medium and Low,</text>
  <text x="110" y="620" font-size="28" fill="#57606a">High priority first</text>
  <rect x="80" y="670" width="620" height="310" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
