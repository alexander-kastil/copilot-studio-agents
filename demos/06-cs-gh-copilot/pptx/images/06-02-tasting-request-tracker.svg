  <text x="140" y="172" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">1</text>
  <text x="192" y="173" font-size="36" font-weight="700" fill="#24292f">Describe</text>
  <text x="110" y="236" font-size="28" fill="#57606a">Customer name, product, requested</text>
  <text x="110" y="278" font-size="28" fill="#57606a">date and status, a list, a summary</text>
  <text x="110" y="320" font-size="28" fill="#57606a">by status, sample data</text>
