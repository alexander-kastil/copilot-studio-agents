<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The describe, draft, and refine loop</title>
  <desc id="d">Describe the problem, review the draft in the live preview, then refine by conversation with one small change at a time. Review and refine repeat until the main scenarios work, and then you publish the latest tested version.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:32px;font-weight:600;fill:#24292f}
      .r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:600;fill:#57606a}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;fill:#57606a}
      .n{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;font-weight:700;fill:#ffffff}
      .box{stroke:#8c959f;stroke-width:2}
      .arrow{stroke:#57606a;stroke-width:3;fill:none}
      .hi{fill:none;stroke:#e0a534;stroke-width:7}
      .ha{fill:none;stroke:#e0a534;stroke-width:8}
    </style>
  </defs>

  <path class="arrow" d="M305,400 V285 H656" marker-end="url(#ah)"/>
  <line class="arrow" x1="800" y1="420" x2="800" y2="636" marker-end="url(#ah)"/>
  <line class="arrow" x1="1120" y1="640" x2="1120" y2="424" marker-end="url(#ah)"/>
  <path class="arrow" d="M1260,285 H1640 V396" marker-end="url(#ah)"/>
  <text class="b" x="1450" y="230" text-anchor="middle">When the main</text>
  <text class="b" x="1450" y="266" text-anchor="middle">scenarios work</text>
  <text class="r" x="960" y="542" text-anchor="middle">Repeat</text>

  <path class="ha" d="M305,400 V285 H640" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.0833;0.125" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </path>
  <path class="ha" d="M800,420 V620" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.2083;0.25;0.4583;0.5" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </path>
  <path class="ha" d="M1120,640 V440" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.3333;0.375;0.5833;0.625" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </path>
  <path class="ha" d="M1260,285 H1640 V380" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7083;0.75" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </path>

  <rect class="box" x="70" y="400" width="470" height="280" rx="22" fill="#eaf2ff"/>
  <text class="h" x="110" y="482">Describe the problem</text>
  <text class="b" x="110" y="537">Name the outcome, people,</text>
  <text class="b" x="110" y="577">data, and actions</text>
  <text class="b" x="110" y="632">Answer follow-up questions</text>

  <rect class="box" x="660" y="150" width="600" height="270" rx="22" fill="#e9f7ef"/>
  <text class="h" x="700" y="232">Review the draft</text>
  <text class="b" x="700" y="287">Test the main scenario in</text>
  <text class="b" x="700" y="327">the live preview</text>

  <rect class="box" x="660" y="640" width="600" height="300" rx="22" fill="#f3edff"/>
  <text class="h" x="700" y="722">Refine by conversation</text>
  <text class="b" x="700" y="777">Describe one small change</text>
  <text class="b" x="700" y="817">Add a file, a screenshot,</text>
  <text class="b" x="700" y="857">or annotate the canvas</text>

  <rect class="box" x="1420" y="400" width="440" height="280" rx="22" fill="#fff6e5" stroke="#e0a534"/>
  <text class="h" x="1460" y="482">Publish</text>
  <text class="b" x="1460" y="537">Release the latest</text>
  <text class="b" x="1460" y="577">tested version</text>

  <rect class="hi" x="64" y="394" width="482" height="292" rx="26" opacity="1">
    <animate attributeName="opacity" values="1;0" keyTimes="0;0.0833" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="654" y="144" width="612" height="282" rx="26" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0;1;0" keyTimes="0;0.125;0.2083;0.375;0.4583;0.625;0.7083" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="654" y="634" width="612" height="312" rx="26" opacity="0">
    <animate attributeName="opacity" values="0;1;0;1;0" keyTimes="0;0.25;0.3333;0.5;0.5833" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect class="hi" x="1414" y="394" width="452" height="292" rx="26" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.75;0.875" calcMode="discrete" dur="12s" repeatCount="indefinite"/>
  </rect>
  <circle cx="130" cy="400" r="30" fill="#24292f"/>
  <text class="n" x="130" y="411" text-anchor="middle">1</text>
  <circle cx="720" cy="150" r="30" fill="#24292f"/>
  <text class="n" x="720" y="161" text-anchor="middle">2</text>
  <circle cx="720" cy="640" r="30" fill="#24292f"/>
  <text class="n" x="720" y="651" text-anchor="middle">3</text>
  <circle cx="1480" cy="400" r="30" fill="#24292f"/>
  <text class="n" x="1480" y="411" text-anchor="middle">4</text>
</svg>
