<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The seven topics of module 6 in four groups</title>
  <desc id="d">Topics 1 and 2 cover the two kinds of agent: Standard vs. GitHub Copilot Agents, then the unified Build surface and the new orchestrator. Topics 3 to 5 sit on the Build tab: Agent Skills, then Tools, MCP and the new Workflows designer, then grounding with Work IQ, Foundry IQ and Fabric IQ. Topic 6, Building Apps in Copilot Studio, sits beside agents. Topic 7, Test and Evaluate Copilot Studio Agents, comes before an agent ships. Arrows lead from one group to the next.</desc>
