<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Aurora Account Assistant reads your Outlook mailbox through Work IQ (Preview)</title>
  <desc id="d">Left, the Add a tool dialog on the MCP tab: Work IQ (Preview), an MCP server with 12 tools such as Retrieve, Fetch and Ask, is picked, and the toast reads Work IQ (Preview) added; the workload tools Mail, Teams, OneDrive and SharePoint belong to a legacy experience and are not picked. Work IQ (Preview) goes onto Aurora Account Assistant, a GitHub Copilot agent. The question What did the most recent customer email I received ask me to do, and by when? goes to the agent, which calls Work IQ with retrieve. On first use the consent prompt is answered with Allow. Work IQ sends the Email capability and its query to your Outlook mailbox for the signed-in account and gets the email thread back, and the agent pulls it in with fetch. The reply names the subject and deadline of a real email and ends with Sources: your Outlook mailbox (inbox and Sent Items). The animation adds the tool, then follows the question through retrieve and fetch to the reply.</desc>
