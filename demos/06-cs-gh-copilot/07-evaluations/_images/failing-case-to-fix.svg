<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">From a failing test case to the component to fix</title>
<desc id="d">A failing test case leads to the question what went wrong. Fact is wrong or missing leads to fix the knowledge source. Refused too little or too much leads to fix the instructions. Wrong tool, or no tool, leads to fix the tool description. Lost the thread across turns leads to fix the multi-turn conversation design. Every fix leads to re-run the same test set.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

<rect x="760" y="50" width="400" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="960" y="102" font-size="30" text-anchor="middle">Failing</text>
<text class="h" x="960" y="140" font-size="30" text-anchor="middle">test case</text>
<path d="M960,170 V199" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<polygon points="960,205 1150,300 960,395 770,300" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="960" y="292" font-size="30" text-anchor="middle">What went</text>
<text class="h" x="960" y="330" font-size="30" text-anchor="middle">wrong?</text>

<g fill="none" stroke="#57606a" stroke-width="3">
<path d="M960,395 V430"/>
<path d="M255,430 H1665"/>
<path d="M255,430 V470 M725,430 V470 M1195,430 V470 M1665,430 V470"/>
<path d="M255,760 V800 M725,760 V800 M1195,760 V800 M1665,760 V800"/>
<path d="M255,800 H1665"/>
</g>

<g fill="#ffffff" stroke="#8c959f" stroke-width="2">
<rect x="75" y="470" width="360" height="110" rx="55"/>
<rect x="545" y="470" width="360" height="110" rx="55"/>
<rect x="1015" y="470" width="360" height="110" rx="55"/>
<rect x="1485" y="470" width="360" height="110" rx="55"/>
</g>
<g class="s" font-size="28" text-anchor="middle">
<text x="255" y="517">Fact is wrong</text>
<text x="255" y="553">or missing</text>
<text x="725" y="517">Refused too little</text>
<text x="725" y="553">or too much</text>
<text x="1195" y="517">Wrong tool,</text>
<text x="1195" y="553">or no tool</text>
<text x="1665" y="517">Lost the thread</text>
<text x="1665" y="553">across turns</text>
</g>

<g fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
<path d="M255,580 V634"/>
<path d="M725,580 V634"/>
<path d="M1195,580 V634"/>
<path d="M1665,580 V634"/>
<path d="M960,800 V864"/>
</g>

<g fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
<rect x="55" y="640" width="400" height="120" rx="18"/>
<rect x="525" y="640" width="400" height="120" rx="18"/>
<rect x="995" y="640" width="400" height="120" rx="18"/>
<rect x="1465" y="640" width="400" height="120" rx="18"/>
</g>
<g class="h" font-size="30" text-anchor="middle">
<text x="255" y="692">Fix the</text>
<text x="255" y="730">knowledge source</text>
<text x="725" y="692">Fix the</text>
<text x="725" y="730">instructions</text>
<text x="1195" y="692">Fix the tool</text>
<text x="1195" y="730">description</text>
<text x="1665" y="692">Fix the multi-turn</text>
<text x="1665" y="730">conversation design</text>
</g>

<rect x="760" y="870" width="400" height="120" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="960" y="922" font-size="30" text-anchor="middle">Re-run the</text>
<text class="h" x="960" y="960" font-size="30" text-anchor="middle">same test set</text>
</svg>
