<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">The orchestrator matches the question against the Server description</title>
<desc id="d">A Preview question about open support cases for North region accounts and the Dataverse MCP server description both reach the orchestrator. The words they share, accounts and support cases, decide the route: the orchestrator calls the Dataverse MCP server, and the live records come back as the Preview answer.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#57606a"/></marker></defs>
<rect x="100" y="120" width="580" height="330" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="140" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="start">Preview question</text>
<text x="140" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">Which <tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">open support cases<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan></text>
<text x="140" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">do we have for <tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">accounts<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan></text>
<text x="140" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">in the North region?</text>
<rect x="1240" y="120" width="580" height="440" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="1280" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="start">Server description</text>
<text x="1280" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="start">Dataverse MCP server</text>
<text x="1280" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">Look up Northwind <tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">account,<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan></text>
<text x="1280" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">order, and <tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">support case<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan></text>
<text x="1280" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve"><tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">records<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan> in Dataverse. Use</text>
<text x="1280" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">when a seller asks about a</text>
<text x="1280" y="466" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">specific account's records,</text>
<text x="1280" y="510" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" text-anchor="start" xml:space="preserve">orders, or <tspan font-weight="700" fill="#8a5a00" stroke="#e0a534" stroke-width="0">open cases<animate attributeName="stroke-width" values="0;0;1.6;1.6;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></tspan>.</text>
<rect x="800" y="230" width="320" height="220" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Orchestrator</text>
<text x="960" y="365" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">reads both</text>
<text x="960" y="403" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">at runtime</text>
<line x1="680" y1="340" x2="796" y2="340" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="1240" y1="340" x2="1124" y2="340" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="960" y1="450" x2="960" y2="686" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="980" y="580" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f" text-anchor="start">calls the server</text>
<rect x="740" y="690" width="440" height="200" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="775" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Dataverse MCP server</text>
<text x="960" y="825" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">live records</text>
<rect x="100" y="690" width="560" height="200" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="380" y="765" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Preview answer</text>
<text x="380" y="815" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">open cases for North</text>
<text x="380" y="855" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">region accounts</text>
<line x1="740" y1="790" x2="664" y2="790" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<circle r="14" cx="0" cy="0" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0328;0.0333;0.1444;0.1449;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M680,340 L800,340" keyPoints="0;0;1;1" keyTimes="0;0.0333;0.1444;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
<circle r="14" cx="0" cy="0" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1439;0.1444;0.2556;0.2561;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M1240,340 L1120,340" keyPoints="0;0;1;1" keyTimes="0;0.1444;0.2556;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
<rect x="790" y="220" width="340" height="240" rx="20" fill="none" stroke="#e0a534" stroke-width="8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2556;0.2933;0.4067;0.4444;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<circle r="14" cx="0" cy="0" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4439;0.4444;0.5778;0.5783;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M960,450 L960,690" keyPoints="0;0;1;1" keyTimes="0;0.4444;0.5778;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
<rect x="730" y="680" width="460" height="220" rx="20" fill="none" stroke="#e0a534" stroke-width="8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5778;0.5956;0.6489;0.6667;1.0000" dur="9s" repeatCount="indefinite"/></rect>
<circle r="14" cx="0" cy="0" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6662;0.6667;0.7556;0.7561;1" dur="9s" repeatCount="indefinite"/><animateMotion path="M740,790 L660,790" keyPoints="0;0;1;1" keyTimes="0;0.6667;0.7556;1" calcMode="linear" dur="9s" repeatCount="indefinite"/></circle>
<rect x="90" y="680" width="580" height="220" rx="20" fill="none" stroke="#e0a534" stroke-width="8" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7556;0.7911;0.8978;0.9333;1.0000" dur="9s" repeatCount="indefinite"/></rect>
