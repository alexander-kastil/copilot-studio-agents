<text x="460" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#24292f" text-anchor="middle">MCP server</text>
<text x="460" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">maintained once</text>
