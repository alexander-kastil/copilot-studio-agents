<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">One MCP server keeps every connected agent current</title>
<desc id="d">An MCP server is maintained once. A new tool or an updated one on the server reaches every connected agent over the Streamable transport, so no agent needs a republish. The animation shows the change travelling from the server to each agent.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#57606a"/></marker></defs>
