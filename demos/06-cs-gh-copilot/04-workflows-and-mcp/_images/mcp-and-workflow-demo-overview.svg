<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">What the demo builds: live Dataverse data and a follow-up workflow</title>
<desc id="d">Exercise 1 attaches the Dataverse MCP server to the Northwind Sales Assistant, and Exercise 2 asks a live-data question in Preview. Exercises 3 and 4 build a workflow from a trigger that takes the account name, through an agent node that calls the same assistant, to a final node that returns the drafted follow-up. Exercise 5 tests it node by node and saves a version.</desc>
