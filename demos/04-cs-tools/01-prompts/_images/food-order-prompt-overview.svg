  <text class="h" x="690" y="142">CS-Calculate food</text>
  <text class="h" x="690" y="186">to order</text>
  <text class="s" x="690" y="228">prompt tool, described as</text>
  <text class="bb" x="690" y="266">Calculate food to order</text>
  <rect x="690" y="290" width="440" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="mb" x="712" y="330">foodDemand</text>
  <text class="ms" x="712" y="370">JSON(Global.orderDemand)</text>
  <rect x="690" y="420" width="440" height="140" rx="12" fill="#fff6e5"/>
  <text class="m" x="712" y="464">orderQuantity =</text>
  <text class="m" x="712" y="504">demand + minStock - inStock</text>
  <text class="s" x="712" y="542">never below 0</text>
  <rect x="690" y="590" width="440" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="mb" x="712" y="630">foodStock</text>
  <text class="ms" x="712" y="670">JSON(Topic.foodStock)</text>
  <text class="s" x="690" y="752">returns only a JSON array</text>

  <rect x="1260" y="80" width="600" height="720" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="1290" y="140">CS-Food Stock Buddy</text>
  <text class="t" x="1290" y="184">Based on our current stock</text>
  <text class="t" x="1290" y="222">we have to order:</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
    <rect x="1290" y="244" width="540" height="114" rx="12"/>
    <rect x="1290" y="372" width="540" height="114" rx="12"/>
    <rect x="1290" y="500" width="540" height="114" rx="12"/>
  </g>
  <text class="bb" x="1316" y="286">Wiener Schnitzel</text>
  <text class="m" x="1316" y="334">40 + 6 - 30 =</text>
  <text class="big e" x="1800" y="336">16</text>
  <text class="bb" x="1316" y="414">Pizza Napoli</text>
  <text class="m" x="1316" y="462">30 + 6 - 28 =</text>
  <text class="big e" x="1800" y="464">8</text>
  <text class="bb" x="1316" y="542">Green Curry</text>
  <text class="m" x="1316" y="590">25 + 4 - 17 =</text>
  <text class="big e" x="1800" y="592">12</text>
  <text class="s" x="1290" y="680">inserted as</text>
  <text class="m" x="1290" y="720">Topic.orderQuantityJSON</text>

  <rect x="60" y="850" width="1800" height="190" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="90" y="875" width="730" height="140" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="112" y="930">Calculate food to order: we need 10 Pad Ka</text>
  <text class="b" x="112" y="970">Prao, we have 5 in stock and keep at least 2.</text>
  <rect x="900" y="875" width="500" height="140" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="bb" x="925" y="930">CS-Calculate food to order</text>
  <text class="s" x="925" y="972">inputs filled from the message</text>
  <rect x="1480" y="875" width="350" height="140" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="mb" x="1505" y="922">10 + 2 - 5 = 7</text>
  <text class="s" x="1505" y="962">or a question for</text>
  <text class="s" x="1505" y="998">the missing values</text>

  <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <rect x="84" y="420" width="92" height="40" rx="20"/>
    <rect x="684" y="60" width="92" height="40" rx="20"/>
    <rect x="786" y="60" width="92" height="40" rx="20"/>
    <rect x="564" y="282" width="92" height="40" rx="20"/>
    <rect x="564" y="582" width="92" height="40" rx="20"/>
    <rect x="1284" y="60" width="92" height="40" rx="20"/>
    <rect x="84" y="830" width="92" height="40" rx="20"/>
  </g>
  <text class="p c" x="130" y="449">Ex 3</text>
  <text class="p c" x="730" y="89">Ex 1</text>
  <text class="p c" x="832" y="89">Ex 2</text>
  <text class="p c" x="610" y="311">Ex 4</text>
  <text class="p c" x="610" y="611">Ex 4</text>
  <text class="p c" x="1330" y="89">Ex 5</text>
  <text class="p c" x="130" y="859">Ex 5</text>

  <g fill="#24292f">
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M560,340 H660" calcMode="linear" keyTimes="0;0.03;0.12;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.03;0.12" values="0;1;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M560,640 H660" calcMode="linear" keyTimes="0;0.03;0.12;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.03;0.12" values="0;1;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M1160,440 H1260" calcMode="linear" keyTimes="0;0.26;0.33;1" keyPoints="0;0;1;1"/>
