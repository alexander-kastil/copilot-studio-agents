<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Food Stock Buddy turns demand and stock into order quantities with a prompt</title>
  <desc id="d">Two inputs feed the prompt CS-Calculate food to order. Global.orderDemand from Submit Demand holds WienerSchnitzel 40, PizzaNapoli 30, GreenCurry 25 and six more dishes at 0. The Set sample stock node holds Topic.foodStock, nine rows with inStock and minStock, such as Wiener Schnitzel 30 and 6, Pizza Napoli 28 and 6, Green Curry 17 and 4. The topic passes JSON(Global.orderDemand) as foodDemand and JSON(Topic.foodStock) as foodStock. The prompt tool, described as Calculate food to order, applies orderQuantity = demand + minStock - inStock, never below 0, and returns only a JSON array. The agent answers Based on our current stock we have to order: Wiener Schnitzel 40 + 6 - 30 = 16, Pizza Napoli 30 + 6 - 28 = 8, Green Curry 25 + 4 - 17 = 12, inserted as Topic.orderQuantityJSON. Along the bottom, without the topic, the message Calculate food to order: we need 10 Pad Ka Prao, we have 5 in stock and keep at least 2 lets the orchestrator fill the tool inputs from the message, which gives 10 + 2 - 5 = 7, or ask a question for the missing values. Dots carry both inputs into the prompt and the result to the answer, where each dish lights up in turn.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      svg { font-size: 28px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; }
      .t { font-size: 30px; font-weight: 600; }
      .b { font-size: 28px; }
      .bb { font-size: 28px; font-weight: 700; }
      .s { font-size: 28px; fill: #57606a; }
      .m { font-family: Consolas, 'Courier New', monospace; font-size: 26px; }
      .ms { font-family: Consolas, 'Courier New', monospace; font-size: 26px; fill: #57606a; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .p { font-size: 26px; font-weight: 700; }
      .big { font-size: 46px; font-weight: 700; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="560" y1="340" x2="660" y2="340"/>
    <line x1="560" y1="640" x2="660" y2="640"/>
    <line x1="1160" y1="440" x2="1260" y2="440"/>
    <line x1="820" y1="945" x2="900" y2="945"/>
    <line x1="1400" y1="945" x2="1480" y2="945"/>
  </g>

  <rect x="60" y="80" width="500" height="300" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="mb" x="90" y="142">Global.orderDemand</text>
  <text class="s" x="90" y="184">from Submit Demand</text>
  <text class="m" x="90" y="238">WienerSchnitzel: 40</text>
  <text class="m" x="90" y="276">PizzaNapoli: 30</text>
  <text class="m" x="90" y="314">GreenCurry: 25</text>
  <text class="s" x="90" y="356">six more dishes at 0</text>

  <rect x="60" y="440" width="500" height="360" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="90" y="502">Set sample stock</text>
  <text class="mb" x="90" y="544">Topic.foodStock</text>
  <text class="p e" x="394" y="598">inStock</text>
  <text class="p e" x="536" y="598">minStock</text>
  <text class="b" x="90" y="644">Wiener Schnitzel</text>
  <text class="b e" x="394" y="644">30</text>
  <text class="b e" x="536" y="644">6</text>
  <text class="b" x="90" y="686">Pizza Napoli</text>
  <text class="b e" x="394" y="686">28</text>
  <text class="b e" x="536" y="686">6</text>
  <text class="b" x="90" y="728">Green Curry</text>
  <text class="b e" x="394" y="728">17</text>
  <text class="b e" x="536" y="728">4</text>
  <text class="s" x="90" y="772">and six more rows</text>

