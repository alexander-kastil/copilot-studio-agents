      <animateMotion dur="12s" repeatCount="indefinite" path="M1400,945 H1480" calcMode="linear" keyTimes="0;0.82;0.88;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.82;0.88" values="0;1;0"/>
    </circle>
