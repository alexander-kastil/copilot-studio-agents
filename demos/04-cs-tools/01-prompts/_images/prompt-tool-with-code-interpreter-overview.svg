<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Two prompt tools: triage in a fixed JSON shape, backlog figures from code interpreter</title>
  <desc id="d">Grey Logistics IT Help Desk sits in the middle and picks the right prompt from each tool's description. In the top lane, the request Triage this one: a new hire cannot sign in to Teams, the account was created yesterday goes to the Triage help desk ticket prompt from Exercises 1 to 3: a Prompt assistant draft with a Ticket text input, Output JSON and Temperature 0. It returns the same JSON shape with the keys category, priority, summary and nextStep, here an Access or Password category. In the bottom lane, the request Here is last week's ticket log. Which category takes longest to fix, and how many tickets were high priority?, with the CSV pasted below, goes to the Analyze ticket backlog prompt from Exercise 4, which has code interpreter turned on, a Ticket log input, and runs Python for exact counts and averages. Its table lists Hardware 2 tickets at 27.0 average hours, Network 3 at 5.0, Software 2 at 2.5 and Password 3 at 1.0, with an overall average of 7.7 hours and 3 tickets with priority High. A dot runs each request through the agent into its tool, and the Hardware row lights up at the end.</desc>
