<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Grey Logistics IT Help Desk logs tickets through the Log help desk ticket agent flow</title>
  <desc id="d">Exercise 4, test pane: the user writes "My laptop won't connect to the VPN, so I can't work at all today. Please log a ticket." The Grey Logistics IT Help Desk, a Standard agent, has Log help desk ticket on its Tools page (Exercise 3), decides on its own to call it and fills both inputs from the conversation. The agent flow Log help desk ticket (Exercises 1 and 2) runs four steps in a fixed order: 1, the When an agent calls the flow trigger with the inputs IssueSummary and RequesterEmail; 2, Run a prompt, which answers P1, P2, P3 or P4; 3, Send an email (V2) to RequesterEmail, which puts a confirmation with the ticket text and the priority in your inbox; 4, Respond to the agent with the output Priority. The agent replies Priority: P2, and the second request, "Also, could you order me a second monitor?", gets Priority: P4. The activity map shows the Log help desk ticket node with Priority returned as P2. A manual test run from the designer with the finance floor network outage returns P1 from Run a prompt. A dot travels from the message through the agent and the four flow steps and back to the reply.</desc>
