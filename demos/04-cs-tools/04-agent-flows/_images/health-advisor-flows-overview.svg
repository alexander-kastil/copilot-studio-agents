<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Health Advisor calls two agent flows from its topics: one classifies symptoms, one posts to Teams after a review</title>
  <desc id="d">At the top, CS-Health Advisor, a Standard agent on GPT Chat Latest (Exercise 1), reads two knowledge files with the status Ready: The Benefits of Intermittent Fasting.docx and Traveling with Health Issues.docx. First row: the Check Symptoms topic (Exercise 2) collects Age, Gender and UserSymptoms with question nodes and calls the agent flow CS-Summarize Patient Symptoms (Exercise 3), whose Run a prompt step runs CS-Classify Patient Symptoms and returns an Outcome. A Condition on Topic.Outcome (Exercise 4) splits the conversation: for 34, female the analysis ends with "Patient is cleared for light work and movement"; for 61, male the agent asks "Your condition looks serious. Did you take any drugs or medication?" Second row: the Post to teams topic (Exercise 6) takes SymptomsSummary as a topic input filled from the conversation and calls the agent flow CS-Post to teams (Exercise 5), which runs Respond to the agent first so the agent gets its answer at once, then Request for information titled Posting Control to a reviewer in Outlook, who selects Submit, then Post message in a chat or channel, posted as User in a channel. The Teams channel shows "A new post with content:" followed by the same advice. Dots travel along both rows; in the second row one dot returns to the topic right after Respond to the agent while another waits at the review step and then reaches Teams.</desc>
