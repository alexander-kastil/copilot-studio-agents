  <text class="tag" x="1083" y="159">Ex 5</text>
  <text class="m" x="1140" y="161">List the public holidays in Austria for 2027.</text>
  <text class="tc" x="960" y="302">Grey Logistics IT Help Desk</text>
  <text class="s" x="90" y="302">runs the topic at a fixed point</text>
  <text class="se" x="1830" y="302">fills the tool inputs from the user's words</text>
