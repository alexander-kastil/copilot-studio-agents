  <text class="s" x="1400" y="649">operation becomes the tool</text>
  <text class="tag" x="1775" y="600">Ex 3</text>
  <text class="num" x="1084" y="763">3</text>
  <text class="ts" x="1126" y="738">Dynamically fill with AI</text>
  <text class="cs" x="1132" y="787">year: 2027   countryCode: AT</text>
  <text class="tc" x="960" y="946">Nager.Date public holiday API, no key</text>
  <text class="csc" x="960" y="996">https://date.nager.at/api/v3/PublicHolidays/{year}/{countryCode}</text>

