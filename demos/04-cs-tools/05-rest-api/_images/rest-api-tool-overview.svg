<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Grey Logistics IT Help Desk reaches the Nager.Date holiday API from a topic and from a REST API tool</title>
  <desc id="d">At the top, two sets of questions. Left, Exercise 1: "Which public holidays do we have this year?", answered with the country AT. Right, Exercise 4: "Is 8 December 2026 a public holiday in Austria?" and Exercise 5: "List the public holidays in Austria for 2027." Both reach the Grey Logistics IT Help Desk, which runs the topic at a fixed point and fills the tool inputs from the user's words. Left path, the Public holidays topic: 1, a Question node saves CountryCode; 2, Send HTTP request with GET builds its URL with Text(Year(Today())), so it covers the current year only; 3, a Message node answers "20 holidays this year: 2026-01-01 New Year's Day; ...". Right path, the Get public holidays REST API tool (preview): 1, public-holidays.json, an OpenAPI 2.0 file (Exercise 2); 2, the REST API wizard turns the GetPublicHolidays operation into the tool (Exercise 3); 3, Dynamically fill with AI sets year: 2027 and countryCode: AT. Both paths end at the Nager.Date public holiday API, which needs no key, at https://date.nager.at/api/v3/PublicHolidays/{year}/{countryCode}. A dot travels down the topic path first, then down the tool path.</desc>
