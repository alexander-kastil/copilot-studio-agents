<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Food Stock Buddy reads and books live stock through three tools of the CS-Food Catalog connector</title>
  <desc id="d">Exercise 1: the OpenAPI 2.0 file cs-food-catalog.json, which describes seven operations on /Food, goes through the REST API tool wizard and becomes the CS-Food Catalog custom connector. Exercise 2: three operations become selected tools, CS-Gets all food from Gets all food, CS-Add food from Add food and CS-Update food stock quantity from Update food stock quantity, while UpdateFood, Search food by name, GetFoodByID and Delete food item stay out. Exercise 3: CS-Food Stock Buddy calls the three tools over the connection CS-Food Catalog. Exercise 4: the Calculate order quantity topic reads CS-Gets all food instead of Set sample stock. The connector calls food-catalog-api-dev, REST under /Food, seeded with nine dishes: Wiener Schnitzel 30 portions against a minimum of 6. Exercise 5: "We just received 12 portions of Schweinshaxe mit Kraut." takes two tool calls and raises its stock from 12 to 24, an amount of -2 takes Pad Ka Prao from 18 to 16, and CS-Add food adds Apfelstrudel with 15 portions. A dot travels from the agent through CS-Gets all food to the API, then through CS-Update food stock quantity to the Schweinshaxe mit Kraut row.</desc>
