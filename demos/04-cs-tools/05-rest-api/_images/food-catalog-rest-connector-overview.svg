  <text class="s" x="790" y="977">Delete food item</text>
  <text class="hc" x="290" y="470">CS-Food Stock Buddy</text>
  <text class="tag" x="143" y="545">Ex 4</text>
  <text class="ts" x="104" y="600">Calculate order quantity</text>
