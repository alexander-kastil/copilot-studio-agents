  <text class="xs" x="104" y="676">instead of Set sample stock</text>
  <text class="tag" x="143" y="789">Ex 5</text>
  <text class="xm" x="104" y="844">We just received 12 portions</text>
  <text class="xm" x="104" y="880">of Schweinshaxe mit Kraut.</text>
  <text class="s" x="104" y="928">two tool calls</text>
  <text class="s" x="104" y="966">for one sentence</text>
  <text class="hc" x="1630" y="168">food-catalog-api-dev</text>
  <text class="sc" x="1630" y="210">REST under /Food</text>
  <text class="sc" x="1630" y="248">seeded with nine dishes</text>
  <text class="s" x="1450" y="310">dish</text>
  <text class="cse" x="1810" y="310">inStock</text>
  <text class="m" x="1450" y="376">Wiener Schnitzel</text>
  <text class="s" x="1450" y="418">minimum 6</text>
  <text class="te" x="1810" y="418">30</text>
  <text class="m" x="1450" y="506">Schweinshaxe mit Kraut</text>
  <text class="s" x="1450" y="548">amount 12</text>
  <text class="te" x="1810" y="548">12 → 24</text>
  <text class="m" x="1450" y="636">Pad Ka Prao</text>
