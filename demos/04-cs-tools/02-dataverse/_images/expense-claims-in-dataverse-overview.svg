<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Travel Expense Refund saves each claim as a row through an agent flow</title>
  <desc id="d">Three columns map one claim from left to right. The Submit Refund Request topic of CS-Travel Expense Refund passes seven topic variables, Topic.claimID, Topic.email, Topic.destination, Topic.comment, Topic.amount, Topic.departureDateIso and Topic.returnDateIso, to the agent flow CS-Save Claim to Dataverse. Its trigger, When an agent calls the flow, has the inputs ClaimId, EMail, Destination and Comment as Text, Comment optional, Amount as Number, and Departure Date and Return Date as Text. Add a new row writes them into the CS-Travel Expense Claims table: Claim ID, Email Address alex@greylogistics.com, Destination Salzburg, Comment Customer workshop, two nights, Amount 318.40, Departure Date 10 November 2026 and Return Date 12 November 2026. Respond to the agent, with Asynchronous response off, hands back to the topic, which answers Thanks. Claim, claim ID, for Salzburg is saved: 318.4 from 2026-11-10T00:00:00Z to 2026-11-12T00:00:00Z. Dots carry each value across the three columns, then down to Respond to the agent and back to the confirmation.</desc>
