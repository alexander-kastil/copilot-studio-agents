<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The OfferRequests and OfferRequestDetails Dataverse tables</title>
  <desc id="d">Two Dataverse tables. OfferRequests has id (GUID, primary key), requestId (Text, primary name), supplierId (Whole Number), transportationCost (Currency) and timestamp (DateTime). OfferRequestDetails has productName (Text, primary name), basePrice and offeredPrice (Currency), requestedAmount, offeredAmount and deliveryDurationDays (Whole Number), isAvailable (Boolean) and offerId (Lookup). A one-to-many relationship runs from OfferRequests to OfferRequestDetails through the offerId lookup.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M430,665 L430,865 L1160,865" fill="none" stroke="#8c959f" stroke-width="3"/>
    <text x="450" y="720" font-size="30" font-weight="700" fill="#24292f">1</text>
    <text x="1060" y="845" font-size="30" font-weight="700" fill="#24292f">many</text>
    <text x="490" y="845" font-size="28" fill="#57606a">one-to-many through the <tspan font-family="Consolas, Menlo, monospace" fill="#24292f">offerId</tspan> lookup</text>

    <rect x="100" y="175" width="660" height="490" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M100,189 a14,14 0 0 1 14,-14 h632 a14,14 0 0 1 14,14 v76 h-660 z" fill="#eaf2ff"/>
    <rect x="102" y="265" width="656" height="80" fill="#fff6e5"/>
    <rect x="102" y="425" width="656" height="80" fill="#f6f8fa"/>
    <rect x="102" y="585" width="656" height="78" fill="#f6f8fa"/>
    <rect x="100" y="175" width="660" height="490" rx="14" fill="none" stroke="#8c959f" stroke-width="2"/>
    <line x1="100" y1="265" x2="760" y2="265" stroke="#8c959f" stroke-width="2"/>
    <text x="130" y="234" font-size="34" font-weight="700" fill="#24292f">OfferRequests</text>

    <rect x="1160" y="175" width="660" height="730" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M1160,189 a14,14 0 0 1 14,-14 h632 a14,14 0 0 1 14,14 v76 h-660 z" fill="#eaf2ff"/>
    <rect x="1162" y="265" width="656" height="80" fill="#f6f8fa"/>
    <rect x="1162" y="425" width="656" height="80" fill="#f6f8fa"/>
    <rect x="1162" y="585" width="656" height="80" fill="#f6f8fa"/>
    <rect x="1162" y="745" width="656" height="80" fill="#f6f8fa"/>
    <rect x="1162" y="825" width="656" height="78" fill="#fff6e5"/>
    <rect x="1160" y="175" width="660" height="730" rx="14" fill="none" stroke="#8c959f" stroke-width="2"/>
    <line x1="1160" y1="265" x2="1820" y2="265" stroke="#8c959f" stroke-width="2"/>
    <text x="1190" y="234" font-size="34" font-weight="700" fill="#24292f">OfferRequestDetails</text>

    <g font-family="Consolas, Menlo, monospace" font-size="29" fill="#24292f">
      <text x="130" y="316">id</text>
      <text x="130" y="396">requestId</text>
      <text x="130" y="476">supplierId</text>
      <text x="130" y="556">transportationCost</text>
      <text x="130" y="636">timestamp</text>
      <text x="1190" y="316">productName</text>
      <text x="1190" y="396">basePrice</text>
      <text x="1190" y="476">offeredPrice</text>
      <text x="1190" y="556">requestedAmount</text>
      <text x="1190" y="636">offeredAmount</text>
      <text x="1190" y="716">deliveryDurationDays</text>
      <text x="1190" y="796">isAvailable</text>
      <text x="1190" y="876">offerId</text>
    </g>
    <g font-size="28" fill="#57606a" text-anchor="end">
      <text x="730" y="316">GUID, primary key</text>
      <text x="730" y="396">Text, primary name</text>
      <text x="730" y="476">Whole Number</text>
      <text x="730" y="556">Currency</text>
      <text x="730" y="636">DateTime</text>
      <text x="1790" y="316">Text, primary name</text>
      <text x="1790" y="396">Currency</text>
      <text x="1790" y="476">Currency</text>
      <text x="1790" y="556">Whole Number</text>
      <text x="1790" y="636">Whole Number</text>
      <text x="1790" y="716">Whole Number</text>
      <text x="1790" y="796">Boolean</text>
      <text x="1790" y="876">Lookup</text>
    </g>
  </g>
</svg>
