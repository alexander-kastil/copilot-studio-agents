<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The help desk agent reads supplier offers from Dataverse and records a new one after you confirm</title>
  <desc id="d">Two Dataverse tables sit at the top. Offer Request Details lists productName, offeredPrice, deliveryDurationDays, isAvailable and offerId, and Exercise 3 adds the words users say: quoted price, lead time and can ship. Its rows are USB-C Dock 169.00, 5 days, Yes, OR-1001; 27-inch Monitor 229.00, 10 days, Yes, OR-1001; USB-C Dock 175.00, 3 days, Yes, OR-1002; Wireless Headset 89.00, 7 days, Yes, OR-1002; and 27-inch Monitor 239.00, 4 days, No, OR-1003. Offer Requests lists requestId, supplierId and transportationCost: OR-1001, 17, 120.00; OR-1002, 23, 0.00; OR-1003, 31, 85.50; and the new row OR-1004, 42, 60. Reading down on the left, Grey Logistics IT Help Desk answers from the knowledge source: Which supplier offered the cheapest USB-C dock, and how many days does delivery take? with OR-1001, supplier 17, 169.00, 5 delivery days, citing the Dataverse source, and Which offers for the 27-inch monitor can ship, and what is the quoted price and lead time? with OR-1001 at 229.00, 10-day lead time; OR-1003 cannot ship. Writing up on the right, the Record offer request tool on Microsoft Dataverse Add a new row takes Record a new offer OR-1004 from supplier 42 with a transportation cost of 60, asks the end user before running with OR-1004, supplier 42, 60 and a Confirm button, sets timestamp to Now(), and creates the row after you confirm. Highlights pair each answer with its rows, then a dot carries the confirmed offer up into the new row.</desc>
