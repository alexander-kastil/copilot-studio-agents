      <animateMotion dur="12s" repeatCount="indefinite" path="M520,280 H600" calcMode="linear" keyTimes="0;0.10;0.17;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.10;0.17" values="0;1;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M520,640 H600" calcMode="linear" keyTimes="0;0.10;0.17;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.10;0.17" values="0;1;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M1160,280 H1240" calcMode="linear" keyTimes="0;0.30;0.37;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.37" values="0;1;0"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="12s" repeatCount="indefinite" path="M1160,640 H1240" calcMode="linear" keyTimes="0;0.30;0.37;1" keyPoints="0;0;1;1"/>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.30;0.37" values="0;1;0"/>
    </circle>
  </g>

  <g fill="none" stroke="#24292f" stroke-width="5">
    <rect x="90" y="256" width="400" height="200" rx="16" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.02;0.10" values="0;1;0"/>
    </rect>
    <rect x="600" y="120" width="560" height="320" rx="16" opacity="0">
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.17;0.30" values="0;1;0"/>
