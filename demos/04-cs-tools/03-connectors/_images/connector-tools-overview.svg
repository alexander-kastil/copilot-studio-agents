  <text class="bb" x="1294" y="580">Sent Items</text>
  <text class="b" x="1294" y="626">the projector in meeting</text>
  <text class="b" x="1294" y="664">room 4 is fixed</text>
  <text class="s" x="1294" y="726">to the colleague, manager in copy</text>

