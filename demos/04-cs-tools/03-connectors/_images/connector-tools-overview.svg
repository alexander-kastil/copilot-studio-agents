<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">One request, three connector tools: the help desk agent finds a colleague, gets the manager and sends an email</title>
  <desc id="d">Grey Logistics IT Help Desk receives Let colleague name know the projector in meeting room 4 is fixed, and copy my manager. Its activity map shows one plan: Find a colleague and Get my manager before Send help desk email. Find a colleague, from Exercise 3, uses Office 365 Users Search for users (V2), with the Search term on Dynamically fill with AI, and asks if the name is missing. Get my manager, from Exercise 1, uses Office 365 Users Get manager (V2) with User (UPN) fixed to System.User.Email, so the user gets no question. Both feed Send help desk email, from Exercise 2, which uses Office 365 Outlook Send an email (V2) and has Ask the end user before running set to Yes: the confirmation shows both addresses, a subject and a body, and after Confirm the email appears in Sent Items, saying the projector in meeting room 4 is fixed. Exercise 5 packages Get my manager, Send help desk email and Find a colleague in the component collection Help Desk Notifications, one copy that several agents reference, and Grey Logistics IT Help Desk appears as a connected agent. Dots run from the request into both lookup tools, then into the email tool, where the confirmation pulses before the email is sent.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      svg { font-size: 28px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; }
      .t { font-size: 30px; font-weight: 600; }
      .b { font-size: 28px; }
      .bb { font-size: 28px; font-weight: 700; }
      .s { font-size: 28px; fill: #57606a; }
      .m { font-family: Consolas, 'Courier New', monospace; font-size: 26px; }
      .p { font-size: 26px; font-weight: 700; }
      .w { fill: #ffffff; }
      .c { text-anchor: middle; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="520" y1="280" x2="600" y2="280"/>
    <line x1="520" y1="640" x2="600" y2="640"/>
    <line x1="1160" y1="280" x2="1240" y2="280"/>
    <line x1="1160" y1="640" x2="1240" y2="640"/>
  </g>

  <rect x="60" y="120" width="460" height="680" rx="16" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="90" y="182">Grey Logistics</text>
  <text class="h" x="90" y="226">IT Help Desk</text>
  <rect x="90" y="256" width="400" height="200" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="112" y="302">Let &lt;colleague name&gt; know</text>
  <text class="b" x="112" y="342">the projector in meeting</text>
  <text class="b" x="112" y="382">room 4 is fixed, and copy</text>
  <text class="b" x="112" y="422">my manager.</text>
  <text class="bb" x="90" y="560">Activity map, one plan:</text>
  <text class="s" x="90" y="604">Find a colleague and</text>
  <text class="s" x="90" y="642">Get my manager before</text>
  <text class="s" x="90" y="680">Send help desk email</text>

  <rect x="600" y="120" width="560" height="320" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="630" y="182">Find a colleague</text>
  <text class="s" x="630" y="226">Office 365 Users</text>
  <text class="s" x="630" y="264">Search for users (V2)</text>
  <text class="bb" x="630" y="320">Search term:</text>
  <text class="s" x="630" y="358">Dynamically fill with AI</text>
  <text class="s" x="630" y="404">asks if the name is missing</text>

  <rect x="600" y="480" width="560" height="320" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
