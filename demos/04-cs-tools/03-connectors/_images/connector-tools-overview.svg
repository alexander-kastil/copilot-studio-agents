  <text class="b c" x="765" y="917">Get my manager</text>
  <text class="b c" x="1070" y="917">Send help desk email</text>
  <text class="b c" x="1385" y="917">Find a colleague</text>
  <text class="s" x="640" y="990">Grey Logistics IT Help Desk appears as a connected agent</text>

  <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <rect x="84" y="100" width="92" height="40" rx="20"/>
    <rect x="624" y="100" width="92" height="40" rx="20"/>
    <rect x="624" y="460" width="92" height="40" rx="20"/>
    <rect x="1264" y="100" width="92" height="40" rx="20"/>
    <rect x="84" y="830" width="92" height="40" rx="20"/>
  </g>
  <text class="p c" x="130" y="129">Ex 4</text>
  <text class="p c" x="670" y="129">Ex 3</text>
