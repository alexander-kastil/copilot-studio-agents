<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Travel Agent books a trip in chat and posts the summary to a Teams channel</title>
  <desc id="d">CS-Travel Agent, described as A travel agent, has Web Search and the Sightseeing site, Provides Travel Information, as knowledge. Its Book Trip topic asks three questions: What is the name of the place you want to visit?, answered Vienna; What date would you like to book your trip for?, answered May 12; and How many people will be going on this trip?, answered 2. It replies Thank you! Here is your trip summary with Sight, Date and Number of people filled from Topic.Sight, Topic.Date and Topic.NumberOfPax, naming Vienna, the date and 2 people. The user then sends Post my trip summary to the General channel, with the name of their own team. The first time, a Connect to continue card for Microsoft Teams asks for Allow. The tool CS-Post message in a chat or channel, on the Microsoft Teams connector, prepares messageBody with the trip summary and a recipient with groupId and channelId taken from the instructions; every input stays on Dynamically fill with AI and it runs with End user credentials. The post appears in the General channel of your team under your name. Highlights walk through the three answers and the summary, then dots carry the summary and the request into the tool and the post into the channel.</desc>
