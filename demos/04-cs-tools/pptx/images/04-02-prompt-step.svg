<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The prompt step inside CS-Summarize Patient Symptoms</title>
  <desc id="d">The flow's trigger receives age 34, gender female and the symptoms slight headache and a runny nose since yesterday. A Run a prompt step calls CS-Classify Patient Symptoms once, reading only its instructions and the three inputs, with no tools and no knowledge search. Respond to the agent returns the prompt's text response as Outcome, ending with Patient is cleared for light work and movement. The Check Symptoms topic stores the Outcome and asks a follow-up question only when the text lacks cleared for light work.</desc>
  <style>
    svg { font-size: 28px; }
    .h { font-weight: 700; fill: #24292f; }
    .s { font-weight: 600; fill: #24292f; }
    .m { fill: #57606a; }
    .c { font-family: Consolas, monospace; fill: #24292f; }
    .box { stroke: #8c959f; stroke-width: 2; }
    .rule { stroke: #d0d7de; stroke-width: 2; }
    .flow { fill: none; stroke: #57606a; stroke-width: 3; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g transform="translate(100,130)">
    <rect class="box" width="520" height="520" rx="20" fill="#eaf2ff"/>
    <text class="h" x="32" y="62" font-size="32">When an agent</text>
    <text class="h" x="32" y="102" font-size="32">calls the flow</text>
    <line class="rule" x1="32" y1="132" x2="488" y2="132"/>
    <text class="m" x="32" y="186">Number</text>
    <text class="c" x="32" y="226">Age: 34</text>
    <text class="m" x="32" y="286">Text</text>
    <text class="c" x="32" y="326">Gender: female</text>
    <text class="m" x="32" y="386">Text</text>
    <text class="c" x="32" y="426">Symptoms: slight headache</text>
    <text class="c" x="32" y="462">and a runny nose since</text>
    <text class="c" x="32" y="498">yesterday</text>
  </g>

  <g transform="translate(700,130)">
    <rect class="box" width="520" height="520" rx="20" fill="#f3edff"/>
    <text class="h" x="32" y="62" font-size="32">Run a prompt</text>
    <text class="s" x="32" y="102">CS-Classify Patient Symptoms</text>
    <line class="rule" x1="32" y1="132" x2="488" y2="132"/>
    <text class="m" x="32" y="196">one model call at a fixed step</text>
    <text class="m" x="32" y="266">reads only its instructions</text>
    <text class="m" x="32" y="304">and the three inputs</text>
    <text class="m" x="32" y="374">no tools and</text>
    <text class="m" x="32" y="412">no knowledge search</text>
  </g>

  <g transform="translate(1300,130)">
    <rect class="box" width="520" height="520" rx="20" fill="#e9f7ef"/>
    <text class="h" x="32" y="62" font-size="32">Respond to the agent</text>
    <text class="c" x="32" y="102">Outcome (Text)</text>
    <line class="rule" x1="32" y1="132" x2="488" y2="132"/>
    <text class="m" x="32" y="196">the prompt's text response,</text>
    <text class="m" x="32" y="234">ending with</text>
    <text class="s" x="32" y="304">Patient is cleared for</text>
    <text class="s" x="32" y="342">light work and movement.</text>
    <text class="m" x="32" y="412">wording around it varies</text>
    <text class="m" x="32" y="450">from run to run</text>
  </g>

  <line class="flow" x1="626" y1="390" x2="692" y2="390" marker-end="url(#ah)"/>
  <line class="flow" x1="1226" y1="390" x2="1292" y2="390" marker-end="url(#ah)"/>
  <line class="flow" x1="1560" y1="656" x2="1560" y2="752" marker-end="url(#ah)"/>

  <rect class="box" x="100" y="760" width="1720" height="190" rx="20" fill="#f6f8fa"/>
  <text class="h" x="140" y="826" font-size="32">Check Symptoms topic</text>
  <text class="m" x="140" y="876">stores the Outcome and asks a follow-up question only when it lacks</text>
  <text class="c" x="140" y="920">"cleared for light work"</text>
</svg>
