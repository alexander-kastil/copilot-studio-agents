<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Grey Logistics IT Help Desk reads one web app and fills another with computer use, fenced to one HTTPS site</title>
  <desc id="d">Left, the CS-Grey Logistics IT Help Desk agent. Exercise 4: the question "Who manages the Fourth Coffee portfolio, and what is it worth?" gets the reply "Fourth Coffee's portfolio is managed by Yhlas Geldiyew and is worth $190,000,000." Exercises 1 and 2: the computer use tool CS-Look up portfolio takes the input ClientName, runs on Claude Sonnet 4.5 and counts 4 actions, 20 Copilot Credits. Exercise 5: CS-Register inventory items fills five fields twice. Right, inside a dashed fence (Exercise 3): Only allow specific websites and desktop apps, computerusedemos.blob.core.windows.net as a Website with Enforce HTTPS, and Microsoft Edge as a Desktop app for the Hosted browser. Inside the fence, the Financial Portfolio Dashboard table with Client Name, Manager and Portfolio Value shows Fourth Coffee, Yhlas Geldiyew, $190,000,000 and Northwind Traders, Niklas Gasper, $95,000,000. Below it, the Product Inventory Update form with Product Name, Product ID, Quantity, Price and Supplier, and its Inventory Items list with Rear Derailleur, RD-4821, 50, 42.75, Tailspin Toys and Pedal Set, PD-1738, 80, 19.99, Northwind Traders. A dot goes from each tool into its web app; the Fourth Coffee row lights up, then each form field in turn.</desc>
