  <text class="csc" x="1005" y="716">assign_shift ×2</text>
  <text class="xsc" x="1005" y="754">date 2026-11-06, shiftStartHour 14</text>
  <text class="mc" x="1005" y="836">from 14:00 to 22:00</text>
  <text class="xmc" x="455" y="944">Send the schedule for 2026-11-06 by email</text>
  <text class="m" x="770" y="1009">Staff Schedule - November 6, 2026</text>

