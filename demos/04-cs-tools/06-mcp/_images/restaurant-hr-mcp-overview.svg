<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Restaurant HR Manager reads the team, books shifts after a confirmation and emails the schedule</title>
  <desc id="d">A sequence across four lifelines: Test your agent, CS-Restaurant HR Manager with its structured instructions (Exercise 1), CS-HR MCP Server with six tools (Exercises 2 and 3) and CS-Send an email on Office 365 Outlook (Exercise 6). Exercise 4: the message "We need a bartender and a waiter" makes the agent call list_employees or search_employees, and the server returns Sofia Fernandez and Luca Rossi. Exercise 5: "Put Sofia Fernandez on the bar and Luca Rossi on waiter duty" makes the agent ask you to confirm first; only after "Yes, book both shifts." does it call assign_shift twice with date 2026-11-06 and shiftStartHour 14, and the server answers from 14:00 to 22:00. Exercise 6: "Send the schedule for 2026-11-06 by email" makes the agent call CS-Send an email, which delivers Staff Schedule - November 6, 2026. A dot travels along each message in order and waits at the confirmation.</desc>
