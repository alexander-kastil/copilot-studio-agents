<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Grey Logistics IT Help Desk connects to the Microsoft Learn MCP Server twice and may call only two of its tools</title>
  <desc id="d">Left, three test questions. Exercise 2: "How do I set up a passkey in Microsoft Authenticator?" goes to the server and the reply cites learn.microsoft.com; "What should I bring to my first day at the help desk?" makes no call to the MCP server. Exercise 3: "Show me a C# code sample that reads a user's calendar with Microsoft Graph." makes no call to microsoft_code_sample_search. Middle, the Grey Logistics IT Help Desk, whose instruction routes Microsoft product questions to the server. It reaches the server through two connections: the Microsoft Learn Docs MCP Server from the catalog (Exercise 1) and Microsoft Learn (wizard), built from the Server URL only, with the tools discovered from the server (Exercise 4). Right, the Microsoft Learn MCP Server at learn.microsoft.com/api/mcp with Allow all switched off (Exercise 3): microsoft_docs_search on, microsoft_docs_fetch on, microsoft_code_sample_search off. With Allow all off, tools the server adds later stay off. A dot carries the passkey question through the catalog connection to microsoft_docs_search, then through the wizard connection to the same tool.</desc>
