    <text class="ts" x="1470" y="350">Allow all</text>
    <text class="tag" x="1783" y="348">Ex 3</text>
    <text class="xm" x="1470" y="460">microsoft_docs_search</text>
    <text class="xm" x="1470" y="560">microsoft_docs_fetch</text>
    <text class="xm" x="1470" y="660">microsoft_code_sample_search</text>
    <text class="s" x="1374" y="760">With Allow all off, tools the</text>
    <text class="s" x="1374" y="798">server adds later stay off</text>

