<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Request software: one Adaptive Card collects three values for the Grey Logistics IT Help Desk</title>
  <desc id="d">In the test panel of Grey Logistics IT Help Desk the user sends I need to request software. The Request software topic runs its Ask with Adaptive Card node, which shows one card: a heading written in Power Fx that reads Hi, display name, which software do you need, a Software dropdown set to Microsoft Visio, a Needed by date field, a Business justification box and a Submit request button. Submitting the card returns three outputs, software, neededBy and justification, and a message repeats them: Thanks. Your request for software, needed by neededBy, is recorded with this justification. Three cases run along the bottom: submitting with the date empty shows Pick the date you need the software and sends nothing; replying asdf brings back the retry prompt Please use the form above and select Submit request, or type cancel to stop; asking How do I fix a OneDrive sync error lets another topic or knowledge answer, then the card is sent again. A dot travels from the message to the card, then from Submit request to the outputs and the message.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <style>
      svg { font-size: 28px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; }
      .t { font-size: 30px; font-weight: 600; }
      .b { font-size: 28px; }
      .bb { font-size: 28px; font-weight: 700; }
      .s { font-size: 28px; fill: #57606a; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .p { font-size: 26px; font-weight: 700; }
      .w { fill: #ffffff; }
      .c { text-anchor: middle; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
