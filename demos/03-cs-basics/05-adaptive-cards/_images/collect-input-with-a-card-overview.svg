    <rect x="1286" y="830" width="574" height="210" rx="16"/>
  </g>
  <text class="t" x="90" y="890">Submit with the date empty</text>
  <text class="b" x="90" y="938">Pick the date you need</text>
  <text class="b" x="90" y="976">the software.</text>
  <text class="s" x="90" y="1014">The card sends nothing.</text>
  <text class="t" x="703" y="890">Reply <tspan class="mb">asdf</tspan>, get the retry prompt</text>
  <text class="b" x="703" y="938">Please use the form above and</text>
  <text class="b" x="703" y="976">select Submit request, or type</text>
  <text class="b" x="703" y="1014">"cancel" to stop.</text>
  <text class="t" x="1316" y="890">How do I fix a OneDrive</text>
