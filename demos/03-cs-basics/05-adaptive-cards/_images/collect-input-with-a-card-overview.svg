    <rect x="84" y="810" width="92" height="40" rx="20"/>
    <rect x="697" y="810" width="92" height="40" rx="20"/>
    <rect x="1310" y="810" width="92" height="40" rx="20"/>
  </g>
  <text class="p c" x="130" y="119">Ex 3</text>
  <text class="p c" x="670" y="119">Ex 1</text>
  <text class="p c" x="837" y="119">Ex 4 Power Fx</text>
  <text class="p c" x="1370" y="119">Ex 2</text>
  <text class="p c" x="1370" y="459">Ex 3</text>
  <text class="p c" x="130" y="839">Ex 3</text>
  <text class="p c" x="743" y="839">Ex 5</text>
  <text class="p c" x="1356" y="839">Ex 5</text>

