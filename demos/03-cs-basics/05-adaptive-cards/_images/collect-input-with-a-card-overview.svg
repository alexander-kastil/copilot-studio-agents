  <text class="s" x="90" y="650">Node</text>
  <text class="bb" x="90" y="695">Ask with Adaptive Card</text>

  <rect x="600" y="110" width="600" height="670" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="624" y="138" width="552" height="114" rx="10" fill="#fff6e5"/>
