<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Food Stock Buddy: nine dishes on one card become a global demand record</title>
  <desc id="d">CS-Food Stock Buddy runs the Submit Demand topic. Its Adaptive Card, Please enter your demand, has the header row Enter required quantity and Quantity and nine dish rows with a number field: Wiener Schnitzel 40, Kaiserschmarrn 0, Germknödel 0, Weisswurst mit Brezn 0, Schweinshaxe mit Kraut 0, Pizza Napoli 30, Arancini Napoletana 0, Pad Ka Prao 0 and Green Curry 25, then a Submit Demand button. Each row leaves the card as one of nine outputs of type Number, bound to topic variables such as Topic.qtyWienerSchnitzel. All nine go into Global.orderDemand, a global variable any topic can access, which holds WienerSchnitzel 40, PizzaNapoli 30, GreenCurry 25 and six more dishes at 0 for the order calculation that follows. Topic.orderDemandClean keeps only rows with Quantity above 0 as compact JSON, so the agent answers Your demand was successfully noted with exactly three entries: WienerSchnitzel 40, PizzaNapoli 30 and GreenCurry 25. Dots travel from the nine rows into the outputs, then to the global record and through the filter to the confirmation.</desc>
