    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="476" y1="290" x2="516" y2="290"/>
      <line x1="938" y1="290" x2="978" y2="290"/>
      <line x1="1400" y1="290" x2="1440" y2="290"/>
      <line x1="1652" y1="764" x2="1652" y2="842"/>
    </g>

    <rect x="60" y="850" width="1798" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="100" y="912" font-size="30" font-weight="700" fill="#24292f">Next, module 04: Publishing, Maintaining &amp; Governing</text>
    <text x="100" y="962" font-size="28" fill="#57606a">Publishing, ALM and governance for the agents you build here</text>
