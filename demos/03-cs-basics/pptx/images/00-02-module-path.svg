<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Path through the Copilot Studio module</title>
  <desc id="d">Four numbered topic cards in delivery order. Topics 1 to 3 (Basics, Tools, Advanced) build Standard agents; topic 4 covers GitHub Copilot agents, which shipped in June 2026. An arrow from topic 4 leads to module 04, which covers publishing, ALM and governance for the agents built here.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="728" y="140" font-size="28" fill="#57606a" text-anchor="middle">Standard agents</text>
    <path d="M60,190 L60,172 L1396,172 L1396,190" fill="none" stroke="#8c959f" stroke-width="2"/>
    <text x="1652" y="140" font-size="28" fill="#57606a" text-anchor="middle">GitHub Copilot agents</text>
    <path d="M1446,190 L1446,172 L1858,172 L1858,190" fill="none" stroke="#8c959f" stroke-width="2"/>

    <rect x="60" y="220" width="412" height="540" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="124" cy="290" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="124" y="301" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">1</text>
    <text x="90" y="384" font-size="34" font-weight="700" fill="#24292f">Copilot Studio</text>
    <text x="90" y="426" font-size="34" font-weight="700" fill="#24292f">Basics</text>
    <g font-size="28" fill="#57606a">
      <text x="90" y="494">Environments</text>
      <text x="90" y="540">Agents and knowledge</text>
      <text x="90" y="586">Topics and Power Fx</text>
      <text x="90" y="632">Conversation design</text>
      <text x="90" y="678">Publish to channels</text>
    </g>

    <rect x="522" y="220" width="412" height="540" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="586" cy="290" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="586" y="301" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">2</text>
    <text x="552" y="384" font-size="34" font-weight="700" fill="#24292f">Extending Agents</text>
    <text x="552" y="426" font-size="34" font-weight="700" fill="#24292f">with Tools</text>
    <g font-size="28" fill="#57606a">
      <text x="552" y="494">Prompt actions</text>
      <text x="552" y="540">Connectors, Dataverse</text>
      <text x="552" y="586">AI Builder</text>
      <text x="552" y="632">MCP and REST APIs</text>
      <text x="552" y="678">Computer Use</text>
    </g>

    <rect x="984" y="220" width="412" height="540" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1048" cy="290" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1048" y="301" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">3</text>
    <text x="1014" y="384" font-size="34" font-weight="700" fill="#24292f">Advanced Copilot</text>
    <text x="1014" y="426" font-size="34" font-weight="700" fill="#24292f">Studio Agents</text>
    <g font-size="28" fill="#57606a">
      <text x="1014" y="494">Generative orchestration</text>
      <text x="1014" y="540">Autonomous agents</text>
      <text x="1014" y="586">Multi-agent</text>
      <text x="1014" y="632">Deep reasoning</text>
      <text x="1014" y="678">Agent Flows and voice</text>
    </g>

    <rect x="1446" y="220" width="412" height="540" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1510" cy="290" r="34" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1510" y="301" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">4</text>
    <text x="1476" y="384" font-size="34" font-weight="700" fill="#24292f">GitHub Copilot</text>
    <text x="1476" y="426" font-size="34" font-weight="700" fill="#24292f">Agents</text>
    <g font-size="28" fill="#57606a">
      <text x="1476" y="494">Unified Build surface</text>
      <text x="1476" y="540">Testing and evaluation</text>
      <text x="1476" y="586">Agent Skills, SKILL.md</text>
      <text x="1476" y="632">Workflows and MCP</text>
      <text x="1476" y="678">IQ grounding, apps</text>
