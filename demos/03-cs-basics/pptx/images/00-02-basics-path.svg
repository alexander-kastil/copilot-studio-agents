    <rect x="1346" y="890" width="488" height="48" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1590" y="923" font-size="26" font-weight="600" fill="#24292f" text-anchor="middle">CS-HR Buddy</text>
