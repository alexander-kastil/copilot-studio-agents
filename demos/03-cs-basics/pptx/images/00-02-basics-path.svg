<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The six topics of Copilot Studio Basics and the agent each demo builds</title>
  <desc id="d">Six numbered topic cards in delivery order, three per row, joined by arrows. 1 Standard Agents: Create and Configure, identity, structured instructions, model and orchestration, on CS-Employee Onboarding Assistant. 2 Knowledge Sources and Suggested Prompts, HR Documents and Sightseeing SharePoint sites with citations, on the same agent. 3 Topics, Entities and Variables, Collect Employee Data and a global variable, on CS-HR Buddy. 4 Power Fx: Formulas in Topics, a claim ID and two ISO dates from three formulas, on CS-Travel Expense Refund. 5 Adaptive Cards: Collect Structured Input, nine dishes on one card kept in Global.orderDemand, on CS-Food Stock Buddy. 6 Publishing to Teams and Copilot, Teams and Microsoft 365 Copilot, shared with a pilot group, on CS-HR Buddy.</desc>
