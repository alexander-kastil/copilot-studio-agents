<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">What the HR Agent is made of and what it reaches</title>
  <desc id="d">The HR Agent built in labs 01 to 03. The agent (model GPT-4.1, Default) has four parts: Instructions on HR policies, career growth and learning pathways; Knowledge from a public website and a SharePoint site; Topics Collect user's role, Register a new candidate and Register new candidate with adaptive cards; Settings with generative AI orchestration. It lives in the Power Platform environment Copilot Dev Camp. Knowledge points to the Microsoft Careers site and to HR Documents in SharePoint, which answers only from documents the user has access to. Publishing to the Teams plus Microsoft 365 channel brings the agent to Microsoft Teams. Each part is tagged with the lab that adds it.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M90,240 L90,732 M90,324 L120,324 M90,460 L120,460 M90,596 L120,596 M90,732 L120,732" fill="none" stroke="#8c959f" stroke-width="2"/>

    <rect x="60" y="120" width="1120" height="120" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="100" y="193" font-size="36" font-weight="700" fill="#24292f">HR Agent</text>
    <text x="300" y="191" font-size="28" fill="#57606a">Model: GPT-4.1 (Default)</text>

    <rect x="120" y="264" width="1060" height="120" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="335" font-size="30" font-weight="700" fill="#24292f">Instructions</text>
    <text x="360" y="315" font-size="28" fill="#57606a">HR policies, career growth, learning pathways</text>
    <text x="360" y="355" font-size="28" fill="#57606a">Professional tone, answers from its sources</text>

    <rect x="120" y="400" width="1060" height="120" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="471" font-size="30" font-weight="700" fill="#24292f">Knowledge</text>
    <text x="360" y="451" font-size="28" fill="#57606a">Public website and SharePoint site</text>
    <text x="360" y="491" font-size="28" fill="#57606a">Name and description say what is inside</text>

    <rect x="120" y="536" width="1060" height="120" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="607" font-size="30" font-weight="700" fill="#24292f">Topics</text>
    <text x="360" y="587" font-size="28" fill="#57606a">Collect user's role, Register a new candidate,</text>
    <text x="360" y="627" font-size="28" fill="#57606a">Register new candidate with adaptive cards</text>

    <rect x="120" y="672" width="1060" height="120" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="150" y="743" font-size="30" font-weight="700" fill="#24292f">Settings</text>
    <text x="360" y="723" font-size="28" fill="#57606a">Orchestration: generative AI</text>
    <text x="360" y="763" font-size="28" fill="#57606a">Chooses the best knowledge, topic or action</text>

    <rect x="60" y="830" width="1120" height="150" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="100" y="892" font-size="30" font-weight="700" fill="#24292f">Power Platform environment</text>
    <text x="100" y="940" font-size="28" fill="#57606a">Copilot Dev Camp (Developer), where the agent lives</text>

    <g stroke="#8c959f" stroke-width="2" fill="#ffffff">
      <rect x="1030" y="158" width="120" height="44" rx="22"/>
      <rect x="1030" y="302" width="120" height="44" rx="22"/>
      <rect x="1030" y="438" width="120" height="44" rx="22"/>
      <rect x="1030" y="574" width="120" height="44" rx="22"/>
      <rect x="1030" y="710" width="120" height="44" rx="22"/>
      <rect x="1030" y="883" width="120" height="44" rx="22"/>
    </g>
    <g font-size="28" fill="#24292f" text-anchor="middle">
      <text x="1090" y="190">Lab 02</text>
      <text x="1090" y="334">Lab 02</text>
      <text x="1090" y="470">Lab 02</text>
      <text x="1090" y="606">Lab 03</text>
      <text x="1090" y="742">Lab 03</text>
      <text x="1090" y="915">Lab 01</text>
    </g>

    <rect x="1340" y="100" width="520" height="190" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1376" y="162" font-size="30" font-weight="700" fill="#24292f">Microsoft Teams</text>
    <text x="1376" y="208" font-size="28" fill="#57606a">Teams + Microsoft 365 channel</text>
    <text x="1376" y="250" font-size="28" fill="#57606a">Colleagues chat with the agent</text>

    <rect x="1340" y="360" width="520" height="180" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1376" y="420" font-size="30" font-weight="700" fill="#24292f">Microsoft Careers site</text>
    <text x="1376" y="464" font-size="28" fill="#57606a">Public website</text>
    <text x="1376" y="506" font-size="28" font-family="Consolas, monospace" fill="#57606a">careers.microsoft.com</text>

    <rect x="1340" y="580" width="520" height="220" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="1376" y="640" font-size="30" font-weight="700" fill="#24292f">HR Documents</text>
    <text x="1376" y="684" font-size="28" fill="#57606a">SharePoint site</text>
    <text x="1376" y="726" font-size="28" fill="#57606a">Answers only from documents</text>
    <text x="1376" y="766" font-size="28" fill="#57606a">the user has access to</text>

    <text x="1260" y="166" font-size="28" fill="#57606a" text-anchor="middle">Publish</text>
    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="1184" y1="190" x2="1332" y2="190"/>
      <line x1="1184" y1="446" x2="1332" y2="446"/>
      <line x1="1184" y1="490" x2="1332" y2="660"/>
    </g>
  </g>
</svg>
