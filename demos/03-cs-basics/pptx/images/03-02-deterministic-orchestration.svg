<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Deterministic and non-deterministic orchestration in three control layers</title>
  <desc id="d">An arrow runs from same input, same path on the left to plan and reply can vary on the right. Three layers sit under it. Deterministic: an authored topic or flow runs step by step, for mission-critical or irreversible steps such as processing a payment. Hybrid: the AI acts and a person or rule approves, for medium-risk processes such as a manager approval. Generative: the planner picks topics, tools and knowledge, for lookups and low-risk requests such as a policy lookup. A band below states that inside a chosen topic, nodes and Power Fx checks run as authored.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="120" y="165" font-size="32" fill="#57606a">Same input, same path</text>
    <text x="1800" y="165" font-size="32" fill="#57606a" text-anchor="end">Plan and reply can vary</text>
    <line x1="120" y1="200" x2="1790" y2="200" stroke="#57606a" stroke-width="5" marker-end="url(#ah)"/>

    <rect x="120" y="250" width="520" height="520" rx="24" fill="#eaf2ff" stroke="#0969da" stroke-width="3"/>
    <text x="380" y="330" font-size="42" font-weight="700" fill="#24292f" text-anchor="middle">Deterministic</text>
    <line x1="170" y1="365" x2="590" y2="365" stroke="#0969da" stroke-width="2"/>
    <text x="380" y="425" font-size="31" fill="#24292f" text-anchor="middle">Authored topic or flow</text>
    <text x="380" y="467" font-size="31" fill="#24292f" text-anchor="middle">runs step by step</text>
    <text x="380" y="540" font-size="30" fill="#57606a" text-anchor="middle">For mission-critical or</text>
    <text x="380" y="582" font-size="30" fill="#57606a" text-anchor="middle">irreversible steps</text>
    <rect x="200" y="640" width="360" height="90" rx="18" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
    <text x="380" y="698" font-size="30" fill="#24292f" text-anchor="middle">Process a payment</text>

    <rect x="700" y="250" width="520" height="520" rx="24" fill="#fff6e5" stroke="#e0a534" stroke-width="3"/>
    <text x="960" y="330" font-size="42" font-weight="700" fill="#24292f" text-anchor="middle">Hybrid</text>
    <line x1="750" y1="365" x2="1170" y2="365" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="425" font-size="31" fill="#24292f" text-anchor="middle">AI acts, a person</text>
    <text x="960" y="467" font-size="31" fill="#24292f" text-anchor="middle">or rule approves</text>
    <text x="960" y="540" font-size="30" fill="#57606a" text-anchor="middle">For medium-risk</text>
    <text x="960" y="582" font-size="30" fill="#57606a" text-anchor="middle">processes</text>
    <rect x="780" y="640" width="360" height="90" rx="18" fill="#ffffff" stroke="#e0a534" stroke-width="2"/>
    <text x="960" y="698" font-size="30" fill="#24292f" text-anchor="middle">Manager approval</text>

    <rect x="1280" y="250" width="520" height="520" rx="24" fill="#fbefff" stroke="#8250df" stroke-width="3"/>
    <text x="1540" y="330" font-size="42" font-weight="700" fill="#24292f" text-anchor="middle">Generative</text>
    <line x1="1330" y1="365" x2="1750" y2="365" stroke="#8250df" stroke-width="2"/>
    <text x="1540" y="425" font-size="31" fill="#24292f" text-anchor="middle">Planner picks topics,</text>
    <text x="1540" y="467" font-size="31" fill="#24292f" text-anchor="middle">tools and knowledge</text>
    <text x="1540" y="540" font-size="30" fill="#57606a" text-anchor="middle">For lookups and</text>
    <text x="1540" y="582" font-size="30" fill="#57606a" text-anchor="middle">low-risk requests</text>
    <rect x="1360" y="640" width="360" height="90" rx="18" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
    <text x="1540" y="698" font-size="30" fill="#24292f" text-anchor="middle">Policy lookup</text>

    <rect x="120" y="830" width="1680" height="110" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="960" y="897" font-size="32" fill="#24292f" text-anchor="middle">Inside a chosen topic, nodes and Power Fx checks run as authored</text>
  </g>
</svg>
