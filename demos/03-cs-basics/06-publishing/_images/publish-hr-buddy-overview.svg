  <text class="b" x="992" y="200">Hello, I'm CS-HR Buddy. How can I help?</text>
  <text class="b" x="1452" y="276">claim my employee reward</text>
  <text class="b" x="992" y="352">last name, first name, department, cost center</text>
  <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
