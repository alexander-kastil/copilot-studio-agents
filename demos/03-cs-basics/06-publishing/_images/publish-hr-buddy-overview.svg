  <text class="b c" x="1585" y="408">Accounting</text>
  <text class="b" x="992" y="502">Hi &lt;first name&gt; &lt;last name&gt;. You have</text>
  <text class="b" x="992" y="540">25 days of paid leave left</text>
  <text class="b" x="992" y="618">Please choose your reward:</text>
