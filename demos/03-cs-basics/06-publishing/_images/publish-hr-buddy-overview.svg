  <defs>
    <style>
      svg { font-size: 28px; }
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
      .h { font-size: 34px; font-weight: 700; }
      .t { font-size: 30px; font-weight: 600; }
      .b { font-size: 28px; }
      .bb { font-size: 28px; font-weight: 700; }
      .s { font-size: 28px; fill: #57606a; }
      .mb { font-family: Consolas, 'Courier New', monospace; font-size: 28px; font-weight: 700; }
      .p { font-size: 26px; font-weight: 700; }
      .w { fill: #ffffff; }
      .c { text-anchor: middle; }
      .e { text-anchor: end; }
    </style>
    <marker id="ah" viewBox="0 0 16 16" refX="16" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L16,8 L0,16 z" fill="#57606a"/>
    </marker>
  </defs>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <line x1="470" y1="270" x2="470" y2="310"/>
