  <text class="b" x="992" y="956">add employee information</text>
  <rect x="1410" y="914" width="380" height="64" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1432" y="956">What is your last name?</text>

  <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <rect x="84" y="40" width="92" height="40" rx="20"/>
    <rect x="84" y="290" width="92" height="40" rx="20"/>
    <rect x="84" y="520" width="92" height="40" rx="20"/>
