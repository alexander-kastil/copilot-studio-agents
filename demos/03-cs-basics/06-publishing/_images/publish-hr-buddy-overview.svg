    <rect x="1700" y="40" width="92" height="40" rx="20"/>
    <rect x="1700" y="810" width="92" height="40" rx="20"/>
  </g>
  <text class="p c" x="130" y="69">Ex 1</text>
  <text class="p c" x="130" y="319">Ex 2</text>
  <text class="p c" x="130" y="549">Ex 4</text>
  <text class="p c" x="130" y="819">Ex 5</text>
  <text class="p c" x="1746" y="69">Ex 3</text>
  <text class="p c" x="1746" y="839">Ex 3</text>

  <g fill="#24292f">
    <circle r="14" opacity="0">
