<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-HR Buddy goes live in Teams and Microsoft 365 Copilot</title>
  <desc id="d">Four steps run down the left. Exercise 1 settles the settings: Authenticate with Microsoft, and Let other agents connect to and use this one turned on. Exercise 2 selects Publish and adds the Microsoft 365 and Microsoft Teams channel, one channel for Teams and Microsoft 365 Copilot. Exercise 4 shares the agent with your HR pilot group, listed as Viewer next to you as Owner, and lists it in Built with Power Platform. Exercise 5 changes a message, publishes again and sends start over, so the confirmation ends with Ask me to collect your employee reward next; one publish updates Teams and Microsoft 365 Copilot. On the right, the Teams chat from Exercise 3: CS-HR Buddy greets with Hello, I'm CS-HR Buddy. How can I help?, the user sends claim my employee reward, the agent asks for last name, first name, department with the buttons Marketing, Software Engineering and Accounting, and cost center, answers Hi first name last name. You have 25 days of paid leave left, asks Please choose your reward with A free dinner and A visit to theatre, and confirms The dinner voucher will be forwarded to you. Below it, Microsoft 365 Copilot answers add employee information with What is your last name?. A highlight steps through the settings, the publish, the chat, the share and the republish in order.</desc>
