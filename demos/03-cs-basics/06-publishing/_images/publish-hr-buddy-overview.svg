  <rect x="90" y="370" width="170" height="60" rx="10" fill="#24292f"/>
  <text class="bb w c" x="175" y="410">Publish</text>
  <line x1="262" y1="400" x2="316" y2="400" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text class="t" x="330" y="380">Microsoft 365 and Microsoft Teams</text>
  <text class="s" x="330" y="424">one channel for Teams and</text>
  <text class="s" x="330" y="462">Microsoft 365 Copilot</text>

  <rect x="60" y="540" width="820" height="230" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="90" y="602">Share with <tspan class="mb">&lt;your HR pilot group&gt;</tspan></text>
  <rect x="90" y="624" width="310" height="52" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
