<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">One draft, one Publish: the help desk agent in Teams, Microsoft Copilot and SharePoint</title>
  <desc id="d">On the left is the one draft of Grey Logistics IT Help Desk, with suggested prompts on the Overview page and the instruction line added in Exercise 4: End every answer with: Still stuck? Open a ticket in the service desk portal. Publish, from Exercise 1, makes the live version. It feeds the Teams and Microsoft Copilot channel from Exercise 2 and the SharePoint IT site from Exercise 3. In Teams, installed for yourself, the user sends start over and Teams can't find my camera in meetings. How do I fix it?, and the answer ends with the ticket sentence. In Microsoft Copilot the welcome page shows the suggested prompts. On the SharePoint IT site the user asks How do I set up Windows Hello again after an update?, the answer cites the Windows support pages, and in a new session it ends with the ticket sentence too. Exercise 5, bottom left, selects Show to my teammates and shared users, which shows the Added to Teams label and lists the agent in Built with Power Platform. A dot carries the changed instruction through Publish to all channels at once.</desc>
