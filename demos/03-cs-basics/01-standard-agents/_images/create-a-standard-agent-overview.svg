<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Grey Logistics IT Help Desk: set up in three steps, then the same VPN question under two orchestration modes</title>
  <desc id="d">Grey Logistics IT Help Desk is a Standard agent set up in three steps. Ex 1 creates it from a description, which generates a name, a description and instructions. Ex 2 sets the name and five instruction rules: workplace IT only, never passwords or codes. Ex 3 keeps the default model, orchestration Yes and Allow ungrounded responses on. Ex 4 tests under generative orchestration, read in the activity map: My VPN keeps disconnecting every few minutes returns numbered steps and a hint to open a ticket, and Which restaurant near the office do you recommend for lunch gets a polite refusal that points back to workplace IT. Ex 5 tests under classic orchestration, read in the topic tracking view: the same VPN question goes to Conversational boosting, then Fallback asks to rephrase, and Hello is matched by the trigger phrases of the Greeting topic. The setup steps light up in order, then a dot carries each prompt to its result.</desc>
