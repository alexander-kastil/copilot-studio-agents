<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Employee Onboarding Assistant answers an off-topic question, gets structured instructions, then declines it</title>
  <desc id="d">Left, Ex 1: the blank agent, before any instructions, answers What's the capital of Australia, and can you write me a limerick about it? with Canberra and the limerick, because nothing yet tells it what its job is; the reply is kept on screen for Ex 5. Centre, the agent CS-Employee Onboarding Assistant with the description Helps new employees complete onboarding. Ex 2 adds structured instructions with the sections Purpose, General Guidelines, Skills, Step-by-step Instructions, Error Handling, Interaction Examples, Nonstandard Terms and Follow-up and Closing. Ex 3 picks GPT Chat Latest as the primary model. Ex 4 sets where answers come from: orchestration Yes, web search off, ungrounded answers on, semantic search on, moderation Low. Right, Ex 5 proves the scope: the first-week checklist returns tasks with how-to lines and ends with the supportive closing; the benefits enrollment form question finds no SharePoint source yet, so the agent points you to HR; the capital question is declined and the reply ends with the closing line. While each test lights up, the instruction section behind it lights up too.</desc>
