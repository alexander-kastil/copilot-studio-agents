<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Report a device issue: one message fills two slots, the topic asks only for the email</title>
  <desc id="d">Grey Logistics IT Help Desk under classic orchestration. Ex 4 sends My notebook CT-104233 has a cracked screen. The word notebook goes to the Device type entity from Ex 1, a closed list with smart matching where notebook maps to laptop. CT-104233 goes to the Asset tag entity from Ex 2, the regular expression (?i)CT-\d{6}. The third entity, Email, is prebuilt. In the Ex 3 topic Report a device issue, three questions are each bound to an entity: deviceType and assetTag are filled at once with laptop and CT-104233, and contactEmail is asked, then answered with alex@greylogistics.com. The recap reads: Thanks. I logged a laptop issue for asset CT-104233. The service desk will contact you at alex@greylogistics.com. At the side, Ex 5: My monitor stopped working, then I can't find a sticker answered twice; Repeat once sends the custom retry prompt That doesn't look like an asset tag; assetTag becomes unknown as the default entity value, the topic moves on to the email question, and the recap names asset unknown. Dots carry the two words into their entities and slots, then each step of the invalid path lights up.</desc>
