<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-HR Buddy: the first reward request detours through Collect Employee Data, the second goes straight to the reward</title>
  <desc id="d">Top, Ex 1: CS-HR Buddy with the description An HR Self service agent, the instruction Answer HR related topics, HR Documents as knowledge and orchestration Yes. Middle, Ex 4: the topic Collect Employee rewards. Two requests in the same conversation, Ex 5, enter its condition Not(Global.EmployeeIdentified). Request 1, claim my employee reward, finds the employee unknown, so a Redirect runs the topic Collect Employee Data below it, built in Ex 2 and Ex 3: four questions, Last name and First name as Person name, Department as multiple choice, Cost center as Number; the message Hi Johanna Kurz. You have 25 days of paid leave left; and Global.EmployeeIdentified set to true. The flow then returns to the question Please choose your reward:, and A free dinner answers The dinner voucher will be forwarded to you. Request 2, redeem employee points, finds the variable already true and goes straight to the question, and A visit to theatre answers The tickets will be sent to you by post. A dot follows request 1 through the detour, then request 2 along the short path.</desc>
