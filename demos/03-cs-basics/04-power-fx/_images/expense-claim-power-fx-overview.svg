<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Travel Expense Refund: three Power Fx formulas turn the Expense Claim card into a claim ready to save</title>
  <desc id="d">Top, Ex 1: CS-Travel Expense Refund with the WKO page Lohnsteuerliche Behandlung von Dienstreisen as knowledge and the topic Submit Refund Request. Left, Ex 2: the Expense Claim Adaptive Card, filled with Email Address alex@greylogistics.com, Destination Vienna, Departure Date 2026-11-03, Return Date 2026-11-05, Amount 245.80 and Comment Train and two hotel nights, sent with Submit Claim. Middle, three Set a variable value nodes: Ex 3 sets claimID to Text(GUID()), a 36-character ID that is new every run; Ex 4 sets departureDateIso to Topic.departureDate &amp; "T00:00:00Z", giving 2026-11-03T00:00:00Z, and returnDateIso to Topic.returnDate &amp; "T00:00:00Z", giving 2026-11-05T00:00:00Z. Right, Ex 5: the recap message Claim {claimID}: 245.80 for Vienna, from 2026-11-03T00:00:00Z to 2026-11-05T00:00:00Z. Contact: alex@greylogistics.com. Comment: Train and two hotel nights. In the next demo an agent flow writes it to a Dataverse table. Dots carry the two card dates into their formulas, then every formula result into the recap.</desc>
