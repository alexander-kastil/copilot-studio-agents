  <text class="t" x="182" y="219">Validate the description</text>
  <text class="m" x="74" y="280">Len(Topic.issueDescription) &gt;= 20</text>
  <text class="s" x="74" y="324">Additional entity validation, custom prompt</text>

  <text class="t" x="182" y="423">Map the priority to service days</text>
  <text class="code" x="74" y="486">slaDays</text>
  <text class="m" x="204" y="486">Switch(Text(Topic.priority), "High", 1, "Medium", 2, 5)</text>
  <text class="s" x="74" y="530">from the question: High, Medium or Low</text>

  <text class="t" x="182" y="627">Move the due date off a weekend</text>
  <text class="code" x="74" y="690">dueDate</text>
  <text class="m" x="214" y="690">DateAdd(Today(), Topic.slaDays)</text>
  <text class="s" x="74" y="738">Condition</text>
  <text class="m" x="214" y="738">Weekday(Topic.dueDate) = 1 || Weekday(Topic.dueDate) = 7</text>
  <text class="code" x="74" y="786">dueDate</text>
  <text class="m" x="214" y="786">DateAdd(Topic.dueDate, If(Weekday(Topic.dueDate) = 7, 2, 1))</text>

  <text class="t" x="182" y="901">Format the date and reply</text>
  <text class="code" x="74" y="964">dueDateText</text>
  <text class="m" x="270" y="964">Text(Topic.dueDate, "dddd, mmmm d")</text>

