<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Estimate a ticket due date: four Power Fx formulas validate, map, move off a weekend and format</title>
  <desc id="d">Grey Logistics IT Help Desk, topic Estimate a ticket due date, tested in Ex 5 with When will my ticket be done? Four stages, each a formula on the left and what the test shows on the right. Ex 1, validate the description: Len(Topic.issueDescription) &gt;= 20 as additional entity validation with a custom prompt; the answer broken brings back the prompt Please add a little more detail, at least a full sentence. Ex 2, map the priority to service days: slaDays is Switch(Text(Topic.priority), "High", 1, "Medium", 2, 5) for the priority question with High, Medium or Low; the Test tab shows High 1, Medium 2, Low 5. Ex 3, move the due date off a weekend: dueDate is DateAdd(Today(), Topic.slaDays); the Condition Weekday(Topic.dueDate) = 1 || Weekday(Topic.dueDate) = 7 sets dueDate to DateAdd(Topic.dueDate, If(Weekday(Topic.dueDate) = 7, 2, 1)); a week strip shows Saturday plus 2 and Sunday plus 1 landing on Monday, so the due date is never a Saturday or Sunday. Ex 4, format the date and reply: dueDateText is Text(Topic.dueDate, "dddd, mmmm d"), and the reply reads Thanks. Your {priority} ticket is due by {dueDateText}. The service desk will update you if anything changes. The stages light up in order, and dots move the weekend dates to Monday.</desc>
