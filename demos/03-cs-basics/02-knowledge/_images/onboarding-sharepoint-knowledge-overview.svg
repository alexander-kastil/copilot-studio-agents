<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">CS-Employee Onboarding Assistant: each answer traced to its SharePoint document</title>
  <desc id="d">Two SharePoint sites flank the agent. Left, HR Documents, added in Ex 1 with the description This source provides any kind of Human Resources information, holds Employee Onboarding.docx. Right, Sightseeing, added in Ex 2 with the description Recommended Sightseeing info, holds Vienna Sightseeing.docx and Lunch Options Near Grinzing Office.docx. In the middle, CS-Employee Onboarding Assistant, whose instructions now end with the section Sightseeing. Ex 3: Where can I find the benefits enrollment form? cites Employee Onboarding.docx. Ex 4: What should I see near the office after work? recommends Bellevue Wiese, Grinzing, St. Stephen's Cathedral, the Vienna State Opera and Belvedere Palace, citing both Sightseeing documents. Ex 5: the dog policy question finds no pet policy, tells you to confirm with HR, cites Employee Onboarding.docx and stays the same with ungrounded answers off. Bottom, Ex 5: What's the capital of Australia, and can you write me a limerick about it? gets Canberra and a limerick with no reference while ungrounded answers are on, and No information was found, then the Fallback topic, once they are off. Dashed citation lines run from each answer to its document, and a dot travels each line in turn.</desc>
