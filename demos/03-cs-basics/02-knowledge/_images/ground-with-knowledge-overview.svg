<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Grey Logistics IT Help Desk: every question lands on the source its description names</title>
  <desc id="d">Grey Logistics IT Help Desk, where the orchestrator picks a source by its name and description. Four columns are the places an answer can come from: Windows support and Microsoft 365 apps support, both added in Ex 1 as public websites; No source, where Allow ungrounded responses decides, in Ex 3; and Web Search over all public sites Bing indexes, in Ex 4. Four questions step across the columns. Ex 2: Windows Hello face sign-in stopped working after an update lands on Windows support with numbered citations, and OneDrive shows a red X on some files in File Explorer lands on Microsoft 365 apps support with numbered citations. Ex 3: How many vacation days does a new Grey Logistics employee get finds no source; with ungrounded responses on there are no citations, with them off the Fallback topic answers. Ex 4: How do I pair a Logitech MX Master 3S mouse over Bluetooth is answered by web search from the manufacturer's support site. Ex 5 adds five suggested prompts for Teams and Copilot Chat: Fix Windows Hello, OneDrive sync errors, Outlook keeps asking for my password, Teams camera not working, Pair a Bluetooth mouse. A dot carries each question to its column in turn.</desc>
