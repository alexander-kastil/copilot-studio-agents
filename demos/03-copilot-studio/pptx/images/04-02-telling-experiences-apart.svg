<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Classic and new Copilot Studio navigation tells</title>
  <desc id="d">Two Copilot Studio windows side by side. Classic lists Topics, Knowledge, Actions and Settings down the left, and Topics is marked as the sign of classic. The new experience shows Build, Preview, Evaluate and Monitor tabs across the top, and its Build tab holds Instructions seeded from the description plus empty Knowledge, Tools and Skills.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="510" y="150" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Classic: navigation down the left</text>
  <text x="1410" y="150" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">New experience: tabs across the top</text>

  <path d="M100,250 V206 Q100,190 116,190 H904 Q920,190 920,206 V250 Z" fill="#f6f8fa"/>
  <path d="M100,250 H420 V950 H116 Q100,950 100,934 Z" fill="#eaf2ff"/>
  <text x="130" y="230" font-size="28" fill="#57606a">Copilot Studio</text>
  <rect x="120" y="285" width="280" height="58" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2.5"/>
  <text x="150" y="325" font-size="30" font-weight="700" fill="#24292f">Topics</text>
  <text x="150" y="405" font-size="30" fill="#24292f">Knowledge</text>
  <text x="150" y="485" font-size="30" fill="#24292f">Actions</text>
  <text x="150" y="565" font-size="30" fill="#24292f">Settings</text>
  <rect x="480" y="280" width="400" height="68" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2.5"/>
  <text x="680" y="324" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Topics means classic</text>
  <line x1="478" y1="314" x2="408" y2="314" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="480" y="410" width="400" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="480" y="470" width="320" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="480" y="530" width="370" height="36" rx="8" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="480" y="610" width="400" height="300" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <line x1="100" y1="250" x2="920" y2="250" stroke="#8c959f" stroke-width="2"/>
  <rect x="100" y="190" width="820" height="760" rx="16" fill="none" stroke="#8c959f" stroke-width="2"/>

  <path d="M1000,250 V206 Q1000,190 1016,190 H1804 Q1820,190 1820,206 V250 Z" fill="#f6f8fa"/>
  <rect x="1000" y="250" width="820" height="90" fill="#f3edff"/>
  <text x="1030" y="230" font-size="28" fill="#57606a">Copilot Studio</text>
  <rect x="1014" y="261" width="792" height="68" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2.5"/>
  <text x="1102" y="306" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Build</text>
  <text x="1307" y="306" font-size="30" fill="#24292f" text-anchor="middle">Preview</text>
  <text x="1512" y="306" font-size="30" fill="#24292f" text-anchor="middle">Evaluate</text>
  <text x="1717" y="306" font-size="30" fill="#24292f" text-anchor="middle">Monitor</text>
  <line x1="1410" y1="384" x2="1410" y2="336" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1160" y="386" width="500" height="68" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2.5"/>
  <text x="1410" y="430" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Tabs mean new experience</text>
  <text x="1050" y="512" font-size="28" fill="#57606a">Build tab: components panel</text>
  <rect x="1050" y="535" width="350" height="170" rx="12" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1080" y="590" font-size="30" font-weight="700" fill="#24292f">Instructions</text>
  <text x="1080" y="638" font-size="28" fill="#57606a">Seeded from your</text>
  <text x="1080" y="676" font-size="28" fill="#57606a">description</text>
  <rect x="1440" y="535" width="350" height="170" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1470" y="590" font-size="30" font-weight="700" fill="#24292f">Knowledge</text>
  <text x="1470" y="638" font-size="28" fill="#57606a">Empty</text>
  <rect x="1050" y="740" width="350" height="170" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1080" y="795" font-size="30" font-weight="700" fill="#24292f">Tools</text>
  <text x="1080" y="843" font-size="28" fill="#57606a">Empty</text>
  <rect x="1440" y="740" width="350" height="170" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1470" y="795" font-size="30" font-weight="700" fill="#24292f">Skills</text>
  <text x="1470" y="843" font-size="28" fill="#57606a">Empty</text>
  <line x1="1000" y1="250" x2="1820" y2="250" stroke="#8c959f" stroke-width="2"/>
  <line x1="1000" y1="340" x2="1820" y2="340" stroke="#8c959f" stroke-width="2"/>
  <rect x="1000" y="190" width="820" height="760" rx="16" fill="none" stroke="#8c959f" stroke-width="2"/>
</svg>
