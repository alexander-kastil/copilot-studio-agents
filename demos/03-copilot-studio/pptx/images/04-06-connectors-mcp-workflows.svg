<line x1="960" y1="290" x2="960" y2="358" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="690" y="360" width="540" height="610" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<rect x="710" y="380" width="500" height="80" rx="12" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">MCP server</text>
