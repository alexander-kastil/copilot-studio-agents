<circle cx="1750" cy="640" r="30" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="1750" y="650" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">5</text>
<line x1="1750" y1="670" x2="1750" y2="728" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="1750" y="762" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">output</text>
<text x="370" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">One action, one service</text>
<text x="370" y="896" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">"send one email" or</text>
<text x="370" y="936" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">"create one record"</text>
<text x="960" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">A shared set of tools</text>
<text x="960" y="896" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">"give every agent the</text>
<text x="960" y="936" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">same shared toolbox"</text>
<text x="1550" y="852" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Repeated multi-step process</text>
<text x="1550" y="896" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">"do these five steps the</text>
