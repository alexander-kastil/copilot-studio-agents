<rect x="810" y="60" width="300" height="90" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="960" y="117" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Agent</text>
<line x1="960" y1="150" x2="960" y2="208" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
