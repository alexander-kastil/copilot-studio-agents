<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Connectors, MCP servers and workflows on one Tools surface</title>
<desc id="d">An agent reaches beyond talking through one Tools surface. A connector is one action against one service, an MCP server is one connection to a shared set of tools and resources, and a workflow is a fixed sequence of steps from an input to an output.</desc>
