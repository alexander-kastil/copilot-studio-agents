<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">One tenant, two experiences, decided per agent</title>
  <desc id="d">Inside one tenant the maker reads the navigation, then confirms the experience with the New experience toggle. Toggle off leads into the classic lane of authored topics and branching; toggle on leads into the new lane of instructions plus the reasoning runtime. The lanes never meet: there is no conversion, so the experience is fixed when the agent is created. Two dots take turns travelling from the decision into each lane.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <rect x="60" y="70" width="1800" height="940" rx="24" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="110" y="135" font-size="30" font-weight="700" fill="#24292f">One tenant, both experiences live</text>

  <rect x="140" y="220" width="420" height="130" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="350" y="296" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Read the navigation</text>
  <line x1="350" y1="352" x2="350" y2="436" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="140" y="440" width="420" height="300" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2.5"/>
  <text x="350" y="508" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">Confirm the</text>
  <text x="350" y="548" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">experience</text>
  <rect x="300" y="588" width="100" height="50" rx="25" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <circle cx="326" cy="613" r="17" fill="#57606a"/>
  <text x="350" y="694" font-size="28" fill="#57606a" text-anchor="middle">New experience toggle</text>
  <text x="350" y="800" font-size="28" fill="#57606a" text-anchor="middle">A per-agent choice,</text>
  <text x="350" y="840" font-size="28" fill="#57606a" text-anchor="middle">not a tenant-wide switch</text>

  <line x1="560" y1="590" x2="690" y2="590" stroke="#57606a" stroke-width="3"/>
  <path d="M690,590 V320 H816" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M690,590 V800 H816" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="754" y="302" font-size="28" fill="#57606a" text-anchor="middle">off</text>
  <text x="754" y="842" font-size="28" fill="#57606a" text-anchor="middle">on</text>

  <rect x="820" y="160" width="1000" height="320" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="870" y="252" font-size="34" font-weight="700" fill="#24292f">Classic experience</text>
  <text x="870" y="302" font-size="28" fill="#57606a">Authored topics</text>
  <text x="870" y="342" font-size="28" fill="#57606a">and branching</text>
  <rect x="1330" y="290" width="160" height="60" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1410" y="330" font-size="28" fill="#24292f" text-anchor="middle">Trigger</text>
  <line x1="1490" y1="320" x2="1542" y2="320" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <polygon points="1614,252 1682,320 1614,388 1546,320" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1614" y="330" font-size="28" fill="#24292f" text-anchor="middle">Branch</text>
  <path d="M1682,320 H1706 V236 H1724" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M1706,320 V404 H1724" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="1726" y="210" width="60" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <rect x="1726" y="378" width="60" height="52" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>

  <text x="1320" y="548" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">No conversion: decide before you invest</text>
  <text x="1320" y="594" font-size="28" fill="#57606a" text-anchor="middle">The experience is fixed when the agent is created</text>

  <rect x="820" y="640" width="1000" height="320" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="870" y="732" font-size="34" font-weight="700" fill="#24292f">New experience</text>
  <text x="870" y="782" font-size="28" fill="#57606a">Instructions plus the</text>
  <text x="870" y="822" font-size="28" fill="#57606a">reasoning runtime</text>
  <rect x="1310" y="765" width="240" height="70" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1430" y="810" font-size="28" fill="#24292f" text-anchor="middle">Instructions</text>
  <line x1="1550" y1="800" x2="1604" y2="800" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <circle cx="1700" cy="800" r="90" fill="#ffffff"/>
  <path d="M1700,710 A90,90 0 1,1 1622.06,755" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="1700" y="792" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Runtime</text>
  <text x="1700" y="832" font-size="28" fill="#57606a" text-anchor="middle">every turn</text>

  <rect x="820" y="160" width="1000" height="320" rx="16" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.45"/>
  </rect>
  <rect x="820" y="640" width="1000" height="320" rx="16" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.75;0.95"/>
  </rect>
  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M560,590 H690 V320 H818" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.05;0.25;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.05;0.27"/>
  </circle>
  <circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" path="M560,590 H690 V800 H818" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.55;0.75;1"/>
    <animate attributeName="opacity" dur="8s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.55;0.77"/>
  </circle>
</svg>
