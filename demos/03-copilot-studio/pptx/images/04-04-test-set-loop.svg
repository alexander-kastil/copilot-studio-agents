<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Filling a test set and running the one-change loop</title>
<desc id="d">Three sources fill the test set: Quick conversation set, CSV upload, and writing questions yourself. The test set goes to a run. The run produces a score and per-case verdicts, which lead to diagnosing one failing case, then changing exactly one component, and back to the run. A highlight steps through the sources, the test set and the loop in order.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

<g stroke="#8c959f" stroke-width="2" fill="#eaf2ff">
<rect x="70" y="220" width="340" height="120" rx="18"/>
<rect x="70" y="480" width="340" height="120" rx="18"/>
<rect x="70" y="740" width="340" height="120" rx="18"/>
</g>
<g class="h" font-size="30" text-anchor="middle">
<text x="240" y="272">Quick</text>
<text x="240" y="310">conversation set</text>
<text x="240" y="532">CSV</text>
<text x="240" y="570">upload</text>
<text x="240" y="792">Write questions</text>
<text x="240" y="830">yourself</text>
</g>

<g fill="none" stroke="#57606a" stroke-width="3">
<path d="M410,280 H465 V540"/>
<path d="M410,800 H465 V540"/>
</g>
<path d="M410,540 H514" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="520" y="480" width="240" height="120" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="640" y="551" font-size="32" text-anchor="middle">Test set</text>
<path d="M760,540 H894" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

<rect x="900" y="480" width="200" height="120" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1000" y="551" font-size="32" text-anchor="middle">Run</text>

<rect x="1150" y="150" width="380" height="120" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1340" y="202" font-size="30" text-anchor="middle">Score and</text>
<text class="h" x="1340" y="240" font-size="30" text-anchor="middle">per-case verdicts</text>

<rect x="1520" y="480" width="340" height="120" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="1690" y="532" font-size="30" text-anchor="middle">Diagnose one</text>
<text class="h" x="1690" y="570" font-size="30" text-anchor="middle">failing case</text>

<rect x="1150" y="810" width="380" height="120" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1340" y="862" font-size="30" text-anchor="middle">Change exactly</text>
<text class="h" x="1340" y="900" font-size="30" text-anchor="middle">one component</text>

<g fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
<path d="M1000,480 V210 H1144"/>
<path d="M1530,210 H1690 V474"/>
<path d="M1690,600 V870 H1536"/>
