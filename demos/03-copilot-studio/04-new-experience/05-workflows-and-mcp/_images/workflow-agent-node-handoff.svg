<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">A workflow hands one step to the agent through an agent node</title>
<desc id="d">A workflow runs a fixed sequence: an input, an agent node, an Outlook action and an output. At the agent node the workflow hands the task to your agent, which drafts the recap, takes the result back and passes it to the Outlook action that sends it.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#57606a"/></marker></defs>
<rect x="500" y="140" width="500" height="220" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="750" y="232" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Your agent</text>
<text x="750" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">drafts the recap</text>
<rect x="100" y="520" width="1720" height="420" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="1780" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="end">Workflow: a fixed sequence of steps</text>
<rect x="170" y="640" width="320" height="200" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="330" y="732" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Input</text>
<text x="330" y="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">take an input</text>
<rect x="590" y="640" width="320" height="200" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="750" y="732" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Agent node</text>
<text x="750" y="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">calls your agent</text>
<rect x="1010" y="640" width="320" height="200" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="1170" y="732" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Outlook action</text>
<text x="1170" y="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">send the recap</text>
<rect x="1430" y="640" width="320" height="200" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="1590" y="732" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Output</text>
<text x="1590" y="778" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">produce an output</text>
<line x1="490" y1="740" x2="586" y2="740" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="910" y1="740" x2="1006" y2="740" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="1330" y1="740" x2="1426" y2="740" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="690" y1="640" x2="690" y2="362" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<line x1="810" y1="360" x2="810" y2="638" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="670" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f" text-anchor="end">hand the task</text>
<text x="830" y="470" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#24292f" text-anchor="start">take the result</text>
