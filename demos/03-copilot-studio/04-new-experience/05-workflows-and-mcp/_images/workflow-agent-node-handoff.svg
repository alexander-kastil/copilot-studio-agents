<circle r="14" cx="0" cy="0" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7795;0.7800;0.8600;0.8605;1" dur="10s" repeatCount="indefinite"/><animateMotion path="M1330,740 L1430,740" keyPoints="0;0;1;1" keyTimes="0;0.7800;0.8600;1" calcMode="linear" dur="10s" repeatCount="indefinite"/></circle>
