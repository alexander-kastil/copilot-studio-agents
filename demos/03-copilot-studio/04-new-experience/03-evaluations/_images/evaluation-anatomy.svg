<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">The parts of an evaluation on the Evaluate tab</title>
<desc id="d">An evaluation is one named test set with Data type Conversation. One test method, General quality, applies to the whole set. Each conversation is one test case: user questions, each with an optional expected response. The set runs as a user profile whose connections show ready, and each run is saved with its own score and a Pass or Fail per conversation.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
