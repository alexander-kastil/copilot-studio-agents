<rect x="640" y="660" width="530" height="250" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="905" y="772" font-size="32" text-anchor="middle">Compare meaning</text>
<text class="s" x="905" y="815" font-size="28" text-anchor="middle">or Text similarity</text>
