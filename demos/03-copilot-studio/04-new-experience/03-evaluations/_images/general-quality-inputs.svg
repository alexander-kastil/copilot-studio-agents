<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">What General quality reads, compared with a classic comparing grader</title>
<desc id="d">On the Evaluate tab in the new experience, the agent's answer goes to General quality, one method for the whole set that judges relevance and completeness, and yields Pass or Fail per conversation. The optional expected response goes to the people who maintain the set: it records what correct means, travels in the CSV and makes a failing case diagnosable. On the classic Evaluation page, the agent's answer and the required expected response both go to Compare meaning or Text similarity, which yields a score out of 100 percent against a pass threshold.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
.r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

<rect x="70" y="70" width="1780" height="430" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="110" y="128" font-size="32">Evaluate tab, new experience</text>

<rect x="110" y="170" width="390" height="100" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="305" y="230" font-size="30" text-anchor="middle">Agent's answer</text>
<path d="M500,220 H634" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="640" y="160" width="530" height="170" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text class="h" x="905" y="212" font-size="32" text-anchor="middle">General quality</text>
<text class="s" x="905" y="254" font-size="28" text-anchor="middle">relevance and completeness</text>
<text class="s" x="905" y="294" font-size="28" text-anchor="middle">one method for the whole set</text>
<path d="M1170,220 H1304" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="1310" y="170" width="500" height="100" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="1560" y="212" font-size="30" text-anchor="middle">Pass or Fail</text>
<text class="s" x="1560" y="252" font-size="28" text-anchor="middle">per conversation</text>

<rect x="110" y="365" width="390" height="105" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="305" y="410" font-size="30" text-anchor="middle">Expected response</text>
<text class="s" x="305" y="450" font-size="28" text-anchor="middle">optional</text>
<path d="M500,417 H634" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="640" y="365" width="1170" height="105" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="r" x="672" y="408" font-size="28">Records what correct means for the people who maintain the set</text>
<text class="s" x="672" y="448" font-size="28">Travels in the CSV and makes a failing case diagnosable</text>

<rect x="70" y="560" width="1780" height="450" rx="22" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="110" y="618" font-size="32">Classic Evaluation page</text>

<rect x="110" y="660" width="390" height="100" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="305" y="720" font-size="30" text-anchor="middle">Agent's answer</text>
<rect x="110" y="800" width="390" height="110" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="h" x="305" y="845" font-size="30" text-anchor="middle">Expected response</text>
<text class="s" x="305" y="885" font-size="28" text-anchor="middle">required</text>
<path d="M500,710 H634" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
