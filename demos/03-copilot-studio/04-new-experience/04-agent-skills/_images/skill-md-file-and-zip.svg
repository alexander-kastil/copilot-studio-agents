<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">A SKILL.md file has YAML front matter on top and Markdown instructions below, and can ship in a ZIP</title>
  <desc id="d">Left: a SKILL.md file. Its YAML front matter between two --- lines holds name: customer-support-escalation and the description. Below it the Markdown instructions start with # Customer support escalation and hold the steps the agent should follow, the response format and edge cases. Right: the SKILL.md is bundled into a ZIP package at the root, beside scripts, templates and reference documents, where data such as a price table or canned responses is updated in one place.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <text x="140" y="150" font-size="34" font-weight="700" font-family="Consolas, monospace" fill="#24292f">SKILL.md</text>
  <rect x="140" y="180" width="780" height="720" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>

  <rect x="170" y="210" width="720" height="300" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="200" y="262" font-size="30" font-weight="700" fill="#24292f">YAML front matter</text>
  <text x="200" y="316" font-size="28" font-family="Consolas, monospace" fill="#57606a">---</text>
  <text x="200" y="360" font-size="28" font-family="Consolas, monospace" fill="#24292f">name: customer-support-escalation</text>
  <text x="200" y="404" font-size="28" font-family="Consolas, monospace" fill="#24292f">description: Handle escalations…</text>
  <text x="200" y="448" font-size="28" font-family="Consolas, monospace" fill="#57606a">---</text>

  <rect x="170" y="530" width="720" height="340" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="200" y="582" font-size="30" font-weight="700" fill="#24292f">Markdown instructions</text>
  <text x="200" y="636" font-size="28" font-family="Consolas, monospace" fill="#24292f"># Customer support escalation</text>
  <text x="200" y="692" font-size="28" fill="#57606a">Steps the agent should follow,</text>
  <text x="200" y="732" font-size="28" fill="#57606a">response format, and edge cases</text>
  <text x="200" y="772" font-size="28" fill="#57606a">as plain Markdown</text>

  <line x1="920" y1="328" x2="1076" y2="328" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text x="998" y="306" text-anchor="middle" font-size="28" fill="#57606a">bundled</text>

  <rect x="1080" y="180" width="720" height="720" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1120" y="240" font-size="34" font-weight="700" fill="#24292f">ZIP package</text>

  <rect x="1120" y="280" width="640" height="96" rx="12" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1150" y="338" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">SKILL.md</text>
  <text x="1730" y="338" text-anchor="end" font-size="28" fill="#57606a">at the root</text>

  <rect x="1120" y="396" width="640" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1150" y="446" font-size="28" fill="#24292f">scripts</text>

  <rect x="1120" y="496" width="640" height="80" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1150" y="546" font-size="28" fill="#24292f">templates</text>

  <rect x="1120" y="596" width="640" height="264" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1150" y="650" font-size="28" fill="#24292f">reference documents</text>
  <text x="1150" y="706" font-size="28" fill="#57606a">data such as a price table</text>
  <text x="1150" y="746" font-size="28" fill="#57606a">or canned responses,</text>
  <text x="1150" y="786" font-size="28" fill="#57606a">updated in one place</text>
</svg>
