<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Controls that keep agents catalogued and reviewed before they spread</title>
  <desc id="d">Makers build agents, and three controls sit on the way to the tenant: default environment routing, managed environments and publishing approval. Agents come out catalogued and reviewed before they spread across the tenant, so every published agent is visible, owned and governed.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <style>
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .h { font-size: 36px; font-weight: 600; }
    .b { font-size: 32px; font-weight: 600; }
    .t { font-size: 28px; }
    .s { font-size: 28px; fill: #57606a; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="160" y="90" width="660" height="120" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="6;2" keyTimes="0;0.125" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="490" y="161" text-anchor="middle">Makers build agents</text>
  <line x1="490" y1="212" x2="490" y2="274" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="160" y="280" width="660" height="120" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.125;0.25" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="490" y="351" text-anchor="middle">Default environment routing</text>
  <line x1="490" y1="402" x2="490" y2="464" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="160" y="470" width="660" height="120" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.25;0.375" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="490" y="541" text-anchor="middle">Managed environments</text>
  <line x1="490" y1="592" x2="490" y2="654" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="160" y="660" width="660" height="120" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.375;0.5" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="490" y="731" text-anchor="middle">Publishing approval</text>
  <line x1="490" y1="782" x2="490" y2="844" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="160" y="850" width="660" height="120" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.5;0.625" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="490" y="921" text-anchor="middle">Catalogued and reviewed</text>

  <path d="M 822 910 H 1470 V 796" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <text class="s" x="860" y="884">before they spread across the tenant</text>

  <rect x="1100" y="290" width="740" height="500" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.625;0.875" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="1470" y="372" text-anchor="middle">Every published agent is</text>
  <rect x="1180" y="410" width="580" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1470" y="470" text-anchor="middle">Visible</text>
  <rect x="1180" y="532" width="580" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1470" y="592" text-anchor="middle">Owned</text>
  <rect x="1180" y="654" width="580" height="96" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1470" y="714" text-anchor="middle">Governed</text>
</svg>
