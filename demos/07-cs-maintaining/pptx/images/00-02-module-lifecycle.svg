  <line x1="1262" y1="355" x2="1394" y2="355" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

  <rect x="1400" y="150" width="440" height="552" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6" keyTimes="0;0.85" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="h" x="1430" y="200">Channels</text>
  <text class="s" x="1430" y="238">where people work</text>

  <rect x="1430" y="262" width="60" height="38" rx="19" fill="#24292f"/>
