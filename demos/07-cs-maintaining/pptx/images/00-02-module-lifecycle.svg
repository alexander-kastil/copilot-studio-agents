  <rect x="965" y="458" width="230" height="55" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="985" y="495">Its components</text>

  <path d="M 260 562 V 610 H 620 V 565" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <path d="M 720 562 V 610 H 1080 V 565" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
  <rect x="470" y="632" width="64" height="44" rx="22" fill="#24292f"/>
