<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The lifecycle of a Copilot Studio agent, mapped to the five topics</title>
  <desc id="d">Topic 1, environments and solutions: development where makers build, test where changes are validated and production where agents reach real users, each with Dataverse holding a solution that carries the agent and its components. Topic 3: deployment pipelines move the solution from development to test to production. Production publishes the agent to the channels where people work: topic 2 covers the Microsoft channels Microsoft Teams, Microsoft 365 Copilot and SharePoint, topic 4 the advanced channels websites, Direct Line and WhatsApp. Topic 5: a coding agent with the copilot-studio and mcs-assistant plugins clones the agent from development and pushes it back as .mcs.yml files.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <style>
    svg { font-size: 28px; }
    text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; fill: #24292f; }
    .h { font-size: 36px; font-weight: 600; }
    .b { font-size: 30px; font-weight: 600; }
    .t { font-size: 28px; }
    .s { font-size: 28px; fill: #57606a; }
    .n { font-size: 28px; font-weight: 700; fill: #ffffff; }
  </style>
