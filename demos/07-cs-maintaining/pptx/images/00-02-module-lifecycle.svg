  <text class="s" x="110" y="245">Makers build</text>
  <rect x="100" y="270" width="320" height="270" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="125" y="312">Dataverse</text>
  <rect x="120" y="330" width="280" height="195" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" values="6;2" keyTimes="0;0.125" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="145" y="370">Solution</text>
  <rect x="145" y="390" width="230" height="55" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="165" y="427">Agent</text>
  <rect x="145" y="458" width="230" height="55" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="165" y="495">Its components</text>

  <rect x="490" y="150" width="360" height="410" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="520" y="205">Test</text>
  <text class="s" x="520" y="245">Changes validated</text>
  <rect x="510" y="270" width="320" height="270" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="535" y="312">Dataverse</text>
  <rect x="530" y="330" width="280" height="195" rx="12" fill="#fff6e5" stroke="#e0a534" stroke-width="2">
    <animate attributeName="stroke-width" values="2;6;2" keyTimes="0;0.3125;0.4375" calcMode="discrete" dur="8s" repeatCount="indefinite"/>
  </rect>
  <text class="b" x="555" y="370">Solution</text>
  <rect x="555" y="390" width="230" height="55" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="575" y="427">Agent</text>
  <rect x="555" y="458" width="230" height="55" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="575" y="495">Its components</text>

  <rect x="900" y="150" width="360" height="410" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text class="h" x="930" y="205">Production</text>
  <text class="s" x="930" y="245">Real users</text>
  <rect x="920" y="270" width="320" height="270" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
