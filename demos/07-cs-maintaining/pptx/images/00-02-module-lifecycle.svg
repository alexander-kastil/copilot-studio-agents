  <text class="b" x="1504" y="544">Advanced channels</text>
  <rect x="1430" y="564" width="380" height="54" rx="10" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="1455" y="601">Websites and Direct Line</text>
  <rect x="1430" y="628" width="380" height="54" rx="10" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text class="t" x="1455" y="665">WhatsApp</text>

  <line x1="170" y1="742" x2="170" y2="566" stroke="#57606a" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text class="s" x="192" y="690">clone, push</text>

  <rect x="80" y="748" width="1760" height="282" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <rect x="120" y="772" width="64" height="44" rx="22" fill="#24292f"/>
  <text class="n" x="152" y="804" text-anchor="middle">05</text>
  <text class="h" x="204" y="806">Agentic building from the terminal</text>
  <rect x="120" y="840" width="533" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="386" y="905" text-anchor="middle">copilot-studio plugin</text>
  <text class="s" x="386" y="945" text-anchor="middle">Standard agents</text>
  <rect x="693" y="840" width="533" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="960" y="905" text-anchor="middle">mcs-assistant plugin</text>
  <text class="s" x="960" y="945" text-anchor="middle">GitHub Copilot agents, migration</text>
  <rect x="1266" y="840" width="533" height="150" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text class="b" x="1532" y="905" text-anchor="middle">The agent as .mcs.yml files</text>
  <text class="s" x="1532" y="945" text-anchor="middle">clone, validate, pull, push</text>

