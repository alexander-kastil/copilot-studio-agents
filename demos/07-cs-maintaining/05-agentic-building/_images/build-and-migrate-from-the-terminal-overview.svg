<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Build and migrate from the terminal: what moves between Claude Code and Copilot Studio</title>
  <desc id="d">On the left, Claude Code with the copilot-studio plugin active and mcs-assistant switched off; on the right, Copilot Studio in your demo environment. Exercise 2 asks Claude Code to clone the agent, and the Grey Logistics IT Help Desk Standard agent lands in src/cs-schema/agents/Grey Logistics IT Help Desk/ with agent.mcs.yml, topics/ and .mcs. Exercise 3 runs an Advisor review that ranks its findings High, Medium and Low with file and line. Exercise 4 authors a new VPN topic, a new .mcs.yml file that validates with no errors; every change lands as a file you can diff. Exercise 5 asks it to pull, then push, which creates a draft with the topic in the Topics list and the Test pane; after Publish, a point test sends My VPN won't connect on my laptop to the published agent, which returns the operating system question. Exercise 6 runs mcs-assistant:migrate, creates the empty GH-Grey Logistics IT Help Desk on the GitHub Copilot harness, writes MIGRATION-PLAN-&lt;id&gt;.md and, after you approve the plan, builds and pushes it while the original stays unchanged. Dots carry each command across, and the boxes light up in exercise order.</desc>
