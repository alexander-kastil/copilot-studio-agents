<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Skills for Copilot Studio: one entry point, four sub-agents, thirty-one skills</title>
  <desc id="d">Claude Code, GitHub Copilot CLI and VS Code feed one SessionStart hook that injects hooks/system-prompt.md, a routing policy that delegates every request to a sub-agent and never calls a skill directly. The four sub-agents are Author for topics, actions and knowledge; Manage for clone, push, pull and publish; Test for evaluations, point tests and the Copilot Studio Kit; and Advisor for patterns, review and debugging. Their skills are 11 authoring, 2 ALM, 10 testing and 7 shared skills, plus create-eval for the plugin's own evals. They run against the local workspace, the bundled Node scripts, the reference schemas and Copilot Studio.</desc>
