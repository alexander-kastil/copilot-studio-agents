<circle cx="1154" cy="590" r="14" fill="#57606a"><animate attributeName="r" values="14;14;24;14;14" keyTimes="0;0.4468;0.4668;0.5068;1" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1262" cy="590" r="14" fill="#57606a"><animate attributeName="r" values="14;14;24;14;14" keyTimes="0;0.5339;0.5539;0.5939;1" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1370" cy="590" r="14" fill="#57606a"><animate attributeName="r" values="14;14;24;14;14" keyTimes="0;0.6210;0.6410;0.6810;1" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1478" cy="590" r="14" fill="#57606a"><animate attributeName="r" values="14;14;24;14;14" keyTimes="0;0.7081;0.7281;0.7681;1" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1586" cy="590" r="14" fill="#57606a"><animate attributeName="r" values="14;14;24;14;14" keyTimes="0;0.7952;0.8152;0.8552;1" dur="10s" repeatCount="indefinite"/></circle>
<rect x="640" y="770" width="350" height="80" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="815.0" y="821" font-size="28" fill="#24292f" text-anchor="middle">Schedule-triggered</text>
<rect x="640" y="770" width="350" height="80" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0323;0.0523;0.2945;0.3145;1.0000" dur="10s" repeatCount="indefinite"/></rect>
<rect x="1090" y="770" width="360" height="80" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1270.0" y="821" font-size="28" fill="#24292f" text-anchor="middle">Condition-triggered</text>
<rect x="1090" y="770" width="360" height="80" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3952;0.4152;0.6655;0.6855;1.0000" dur="10s" repeatCount="indefinite"/></rect>
<rect x="1550" y="770" width="230" height="80" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="1665.0" y="821" font-size="28" fill="#24292f" text-anchor="middle">One-shot</text>
<rect x="1550" y="770" width="230" height="80" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.7661;0.7861;0.9316;0.9516;1.0000" dur="10s" repeatCount="indefinite"/></rect>
<path d="M600,985 L1832,985" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<text x="575" y="995" font-size="28" font-weight="600" fill="#24292f" text-anchor="end">Time</text>
</svg>
