<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">One shared memory for everyone the agent works with</title>
<desc id="d">What one person explains, even in a one-to-one chat, goes into one shared memory for everyone the agent works with: facts about the work such as team processes and terminology, and details about people such as how someone prefers to receive updates. Later conversations with other people can use it. The People card states that anything shared can be summarized in responses to any user, even users without permission to the original file or chat, regardless of sensitivity label.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#57606a"/></marker></defs>
<rect x="60" y="340" width="460" height="220" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="90" y="405" font-size="32" font-weight="600" fill="#24292f">One person explains</text>
<text x="90" y="452" font-size="28" fill="#57606a">even in a one-to-one chat</text>
<rect x="640" y="150" width="640" height="610" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
<text x="680" y="215" font-size="32" font-weight="600" fill="#24292f">One shared memory</text>
<text x="680" y="258" font-size="28" fill="#57606a">for everyone it works with</text>
<rect x="680" y="300" width="560" height="200" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="710" y="360" font-size="30" font-weight="600" fill="#24292f">Facts about the work</text>
<text x="710" y="410" font-size="28" fill="#57606a">Team processes</text>
<text x="710" y="450" font-size="28" fill="#57606a">and terminology</text>
<rect x="680" y="530" width="560" height="200" rx="16" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text x="710" y="590" font-size="30" font-weight="600" fill="#24292f">Details about people</text>
<text x="710" y="640" font-size="28" fill="#57606a">How someone prefers</text>
<text x="710" y="680" font-size="28" fill="#57606a">to receive updates</text>
<rect x="1400" y="340" width="460" height="220" rx="16" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
<text x="1430" y="405" font-size="32" font-weight="600" fill="#24292f">Later conversations</text>
<text x="1430" y="452" font-size="28" fill="#57606a">with other people</text>
<text x="1430" y="492" font-size="28" fill="#57606a">can use it</text>
<path d="M520,450 L632,450" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1280,450 L1392,450" fill="none" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
<rect x="70" y="820" width="1780" height="170" rx="16" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
<text x="110" y="885" font-size="28" fill="#24292f">The People card: anything shared can be summarized in the agent's responses to any user,</text>
<text x="110" y="935" font-size="28" fill="#24292f">even users without permission to the original file or chat, regardless of sensitivity label.</text>
<rect x="60" y="340" width="460" height="220" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.0250;0.0500;0.1500;0.1750;1.0000" dur="8s" repeatCount="indefinite"/></rect>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M520,450 L632,450" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.1375;0.2125;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1335;0.1375;0.2125;0.2185;1" dur="8s" repeatCount="indefinite"/></circle>
<rect x="640" y="150" width="640" height="610" rx="20" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2000;0.2250;0.4000;0.4250;1.0000" dur="8s" repeatCount="indefinite"/></rect>
<circle r="14" fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0"><animateMotion path="M1280,450 L1392,450" dur="8s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.3875;0.4625;1"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3835;0.3875;0.4625;0.4685;1" dur="8s" repeatCount="indefinite"/></circle>
<rect x="1400" y="340" width="460" height="220" rx="16" fill="none" stroke="#e0a534" stroke-width="7" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4500;0.4750;0.6500;0.6750;1.0000" dur="8s" repeatCount="indefinite"/></rect>
</svg>
