<title id="t">The five topics of the AI teammates module</title>
<desc id="d">Topic 01, Meet Autopilot: digital teammates in Microsoft 365, leads to two paths. The Autopilot path continues with topic 02, Working with Autopilot: goals, memory and long-running work. The agent account path continues with topic 03, Agent Accounts: its own identity for a Copilot Studio agent, and topic 04, Proactive Teammates: triggers, email and Teams mentions. Both paths end in topic 05, Shared Memory, Licensing and Teammate Governance.</desc>
