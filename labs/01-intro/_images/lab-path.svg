<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The module 1 lab path</title>
  <desc id="d">First the Agents and SharePoint Agents labs: Making agents with Agent Builder and Understanding and Building SharePoint Agents on Copilot Camp, with exercises MAB, MAB1, MSA, MSA1 and MSA2. All later labs are optional: the Productivity Agents labs Analyst Agent and Researcher Agent on Microsoft Learn, which need a Microsoft Copilot license, then Share and use agents on Microsoft Learn, and Get started with Workflows in Microsoft 365 Copilot on Microsoft Support, which also needs Microsoft Frontier program access.</desc>
