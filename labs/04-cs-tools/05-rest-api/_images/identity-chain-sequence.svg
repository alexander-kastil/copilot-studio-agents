<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The identity chain from the Agentic HR agent to the secured HR Service API</title>
  <desc id="d">A sequence across four participants: the Agentic HR agent in Microsoft 365 Copilot Chat, the HR-Services custom connector registered as HR-Service-Consumer, Microsoft Entra ID, and the HR Service API behind the dev tunnel registered as HR-Service-API. The agent calls Get all candidates on the connector, the user signs in with Entra ID, Entra ID returns a token for HR.Consume, the connector sends GET /api/candidates with the user's token, the API checks audience and HR.Consume scope and logs Token is valid for user username, and the candidate list returns to the agent. An animation walks the messages in order.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g stroke="#8c959f" stroke-width="2" stroke-dasharray="8 8">
      <line x1="255" y1="200" x2="255" y2="1030"/>
      <line x1="725" y1="302" x2="725" y2="1030"/>
      <line x1="1195" y1="200" x2="1195" y2="1030"/>
      <line x1="1665" y1="302" x2="1665" y2="1030"/>
    </g>

    <g stroke="#8c959f" stroke-width="2">
      <rect x="65" y="50" width="380" height="150" rx="16" fill="#f6f8fa"/>
      <rect x="535" y="50" width="380" height="150" rx="16" fill="#eaf2ff"/>
      <rect x="1005" y="50" width="380" height="150" rx="16" fill="#f3edff"/>
      <rect x="1475" y="50" width="380" height="150" rx="16" fill="#e9f7ef"/>
      <rect x="555" y="212" width="340" height="90" rx="12" fill="#f3edff"/>
      <rect x="1495" y="212" width="340" height="90" rx="12" fill="#f3edff"/>
    </g>
    <g font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">
      <text x="255" y="104">Agentic HR</text>
      <text x="725" y="114">HR-Services</text>
      <text x="1195" y="114">Microsoft Entra ID</text>
      <text x="1665" y="114">HR Service API</text>
    </g>
    <g font-size="28" fill="#57606a" text-anchor="middle">
      <text x="255" y="146">in Microsoft 365</text>
      <text x="255" y="182">Copilot Chat</text>
      <text x="725" y="158">custom connector</text>
      <text x="1195" y="158">OAuth 2.0</text>
      <text x="1665" y="158">behind the dev tunnel</text>
      <text x="725" y="248">app registration</text>
      <text x="1665" y="248">app registration</text>
    </g>
    <g font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">
      <text x="725" y="286">HR-Service-Consumer</text>
      <text x="1665" y="286">HR-Service-API</text>
    </g>

    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <line x1="255" y1="370" x2="719" y2="370"/>
      <line x1="725" y1="470" x2="1189" y2="470"/>
      <line x1="1195" y1="570" x2="731" y2="570" stroke-dasharray="12 8"/>
      <line x1="725" y1="680" x2="1659" y2="680"/>
      <path d="M1665,750 h80 v60 h-74"/>
      <line x1="1665" y1="990" x2="261" y2="990" stroke-dasharray="12 8"/>
    </g>

    <g font-size="28" fill="#24292f" text-anchor="middle">
      <text x="490" y="352">Get all candidates</text>
      <text x="960" y="452">user signs in</text>
      <text x="960" y="552">token for <tspan font-family="Consolas, Menlo, monospace">HR.Consume</tspan></text>
      <text x="960" y="662" font-family="Consolas, Menlo, monospace">GET /api/candidates</text>
      <text x="960" y="720" fill="#57606a">with the user's token</text>
      <text x="490" y="972">candidate list</text>
    </g>
    <g font-size="28" fill="#24292f" text-anchor="end">
      <text x="1640" y="770">checks audience and</text>
      <text x="1640" y="808"><tspan font-family="Consolas, Menlo, monospace">HR.Consume</tspan> scope</text>
    </g>
    <rect x="1255" y="830" width="390" height="104" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <g font-family="Consolas, Menlo, monospace" font-size="28" fill="#24292f">
      <text x="1280" y="872">Token is valid for</text>
      <text x="1280" y="912">user &lt;username&gt;</text>
    </g>

    <rect x="1255" y="830" width="390" height="104" rx="10" fill="none" stroke="#e0a534" stroke-width="7" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.58;0.60;0.68;0.70;1"/>
    </rect>
    <g fill="#e0a534">
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M255,370 L725,370" keyPoints="0;0;1;1" keyTimes="0;0.02;0.10;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.019;0.02;0.10;0.101;1"/>
      </circle>
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M725,470 L1195,470" keyPoints="0;0;1;1" keyTimes="0;0.12;0.20;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.119;0.12;0.20;0.201;1"/>
      </circle>
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M1195,570 L725,570" keyPoints="0;0;1;1" keyTimes="0;0.22;0.30;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.219;0.22;0.30;0.301;1"/>
      </circle>
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M725,680 L1665,680" keyPoints="0;0;1;1" keyTimes="0;0.32;0.46;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.319;0.32;0.46;0.461;1"/>
      </circle>
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M1665,750 h80 v60 h-80" keyPoints="0;0;1;1" keyTimes="0;0.48;0.58;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.479;0.48;0.58;0.581;1"/>
      </circle>
      <circle r="14" opacity="0">
        <animateMotion dur="10s" repeatCount="indefinite" path="M1665,990 L255,990" keyPoints="0;0;1;1" keyTimes="0;0.72;0.88;1" calcMode="linear"/>
        <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.719;0.72;0.88;0.881;1"/>
      </circle>
    </g>
  </g>
</svg>
