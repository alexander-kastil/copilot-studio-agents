<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The prompt Ticket customer communication inside the Check Ticket Status topic</title>
  <desc id="d">Left, the topic Check Ticket Status: the ticket from ServiceNow, shown in an Adaptive Card, is in SNTicketInfo; a Prompt node passes SNTicketInfo to the input Ticket Details and saves the output as PersonalizedMessage; a Message node shows PersonalizedMessage.text. Right, the AI Builder prompt the node calls: input Ticket Details, instructions for a personalized, apologetic message to the person impacted, model GPT4o, tested with the ServiceNow sample JSON, output text.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">
    <rect x="60" y="60" width="720" height="960" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="90" y="112" font-size="30" font-weight="700">Topic: Check Ticket Status</text>

    <rect x="100" y="160" width="640" height="190" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="215" text-anchor="middle" font-weight="700">Ticket from ServiceNow</text>
    <text x="420" y="260" text-anchor="middle" fill="#57606a">shown in an Adaptive Card</text>
    <text x="420" y="315" text-anchor="middle" font-family="Consolas, monospace">SNTicketInfo</text>

    <rect x="100" y="430" width="640" height="260" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="485" text-anchor="middle" font-weight="700">Prompt node</text>
    <text x="420" y="527" text-anchor="middle" fill="#57606a">Call an action</text>
    <text x="140" y="590">Ticket Details</text>
    <text x="700" y="590" text-anchor="end" font-family="Consolas, monospace">SNTicketInfo</text>
    <text x="140" y="650">Output</text>
    <text x="700" y="650" text-anchor="end" font-family="Consolas, monospace">PersonalizedMessage</text>

    <rect x="100" y="770" width="640" height="190" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <text x="420" y="835" text-anchor="middle" font-weight="700">Message</text>
    <text x="420" y="895" text-anchor="middle" font-family="Consolas, monospace">PersonalizedMessage.text</text>

    <rect x="900" y="200" width="960" height="700" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1380" y="268" text-anchor="middle" font-size="30" font-weight="700">Ticket customer communication</text>
    <text x="1380" y="312" text-anchor="middle" fill="#57606a">AI Builder prompt</text>
    <rect x="930" y="350" width="900" height="520" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <g font-weight="700">
      <text x="960" y="420">Input</text>
      <text x="960" y="510">Instructions</text>
      <text x="960" y="640">Model</text>
      <text x="960" y="730">Test with</text>
      <text x="960" y="820">Output</text>
    </g>
    <text x="1200" y="420">Ticket Details</text>
    <text x="1200" y="510">a personalized, apologetic message</text>
    <text x="1200" y="550">to the person impacted</text>
    <text x="1200" y="640">GPT4o</text>
    <text x="1200" y="730">ServiceNow sample JSON</text>
    <text x="1200" y="820" font-family="Consolas, monospace">text</text>
    <g stroke="#d0d7de" stroke-width="2">
      <line x1="960" y1="458" x2="1800" y2="458"/>
      <line x1="960" y1="588" x2="1800" y2="588"/>
      <line x1="960" y1="678" x2="1800" y2="678"/>
      <line x1="960" y1="768" x2="1800" y2="768"/>
    </g>

    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="490" y1="580" x2="356" y2="580"/>
      <line x1="252" y1="640" x2="386" y2="640"/>
      <line x1="420" y1="350" x2="420" y2="422"/>
      <line x1="420" y1="690" x2="420" y2="762"/>
    </g>
    <line x1="740" y1="560" x2="892" y2="560" stroke="#57606a" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#ah)"/>
    <text x="846" y="540" text-anchor="middle" fill="#57606a">calls</text>
  </g>
</svg>
