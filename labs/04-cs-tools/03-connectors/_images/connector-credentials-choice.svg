<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">User credentials compared with maker-provided credentials for a connector tool</title>
  <desc id="d">Left, user credentials, the default: each user reaches the List product support files tool with their own identity, the Products library is read as each signed-in user, a Connect to continue card appears on first use, and each user sees only what their SharePoint permissions allow; right for a library with mixed permissions. Right, maker-provided credentials: every user goes through the tool on the maker's connection, there is no Connect to continue card, and every user reads SharePoint as the maker; right for a library readable by all employees.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#8c959f"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="70" y="80" width="860" height="920" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <rect x="990" y="80" width="860" height="920" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="110" y="144" font-size="34" font-weight="700" fill="#24292f">User credentials <tspan font-size="28" font-weight="400" fill="#57606a">(default)</tspan></text>
    <text x="1030" y="144" font-size="34" font-weight="700" fill="#24292f">Maker-provided credentials</text>

    <g stroke="#8c959f" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <line x1="330" y1="318" x2="330" y2="414"/>
      <line x1="670" y1="318" x2="670" y2="414"/>
      <line x1="330" y1="540" x2="330" y2="634"/>
      <line x1="670" y1="540" x2="670" y2="634"/>
      <line x1="1250" y1="318" x2="1400" y2="415"/>
      <line x1="1590" y1="318" x2="1440" y2="415"/>
      <line x1="1420" y1="540" x2="1420" y2="634"/>
    </g>

    <g fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
      <circle cx="330" cy="222" r="30"/>
      <path d="M280,316 a50,50 0 0 1 100,0 z"/>
      <circle cx="670" cy="222" r="30"/>
      <path d="M620,316 a50,50 0 0 1 100,0 z"/>
      <circle cx="1250" cy="222" r="30"/>
      <path d="M1200,316 a50,50 0 0 1 100,0 z"/>
      <circle cx="1590" cy="222" r="30"/>
      <path d="M1540,316 a50,50 0 0 1 100,0 z"/>
    </g>

    <g fill="#ffffff" stroke="#8c959f" stroke-width="2">
      <rect x="170" y="420" width="660" height="120" rx="14"/>
      <rect x="1090" y="420" width="660" height="120" rx="14"/>
    </g>
    <g fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
      <rect x="170" y="640" width="660" height="130" rx="14"/>
      <rect x="1090" y="640" width="660" height="130" rx="14"/>
    </g>
    <g font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">
      <text x="500" y="491">List product support files</text>
      <text x="1420" y="491">List product support files</text>
      <text x="500" y="696"><tspan font-family="Consolas, Menlo, monospace">Products</tspan> library</text>
      <text x="1420" y="696"><tspan font-family="Consolas, Menlo, monospace">Products</tspan> library</text>
    </g>
    <g font-size="28" fill="#57606a" text-anchor="middle">
      <text x="500" y="740">read as each signed-in user</text>
      <text x="1420" y="740">read through the maker's connection</text>
    </g>

    <g font-size="28" fill="#57606a">
      <text x="110" y="846">Connect to continue card on first use</text>
      <text x="110" y="888">each user sees only what SharePoint allows them</text>
      <text x="1030" y="846">no Connect to continue card</text>
      <text x="1030" y="888">every user reads SharePoint as you</text>
    </g>
    <g font-size="28" font-weight="700" fill="#24292f">
      <text x="110" y="950">Right for a library with mixed permissions</text>
      <text x="1030" y="950">Right for a library readable by all employees</text>
    </g>
  </g>
</svg>
