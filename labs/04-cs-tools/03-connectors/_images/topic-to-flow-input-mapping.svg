<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">How the topic hands the candidate to the agent flow</title>
  <desc id="d">Four rows map each value across three names. First name: adaptive card id firstname, tool input text, flow input Firstname. Last name: lastname, text_1, Lastname. Current role: current_role, text_2, Role. Expertise: expertise, text_3, Expertise. The ids come from Ask with adaptive card, the tool inputs are set with + Set value in the tool node, and the flow inputs are defined in When an agent calls the flow.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">
    <text x="620" y="170" text-anchor="middle" font-weight="700">Adaptive card field id</text>
    <text x="1130" y="170" text-anchor="middle" font-weight="700">Tool input</text>
    <text x="1645" y="170" text-anchor="middle" font-weight="700">Flow input parameter</text>

    <g fill="#57606a" font-size="30">
      <text x="80" y="286">First name</text>
      <text x="80" y="456">Last name</text>
      <text x="80" y="626">Current role</text>
      <text x="80" y="796">Expertise</text>
    </g>

    <g fill="#f3edff" stroke="#8c959f" stroke-width="2">
      <rect x="420" y="220" width="400" height="110" rx="14"/>
      <rect x="420" y="390" width="400" height="110" rx="14"/>
      <rect x="420" y="560" width="400" height="110" rx="14"/>
      <rect x="420" y="730" width="400" height="110" rx="14"/>
    </g>
    <g font-family="Consolas, monospace" font-size="30" text-anchor="middle">
      <text x="620" y="286">firstname</text>
      <text x="620" y="456">lastname</text>
      <text x="620" y="626">current_role</text>
      <text x="620" y="796">expertise</text>
    </g>

    <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
      <rect x="930" y="220" width="400" height="110" rx="14"/>
      <rect x="930" y="390" width="400" height="110" rx="14"/>
      <rect x="930" y="560" width="400" height="110" rx="14"/>
      <rect x="930" y="730" width="400" height="110" rx="14"/>
    </g>
    <g font-family="Consolas, monospace" font-size="30" text-anchor="middle">
      <text x="1130" y="286">text</text>
      <text x="1130" y="456">text_1</text>
      <text x="1130" y="626">text_2</text>
      <text x="1130" y="796">text_3</text>
    </g>

    <g fill="#ffffff" stroke="#e0a534" stroke-width="2">
      <rect x="1440" y="220" width="410" height="110" rx="55"/>
      <rect x="1440" y="390" width="410" height="110" rx="55"/>
      <rect x="1440" y="560" width="410" height="110" rx="55"/>
      <rect x="1440" y="730" width="410" height="110" rx="55"/>
    </g>
    <g font-size="30" text-anchor="middle">
      <text x="1645" y="286">Firstname</text>
      <text x="1645" y="456">Lastname</text>
      <text x="1645" y="626">Role</text>
      <text x="1645" y="796">Expertise</text>
    </g>

    <g stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
      <line x1="820" y1="275" x2="922" y2="275"/>
      <line x1="820" y1="445" x2="922" y2="445"/>
      <line x1="820" y1="615" x2="922" y2="615"/>
      <line x1="820" y1="785" x2="922" y2="785"/>
      <line x1="1330" y1="275" x2="1432" y2="275"/>
      <line x1="1330" y1="445" x2="1432" y2="445"/>
      <line x1="1330" y1="615" x2="1432" y2="615"/>
      <line x1="1330" y1="785" x2="1432" y2="785"/>
    </g>

    <g fill="#57606a" text-anchor="middle">
      <text x="620" y="930">Ask with adaptive card</text>
      <text x="1130" y="930">tool node: + Set value</text>
      <text x="1645" y="930">When an agent calls the flow</text>
    </g>
  </g>
</svg>
