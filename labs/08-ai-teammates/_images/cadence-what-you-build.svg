<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">What you build in Labs 3 and 4: the Cadence agent</title>
<desc id="d">Lab 3 builds Cadence in Copilot Studio Preview on an early release environment: the Cadence instructions, an agent account with display name and email, the authentication mode of each tool, and publishing to the Teams people picker and the directory. Lab 4 adds a recurrence trigger and an email trigger, a workstream tracker in a SharePoint site that Cadence reads, a new review document in the approved team folder, and reviewers who get the link and send updates by email reply or by mention in Teams.</desc>
