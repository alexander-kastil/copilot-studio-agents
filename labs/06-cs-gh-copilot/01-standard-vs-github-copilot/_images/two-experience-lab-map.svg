<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">Where each exercise of the two-experience lab lands</title>
  <desc id="d">On the left, one environment holds the New agent menu on the Agents page (exercises 1 and 5), a Standard agent (exercise 2) and the Northwind Sales Assistant built as a GitHub Copilot agent (exercises 3, 4, 6, 7 and 8). On the right, the Northwind Agent Decision Card lists its sections with the exercise that fills each one: where you choose the kind, Standard agent navigation, GitHub Copilot navigation, the authoring model, conversion between them, the per-agent decision, and a final review in exercise 10. A highlight steps through the exercises in order.</desc>
