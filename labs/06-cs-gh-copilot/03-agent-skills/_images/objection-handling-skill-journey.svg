  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="80" y="120" width="500" height="800" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="330" y="190" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">ZIP package</text>
  <text x="330" y="236" text-anchor="middle" font-size="28" fill="#57606a">Steps 1 to 4</text>

  <rect x="110" y="280" width="440" height="160" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="140" y="332" font-size="28" font-weight="700" font-family="Consolas, monospace" fill="#24292f">SKILL.md</text>
  <text x="520" y="332" text-anchor="end" font-size="28" fill="#57606a">at the root</text>
  <text x="140" y="380" font-size="28" fill="#57606a">name, description,</text>
  <text x="140" y="420" font-size="28" fill="#57606a">four-move method</text>

  <rect x="110" y="490" width="440" height="160" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="140" y="555" font-size="28" font-family="Consolas, monospace" fill="#24292f">references/</text>
  <text x="140" y="602" font-size="28" fill="#57606a">folder beside SKILL.md</text>

  <polyline points="128,650 128,780 150,780" fill="none" stroke="#8c959f" stroke-width="2"/>
  <rect x="150" y="700" width="400" height="160" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="175" y="765" font-size="28" font-family="Consolas, monospace" fill="#24292f">objection-handling.md</text>
  <text x="175" y="812" font-size="28" fill="#57606a">standard responses</text>

  <rect x="740" y="120" width="460" height="800" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="970" y="190" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Sales Assistant</text>
  <text x="970" y="236" text-anchor="middle" font-size="28" fill="#57606a">Steps 5 to 7</text>
