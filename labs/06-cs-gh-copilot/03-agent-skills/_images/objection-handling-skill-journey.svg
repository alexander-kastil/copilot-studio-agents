<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The objection-handling skill: one ZIP package, tested and refined on the Sales Assistant, reused on the Account Manager</title>
  <desc id="d">Steps 1 to 4 build a ZIP package with SKILL.md at the root, holding the name, description and four-move method, and a references folder beside it with objection-handling.md, the standard responses. Steps 5 to 7 upload the ZIP to the Sales Assistant, test in Preview that it fires on an objection, then refine it and Replace it so it stays one skill. In Step 8 the downloaded package is uploaded to the Account Manager, where Preview gives the same labelled reply from the identical package with no re-authoring.</desc>
