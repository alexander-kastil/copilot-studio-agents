  <text x="970" y="765" text-anchor="middle" font-size="30" fill="#24292f">Refine and Replace</text>
  <text x="970" y="812" text-anchor="middle" font-size="28" fill="#57606a">still one skill</text>

  <rect x="1360" y="120" width="460" height="800" rx="18" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="190" text-anchor="middle" font-size="36" font-weight="700" fill="#24292f">Account Manager</text>
  <text x="1590" y="236" text-anchor="middle" font-size="28" fill="#57606a">Step 8</text>
  <rect x="1390" y="280" width="400" height="160" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="345" text-anchor="middle" font-size="30" fill="#24292f">Upload a skill</text>
  <text x="1590" y="392" text-anchor="middle" font-size="28" fill="#57606a">the downloaded package</text>
