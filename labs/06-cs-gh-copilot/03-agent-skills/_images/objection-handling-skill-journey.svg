  </rect>
  <rect x="1390" y="700" width="400" height="160" rx="12" fill="none" stroke="#1a7f37" stroke-width="6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.84;0.845;0.96;0.965;1" dur="10s" repeatCount="indefinite"/>
  </rect>

  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="1">
    <animateMotion path="M580,360 L736,360" keyPoints="0;1;1" keyTimes="0;0.12;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.12;0.125;1" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="0" r="13" fill="#1a7f37" opacity="0">
    <animateMotion path="M1200,360 L1356,360" keyPoints="0;0;1;1" keyTimes="0;0.48;0.6;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.479;0.48;0.6;0.605;1" dur="10s" repeatCount="indefinite"/>
