  <text x="970" y="345" text-anchor="middle" font-size="30" fill="#24292f">Upload a skill</text>
  <text x="970" y="392" text-anchor="middle" font-size="28" fill="#57606a">the ZIP</text>
  <rect x="770" y="490" width="400" height="160" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="970" y="555" text-anchor="middle" font-size="30" fill="#24292f">Test in Preview</text>
  <text x="970" y="602" text-anchor="middle" font-size="28" fill="#57606a">fires on an objection</text>
