<title id="t">What you build: the Sales Account Assistant, component by component</title>
<desc id="d">The finished Sales Account Assistant on the Build tab, with the lab step that fills each component: Instructions in Steps 1 and 2, the northwind-products and northwind-accounts Knowledge in Steps 3 and 4, the Send an email action, the Dataverse MCP server and the Send Account Follow-Up workflow as Tools in Steps 5, 6, 9 and 10, and the account-research Skill in Step 8. Preview tests run in Steps 4, 7, 8, 10 and 11, and Step 11 publishes to Teams and Microsoft 365 Copilot.</desc>
