<text x="1290" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f" text-anchor="start">12 cases Organic Green Tea,</text>
<text x="1290" y="290" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#24292f" text-anchor="start">1 case backordered</text>
