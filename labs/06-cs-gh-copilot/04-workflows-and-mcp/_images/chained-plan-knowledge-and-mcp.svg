<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">One question, one plan across Knowledge and the Dataverse MCP server</title>
<desc id="d">The Step 7 Preview question about Around the Horn reaches the orchestrator, which plans the lookups itself: the last-quarter order from northwind-accounts, the Tier 2 lead time from northwind-products and the open cases from the Dataverse MCP server. The results come back as one answer in one turn, and Get rationale shows the plan.</desc>
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<defs><marker id="ah" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="#57606a"/></marker></defs>
<rect x="80" y="120" width="560" height="440" rx="18" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
<text x="120" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="start">Preview</text>
<text x="120" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">Prepare me for my call</text>
<text x="120" y="307" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">with Around the Horn:</text>
<text x="120" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">what did they order last</text>
<text x="120" y="397" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">quarter, any open cases,</text>
<text x="120" y="442" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">and their standard lead</text>
<text x="120" y="487" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#24292f" text-anchor="start">time?</text>
<rect x="760" y="230" width="340" height="220" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
<text x="930" y="315" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Orchestrator</text>
<text x="930" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">plans the order</text>
<text x="930" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#57606a" text-anchor="middle">itself</text>
