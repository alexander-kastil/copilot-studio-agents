<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">The order of the GitHub Copilot agent labs</title>
  <desc id="d">Four labs each isolate one surface: the New agent menu, the Build tabs, Evaluate and Skills. All four feed the fifth lab, the capstone Sales Account Assistant that is built, grounded, tooled up, given a skill and published. The last two labs then add IQ grounding with Work IQ and apps that are built and shared.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#ffffff"/>

  <g font-size="28">
    <rect x="80" y="100" width="640" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="150" cy="185" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="195" font-weight="700" fill="#24292f" text-anchor="middle">01</text>
    <text x="216" y="173" font-size="32" font-weight="700" fill="#24292f">The New agent menu</text>
    <text x="216" y="219" fill="#57606a">Standard vs. GitHub Copilot</text>

    <rect x="80" y="320" width="640" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="150" cy="405" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="415" font-weight="700" fill="#24292f" text-anchor="middle">02</text>
    <text x="216" y="393" font-size="32" font-weight="700" fill="#24292f">The Build tabs</text>
    <text x="216" y="439" fill="#57606a">Build, evaluate, monitor</text>

    <rect x="80" y="540" width="640" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="150" cy="625" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="635" font-weight="700" fill="#24292f" text-anchor="middle">03</text>
    <text x="216" y="613" font-size="32" font-weight="700" fill="#24292f">Evaluate</text>
    <text x="216" y="659" fill="#57606a">Evaluate with test sets</text>

    <rect x="80" y="760" width="640" height="170" rx="16" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="150" cy="845" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="150" y="855" font-weight="700" fill="#24292f" text-anchor="middle">04</text>
    <text x="216" y="833" font-size="32" font-weight="700" fill="#24292f">Skills</text>
    <text x="216" y="879" fill="#57606a">A portable <tspan font-family="Consolas, monospace">SKILL.md</tspan></text>
  </g>

  <g fill="none" stroke="#57606a" stroke-width="3">
    <path d="M720,185 H790 V845 H720"/>
    <line x1="720" y1="405" x2="790" y2="405"/>
    <line x1="720" y1="625" x2="790" y2="625"/>
    <line x1="790" y1="515" x2="866" y2="515" marker-end="url(#ah)"/>
  </g>

  <rect x="870" y="350" width="460" height="330" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <circle cx="1100" cy="420" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
  <text x="1100" y="430" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">05</text>
  <text x="1100" y="504" font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">Capstone agent</text>
  <text x="1100" y="550" font-size="28" fill="#24292f" text-anchor="middle">Sales Account Assistant</text>
  <text x="1100" y="604" font-size="28" fill="#57606a" text-anchor="middle">Build, ground, tool up,</text>
  <text x="1100" y="642" font-size="28" fill="#57606a" text-anchor="middle">skill, and publish</text>

  <g fill="none" stroke="#57606a" stroke-width="3">
    <line x1="1330" y1="515" x2="1390" y2="515"/>
    <path d="M1390,515 V300 H1436" marker-end="url(#ah)"/>
    <path d="M1390,515 V730 H1436" marker-end="url(#ah)"/>
  </g>

  <g font-size="28">
    <rect x="1440" y="215" width="420" height="170" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1510" cy="300" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1510" y="310" font-weight="700" fill="#24292f" text-anchor="middle">06</text>
    <text x="1576" y="288" font-size="32" font-weight="700" fill="#24292f">IQ grounding</text>
    <text x="1576" y="334" fill="#57606a">With Work IQ</text>

    <rect x="1440" y="645" width="420" height="170" rx="16" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <circle cx="1510" cy="730" r="36" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1510" y="740" font-weight="700" fill="#24292f" text-anchor="middle">07</text>
    <text x="1576" y="718" font-size="32" font-weight="700" fill="#24292f">Apps</text>
    <text x="1576" y="764" fill="#57606a">Build and share</text>
  </g>
</svg>
