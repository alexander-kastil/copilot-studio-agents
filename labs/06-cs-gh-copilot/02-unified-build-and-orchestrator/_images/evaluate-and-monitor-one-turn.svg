<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title id="t">What Evaluate and Monitor each read from one turn</title>
  <desc id="d">The test case What is the capital of France? from the Northwind quality set produces one turn with two parts. The answer text declines because the question is unrelated to Northwind sales; the Evaluate tab's General quality test method reads that answer text for relevance and completeness. The activity shows Send an email was not called; the Monitor tab shows the transcript and the resources used, here no tool call.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g transform="translate(0,40)">

  <rect x="70" y="365" width="400" height="340" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="270" y="435" font-size="28" fill="#57606a" text-anchor="middle">Test case</text>
  <g font-size="34" font-weight="700" fill="#24292f" text-anchor="middle">
    <text x="270" y="505">What is the</text>
    <text x="270" y="550">capital of</text>
    <text x="270" y="595">France?</text>
  </g>
  <text x="270" y="660" font-size="28" fill="#57606a" text-anchor="middle">Northwind quality set</text>

  <text x="900" y="140" font-size="32" font-weight="700" fill="#57606a" text-anchor="middle">One turn</text>

  <rect x="630" y="180" width="540" height="290" rx="20" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="900" y="250" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Answer text</text>
  <g font-size="30" fill="#24292f" text-anchor="middle">
    <text x="900" y="320">Declines: the question</text>
    <text x="900" y="365">is unrelated to</text>
    <text x="900" y="410">Northwind sales</text>
  </g>

  <rect x="630" y="600" width="540" height="290" rx="20" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="900" y="670" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Activity</text>
  <text x="900" y="760" font-size="32" font-weight="700" fill="#24292f" text-anchor="middle">Send an email</text>
  <text x="900" y="810" font-size="30" fill="#24292f" text-anchor="middle">not called</text>

  <rect x="1330" y="180" width="520" height="290" rx="20" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="250" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Evaluate tab</text>
  <g font-size="30" fill="#24292f" text-anchor="middle">
    <text x="1590" y="320">General quality reads</text>
    <text x="1590" y="365">the answer text:</text>
    <text x="1590" y="410">relevance, completeness</text>
  </g>

  <rect x="1330" y="600" width="520" height="290" rx="20" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
  <text x="1590" y="670" font-size="36" font-weight="700" fill="#24292f" text-anchor="middle">Monitor tab</text>
  <g font-size="30" fill="#24292f" text-anchor="middle">
    <text x="1590" y="740">Shows the transcript</text>
    <text x="1590" y="785">and the resources used:</text>
    <text x="1590" y="830">no tool call here</text>
  </g>

  <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
    <path d="M478,535 H560 V325 H622"/>
    <path d="M478,535 H560 V745 H622"/>
    <line x1="1178" y1="325" x2="1322" y2="325"/>
    <line x1="1178" y1="745" x2="1322" y2="745"/>
  </g>
  </g>
</svg>
