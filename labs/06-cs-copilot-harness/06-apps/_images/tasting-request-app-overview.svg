<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The tasting request app you build in this lab</title>
  <desc id="d">The lab file aurora-provisions-tasting-requests.csv is attached as context only in Step 2. In Step 3 the app reads and writes the Aurora Tasting Requests SharePoint list, whose first records are the ten CSV rows. Steps 4 to 6 add the status filter, the priority sort, and publish the app. In Step 7 the classmate gets app access, and in Step 8 list access.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="22" markerHeight="22" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <style>
      .h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:34px;font-weight:600;fill:#24292f}
      .ch{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:30px;fill:#24292f}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;fill:#57606a}
      .m{font-family:Consolas,'Courier New',monospace;font-size:28px;fill:#24292f}
      .n{font-family:'Segoe UI',Helvetica,Arial,sans-serif;font-size:28px;font-weight:700;fill:#ffffff}
      .box{stroke:#8c959f;stroke-width:2}
      .arrow{stroke:#57606a;stroke-width:3;fill:none}
      .hi{fill:none;stroke:#e0a534;stroke-width:7}
      .ring{fill:none;stroke:#e0a534;stroke-width:6}
    </style>
  </defs>

