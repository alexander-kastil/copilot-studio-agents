    </rect>
    <rect x="1440" y="920" width="420" height="70" rx="12" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.88;0.89;0.97;0.98;1"/>
    </rect>
  </g>

  <g fill="#0969da" stroke="#ffffff" stroke-width="3">
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" values="534,365;564,365;564,365" keyTimes="0;0.08;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.08"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" values="974,365;974,365;1012,365;1012,365" keyTimes="0;0.14;0.22;1"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.14;0.22"/>
    </circle>
