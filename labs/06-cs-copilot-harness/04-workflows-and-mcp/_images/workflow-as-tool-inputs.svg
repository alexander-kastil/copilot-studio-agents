<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">How the agent fills the Send Account Follow-Up inputs</title>
<desc id="d">The Sales Account Assistant fills accountName and followUpBody with AI from the conversation, while recipientEmail is pinned with Value to your own mailbox. The trigger passes the three Text inputs to Send an email (V2) as Subject, Body and To, and Respond to the agent returns status Follow-up sent to the assistant.</desc>
