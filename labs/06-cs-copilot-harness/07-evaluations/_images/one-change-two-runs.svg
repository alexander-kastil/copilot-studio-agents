<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">Two runs of the identical set with one change between them</title>
<desc id="d">Run 1, the baseline, and Run 2 share the knowledge source Northwind sales reference, the Northwind regression set, the General quality test method and the user profile you confirmed. The one change is the Instructions, from agent-instructions-v1.txt to agent-instructions-v2.txt. Run 1 records a baseline Score and verdicts in the scorecard; Run 2 compares its Score to Run 1 and marks every case that flipped.</desc>
<rect width="1920" height="1080" fill="#ffffff"/>
<defs>
<style>
.h{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f;font-weight:600}
.r{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#24292f}
.s{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a}
.c{font-family:Consolas,Menlo,monospace;fill:#24292f}
.e{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#57606a;font-weight:600}
</style>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
</defs>

