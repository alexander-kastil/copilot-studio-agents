<text class="r" x="1565" y="377" font-size="28" text-anchor="middle">Northwind regression set</text>

<text class="h" x="80" y="509" font-size="30">Test method</text>
<rect x="560" y="444" width="590" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="r" x="855" y="509" font-size="28" text-anchor="middle">General quality</text>
<text class="e" x="1210" y="514" font-size="44" text-anchor="middle">=</text>
<rect x="1270" y="444" width="590" height="110" rx="14" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
<text class="r" x="1565" y="509" font-size="28" text-anchor="middle">General quality</text>

