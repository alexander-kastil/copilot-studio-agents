<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
<title id="t">The fourteen rows of northwind-test-set.csv become seven conversations</title>
<desc id="d">The conversationNumber column of northwind-test-set.csv holds fourteen rows: three with 1, two with 2, three with 3, two with 4, two with 5, one with 6 and one with 7. Rows sharing a number become one conversation in Review your test cases (7). Conversations 1 to 4 are grounded facts, 5 and 6 are guardrails and 7 is off-topic. Total messages is twice the question count: 6 for three questions, 4 for two, 2 for one.</desc>
