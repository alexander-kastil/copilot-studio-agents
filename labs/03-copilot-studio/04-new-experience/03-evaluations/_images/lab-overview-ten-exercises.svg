<rect x="703" y="308" width="514" height="209" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.4;0.5" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<rect x="703" y="563" width="514" height="209" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.6" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<rect x="703" y="818" width="514" height="209" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.6;0.7" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<rect x="1273" y="53" width="594" height="274" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.7;0.8" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<rect x="1273" y="403" width="594" height="274" rx="24" opacity="0"><animate attributeName="opacity" values="0;1;0" keyTimes="0;0.8;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
<rect x="1273" y="753" width="594" height="274" rx="24" opacity="0"><animate attributeName="opacity" values="0;1" keyTimes="0;0.9" calcMode="discrete" dur="10s" repeatCount="indefinite"/></rect>
