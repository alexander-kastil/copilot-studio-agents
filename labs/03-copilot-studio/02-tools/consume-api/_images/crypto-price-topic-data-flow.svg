<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">How the Crypto Currency Price topic gets the Bitcoin price</title>
  <desc id="d">The topic Crypto Currency Price has three nodes. The Question node offers USD, EUR and GBP with the synonyms dollars, euros and pounds and saves the answer as Topic.Currency. The HTTP Request node sends GET .../v2/ticker/btcusd, a lowercase URL with the currency, to api.gemini.com, which returns JSON with symbol BTCUSD, bid 67837.17 and ask 67843.41. The response is parsed with the schema from sample JSON and saved as Topic.CryptoCurrentPrice. The Message node shows The current bid price for Bitcoins in USD is $67,837.17 from Topic.CryptoCurrentPrice.bid.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">
    <rect x="60" y="60" width="1800" height="440" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="90" y="112" font-size="30" font-weight="700">Topic: Crypto Currency Price</text>

    <rect x="90" y="150" width="420" height="320" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="300" y="205" text-anchor="middle" font-weight="700">Question</text>
    <rect x="115" y="232" width="110" height="50" rx="25" fill="#ffffff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="fill" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#ffffff;#fff6e5;#ffffff" keyTimes="0;0.02;0.10"/>
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.02;0.10"/>
    </rect>
    <rect x="245" y="232" width="110" height="50" rx="25" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="375" y="232" width="110" height="50" rx="25" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <g text-anchor="middle">
      <text x="170" y="267">USD</text>
      <text x="300" y="267">EUR</text>
      <text x="430" y="267">GBP</text>
    </g>
    <text x="300" y="330" text-anchor="middle" fill="#57606a">dollars, euros, pounds</text>
    <text x="300" y="390" text-anchor="middle" fill="#57606a">Save response as</text>
    <text x="300" y="435" text-anchor="middle" font-family="Consolas, monospace">Topic.Currency</text>

    <rect x="590" y="150" width="560" height="320" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.17;0.23"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.17;0.23"/>
    </rect>
    <text x="870" y="205" text-anchor="middle" font-weight="700">HTTP Request</text>
    <text x="870" y="260" text-anchor="middle" fill="#57606a">Method: GET</text>
    <text x="870" y="300" text-anchor="middle" fill="#57606a">URL: Power Fx formula</text>
    <text x="870" y="390" text-anchor="middle" fill="#57606a">Save response as</text>
    <text x="870" y="435" text-anchor="middle" font-family="Consolas, monospace">Topic.CryptoCurrentPrice</text>

    <rect x="1230" y="150" width="600" height="320" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.60;0.75"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.60;0.75"/>
    </rect>
    <text x="1530" y="205" text-anchor="middle" font-weight="700">Message</text>
    <text x="1530" y="260" text-anchor="middle">The current bid price for</text>
    <text x="1530" y="300" text-anchor="middle">Bitcoins in USD is $67,837.17</text>
    <text x="1530" y="390" text-anchor="middle" fill="#57606a">the price comes from</text>
    <text x="1530" y="435" text-anchor="middle" font-family="Consolas, monospace">{Topic.CryptoCurrentPrice.bid}</text>

    <rect x="590" y="700" width="560" height="300" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.33;0.40"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.33;0.40"/>
    </rect>
    <text x="870" y="755" text-anchor="middle" font-weight="700">api.gemini.com</text>
    <rect x="640" y="832" width="460" height="42" rx="6" fill="#fff6e5" opacity="0">
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.33;0.75"/>
    </rect>
    <g font-family="Consolas, monospace">
      <text x="660" y="820">{ "symbol": "BTCUSD",</text>
      <text x="691" y="862">"bid": "67837.17",</text>
      <text x="691" y="904">"ask": "67843.41",</text>
      <text x="691" y="946">... }</text>
    </g>

    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="510" y1="310" x2="582" y2="310"/>
      <line x1="1150" y1="310" x2="1222" y2="310"/>
      <line x1="760" y1="470" x2="760" y2="692"/>
      <line x1="980" y1="700" x2="980" y2="478"/>
    </g>
    <text x="735" y="600" text-anchor="end" font-family="Consolas, monospace">GET .../v2/ticker/btcusd</text>
    <text x="735" y="645" text-anchor="end" fill="#57606a">lowercase URL with the currency</text>
    <text x="1005" y="600" font-weight="700">JSON response</text>
    <text x="1005" y="645" fill="#57606a">parsed by the schema from sample JSON</text>
  </g>

  <g stroke="#ffffff" stroke-width="3">
    <circle r="14" fill="#e0a534" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M510 310 L582 310" keyPoints="0;0;1;1" keyTimes="0;0.10;0.17;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.10;0.17"/>
    </circle>
    <circle r="14" fill="#e0a534" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M760 470 L760 692" keyPoints="0;0;1;1" keyTimes="0;0.23;0.33;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.23;0.33"/>
    </circle>
    <circle r="14" fill="#2f855a" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M980 700 L980 478" keyPoints="0;0;1;1" keyTimes="0;0.40;0.50;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.40;0.50"/>
    </circle>
    <circle r="14" fill="#2f855a" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1150 310 L1222 310" keyPoints="0;0;1;1" keyTimes="0;0.53;0.60;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.53;0.60"/>
    </circle>
  </g>
</svg>
