<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Classic and generative orchestration side by side</title>
  <desc id="d">Two lanes. Classic: a user query goes to the topic whose trigger phrases match most closely; only topics respond and a topic can call actions explicitly; topic inputs are filled from the conversation context. Generative: a user query is matched to topics and actions mainly by their description, also by names, inputs and outputs; the agent builds a plan with one or more topics or actions in execution order; inputs come from the context, or the agent asks the user a question.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#24292f">
    <rect x="60" y="60" width="1800" height="430" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="90" y="114" font-size="30" font-weight="700">Classic</text>
    <rect x="60" y="550" width="1800" height="470" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="90" y="604" font-size="30" font-weight="700">Generative</text>

    <rect x="90" y="235" width="240" height="140" rx="70" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="210" y="298" text-anchor="middle" font-weight="700">User</text>
    <text x="210" y="336" text-anchor="middle" font-weight="700">query</text>

    <rect x="430" y="150" width="400" height="310" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.10;0.16"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.10;0.16"/>
    </rect>
    <text x="630" y="240" text-anchor="middle" font-weight="700">Trigger phrases</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="630" y="305">the topic whose</text>
      <text x="630" y="345">trigger phrases match</text>
      <text x="630" y="385">most closely</text>
    </g>

    <rect x="930" y="150" width="400" height="310" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.23;0.29"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.23;0.29"/>
    </rect>
    <text x="1130" y="240" text-anchor="middle" font-weight="700">One topic</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="1130" y="305">only topics respond;</text>
      <text x="1130" y="345">a topic can call</text>
      <text x="1130" y="385">actions explicitly</text>
    </g>

    <rect x="1430" y="150" width="400" height="310" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.36;0.44"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.36;0.44"/>
    </rect>
    <text x="1630" y="240" text-anchor="middle" font-weight="700">Topic inputs</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="1630" y="305">filled from the</text>
      <text x="1630" y="345">conversation context</text>
    </g>

    <rect x="90" y="745" width="240" height="140" rx="70" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="210" y="808" text-anchor="middle" font-weight="700">User</text>
    <text x="210" y="846" text-anchor="middle" font-weight="700">query</text>

    <rect x="430" y="640" width="400" height="350" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.57;0.63"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.57;0.63"/>
    </rect>
    <text x="630" y="712" text-anchor="middle" font-weight="700">Descriptions</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="630" y="770">chooses topics and</text>
      <text x="630" y="810">actions, mainly by</text>
      <text x="630" y="850">their description</text>
      <text x="630" y="905">also names, inputs</text>
      <text x="630" y="945">and outputs</text>
    </g>

    <rect x="930" y="640" width="400" height="350" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1130" y="712" text-anchor="middle" font-weight="700">Plan</text>
    <rect x="970" y="742" width="320" height="54" rx="27" fill="#ffffff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.70;0.76"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.70;0.76"/>
    </rect>
    <text x="1130" y="779" text-anchor="middle">1  topic or action</text>
    <rect x="970" y="812" width="320" height="54" rx="27" fill="#ffffff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.76;0.82"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.76;0.82"/>
    </rect>
    <text x="1130" y="849" text-anchor="middle">2  topic or action</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="1130" y="915">one or more, in</text>
      <text x="1130" y="955">execution order</text>
    </g>

    <rect x="1430" y="640" width="400" height="350" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" dur="10s" repeatCount="indefinite" calcMode="discrete" values="#8c959f;#e0a534;#8c959f" keyTimes="0;0.89;0.97"/>
      <animate attributeName="stroke-width" dur="10s" repeatCount="indefinite" calcMode="discrete" values="2;5;2" keyTimes="0;0.89;0.97"/>
    </rect>
    <text x="1630" y="712" text-anchor="middle" font-weight="700">Inputs</text>
    <g fill="#57606a" text-anchor="middle">
      <text x="1630" y="770">from the context,</text>
      <text x="1630" y="810">or the agent asks</text>
      <text x="1630" y="850">the user a question</text>
    </g>

    <g stroke="#57606a" stroke-width="3" marker-end="url(#ah)">
      <line x1="330" y1="305" x2="422" y2="305"/>
      <line x1="830" y1="305" x2="922" y2="305"/>
      <line x1="1330" y1="305" x2="1422" y2="305"/>
      <line x1="330" y1="815" x2="422" y2="815"/>
      <line x1="830" y1="815" x2="922" y2="815"/>
      <line x1="1330" y1="815" x2="1422" y2="815"/>
    </g>
  </g>

  <g stroke="#ffffff" stroke-width="3" fill="#e0a534">
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M330 305 L422 305" keyPoints="0;0;1;1" keyTimes="0;0.03;0.10;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.03;0.10"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M830 305 L922 305" keyPoints="0;0;1;1" keyTimes="0;0.16;0.23;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.16;0.23"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1330 305 L1422 305" keyPoints="0;0;1;1" keyTimes="0;0.29;0.36;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.29;0.36"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M330 815 L422 815" keyPoints="0;0;1;1" keyTimes="0;0.50;0.57;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.50;0.57"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M830 815 L922 815" keyPoints="0;0;1;1" keyTimes="0;0.63;0.70;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.63;0.70"/>
    </circle>
    <circle r="14" opacity="0">
      <animateMotion dur="10s" repeatCount="indefinite" path="M1330 815 L1422 815" keyPoints="0;0;1;1" keyTimes="0;0.82;0.89;1" calcMode="linear"/>
      <animate attributeName="opacity" dur="10s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.82;0.89"/>
    </circle>
  </g>
</svg>
