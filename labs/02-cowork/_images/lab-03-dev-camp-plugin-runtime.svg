<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">The Copilot Dev Camp plugin at work</title>
  <desc id="d">Three Cowork prompts each activate one skill of the Copilot Dev Camp plugin: foundry-research, dev-camp-deck and dev-camp-document. Each skill calls the Microsoft Learn MCP Server at learn.microsoft.com/api/mcp through the microsoft-learn-mcp connector with authorization None, using microsoft_docs_search, microsoft_code_sample_search and microsoft_docs_fetch, and returns compiled Foundry information, a PowerPoint deck with speaker notes, or a Word one-pager or detailed guide.</desc>
