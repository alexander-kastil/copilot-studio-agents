<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">From the weekly-status-mail folder to an active skill</title>
  <desc id="d">Step 1: author SKILL.md in the folder weekly-status-mail, with a kebab-case name that matches the folder name. Step 2: zip the files inside the folder into a .zip or .skill archive with SKILL.md at the root, up to 10 MB compressed, 50 MB uncompressed and 100 files, then upload it from Customize, Skills, the arrow next to Add, Upload skill, and verify weekly-status-mail is listed under Your skills. Step 3: in a new conversation ask Draft my weekly status email and see the skill in the side panel.</desc>
  <rect width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="80" y="150" width="410" height="760" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="530" y="150" width="410" height="760" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="980" y="150" width="410" height="760" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1430" y="150" width="410" height="760" rx="20" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>

    <rect x="80" y="150" width="410" height="760" rx="20" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.02;0.04;0.18;0.2;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="530" y="150" width="410" height="760" rx="20" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.24;0.26;0.4;0.42;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="980" y="150" width="410" height="760" rx="20" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.46;0.48;0.62;0.64;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <rect x="1430" y="150" width="410" height="760" rx="20" fill="none" stroke="#e0a534" stroke-width="6" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.68;0.7;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>

    <text x="110" y="205" font-size="28" fill="#57606a">Step 1</text>
    <text x="110" y="252" font-size="32" font-weight="700" fill="#24292f">Author SKILL.md</text>
    <rect x="110" y="290" width="350" height="330" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="130" y="340" font-size="28" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f">weekly-status-mail/</text>
    <path d="M200,380 L330,380 L370,420 L370,580 L200,580 Z" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <path d="M330,380 L330,420 L370,420" fill="none" stroke="#8c959f" stroke-width="2"/>
    <text x="285" y="500" font-size="28" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">SKILL.md</text>
    <text x="110" y="750" font-size="28" fill="#57606a">name matches</text>
    <text x="110" y="792" font-size="28" fill="#57606a">the folder name,</text>
    <text x="110" y="834" font-size="28" fill="#57606a">kebab-case</text>

    <text x="560" y="205" font-size="28" fill="#57606a">Step 2</text>
    <text x="560" y="252" font-size="32" font-weight="700" fill="#24292f">Zip the files</text>
    <text x="560" y="296" font-size="28" fill="#57606a">inside the folder</text>
    <rect x="560" y="330" width="350" height="290" rx="14" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="585" y="378" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f">.zip or .skill</text>
    <rect x="590" y="410" width="230" height="100" rx="12" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="705" y="470" font-size="28" font-weight="700" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">SKILL.md</text>
    <text x="590" y="570" font-size="28" fill="#57606a">at the root</text>
    <text x="560" y="750" font-size="28" fill="#57606a">10 MB compressed,</text>
    <text x="560" y="792" font-size="28" fill="#57606a">50 MB uncompressed,</text>
    <text x="560" y="834" font-size="28" fill="#57606a">100 files</text>

    <text x="1010" y="205" font-size="28" fill="#57606a">Step 2</text>
    <text x="1010" y="252" font-size="32" font-weight="700" fill="#24292f">Upload skill</text>
    <text x="1010" y="296" font-size="28" fill="#57606a">Customize &gt; Skills,</text>
    <text x="1010" y="336" font-size="28" fill="#57606a">arrow next to Add</text>
    <rect x="1010" y="370" width="350" height="250" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1035" y="420" font-size="28" font-weight="700" fill="#24292f">Your skills</text>
    <rect x="1022" y="448" width="326" height="62" rx="12" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
    <rect x="1022" y="448" width="326" height="62" rx="12" fill="none" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.55;0.57;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1185" y="489" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">weekly-status-mail</text>
    <text x="1010" y="750" font-size="28" fill="#57606a">verify it is listed</text>

    <text x="1460" y="205" font-size="28" fill="#57606a">Step 3</text>
    <text x="1460" y="252" font-size="32" font-weight="700" fill="#24292f">Test it</text>
    <text x="1460" y="296" font-size="28" fill="#57606a">new conversation</text>
    <rect x="1460" y="330" width="350" height="120" rx="24" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="1635" y="380" font-size="28" fill="#24292f" text-anchor="middle">Draft my weekly</text>
    <text x="1635" y="422" font-size="28" fill="#24292f" text-anchor="middle">status email</text>
    <rect x="1460" y="480" width="350" height="160" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
    <text x="1485" y="525" font-size="28" font-weight="700" fill="#24292f">Skills</text>
    <rect x="1472" y="550" width="326" height="62" rx="31" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <rect x="1472" y="550" width="326" height="62" rx="31" fill="#fff6e5" stroke="#e0a534" stroke-width="4" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.93;0.95;1" dur="10s" repeatCount="indefinite"/>
    </rect>
    <text x="1635" y="591" font-size="28" font-family="Consolas, Menlo, monospace" fill="#24292f" text-anchor="middle">weekly-status-mail</text>
    <text x="1460" y="750" font-size="28" fill="#57606a">skill shows in</text>
    <text x="1460" y="792" font-size="28" fill="#57606a">the side panel</text>

    <line x1="490" y1="470" x2="527" y2="470" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="940" y1="470" x2="977" y2="470" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>
    <line x1="1390" y1="470" x2="1427" y2="470" stroke="#57606a" stroke-width="3" marker-end="url(#ah)"/>

    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M478,470 L522,470" keyPoints="0;0;1;1" keyTimes="0;0.2;0.24;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.199;0.2;0.24;0.241;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M928,470 L972,470" keyPoints="0;0;1;1" keyTimes="0;0.42;0.46;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.419;0.42;0.46;0.461;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle r="12" fill="#e0a534" opacity="0">
      <animateMotion path="M1378,470 L1422,470" keyPoints="0;0;1;1" keyTimes="0;0.64;0.68;1" calcMode="linear" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.639;0.64;0.68;0.681;1" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
