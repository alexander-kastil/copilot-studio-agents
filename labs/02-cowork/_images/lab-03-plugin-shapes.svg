<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Three shapes of a Cowork plugin</title>
  <desc id="d">A skills-only plugin packages custom SKILL.md skills without external systems. A connector-only plugin packages a connector to a remote MCP endpoint that built-in skills use. A combined plugin packages custom skills that orchestrate the tools of a remote MCP endpoint through its connector.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#57606a"/></marker>
  </defs>
  <text x="330" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#24292f" font-weight="700" text-anchor="middle">Skills-only plugin</text>
  <text x="330" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">Workflow guidance</text>
  <text x="330" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">without external systems</text>
  <text x="960" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#24292f" font-weight="700" text-anchor="middle">Connector-only plugin</text>
  <text x="960" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">External tools used</text>
  <text x="960" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">by built-in skills</text>
  <text x="1590" y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#24292f" font-weight="700" text-anchor="middle">Combined plugin</text>
  <text x="1590" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">Custom skills orchestrating</text>
  <text x="1590" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">external tools</text>
  <rect x="70" y="250" width="520" height="220" rx="20" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <rect x="88" y="230" width="214" height="40" fill="#ffffff"/>
  <text x="98" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" font-weight="600">Plugin package</text>
  <rect x="700" y="520" width="520" height="220" rx="20" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <rect x="718" y="500" width="214" height="40" fill="#ffffff"/>
  <text x="728" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" font-weight="600">Plugin package</text>
  <rect x="1330" y="250" width="520" height="490" rx="20" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="12 8"/>
  <rect x="1348" y="230" width="214" height="40" fill="#ffffff"/>
  <text x="1358" y="260" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" font-weight="600">Plugin package</text>
  <rect x="120" y="290" width="420" height="140" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="330" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Custom skills</text>
  <text x="330" y="396" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#57606a" text-anchor="middle">SKILL.md</text>
  <rect x="750" y="290" width="420" height="140" rx="14" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Built-in skills</text>
  <text x="960" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">part of Cowork</text>
  <rect x="750" y="560" width="420" height="140" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Connector</text>
  <text x="960" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">in the plugin</text>
  <rect x="750" y="840" width="420" height="140" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="960" y="902" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Remote MCP endpoint</text>
  <text x="960" y="946" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">tools and data</text>
  <rect x="1380" y="290" width="420" height="140" rx="14" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="352" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Custom skills</text>
  <text x="1590" y="396" font-family="Consolas, 'Courier New', monospace" font-size="28" fill="#57606a" text-anchor="middle">SKILL.md</text>
  <rect x="1380" y="560" width="420" height="140" rx="14" fill="#e9f7ef" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Connector</text>
  <text x="1590" y="666" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">in the plugin</text>
  <rect x="1380" y="840" width="420" height="140" rx="14" fill="#f6f8fa" stroke="#8c959f" stroke-width="2"/>
  <text x="1590" y="902" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#24292f" font-weight="700" text-anchor="middle">Remote MCP endpoint</text>
  <text x="1590" y="946" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" fill="#57606a" text-anchor="middle">tools and data</text>
  <path d="M960,430 L960,558" fill="none" stroke="#57606a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M960,700 L960,838" fill="none" stroke="#57606a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
  <path d="M1590,430 L1590,558" fill="none" stroke="#57606a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)"/>
  <path d="M1590,700 L1590,838" fill="none" stroke="#57606a" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah)" marker-start="url(#ah)"/>
