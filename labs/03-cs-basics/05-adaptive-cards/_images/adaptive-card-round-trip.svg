<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Adaptive card round trip: input card, topic variables, summary card</title>
  <desc id="d">Left, the Ask with adaptive card node shows the New HR Candidate Information card with First Name, Last Name, Email, Current Role, Spoken Languages, Skills and a Submit button. Middle, Copilot Studio creates one topic variable per input: Topic.firstname, Topic.lastname, Topic.email, Topic.current_role, and the tables Topic.spoken_languages and Topic.skills. Right, a Send a message node in Formula Card mode shows the Candidate Summary, each fact bound to its variable, the two tables through Text and Concat. Below, the full formula Text(Concat(Topic.skills, Value, ", ")). Dots carry the six values from the card to the variables and on to the summary.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <g font-size="28" fill="#57606a">
      <text x="60" y="122">Ask with adaptive card</text>
      <text x="620" y="122">Topic variables</text>
      <text x="1220" y="122">Send a message: Formula Card</text>
    </g>

    <rect x="60" y="150" width="500" height="680" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="84" y="206" font-size="28" font-weight="700" fill="#24292f">New HR Candidate Information</text>
    <g fill="#f6f8fa" stroke="#8c959f" stroke-width="2">
      <rect x="84" y="240" width="452" height="60" rx="8"/>
      <rect x="84" y="320" width="452" height="60" rx="8"/>
      <rect x="84" y="400" width="452" height="60" rx="8"/>
      <rect x="84" y="480" width="452" height="60" rx="8"/>
      <rect x="84" y="560" width="452" height="60" rx="8"/>
      <rect x="84" y="640" width="452" height="60" rx="8"/>
    </g>
    <g font-size="28" fill="#57606a">
      <text x="104" y="280">First Name</text>
      <text x="104" y="360">Last Name</text>
      <text x="104" y="440">Email</text>
      <text x="104" y="520">Current Role</text>
      <text x="104" y="600">Spoken Languages</text>
      <text x="104" y="680">Skills</text>
    </g>
    <path d="M492,584 L504,596 L516,584 M492,664 L504,676 L516,664" fill="none" stroke="#57606a" stroke-width="3"/>
    <rect x="84" y="730" width="160" height="60" rx="10" fill="#eaf2ff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" values="#e0a534;#8c959f" keyTimes="0;0.125" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="5;2" keyTimes="0;0.125" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="164" y="770" font-size="28" font-weight="700" fill="#24292f" text-anchor="middle">Submit</text>

    <g fill="#e9f7ef" stroke="#8c959f" stroke-width="2">
      <rect x="620" y="240" width="540" height="60" rx="10"/>
      <rect x="620" y="320" width="540" height="60" rx="10"/>
      <rect x="620" y="400" width="540" height="60" rx="10"/>
      <rect x="620" y="480" width="540" height="60" rx="10"/>
      <rect x="620" y="560" width="540" height="60" rx="10"/>
      <rect x="620" y="640" width="540" height="60" rx="10"/>
    </g>
    <g font-size="28" font-family="Consolas, monospace" fill="#24292f">
      <text x="644" y="280">Topic.firstname</text>
      <text x="644" y="360">Topic.lastname</text>
      <text x="644" y="440">Topic.email</text>
      <text x="644" y="520">Topic.current_role</text>
      <text x="644" y="600">Topic.spoken_languages</text>
      <text x="644" y="680">Topic.skills</text>
    </g>
    <g fill="#fff6e5" stroke="#e0a534" stroke-width="2">
      <rect x="1040" y="568" width="104" height="44" rx="22"/>
      <rect x="1040" y="648" width="104" height="44" rx="22"/>
    </g>
    <g font-size="28" fill="#24292f" text-anchor="middle">
      <text x="1092" y="600">Table</text>
      <text x="1092" y="680">Table</text>
    </g>
    <text x="620" y="770" font-size="28" fill="#57606a">Created automatically from the card</text>

    <rect x="1220" y="150" width="640" height="680" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2">
      <animate attributeName="stroke" values="#8c959f;#e0a534" keyTimes="0;0.75" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="2;5" keyTimes="0;0.75" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
    </rect>
    <text x="1244" y="206" font-size="28" font-weight="700" fill="#24292f">Candidate Summary</text>
    <g font-size="28" font-weight="700" fill="#24292f">
      <text x="1244" y="280">First Name:</text>
      <text x="1244" y="360">Last Name:</text>
      <text x="1244" y="440">E-mail:</text>
      <text x="1244" y="520">Current Role:</text>
      <text x="1244" y="600">Spoken Languages:</text>
      <text x="1244" y="680">Skills:</text>
    </g>
    <g font-size="28" font-family="Consolas, monospace" fill="#57606a">
      <text x="1524" y="280">Topic.firstname</text>
      <text x="1524" y="360">Topic.lastname</text>
      <text x="1524" y="440">Topic.email</text>
      <text x="1524" y="520">Topic.current_role</text>
      <text x="1524" y="600">Text(Concat(…))</text>
      <text x="1524" y="680">Text(Concat(…))</text>
    </g>

    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="564" y1="270" x2="612" y2="270"/>
      <line x1="564" y1="350" x2="612" y2="350"/>
      <line x1="564" y1="430" x2="612" y2="430"/>
      <line x1="564" y1="510" x2="612" y2="510"/>
      <line x1="564" y1="590" x2="612" y2="590"/>
      <line x1="564" y1="670" x2="612" y2="670"/>
      <line x1="1164" y1="270" x2="1212" y2="270"/>
      <line x1="1164" y1="350" x2="1212" y2="350"/>
      <line x1="1164" y1="430" x2="1212" y2="430"/>
      <line x1="1164" y1="510" x2="1212" y2="510"/>
      <line x1="1164" y1="590" x2="1212" y2="590"/>
      <line x1="1164" y1="670" x2="1212" y2="670"/>
    </g>

    <rect x="60" y="890" width="1800" height="110" rx="18" fill="#fff6e5" stroke="#e0a534" stroke-width="2"/>
    <text x="100" y="956" font-size="28" fill="#24292f">Spoken languages and skills are tables, so the card shows them with <tspan font-family="Consolas, monospace">Text(Concat(Topic.skills, Value, ", "))</tspan></text>

    <g fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
      <circle cx="564" cy="270" r="12"/>
      <circle cx="564" cy="350" r="12"/>
      <circle cx="564" cy="430" r="12"/>
      <circle cx="564" cy="510" r="12"/>
      <circle cx="564" cy="590" r="12"/>
      <circle cx="564" cy="670" r="12"/>
      <animateMotion path="M0,0 L48,0" keyPoints="0;0;1;1" keyTimes="0;0.125;0.375;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.125;0.375" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
    <g fill="#e0a534" stroke="#ffffff" stroke-width="3" opacity="0">
      <circle cx="1164" cy="270" r="12"/>
      <circle cx="1164" cy="350" r="12"/>
      <circle cx="1164" cy="430" r="12"/>
      <circle cx="1164" cy="510" r="12"/>
      <circle cx="1164" cy="590" r="12"/>
      <circle cx="1164" cy="670" r="12"/>
      <animateMotion path="M0,0 L48,0" keyPoints="0;0;1;1" keyTimes="0;0.5;0.75;1" calcMode="linear" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;0.75" dur="8s" calcMode="discrete" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
