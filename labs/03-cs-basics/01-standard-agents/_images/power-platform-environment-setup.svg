<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Two portals, one environment</title>
  <desc id="d">Inside your Microsoft 365 tenant, the Power Platform admin center at admin.powerplatform.com creates the environment Copilot Dev Camp in Exercise 1 (Manage, then Environments, then + New). The environment is of type Developer and holds apps, flows, data and agents; delete it after the training path to remove everything. In Exercise 2, Copilot Studio at copilotstudio.microsoft.com selects that environment with the environment picker in the top right. Any other environment is isolated and shares nothing with it.</desc>
  <rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="60" y="60" width="1800" height="940" rx="24" fill="none" stroke="#8c959f" stroke-width="2"/>
    <text x="100" y="114" font-size="28" fill="#57606a">Your Microsoft 365 tenant</text>

    <rect x="100" y="170" width="500" height="440" rx="18" fill="#eaf2ff" stroke="#8c959f" stroke-width="2"/>
    <text x="130" y="232" font-size="32" font-weight="700" fill="#24292f">Power Platform</text>
    <text x="130" y="274" font-size="32" font-weight="700" fill="#24292f">admin center</text>
    <text x="130" y="330" font-size="28" font-family="Consolas, monospace" fill="#57606a">admin.powerplatform.com</text>
    <text x="130" y="400" font-size="28" fill="#57606a">Manage, then Environments,</text>
    <text x="130" y="440" font-size="28" fill="#57606a">then + New</text>
    <rect x="130" y="526" width="160" height="48" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="210" y="560" font-size="28" fill="#24292f" text-anchor="middle">Exercise 1</text>

    <rect x="740" y="140" width="440" height="530" rx="18" fill="#f6f8fa" stroke="#57606a" stroke-width="3"/>
    <text x="770" y="200" font-size="34" font-weight="700" fill="#24292f">Copilot Dev Camp</text>
    <text x="770" y="244" font-size="28" fill="#57606a">Type: Developer</text>
    <g stroke="#8c959f" stroke-width="2">
      <rect x="770" y="280" width="180" height="100" rx="12" fill="#ffffff"/>
      <rect x="970" y="280" width="180" height="100" rx="12" fill="#ffffff"/>
      <rect x="770" y="400" width="180" height="100" rx="12" fill="#ffffff"/>
      <rect x="970" y="400" width="180" height="100" rx="12" fill="#f3edff"/>
    </g>
    <g font-size="28" fill="#24292f" text-anchor="middle">
      <text x="860" y="340">Apps</text>
      <text x="1060" y="340">Flows</text>
      <text x="860" y="460">Data</text>
      <text x="1060" y="460" font-weight="700">Agents</text>
    </g>
    <text x="770" y="572" font-size="28" fill="#57606a">Delete it after the training</text>
    <text x="770" y="612" font-size="28" fill="#57606a">path to remove everything</text>

    <rect x="1320" y="170" width="500" height="440" rx="18" fill="#f3edff" stroke="#8c959f" stroke-width="2"/>
    <text x="1350" y="232" font-size="32" font-weight="700" fill="#24292f">Copilot Studio</text>
    <text x="1350" y="290" font-size="28" font-family="Consolas, monospace" fill="#57606a">copilotstudio.microsoft.com</text>
    <text x="1350" y="360" font-size="28" fill="#57606a">Environment picker, top right:</text>
    <text x="1350" y="400" font-size="28" fill="#57606a">choose Copilot Dev Camp</text>
    <rect x="1350" y="526" width="160" height="48" rx="24" fill="#ffffff" stroke="#8c959f" stroke-width="2"/>
    <text x="1430" y="560" font-size="28" fill="#24292f" text-anchor="middle">Exercise 2</text>

    <text x="670" y="358" font-size="28" fill="#57606a" text-anchor="middle">creates</text>
    <text x="1250" y="358" font-size="28" fill="#57606a" text-anchor="middle">selects</text>
    <g stroke="#57606a" stroke-width="3" fill="none" marker-end="url(#ah)">
      <line x1="604" y1="384" x2="732" y2="384"/>
      <line x1="1316" y1="384" x2="1188" y2="384"/>
    </g>

    <rect x="740" y="760" width="440" height="170" rx="18" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="770" y="826" font-size="30" font-weight="700" fill="#24292f">Any other environment</text>
    <text x="770" y="876" font-size="28" fill="#57606a">Isolated: nothing is shared</text>
  </g>
</svg>
